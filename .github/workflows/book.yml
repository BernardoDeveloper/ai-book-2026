# Builds and validates every edition (one job per language) on each push and
# pull request. On a v* tag, a release job collects the editions and publishes
# a GitHub Release. Release notes come from the tag's section in CHANGELOG.md;
# tags with a hyphen (v1.0.0-preview) are marked as pre-releases.
name: book

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lang: [pt, en]
    env:
      BOOK_LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # tags, for the revision printed on the copyright page

      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: .ruby-version

      - uses: actions/setup-java@v6.0.1 # epubcheck
        with:
          distribution: temurin
          java-version: "21"

      - name: System tools (page audit)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Cache pinned toolchain downloads
        uses: actions/cache@v6.1.0
        with:
          path: tools/cache
          key: tools-${{ hashFiles('tools/SHA256SUMS') }}

      - name: Toolchain (Quarto, epubcheck; checksum-verified)
        run: rake tools

      - name: Tool regression tests (fixture book, no render)
        run: rake test

      - name: Outline coverage and chapter lint
        run: rake check

      - name: Build editions (EPUB, PDF, ebook PDF, HTML, DOCX) + epubcheck + page audit
        run: rake build

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: book-${{ matrix.lang }}
          path: |
            build/${{ matrix.lang }}/*.epub
            build/${{ matrix.lang }}/*.pdf
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Section of CHANGELOG.md between "## <version>" and the next "## ".
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Edition $version." > notes.md
          prerelease=""; case "$TAG" in *-*) prerelease="--prerelease";; esac
          ls -la dist
          gh release create "$TAG" $prerelease \
            --title "Competente o Suficiente / Competent Enough $version" --notes-file notes.md \
            dist/*.epub dist/*.pdf

      - name: Keep only the two newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Old editions aren't worth keeping; the git tags stay as history.
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r old; do
            echo "deleting release $old"
            gh release delete "$old" --yes
          done
