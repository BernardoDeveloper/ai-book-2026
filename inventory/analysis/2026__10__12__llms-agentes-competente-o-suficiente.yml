title_en: "LLMs + Agents = competent enough"
ai_relevance: core
ai_relevance_reason: "Synthesis essay on the state and trajectory of LLM capability and agent harnesses."
genre: essay
themes: [what-llms-are, limits-of-llms, hype-and-marketing, coding-agents-tools]
thesis: "Base LLM intelligence has converged and is near the ceiling of the transformer architecture; the real jump of 2025-2026 came from the agentic harness (tool use, caching, long sessions), which is competent enough to automate real software engineering when guided by disciplined engineers."
summary: "Akita ties together his benchmark and essay series with a timeline from GPT-2 (2019) to the agentic era: GPT-3 and the parameter war, Chinchilla shifting weight to data, GPT-4 hiding parameter counts, o1 (2024) as the last big leap in core reasoning, 2025 as architecture optimization (mixture of experts, prompt caching, long context), and 2026 as harness refinement. He argues an agent can run a less dense model because it can look up facts on demand and use trial and error with real test feedback, which fights hallucination and explains why recent progress feels huge. He notes many tasks (e.g. classification) don't need giant LLMs. He warns the loop needs an oracle, otherwise it spins, and cites signs of plateau such as diminishing pretraining returns and shrinking gaps between top models. He contrasts this with apocalyptic marketing and concludes that LLM alone is an expensive parrot, with an agent and engineering discipline it is competent enough, but there is no magic for amateurs: unskilled prompting yields slop."
key_claims:
  - claim: "In the author's benchmarks, general programming ability has not improved noticeably since the Opus 4.5 generation; frontier models converge and model choice is nearly indifferent, except for effort level."
    time_sensitive: true
  - claim: "Core reasoning had its last big leap around 2024 (o1-style reasoning); 2025 was architectural optimization and 2026 harness refinement."
    time_sensitive: true
  - claim: "Mixture-of-experts separates total capacity from per-token cost; prompt caching cut repeated-context cost by up to 90%."
    time_sensitive: false
  - claim: "An agent with search and test feedback can use a less dense model because facts are fetched and errors are caught by test loops, reducing hallucination."
    time_sensitive: false
  - claim: "The agentic loop needs an oracle (docs, tests); with none it spins, as seen with a brand-new language."
    time_sensitive: false
  - claim: "Frontier-lab claims of dangerous emergent behavior were brute-force trial and error rather than consciousness; fear serves marketing and regulation."
    time_sensitive: true
  - claim: "LLM alone is an expensive parrot; with an agent it is competent enough for real engineering, but unskilled use produces slop."
    time_sensitive: false
