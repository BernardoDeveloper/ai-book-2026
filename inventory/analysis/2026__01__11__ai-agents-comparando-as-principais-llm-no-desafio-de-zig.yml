title_en: "AI Agents: Comparing the Main LLMs on the Zig Challenge"
ai_relevance: core
ai_relevance_reason: "A hands-on comparison of commercial and open-source LLMs on one hard coding task, plus commentary on careers."
genre: benchmark
themes: [benchmarks-model-comparison, open-vs-closed-and-local-models, jobs-and-careers, limits-of-llms]
thesis: "On one demanding, deliberately obscure coding task, the top commercial models (led by Claude Opus) now succeed where a year ago all failed, while the open-source models that fit on a consumer GPU still fail; and this makes good programmers more valuable, not obsolete."
summary: "Akita revisits an unfinished Zig + llama.cpp command-line chat he abandoned a year earlier, which needs updating to Zig 0.15 and a new llama.cpp, with a deliberately bad all-in-one prompt. He tested agents Crush and OpenCode against commercial and open models. Claude Opus solved it in two prompts in about half an hour for about US$8; GPT 5.1 Codex took a few more prompts (~US$6); GPT 5.2 was slower; Gemini 3 Pro Preview was slowest, most expensive (~US$14) and gave up once claiming success falsely. No open-source model finished: Qwen3-Coder 30B and GPT-OSS 20B (run locally on an RTX 5090 with 32GB VRAM) failed, and GLM 4.7 and MiniMax 2.1 (run through OpenRouter) were slow and failed; DeepSeek could not be integrated. He explains why small models fall into 'agentic loops' that claim success without acting, and how sampling parameters (temperature, Min-P, repeat penalty) affect this. He ends by saying agents are very good now, that they make senior programmers more productive, that the 'programming bubble' of mediocre bootcamp grads burst in 2022, that amateurs 'don't know what they don't know', and that AI also helps onboarding into unfamiliar projects such as the Xenia emulator."
key_claims:
  - claim: "Ranking on this task: Claude Opus first, then GPT 5.1 Codex, GPT 5.2, Gemini 3 Pro Preview; it is explicitly one small opinionated test, not a general benchmark."
    time_sensitive: true
  - claim: "No open-source model he could run solved the challenge; the largest open models (hundreds of billions of parameters) need hardware like a 512GB Mac Studio (~US$4000+) or are too slow."
    time_sensitive: true
  - claim: "Commercial models have trillions of parameters; the biggest open ones around 300 billion; a top consumer GPU (RTX 5090) has 32GB VRAM, limiting local models to roughly 30B parameters with quantization."
    time_sensitive: true
  - claim: "Small models can fall into an 'agentic loop', repeating that the task is done without making changes, a symptom of training to please and confused context."
    time_sensitive: false
  - claim: "Costs on this task: Opus about US$8, GPT 5 Codex about US$6, Gemini 3 Pro nearly US$14; Opus costs more per token but wastes less context on reasoning."
    time_sensitive: true
  - claim: "LLMs are stochastic and non-deterministic, so only someone who knows what they want and can check the result gets real value; an amateur cannot do complicated things ('you don't know what you don't know')."
    time_sensitive: false
  - claim: "Agents can replace some junior-type grunt work for seniors, but the bar for a programming career has risen by an order of magnitude and competition has increased."
    time_sensitive: false
  - claim: "Tailwind lost 80% of its revenue because of AI, as an example of quick-training/shallow-skill markets collapsing."
    time_sensitive: true
  - claim: "Bad prompt practices: many tasks at once, sweeping changes, mixing refactor with bug fixes, vague wording."
    time_sensitive: false
