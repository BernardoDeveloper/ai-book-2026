thesis: "A modern, accessible, dark-mode-capable frontend for web, blog, RSS and email can be built with Tailwind, Hugo, ERB and plain Markdown, without a JavaScript framework."
summary: "Part 4 of the series. Akita explains using Tailwind CSS v4 in Rails, Hugo with the Hextra theme and shortcodes for the blog, and two independent rendering pipelines from the same Markdown content (one for the web, one for email). He lists email HTML survival rules (tables, inline CSS, Outlook 2016 using the Word engine), derives a colour palette from HSL hues and fixed lightness per layer with WCAG contrast targets, explains that well-formed HTML also reduces spam scoring, covers podcast RSS requirements, and closes with a content-first philosophy: Markdown plus YAML as the universal format."
key_claims:
  - claim: "Outlook 2016 renders HTML with the Microsoft Word engine, so email layout needs tables and inline CSS."
    time_sensitive: true
  - claim: "Mail providers treat malformed HTML as a spam signal; the practices that make email render correctly also help deliverability."
    time_sensitive: false
  - claim: "A palette built on evenly spaced HSL hues with fixed saturation and lightness per layer gives coherent colours and verifiable contrast (WCAG AA/AAA)."
    time_sensitive: false
