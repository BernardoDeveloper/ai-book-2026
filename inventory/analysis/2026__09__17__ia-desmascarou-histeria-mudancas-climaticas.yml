title_en: "AI Unmasked the Climate Change Hysteria"
ai_relevance: tangential
ai_relevance_reason: "Framed around AI's energy demand (datacenter electricity, nuclear deals), but most of the post is a climate-policy argument unrelated to AI technology."
genre: opinion
themes: [hardware-and-infrastructure, society-politics-censorship, business-and-economics]
thesis: "The AI datacenter race exposed that green commitments were negotiable; governments and Big Tech are rushing to nuclear, which the author takes as evidence that climate alarmism was driven by money and theater, while the real problem is misallocated trillions."
summary: "Akita argues that the energy hunger of AI datacenters has displaced the climate agenda: Microsoft restarts Three Mile Island, Meta, Google and Amazon sign nuclear deals, and Germany's chancellor calls the nuclear exit a mistake. He cites IEA figures that datacenters used about 415 TWh in 2024 and are projected near 945 TWh by 2030, and that they already consume nearly twice the electricity of the global EV fleet. Grid bottlenecks (capacity auction shortfalls, transformer queues, delayed datacenters) show energy is now the AI constraint. The rest is a long case that climate panic is funded by foundations, governments and rivals, citing Bjorn Lomborg's cost-benefit numbers, failed treaties, Al Gore's predictions, and geological history, while stating that human-caused warming is real but manageable. He recommends spending on cheap health interventions instead and mocks symbolic gestures like paper straws."
key_claims:
  - claim: "Datacenters consumed about 415 TWh in 2024 (about 1.5% of world electricity), roughly 485 TWh in 2025, with a central projection of about 945 TWh by 2030 (IEA)."
    time_sensitive: true
  - claim: "Data center electricity use in 2025 was already nearly double the global EV fleet's consumption (~250 TWh)."
    time_sensitive: true
  - claim: "Big Tech capex on AI infrastructure roughly US$400B in 2025 rising to about US$715B guided for 2026; power, not chips, is becoming the bottleneck."
    time_sensitive: true
  - claim: "Microsoft, Meta, Google and Amazon signed large nuclear power deals to feed datacenters, including restarting Three Mile Island unit 1."
    time_sensitive: true
  - claim: "Germany's chancellor said in January 2026 that abandoning nuclear was a grave strategic mistake."
    time_sensitive: true
  - claim: "The author asserts human-caused warming is real but manageable; policy cost-benefit and many cited figures (Lomborg, Spencer) are contested political claims, not settled consensus."
    time_sensitive: false
fears_addressed:
