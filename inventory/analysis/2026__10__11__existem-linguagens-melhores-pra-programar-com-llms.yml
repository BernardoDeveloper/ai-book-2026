source_sha256: "d0ad6a79b80f5d9dd74bf39c0782d291889f9de32b964c6ea06c580f02bb4079"
title_en: "Are there better languages for programming with LLMs?"
ai_relevance: core
ai_relevance_reason: "Reproducible benchmark testing whether programming language choice matters when LLM agents write the code."
genre: benchmark
themes: [programming-languages, benchmarks-model-comparison, software-engineering-discipline, vibe-coding-practice]
thesis: "No language is better for LLM-written code: concise syntax did not save tokens, strong typing did not save repair cycles, and what mattered was the presence of tests and engineering discipline."
summary: "Responding to DHH's viral series converting an app into several languages with agents and declaring Rust the winner, Akita argues a single agent conversion measures the model's familiarity, not the language, and that real software needs many iterations. He ran 112 attempts: 7 languages, 4 model configurations, with and without public tests, on a multi-tenant ledger engine task graded by hidden stories. The two frontier configurations passed all eligible attempts, so there was no language ranking. Weaker models did better when tests were provided. Token use did not follow code conciseness (Ruby used as many or more tokens as Rust), and there were zero compiler-error repair cycles in audited runs. A separate queue-worker test (Elixir, Rust, Rails, plain Ruby) found equal throughput under his load, with Rust only using less memory, although the test may just show the shared collector was the bottleneck. He concludes that choosing the right tool for the job and testing discipline outweigh language wars, lists his rule-of-thumb language map, and clearly flags the benchmark's limits."
key_claims:
  - claim: "Across 112 attempts on one ledger task, frontier models (Opus 5.5, Codex/GPT-6 Sol) passed 53 of 53 eligible attempts regardless of language, so no language ranking emerged."
    time_sensitive: true
  - claim: "Providing a public test suite improved weaker models' results (24 correct artifacts vs 16 without), which was the cleanest signal in the benchmark."
    time_sensitive: true
  - claim: "Concise languages did not save tokens: Ruby cost as many or more tokens than Rust; strongly typed languages showed no compiler-guided repair cycles to save."
    time_sensitive: true
  - claim: "Remaining model errors were domain invariants no compiler catches, in typed and dynamic languages alike."
    time_sensitive: false
  - claim: "In a queue-worker load test, four stacks tied on throughput at the tested load; Rust used far less memory (16 MiB vs 135 MiB for Elixir)."
    time_sensitive: true
  - claim: "A single-shot agent conversion (like DHH's) measures the model's familiarity with idioms and the number of iterations, not the language."
    time_sensitive: false
  - claim: "The benchmark is small, one task, two repetitions per cell, and shows a floor not a ceiling; results don't transfer automatically."
    time_sensitive: false
