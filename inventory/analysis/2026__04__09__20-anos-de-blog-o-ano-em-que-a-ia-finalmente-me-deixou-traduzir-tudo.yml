genre: essay
themes: [personal-journey, coding-agents-tools, society-politics-censorship, ai-in-daily-life]
thesis: "A job that was too tedious to ever do by hand (translating 20 years of a blog) became a weekend task with an AI agent, and the only wall left was commercial models' content-policy refusals."
summary: "Akita marks 20 years of his blog (April 5, 2026) and reviews five tech eras and his career turns, from multimedia agencies and SAP to Rails, events, the Akitando YouTube channel, and now full-time AI research. He says he always wanted an English version but 727 Portuguese posts made manual translation unrealistic. He opened Claude Code in the blog repo and asked for translation of everything; it ran about 39 hours over a few days, producing 354 English files in 80+ commits. He says about 90 percent came out natural and faithful to his voice. The effort exhausted his Max 20x plan quota and cost about R$280 (around US$50) in extra usage, with rate-limit errors. About six posts were refused by both Claude and GPT through their APIs (Steve Jobs speech mentioning cancer, Ayn Rand texts, an anti-Nazi post, an ethics essay), so he translated them with a local Qwen 3.5 35B. He also ran the reverse direction for his old English posts and concludes translation at scale is now a weekend problem."
key_claims:
