title_en: "Stop making excuses and deploy more: with AI, the premise changed"
ai_relevance: substantial
ai_relevance_reason: "The argument rests on LLM agents lowering the cost of fixing bugs, and the author describes his agent-driven workflow and output."
genre: essay
themes: [software-engineering-discipline, vibe-coding-practice, coding-agents-tools]
thesis: "Because AI makes fixing bugs fast and cheap, holding code back for slow human review costs more than shipping and correcting, provided basic engineering safeguards (tests, CI, rollback, flags, staging) exist."
summary: "Akita argues that with frontier LLMs fixing a bug after release is now quick and cheap, so withholding deploys for line-by-line review is a bottleneck. He stresses this is not 'ship anything': it requires automated tests, CI, hostile automated review, feature flags, staging, rollback and observability. He cites DORA data and agile history showing frequent small deploys reduce failures. He lists honest limits: rollback cannot undo real-world consequences like payments, database migrations need expand-contract, public libraries have downstream users, app stores slow things, and his evidence comes from projects he owns alone. He shows his output since February (30+ open-source projects, over 1.6 million lines with agents, multi-platform release pipelines triggered by a tag) and says he has never seen an LLM do something randomly destructive unprompted. He ends that real users reporting issues, not his reviews, keep quality up, and that if review takes longer than building, you are the bottleneck."
key_claims:
  - claim: "Fixing a bug after release has become fast and cheap with AI agents, so holding deploys for manual review is often a cost, not prudence."
    time_sensitive: false
  - claim: "Frontier LLMs make fewer mistakes than most human developers he has seen in code review, and errors are usually from whoever drives the harness."
    time_sensitive: true
  - claim: "DORA research shows frequent deploys correlate with lower failure rates and faster recovery."
    time_sensitive: false
  - claim: "Rollback can't undo external consequences (payments, safety), and database migrations need expand-contract; those domains need stricter review regardless of who wrote the code."
    time_sensitive: false
  - claim: "Author produced over 1.6 million lines of code with LLMs since February and has never seen an LLM do something randomly destructive unrequested (anecdotal, single-owner projects)."
    time_sensitive: true
  - claim: "For ai-memory, 249 of 287 issues and 361 human PRs came from outside contributors; real usage, not automated review, keeps quality grounded."
    time_sensitive: true
fears_addressed:
  - "AI-written code will flood production with bugs"
  - "AI makes human software engineers unnecessary (it multiplies the judgment engineers already have)"
reader_value: "Medium. Explains why AI changes the economics of fixing bugs, while insisting that engineering fundamentals and human judgment remain required; clearly flags the limits of his evidence."
