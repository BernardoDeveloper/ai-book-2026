thesis: "FFmpeg flags are painful; a small Crystal CLI with presets and an interactive mode fixes that, and Crystal is a good fit for static-binary CLIs compared with Go and Rust."
summary: "Akita wraps FFmpeg in a command-line tool called easy-ffmpeg that probes input files, checks codec compatibility with the target container, and decides what can be copied without re-encoding. It offers presets, trimming, scaling, aspect ratio, image-sequence to video, a dry-run mode and an interactive terminal menu with fuzzy file search. He compares Crystal (Ruby-like syntax, static typing, fibers and channels, static binaries) to Go (verbose, deliberately simple) and Rust (better for systems code, overkill here). The whole tool was built in about 3 hours in a single afternoon: 2,342 lines, 10 commits, with CI building static binaries for Linux and macOS. The AI role is only implied by the vibe-coding tag."
