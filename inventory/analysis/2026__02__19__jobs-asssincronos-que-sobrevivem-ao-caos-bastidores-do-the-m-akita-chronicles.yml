thesis: "Background jobs that do important work must be designed to recover from failures: targeted retries, locks with expiry, atomic claiming, orchestrator jobs, cron safety nets and status notifications."
summary: "Part 5 of the series. Akita presents six patterns used in the newsletter system running on Rails 8, ActiveJob and SolidQueue: retry_on with specific transient exceptions and bounded polling (up to four hours for a podcast to be ready) with graceful degradation; file or database locks with a time-to-live; atomic per-recipient claiming for emails with a recovery job that moves ambiguous cases to 'unknown'; orchestrator jobs delegating to specialist jobs; cron as a safety net with idempotent jobs; and a notification concern for start, done and error. He adds that SolidQueue on SQLite avoids needing Redis."
key_claims:
  - claim: "Idempotent jobs plus a cron fallback let a failed pipeline recover without duplicating work."
