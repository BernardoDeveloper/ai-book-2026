title_en: "AI Agents: Protecting Your System"
ai_relevance: core
ai_relevance_reason: "About the risk of letting AI coding agents run commands on your machine and how to contain it."
genre: tutorial
themes: [security-and-sandboxing, coding-agents-tools]
thesis: "AI coding agents need broad system access to be useful, so you should treat them as untrusted and run them inside a sandbox that can only write to the project directory."
summary: "Coding agents must read files and run commands like grep, compilers and linters, so an LLM that hallucinates can issue something destructive such as rm -Rf. Tools ask for permission, but users tire of approving every command and switch to allow-all. Supply-chain attacks on open-source libraries (e.g. NPM) add a second risk: even a well-behaved tool can be compromised. His answer is a jail using Bubblewrap (the sandbox technology behind Flatpak): read-only system directories, write access only to the current project, hidden home directory. He supplies a long custom ai-jail script with deny-lists for password stores and browser data. For Claude Code he also shows a settings file with allow, ask and deny permission lists instead of skipping permissions. He ends by saying this is essentially how Docker/Podman containers work and that nothing is 100% safe."
key_claims:
  - claim: "To be useful, coding agents need file-system access and the ability to run arbitrary shell commands, which creates a risk of damage or data exfiltration."
    time_sensitive: false
  - claim: "Approval prompts get bypassed in practice because users get tired and choose 'allow everything'."
    time_sensitive: false
  - claim: "Supply-chain attacks mean even open-source software cannot be assumed trustworthy; assume everything is insecure until proven otherwise."
    time_sensitive: false
  - claim: "A Bubblewrap jail with read-only system mounts and a single writable project directory prevents the agent from touching the rest of the system."
    time_sensitive: false
  - claim: "Granular allow/ask/deny rules are a middle path between approving everything and approving nothing."
    time_sensitive: false
fears_addressed:
  - "Could an AI agent wipe my computer or leak my files?"
