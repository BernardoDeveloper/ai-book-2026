title_en: "VS Code Is the New Punch Card"
ai_relevance: core
ai_relevance_reason: "The whole post argues how coding agents change what programming is and what juniors must learn."
genre: opinion
themes: [jobs-and-careers, software-engineering-discipline, coding-agents-tools, vibe-coding-practice]
thesis: "Typing code by hand is the modern punch card: an input mechanism being displaced by agents, while the real discipline of software engineering (fundamentals, judgment) matters more, not less."
summary: "Akita says people asking whether juniors will stop learning to program confuse code input with software engineering. He walks through earlier eras (switches, punch cards, Assembly, compilers, the web's markup grind) to show interfaces change while the machine still demands precision. He blames the 2010s hiring bubble and bootcamps for a flood of weak programmers and says the 2022 layoffs were predicted. In his view the turning point for usable coding agents was late 2025 (better models, prompt caching, tool calling, agent interfaces), and Claude Code is now his terminal. He urges treating the agent as a pair programmer while acting as tech lead, avoiding both blind trust and nitpicking, and relying on XP practices (tests, CI, refactoring). Without fundamentals, a junior just outsources ignorance and approves patches they cannot judge, such as a query that works on 300 fake rows and melts at a million. He dismisses sustainability worries as unactionable and says he exploits subsidized pricing while it lasts. He closes that AI reflects who you are: it accelerates good code or technical debt."
key_claims:
  - claim: "Typing code is not software engineering; as tooling changes, fundamentals (domain modeling, architecture, performance, security, trade-offs) remain the core skill."
    time_sensitive: false
  - claim: "Coding agents became real work tools only around late 2025, not in 2023-2024 when hallucination, context loss and cost made them unreliable."
    time_sensitive: true
  - claim: "Juniors using agents without fundamentals will outsource their ignorance and become unable to review; those with fundamentals will learn faster."
    time_sensitive: false
  - claim: "AI does not turn bad programmers into good ones; it accelerates whatever quality (or technical debt) is already there."
    time_sensitive: false
  - claim: "The right balance is neither blind trust nor nitpicking; XP practices (tests, CI, small changes) sustain speed with agents."
    time_sensitive: false
  - claim: "AI companies are currently subsidizing usage; individuals cannot act on sustainability concerns so should use it while the window is open."
    time_sensitive: true
