thesis: "The ColdCard thefts are a brute-force attack on weak entropy, not a break in Bitcoin cryptography; the attacker only needs to enumerate a small space of predictable random states."
summary: "Follow-up to the alert post explaining how the attack works. The firmware's fallback pseudo-random generator was seeded from predictable values (chip unique ID, a timer, an unset real-time clock), shrinking the key space to around 40 bits on Mk3 and about 32 to 72 bits on newer models. He walks through why 2^40 is enumerable with cheap hardware, then cites public blockchain evidence of at least 1,128 BTC drained from over 2,300 addresses in two waves, uniform fees and sorted amounts suggesting one automated operation. He cites commits with no pull-request review. He provides educational proof-of-concept code, noting it was generated with Kimi K3 because Claude and GPT refused the same prompt on misuse grounds. He discusses whether the thief can be caught and how mixers, CoinJoin and peel chains work, and closes telling readers to verify rather than trust."
