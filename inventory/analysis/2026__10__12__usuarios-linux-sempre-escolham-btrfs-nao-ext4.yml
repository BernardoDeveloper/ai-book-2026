title_en: "Linux users: always choose BTRFS, not EXT4"
ai_relevance: tangential
ai_relevance_reason: "A filesystem advocacy post; AI appears in one section on disk hygiene in the AI-coding era (agents create build artifacts, caches, worktrees) and agent cleanup rules."
genre: opinion
themes: [hardware-and-infrastructure, coding-agents-tools, non-ai]
thesis: "Linux users should pick btrfs over ext4 for checksums, snapshots, compression and recovery, and AI coding agents make disk hygiene and cheap rollback more important."
summary: "A follow-up to the NAS disaster post. Akita compares ext4 (journaling, no data checksums or snapshots) with btrfs (copy-on-write, checksums, snapshots, subvolumes, transparent compression, scrub) and argues even NTFS and APFS now protect data better than ext4. He explains copy-on-write, snapshots as boot recovery (including a kernel rollback that saved his server), compression that saved about 630 GB on 2.2 TB, and why ZFS suits large NAS while btrfs suits everything else. A section on AI coding says agents produce junk at industrial speed (Rust build directories of hundreds of GB, Docker caches, model caches, worktrees) and recommends automated cleanup plus rules in agent instruction files telling agents to remove only what they created. He ends with backup practice using restic and the lesson that snapshots are not backups."
key_claims:
  - claim: "btrfs checksums every block and supports snapshots, scrub and compression, which ext4 lacks; this protects against silent corruption."
    time_sensitive: false
  - claim: "Snapshots are not backups; they live on the same disk."
    time_sensitive: false
  - claim: "AI coding agents generate large amounts of build artifacts, caches and worktrees that fill disks quickly; agents should be instructed to clean up only what they created."
    time_sensitive: false
  - claim: "Compression saved about 15% (630 GB of 2.2 TB) on his machines; AI model weights do not compress."
    time_sensitive: true
