title_en: "I Rewrote OpenClaw in Rust: Did It Work? (FrankClaw)"
ai_relevance: core
ai_relevance_reason: "OpenClaw is an AI-agent gateway; the post covers an AI-generated codebase audit, context limits of coding agents, and agent security hardening."
genre: project-log
themes: [security-and-sandboxing, coding-agents-tools, limits-of-llms, software-engineering-discipline]
thesis: "A million-line, AI-generated gateway for LLM agents, merged at 50 commits per day with no human review, ships with serious vulnerabilities; a much smaller rewrite is possible, but no agent can rewrite such a codebase in one pass because of context limits."
summary: "Akita measured OpenClaw, a popular gateway connecting chat channels to AI models, at about 1.25 million lines of TypeScript with around 50 commits per day from 42 contributors, which he reads as AI-generated code poured in faster than a human can review. A Claude security audit found 7 critical, 9 high, and more lower issues, including eval in the browser tool, unrestricted shell, unsigned Slack webhooks and plaintext transcripts. He refused to run it and rebuilt the core in Rust as FrankClaw (about 56,600 lines, 178 commits in about 5 days) with fixes for all critical and high findings, borrowing 12 ideas from a competing Rust rewrite (IronClaw). Asking Claude Code or Codex to rewrite the entire project failed because the codebase did not fit in context, producing stubs and todo markers; what worked was step-by-step analysis, a plan, and one feature at a time with tests and commits. He admits it is alpha, tested only for simple chats, and that he personally prefers building small custom bots in a day over a generic gateway."
key_claims:
  - claim: "OpenClaw is ~1.25 million lines of TypeScript with ~50 commits per day from 42 contributors, which makes serious human review impossible."
    time_sensitive: true
  - claim: "A Claude-driven automated audit of OpenClaw found 7 critical and 9 high-severity vulnerabilities."
    time_sensitive: true
  - claim: "No AI coding agent can rewrite a million-line project in one pass because it cannot hold it in context; results are stubs and todo!() placeholders."
    time_sensitive: true
  - claim: "A workable method: analyze in stages, write a detailed plan, implement one feature at a time with tests and commits."
    time_sensitive: false
  - claim: "The LLM generates functional code but does not think about attack vectors by itself; security hardening required human intervention."
    time_sensitive: false
  - claim: "FrankClaw is alpha and only simple chat flows were tested."
    time_sensitive: true
  - claim: "A custom-built bot for a specific task can be built in a day and may suit developers better than a generic agent gateway."
    time_sensitive: true
