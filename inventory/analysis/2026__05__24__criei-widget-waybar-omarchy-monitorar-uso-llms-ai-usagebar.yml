thesis: "Someone who juggles several LLM subscriptions needs one place to see how much quota is left across vendors, so the author wrote a Rust widget and terminal UI for it."
summary: "Akita uses Claude and GPT through their official coding tools on subscription plans, which he says are much cheaper than per-token credit, plus OpenRouter for testing and a Z.AI GLM subscription. To track usage of all of them in one view, he ported the claudebar Waybar widget to Rust and extended it to four vendors: Anthropic, OpenAI Codex, Z.AI and OpenRouter. Claude and Codex are read through the OAuth credentials their official CLIs already store, while Z.AI and OpenRouter use API keys. There is also a standalone terminal interface that works over SSH and in any terminal. He lists install options (AUR, source) and recommends one Waybar module with scrolling between vendors. It was a Saturday-night project, MIT licensed."
