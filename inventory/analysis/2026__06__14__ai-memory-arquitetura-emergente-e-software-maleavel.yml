title_en: "ai-memory: Emergent Architecture and Malleable Software"
ai_relevance: substantial
ai_relevance_reason: "The subject is an AI agent memory tool developed with agents and community PRs, but the post's lesson is about software design process."
genre: essay
themes: [software-engineering-discipline, agent-memory-and-context, open-source-community]
thesis: "Good software is cultivated, not assembled: architecture should emerge from real use and be consolidated afterwards, following make it work, make it right, make it fast, instead of designing everything upfront."
summary: "In 24 days the author's personal long-term memory tool for coding agents, ai-memory, grew from a single-user Linux MVP to a multi-user, cross-platform system with 482 commits, 26 contributors and 70 PRs. He gives the numbers, thanks contributors, and lists what they added (Windows and macOS, web API, multi-user, multi-workspace, more providers). He criticizes the 'Lego fallacy' of designing all architecture before building, which he says leads to over-engineering and rot. Only after the software ran for many people did he refactor the scattered scope logic into a central ScopeResolver, an abstraction extracted from working code. He invokes Kent Beck's 'make it work, make it right, make it fast' and the clay-sculpture metaphor for software."
key_claims:
  - claim: "ai-memory reached 482 commits, 26 contributors, 70 PRs (59 merged) and 27 issues all closed within 24 days of the first commit on 21 May 2026."
    time_sensitive: true
  - claim: "Designing the full architecture upfront leads to abstractions nobody uses and usually wrong because they guess the future."
    time_sensitive: false
  - claim: "Abstractions should be extracted from working code after the patterns repeat, not invented before use."
    time_sensitive: false
  - claim: "Software is never finished; it is malleable like clay and shaped while in use."
    time_sensitive: false
