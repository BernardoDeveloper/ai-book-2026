thesis: "The ARM-versus-x86 efficiency gap is a myth rooted in the past; Intel's fall was managerial and a manufacturing failure, and Panther Lake shows a competitive x86 chip can match Apple-class battery life when the fab is competitive."
summary: "Reviews of Intel Panther Lake laptops (2026) show x86 matching MacBook Air M5 battery in light use, while Apple still leads in single-core and sustained load. Akita argues that since the Pentium Pro in 1995, x86 chips translate instructions into internal RISC-like micro-operations, and that decoding cost became a small share of the die. Apple's efficiency comes from microarchitecture, huge caches, vertical integration and leading process, not from being ARM; mediocre ARM chips exist. Heavy workloads (video, crypto, matrix/AI) run on dedicated extensions regardless of ISA. Intel's decline is told through lost iPhone chip deal, sold XScale, failed 10nm, CEO churn and losses, and its 2025 rescue (US government stake, SoftBank, Nvidia). He closes saying the debate was theological and he roots for competition."
