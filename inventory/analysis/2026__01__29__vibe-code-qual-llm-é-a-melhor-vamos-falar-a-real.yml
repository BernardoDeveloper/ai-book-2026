title_en: "Vibe Code: Which LLM Is the Best? Let's Be Real"
ai_relevance: core
ai_relevance_reason: "Answers the question 'which LLM lets a beginner build a perfect app by prompting' by running five models over the same code."
genre: opinion
themes: [limits-of-llms, vibe-coding-practice, jobs-and-careers, benchmarks-model-comparison]
thesis: "No LLM lets a total beginner produce a perfect, secure app; the quality of the result is proportional to the seniority of the person asking, and there is always something left over."
summary: "Following up on the TV Clipboard post, Akita had five more models run an 'extensive' security, optimisation and test review of the same tiny app in sequence: Claude Opus 4.5, GPT 5.2 Codex, Kimi 2.5, Gemini 3 Pro Preview and MiniMax 2.1, for about US$3 total. Each found something the previous ones missed (missing security headers, a deadlock at shutdown, a stale timeout, WebSocket headers) and each also suggested unnecessary changes, reintroduced code he had removed, or over-engineered. He characterises Opus as over-proactive like an intern showing off, and GPT/Gemini as more literal. His conclusion: AIs are probability machines that never reach 100%, what you want and what you need differ, and the quality of the app tracks the asker's experience. The models are very good but are motivated interns, not geniuses, and he would still not publish the app without manual review."
key_claims:
  - claim: "Five frontier models reviewed the same small app in sequence and each still found new issues; none could produce a perfect app."
    time_sensitive: true
  - claim: "App quality is directly proportional to the requester's seniority, with or without AI."
    time_sensitive: false
  - claim: "AIs will not guess what you want or need; you must know the right limits for your use case (not NASA-grade security everywhere)."
    time_sensitive: false
  - claim: "Models tend to over-engineer, keep or re-add dead code, and show off; Opus was more over-proactive, GPT Codex and Gemini more literal (his impression)."
    time_sensitive: true
  - claim: "The five-model review cost about US$3 in total."
    time_sensitive: true
  - claim: "Reaching 100% is impossible because the effort per extra percent grows without bound."
    time_sensitive: false
  - claim: "If unsure, use Claude Code for the best speed/quality balance (his recommendation at the time)."
    time_sensitive: true
