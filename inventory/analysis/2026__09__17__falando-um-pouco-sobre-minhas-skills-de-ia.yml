title_en: "A bit about my AI Skills"
ai_relevance: core
ai_relevance_reason: "Explains agent skills (prompt files for coding agents), memory and how the author works daily with agents."
genre: essay
themes: [coding-agents-tools, agent-memory-and-context, vibe-coding-practice, security-and-sandboxing]
thesis: "Agent skills are just versioned prompts; do not copy other people's, build your own from experience, and make agents write down everything that is not code so knowledge compounds."
summary: "Akita explains that a skill is a folder with a text file containing a well-written prompt, loaded on demand (progressive disclosure) so it does not flood the context. He warns that installing third-party skills is like running someone else's instructions with your permissions and invites prompt injection; more skills also compete for the agent's attention. His one borrowed skill is a humanizer built from Wikipedia's catalog of AI-writing tells. He describes his daily routine of managing 40+ repositories with skills for auditing pull requests and issues, resolving tickets, batching dependency bumps and cutting releases, claiming over a thousand PRs and issues handled with his supervision. He argues skills are minor compared to per-project instruction files, a persistent memory wiki, and pointing the agent at living examples. He recommends having the agent document research and decisions as lasting assets, calling it compound interest of knowledge, and closes with the principle that nobody else knows what you need."
key_claims:
  - claim: "A skill is just a text file prompt (SKILL.md) possibly with helper scripts; harnesses load only name and description up front and the body on demand."
    time_sensitive: false
  - claim: "Installing third-party skills means running another person's instructions with your credentials and is a prompt-injection risk."
    time_sensitive: false
  - claim: "More tools/skills do not necessarily improve agent results and unused skills become debt."
    time_sensitive: false
  - claim: "One person using these skills handled 609 merged PRs and 375 closed issues across three projects, with supervision."
    time_sensitive: true
  - claim: "Per-project instruction files, persistent memory and pointing to working examples carry more value than skills."
    time_sensitive: false
  - claim: "Make the agent write down research, decisions and rejected alternatives so knowledge accumulates."
    time_sensitive: false
