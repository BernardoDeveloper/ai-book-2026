genre: essay
themes: [non-ai, society-politics-censorship]
thesis: "End-to-end verifiable digital elections are mathematically possible, but a system whose trust depends on math most citizens cannot follow is as opaque as the current one, so social trust beats sophistication."
summary: "Akita builds, as a computer-science exercise, a hypothetical verifiable digital election using hash commitments, Pedersen commitments, a public Merkle tree, Benaloh's cast-or-challenge, Schnorr zero-knowledge proofs and blind signatures, with toy numbers and code. He argues that 'the voting machine is not on the internet' is irrelevant because current security rests on physical custody and trust in people, while a verifiable system rests on public checks. He addresses vote-buying (receipts must not prove the vote) and the weakest link, authenticating who is voting. He then argues it would never work in practice: ordinary citizens cannot verify the math, so trust becomes blind faith in experts, and rich countries keep paper trails. Appendices review auditability of the Brazilian system and an incentive idea for rewarding verifiers. He stresses it is an exercise, not a proposal."
key_claims:
  - claim: "A voting system can in theory give every voter individual verification and anyone universal verification without a secret component or a coercion-proof receipt."
    time_sensitive: false
  - claim: "Security of the current Brazilian system depends on physical custody and ceremonies conducted by the electoral court, not on independent software-free recount."
    time_sensitive: false
  - claim: "A system requiring trust in mathematics few can audit is as opaque to citizens as the current one."
    time_sensitive: false
  - claim: "Blockchain is not synonymous with cryptocurrency; public does not mean anonymous (chain analysis can deanonymize)."
    time_sensitive: false
