title_en: "Vibe Code: I Built a Mega Clone in Rails in 1 Day for My Home Server"
ai_relevance: substantial
ai_relevance_reason: "Built with Claude Code (Opus 4.6); the post's argument is about what the human expert vs the LLM contributed."
genre: project-log
themes: [vibe-coding-practice, software-engineering-discipline, security-and-sandboxing, coding-agents-tools]
thesis: "AI makes a working app in hours, but the first output is not production-ready; the experienced programmer's value is knowing what to ask and what to audit. AI is a mirror of your own competence."
summary: "Akita writes a 56-line spec and uses Claude Code to build FrankMega, a self-hosted file-sharing service (Rails 8, SQLite, invitations only, 2FA, passkeys) in about 3 hours and 21 commits. The first commit delivers 6,900 lines but is far from production-ready: Docker and gem conflicts fail, and a security-audit commit later fixes 22 flaws (hardcoded fallback encryption keys, OTP replay, download-counter race condition, open redirect, predictable CSP nonce). He argues the LLM found these only because he knew to ask specific questions such as 'check the race condition on the counter'. Debugging a download bug took five commits and real browser testing that the LLM could not do alone. Requirements also emerged during building (quotas, i18n, terms of service) that were not in the spec. The post ends with deployment steps via Docker and Cloudflare Tunnel and the line that AI is the mirror of your own competence."
key_claims:
  - claim: "FrankMega was built in about 3 hours of active work, 21 commits, 210 tests, using Claude Code with Claude Opus 4.6."
    time_sensitive: true
  - claim: "The first AI-generated commit (207 files, ~6,900 lines) was not production-ready; a later audit fixed 22 security issues."
    time_sensitive: false
  - claim: "The LLM did not make the security decisions; the human had to know which specific questions to ask (e.g. TOCTOU race conditions)."
    time_sensitive: false
  - claim: "A beginner writing the same spec would likely get a functional, attractive, but insecure service."
    time_sensitive: false
  - claim: "Some bugs (browser download behaviour with Turbo) require iterative real-browser testing that an LLM does not resolve alone."
    time_sensitive: false
  - claim: "AI is the mirror of your own competence."
    time_sensitive: false
