thesis: "Microsoft's Majorana 2 shows real materials progress but still demonstrates no topological qubit, and Shor's algorithm works by turning factoring into period finding via interference; quantum computers accelerate problems with exploitable structure, not everything."
summary: "On 2 June 2026 Microsoft announced Majorana 2 with parity lifetimes of about 22 seconds (versus milliseconds before) and moved its roadmap from 2033 to 2029. Akita recounts the program's retracted 2018 Nature paper, the Majorana 1 criticisms, and physicists' immediate replies that nothing resolves the basic question. Missing items cited from an analysis include X-basis measurements, proof of topological states, logic gates or entanglement, peer review and reproducibility. He then explains Shor's algorithm: factoring reduces to finding the period of a^x mod N, which superposition plus a quantum Fourier transform extracts through interference. He clarifies that quantum computers are not universal accelerators; they help with structured problems like simulation, Grover search and phase estimation. He expects only niche chemistry and materials use in the short term."
key_claims:
  - claim: "Microsoft's Majorana 2 (announced 2 June 2026) reported Z-parity lifetimes of about 22 seconds, versus 1-12 milliseconds in Majorana 1, and shortened its scalable-quantum timeline from 2033 to 2029."
    time_sensitive: true
  - claim: "The paper reports no X measurements, no proof the states are topological, no gates, entanglement or algorithms, no peer review and no reproducibility, so it does not show a qubit."
    time_sensitive: true
  - claim: "Earlier Microsoft-funded Majorana papers (2018 Delft) were retracted in 2021 and 2022 after selective data presentation was shown."
    time_sensitive: false
  - claim: "Shor's algorithm factors N by finding the period of a^x mod N using superposition and a quantum Fourier transform that uses interference to amplify the period."
    time_sensitive: false
  - claim: "Breaking real RSA keys would need millions of physical qubits with error correction; quantum computers are accelerators for structured problems and do not speed up sorting or most everyday tasks."
    time_sensitive: false
