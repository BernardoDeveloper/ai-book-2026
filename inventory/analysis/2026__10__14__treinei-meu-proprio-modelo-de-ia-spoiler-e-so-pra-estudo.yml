title_en: "I trained my own AI model (spoiler: it's just for study)"
ai_relevance: core
ai_relevance_reason: "Hands-on account of building and training an LLM from random weights; demystifies how models are made and argues for small specialised models."
genre: project-log
themes: [what-llms-are, limits-of-llms, open-vs-closed-and-local-models, hardware-and-infrastructure]
thesis: "The whole algorithm of a GPT fits in 200 lines and anyone who studies seriously can train one; what separates a toy from a useful model is data, scale and evaluation, and the future favours small specialised models with a harness fetching the world."
summary: >-
  Starting from Karpathy's 200-line microgpt (Feb 2026), the author expanded it
  into a PyTorch lab (tokenizer, pre-training, SFT, OpenAI-compatible server,
  OpenCode integration) and trained, in under two weeks on one RTX 5090, a
  337M-parameter model on 10B tokens (137 GPU hours, about R$ 80 of
  electricity). It writes valid small Python functions (58/100 held-out
  correct) but scores zero on repository tasks, tool use, long-context recall
  and conversation. The post walks through the stations of building an LLM,
  the dimensions against GPT-2 and frontier models (SmolLM2 same size saw 400x
  the tokens), the stumbles (measuring near training, vocabulary eating the
  model, lower loss with worse code, lying datasets, train/serve format
  mismatch, a stale checkpoint after NAS maintenance) and argues that mixture
  of experts, domain models and Jev-like classifiers point to smaller,
  specialised models.
key_claims:
  - {claim: "Karpathy's microgpt trains a GPT in 200 lines of dependency-free Python on 32k names in about a minute", time_sensitive: false}
  - {claim: "Final model: 337,167,360 parameters, 24 layers, 32,768-entry BPE, 10B pre-training tokens, 305,176 updates", time_sensitive: false}
  - {claim: "137 hours of GPU process time on one RTX 5090; at most about R$ 80 of electricity", time_sensitive: true}
  - {claim: "58/100 held-out tasks correct; 100/100 valid Python; 97 with the right name and parameters; 0/4 repository fixes; 0/9 long-context probes; 0/12 output tracing", time_sensitive: false}
  - {claim: "In the 239M model, 154M parameters were the vocabulary table (o200k)", time_sensitive: false}
  - {claim: "SmolLM2-360M was trained on 4 trillion tokens, 400x this model", time_sensitive: false}
  - {claim: "AI Index estimated GPT-4 compute at US$ 78M and Gemini Ultra at US$ 191M", time_sensitive: false}
