title_en: "What's new in my ai-memory, getting better for use with your AIs"
ai_relevance: substantial
ai_relevance_reason: "Project update for a tool that manages coding-agent sessions and memory across Claude Code, Codex etc.; the argument about session memory and provider independence is AI-centered, but much is feature changelog."
genre: announcement
themes: [agent-memory-and-context, coding-agents-tools, open-source-community, security-and-sandboxing]
thesis: "The agent session (decisions, failed experiments) is as much part of the project as the code, so developers should own it and be able to switch model or provider without losing it."
summary: "A month after the first ai-memory post, the project went from 1.1.0 to 1.17.1 with 31 releases, 55 merged PRs and 14 outside contributors. The main new feature, ai-memory run, treats a work line as a 'workstream' spanning harnesses: Claude Code, Codex, OpenCode and others each keep their native session, linked through a portable ledger and a recent delta. Handoffs are described as lossy summaries; the ledger is searchable. Sessions are text (JSONL, SQLite), so there is no reason to leave them locked in one vendor's tool. Smaller additions: automatic briefing at session start, global preferences, Agent Skills instead of fixed instructions, and path exclusion for privacy. He pairs it with ai-jail (sandbox) running agents in YOLO mode, and ai-usagebar to monitor quota usage across providers. Closing line: he rents LLMs and subscriptions from whoever delivers best today, but the project's session stays with him."
key_claims:
  - claim: "The programmer should stay independent of provider whims: models and harnesses are replaceable, the project's memory is yours."
    time_sensitive: false
  - claim: "Code only shows what survived; the agent session holds the reasoning, discarded attempts and decisions."
    time_sensitive: false
  - claim: "Handoff summaries are deliberately lossy; feeding raw whole sessions into the next prompt is too big, costly and noisy."
    time_sensitive: false
  - claim: "Running agents in YOLO mode is best when a sandbox (ai-jail) limits the possible damage."
    time_sensitive: false
  - claim: "ai-memory went from 1.1.0 to 1.17.1 in a month with 55 merged PRs from 15 people."
    time_sensitive: true
fears_addressed:
  - "Vendor lock-in with AI providers"
  - "AI assistants forgetting everything between sessions"
reader_value: "Moderate. The idea that AI sessions are an asset and that memory lives outside the model is accessible; the command-level details are for developers."
