title_en: "LLM benchmark: should I use the one with the highest score?"
ai_relevance: core
ai_relevance_reason: "Explains how to read LLM benchmark rankings critically; AI evaluation is the subject."
genre: essay
themes: [benchmarks-model-comparison, hype-and-marketing, limits-of-llms, coding-agents-tools]
thesis: "A benchmark's first place is not the best model; the score belongs to one generated project under one prompt, harness and rubric, so read the top (90+) as a cluster and never outsource a technical decision to a table, including this one."
summary: "Readers keep asking why Opus 4.7 ranks above 4.8 or GPT 5.4 above 5.6. Akita answers that the table is simply sorted by a score column, and the score grades a project, not the model's total intelligence. A result is model plus prompt plus harness plus context plus tools plus snapshot plus execution plus audit. LLMs are non-deterministic: the same model re-run scored 94 then 93, and the same family scored 69 or 89 depending on harness. Above 90 the models are saturating a small greenfield task, so ordering is decided by small details such as a missing API-key guard or cookie cap. Tier A versus Tier C is a meaningful gap, 97 versus 95 is not. He also admits his own audits have bugs: GPT 5.5 dropped from 96 to 85 after a re-audit with no change to the model. He recommends using rankings to discard bad groups, find candidate clusters, and read defects, then to run your own test on your own work."
key_claims:
  - claim: "The benchmark score evaluates the generated project, not the model's overall capability; the result depends on model, prompt, harness, context, tools, snapshot, execution and audit."
    time_sensitive: false
  - claim: "LLMs are non-deterministic; re-running the same model changes results (Fable 5 scored 94 then 93 on the same model ID)."
    time_sensitive: true
  - claim: "Models scoring above 90 should be read as one cluster; the Tier A to Tier C gap is meaningful, the gap between 97 and 95 is not."
    time_sensitive: true
  - claim: "Harness can swing scores a lot (DeepSeek V4 Pro 69 vs 89; Kimi K2.7 86 vs about 68)."
    time_sensitive: true
  - claim: "The author's own auditing improved over time, changing scores with no change to the model or project (GPT 5.5 from 96 to 85)."
    time_sensitive: true
  - claim: "A newer GPT version used far fewer tokens than 5.4 and cost less per run despite a higher per-token price."
    time_sensitive: true
  - claim: "No benchmark yields 'the best LLM' in absolute terms; do your own test with your own tasks."
    time_sensitive: false
fears_addressed:
