thesis: "A dedicated steel cockpit beats years of unstable stands; it is always ready and fits a solo, single-player sim-racing hobby."
summary: "Akita recounts his lifelong love of racing games and cars, from arcade cabinets to Gran Turismo, Initial D and track days, and the evolution of his wheel setups (Logitech, Thrustmaster, Fanatec direct drive). He explains why he finally bought a Formula FX1 cockpit, describes the assembly, the steering wheel, the 4K OLED monitor, the audio chain and the mini-PC with an external GPU, and lists the total cost of about 57,000 reais. A short aside says he spent about 30 days of 16-hour days testing the newest AI agents from Anthropic and OpenAI, which gave him a back problem that coincided with the cockpit delivery. He bought a second GPU in 2025 because he was using more AI and local LLMs."
