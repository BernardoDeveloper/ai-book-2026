thesis: "Treat politics as an environmental risk to manage, not a team to cheer for: build English skills, earn in strong currency, understand taxes and structure assets legally so your life does not depend on elections."
summary: "Akita, writing as off-topic personal opinion with a disclaimer that it is not financial or legal advice, argues Brazilians treat elections like football fandom. He cites high public debt, cumulative inflation of about 197% over 20 years and the real's fall against the dollar to say the bill always arrives. He recalls 1980s hyperinflation and the Collor plan's freezing of savings, and explains how informed people profited from float and spread. His strategy: learn English, build an exportable profession, earn in dollars, understand taxes and lawful wealth structuring, choose marriage and children deliberately, keep optionality like passports and foreign accounts, and cultivate competent friends such as accountants and lawyers. He says emigration is optional, and notes that foreign income makes Brazil cheap."
