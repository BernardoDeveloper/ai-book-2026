id: "2026/07/11/como-me-precaver-pros-meus-agentes-nao-apagarem-minhas-coisas"
source_sha256: "c1c7d372d1654932a63455ef8c205e83209a4d5e9a2d6cf037ce6dae97aee041"
title_en: "How to Protect Yourself From Your Agents Deleting Your Stuff"
ai_relevance: core
ai_relevance_reason: "About the risk of coding agents running destructive commands and layered defenses against it."
genre: essay
themes: [security-and-sandboxing, coding-agents-tools, software-engineering-discipline]
thesis: "Agents deleting files is a test of your own discipline: layered defenses (sandbox, copy-on-write snapshots, external backup, no agent access to production, reproducible infrastructure as code, monitoring) make a single bad command recoverable, regardless of who or what issued it."
summary: "After reports that GPT-5.6-Sol deleted most of one user's Mac files and another user's devnet, Akita says that in five months of heavy use in 'YOLO mode' (permission prompts off) no agent ever deleted anything unrequested, and he suspects vague prompts in many incident reports, while still not trusting LLMs. His defense in layers: ai-jail sandboxing so only the project directory is real; BTRFS snapshots with Timeshift/snapper and grub-btrfs so even a broken OS can boot a snapshot, with macOS APFS mentioned as an equivalent; and restic external backup to a NAS with retention. For companies he insists agents must never touch production, may work in staging, and should write versioned automation (Ansible, Kubernetes manifests, migrations) that a human promotes. He adds monitoring and concludes that vulnerability to one wrong command always existed."
key_claims:
  - claim: "Matt Shumer reported GPT-5.6-Sol accidentally deleted nearly all files on his Mac via a mis-expanded $HOME in a review subagent; another user reproduced a destructive rsync on a devnet (as cited from X posts, July 2026)."
    time_sensitive: true
  - claim: "In five months of YOLO mode (about 40 repos, 500K+ lines) no agent deleted a file the author did not ask about; his hypothesis is that incidents often come from vague prompts."
    time_sensitive: true
  - claim: "Copy-on-write filesystems (BTRFS, APFS) allow near-instant, near-free snapshots that make a deleted directory or even a broken OS recoverable in minutes."
    time_sensitive: false
  - claim: "Snapshots live on the same disk as the data, so an external, encrypted, deduplicated backup (restic to a NAS) is also needed."
    time_sensitive: false
  - claim: "No AI agent should have access to production; agents belong in staging and should write reproducible infrastructure code which a human promotes."
    time_sensitive: false
  - claim: "Never run in production anything you cannot recover from; maintenance SQL should be a versioned migration, not an ad-hoc command."
    time_sensitive: false
