thesis: "A book can be built from hundreds of blog posts with agents without losing control of what it says, if structure is data, every paragraph carries provenance and nothing ships without mechanical checks."
summary: "Announces the free EPUB/PDF preview of Competente o Suficiente and its English edition. Explains the problem of turning ~131 posts that disagree with each other into one book, and the steps used: a sealed inventory with hashes and lineage, the outline as data generating the build config, a pilot chapter as contract, parallel drafts, a provenance marker per paragraph, verification that caught errors, and a build where a chapter with errors doesn't pass. Covers the assembly pipeline and figures, the English edition, releasing by pushing a tag, and what remains the author's own work. Asks readers to report errors as GitHub issues."
