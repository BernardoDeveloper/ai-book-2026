title_en: "Sending Emails Without Spamming (Behind the Scenes of The M.Akita Chronicles)"
ai_relevance: tangential
ai_relevance_reason: "Backend engineering of a reliable email pipeline; AI appears only as the context (the project was vibe coded), not as the subject."
genre: tutorial
themes: [software-engineering-discipline, non-ai]
thesis: "Reliable email sending means treating each delivery as a state machine and, when uncertain whether a message was sent, never resending (at-most-once), plus correct DNS authentication and unsubscribe headers."
summary: "Part 1 of a behind-the-scenes series. Using Amazon SES, Akita describes patterns to avoid duplicate newsletters: one delivery record per recipient, atomic claiming so two workers cannot send the same email, terminal states that are never auto-reverted, an explicit 'unknown' state for ambiguous cases, recovery of stuck jobs, careful retry rules, tags and webhooks to reconcile bounces, and deferred reports. He also covers SES sandbox, DKIM/SPF/DMARC, the Gmail List-Unsubscribe header requirement (RFC 8058 one-click), the silent suppression list, encrypting subscriber emails at rest, and a cost of about US$0.40 per month for 1,000 subscribers. Ruby on Rails code is shown throughout."
key_claims:
  - claim: "For email, at-most-once delivery is preferable to at-least-once: nobody complains about missing a newsletter, everyone complains about receiving it twice, so when in doubt do not resend."
    time_sensitive: false
  - claim: "Gmail requires List-Unsubscribe headers for bulk senders (since Feb 2024) and silently penalises domain reputation otherwise."
    time_sensitive: true
  - claim: "SES silently drops messages to addresses on its account-level suppression list while still returning success."
    time_sensitive: true
  - claim: "Subscriber emails should be encrypted at rest."
    time_sensitive: false
