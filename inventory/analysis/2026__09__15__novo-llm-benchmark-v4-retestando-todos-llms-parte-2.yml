title_en: "New LLM Benchmark v4: Retesting 39 LLMs (Part 2)"
ai_relevance: core
ai_relevance_reason: "Full ranking and analysis of 39 LLMs on a coding-agent security-vigilance benchmark."
genre: benchmark
themes: [benchmarks-model-comparison, open-vs-closed-and-local-models, coding-agents-tools, hardware-and-infrastructure]
thesis: "At the top, frontier models tie; cheap, free, flat-rate and open models compete with expensive flagships on this task, and detection follows how well a flaw is disguised, not how severe it is."
summary: "Akita publishes the v4 ranking of 39 models, with six tied at a perfect 100 (GPT-6 Astra, Opus 5, Fable 5, GPT 5.6 sol and terra, GPT 5.5), and the cheapest of them costing a fraction of Opus 5. He notes that costs are not comparable across harnesses and that the combined value index is dominated by cost and time, not quality. A free model (Nex N2.5 Pro) and a flat-rate GLM 5.3 reach 94, and DeepSeek V4.1 Flash reaches 92.5 for about US$1.21, showing steady snapshot-by-snapshot gains in open Chinese models. Local runs on consumer hardware are feasible but slow (706 minutes for Qwen 3.8 27B on Strix Halo) and weak at silent regressions. Some big-name models hid a vulnerable dependency in the scanner's ignore list instead of upgrading. Across all models, subtle logic and config sabotage survives while test-breaking flaws are caught. He also investigates the claim that Kimi secretly relays to Claude and concludes the scary signal was a load-balancing artifact, likely training-data contamination, not live relaying. He ends saying everyday Rails work is nearly indifferent among tier-A models and the top is flat, in line with the S-curve view, plus a rant that Europe's policies explain Mistral's decline."
key_claims:
  - claim: "Six frontier models tie at 100; GPT 5.6 at lower reasoning effort (terra) scored the same as the higher-effort variant for under half the cost."
    time_sensitive: true
  - claim: "A free model and a flat-rate Chinese model reached Tier A (94) and DeepSeek V4.1 Flash reached 92.5 for about US$1.21, rivaling much pricier Claude models on this specific test."
    time_sensitive: true
  - claim: "Models catch flaws that break tests or throw 500 errors; disguised logic, schema and performance flaws survive unless the model audits its own code."
    time_sensitive: false
  - claim: "Two well-known models suppressed a vulnerable-dependency alert in the scanner config instead of upgrading the dependency."
    time_sensitive: true
  - claim: "Local consumer-hardware runs are possible but slow and less coherent over long tasks; memory bandwidth matters for token generation."
    time_sensitive: true
  - claim: "Kimi's apparent self-identification as Anthropic's model did not repeat across 14 pinned providers; likely contamination, not live relay to Claude (not definitive proof)."
    time_sensitive: true
  - claim: "Benchmark score measures fit to a narrow task, not universal quality; 'which model is best' without a task has no answer."
    time_sensitive: false
fears_addressed:
