thesis: "Run the desktop on the AMD integrated GPU and reserve the NVIDIA GPU for heavy apps and AI workloads, to avoid Hyprland/NVIDIA instability."
summary: "Akita documents a personal fix for Hyprland crashing on wake-up with an NVIDIA RTX 5090. He moves the window manager to the CPU's integrated AMD GPU, configures environment variables and DRM device order, and uses Prime offload scripts so only Blender, Plasticity and Bambu Studio use the NVIDIA card. AI tools like ComfyUI, Ollama and LM Studio find the NVIDIA GPU automatically, and the NVIDIA card gains free VRAM for loading LLMs. He concludes Wayland on NVIDIA is not fully stable."
key_claims:
  - claim: "Using a second (integrated) GPU for the desktop frees the NVIDIA GPU's VRAM for running LLMs and other heavy workloads."
    time_sensitive: true
  - claim: "Wayland with Hyprland on NVIDIA is still not fully stable (at the time of writing)."
    time_sensitive: true
