summary: "After his AI experimentation marathon left him with dozens of public repositories receiving issues and pull requests, Akita built ghpending, a small Rust command line tool that fetches open issues and PRs for chosen repos in parallel and prints a digest. He lists install options (Homebrew, Cargo, mise), the four commands, the optional GitHub token that raises the API rate limit from 60 to 5000 requests per hour, and the config file locations. He explains that a self-made tool gets used because third-party ones always add friction. It is MIT-licensed and PRs are welcome."
