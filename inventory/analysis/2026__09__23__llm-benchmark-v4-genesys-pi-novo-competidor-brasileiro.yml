genre: benchmark
themes: [benchmarks-model-comparison, open-vs-closed-and-local-models, business-and-economics]
thesis: "A small Brazilian lab's from-scratch model lands mid-table (83.5, tied with Grok 4.7), a genuine result that the author says disproved his prior doubt about national model training, though it is not at flagship level."
summary: "A Brazilian company, LUA Vision, offered Akita free access to its Genesys PI model, and he ran both tiers (House and Enterprise) through his v4 sabotage-detection benchmark. House scored 83.5 (Tier A, tied with Grok 4.7) and Enterprise 82.5 (Tier B), behind 34 of 46 models, including all flagship Claude and GPT models and several Chinese ones. He describes the company, its self-published preprints and self-declared LiveBench score, noting they are not independently verified. A notional cost calculation (US$460 for House, US$19 for Enterprise, partly from lack of prompt caching) was later disowned by the company's CRO, who said API prices were examples and the real model is licensing on the customer's infrastructure, priced from 7 October. He notes an Enterprise run got stuck in a tool-call loop. He concludes the advantages are Brazilian legal and fiscal context, Portuguese support and data sovereignty, not benchmark leadership, and admits he used to think training a frontier-class model in Brazil was unviable."
key_claims:
  - claim: "Genesys PI House scored 83.5 (Tier A) and Enterprise 82.5 (Tier B) on the author's v4 vigilance benchmark, behind 34 of 46 models."
    time_sensitive: true
