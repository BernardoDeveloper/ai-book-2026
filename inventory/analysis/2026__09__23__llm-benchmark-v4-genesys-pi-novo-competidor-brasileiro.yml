    time_sensitive: true
  - claim: "Notional token pricing was an example; the company says it will license the model to run on customer infrastructure with pricing published 7 October 2026."
    time_sensitive: true
  - claim: "The author was provided a free evaluation key and has no commercial relation with the company."
    time_sensitive: false
  - claim: "Benchmark does not measure Brazilian legal/fiscal knowledge, Portuguese support or data sovereignty, which are the model's claimed advantages."
    time_sensitive: false
