ai_relevance: core
ai_relevance_reason: "The whole post is a hands-on test of a coding agent (Crush) driving Claude Opus 4.5."
genre: review
themes: [coding-agents-tools, vibe-coding-practice]
thesis: "Open-source terminal coding agents such as Crush and OpenCode, paired with a strong model, have become practical for daily work, a clear leap over a year earlier."
summary: "Akita says Aider has stagnated and that Omarchy 3 now ships OpenCode and Crush. He runs Crush (a terminal agent from Charm) with Claude Opus 4.5 on his Hugo blog. It scans the project, writes an AGENTS.md summary, refactors two scripts without breaking them, runs the result to check it, and finds a bug he had missed. A harder second test: an abandoned-style command-line chat written in Zig (an obscure, unfinished language) using llama.cpp, CUDA and Qwen3, which had to be updated for Zig 0.15's new IO API. The agent split a monolithic file, remapped the C functions, iterated on compiler errors until it built, then diagnosed a segmentation fault (wrong struct, memory leak) after being told to run it. The first refactor round cost US$5.64 and the total was close to US$8. He notes no model he tried the year before could finish this program, and that he has not tested local models."
key_claims:
  - claim: "A coding agent is a wrapper that feeds a model context and tools; here all code came from Claude Opus 4.5, Crush only orchestrates."
    time_sensitive: false
  - claim: "The agent ran the code it modified and checked it still worked, and caught a bug the author had not noticed."
    time_sensitive: false
  - claim: "With an obscure, recently changed language (Zig 0.15) and little training data, the agent still refactored, updated APIs and reached a working binary, which no LLM he tested in 2025 managed."
    time_sensitive: true
  - claim: "Compiling is not the same as working: the first build segfaulted and needed a second debugging round."
    time_sensitive: false
  - claim: "The whole job cost about US$8 in API credits."
    time_sensitive: true
