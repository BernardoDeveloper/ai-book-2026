genre: project-log
themes: [vibe-coding-practice, programming-languages, coding-agents-tools, software-engineering-discipline]
thesis: "When an AI can port a 10,000-line project in under 40 minutes, the cost calculus of rewriting software changes, and the old rule against porting 'just because' needs rethinking."
summary: "To avoid the Python dependency burden of an open source subtitle automation tool (Subservient), Akita asked Claude to analyze it and produce a feature-parity port in Crystal, after specifying design decisions: use a standalone Rust sync binary, subcommands instead of menus, and YAML instead of INI. Five commits in under 40 minutes yielded 2,516 lines in 42 files plus 76 tests (the original had none), a 6 MB static binary with no runtime dependencies, CI releases and a Homebrew formula. The original was 10,220 lines in 6 monolithic files. He notes the line-count difference is partly due to restructuring, not only Crystal. He admits the experiment made him reconsider his long-held view that porting for language fetishism is a waste, because the barrier fell so low. The port is GPL-3.0 like the original."
