themes: [benchmarks-model-comparison, coding-agents-tools, hype-and-marketing, business-and-economics]
thesis: "Claude Opus 5 is very good (95/100, tied at the top, half Fable 5's price per token), but that does not prove it is the best LLM in general, and the benchmark itself keeps being corrected."
summary: "A day after Anthropic released Claude Opus 5, Akita ran it on his Rails chat-app benchmark through Claude Code headless: 95/100, 39 minutes, 201 turns, 121 tests, about $16 in API-equivalent cost billed to a subscription. He notes the harness differs from other entries, so the comparison is not controlled. The generated project showed unusually defensive engineering: isolated client, guard test for the gem's API, bounded cached history, and two bugs found and fixed during the run. It ties Opus 4.8 and GPT 5.4, one point above Fable 5. API price is $5/$25 per million tokens versus Fable's $10/$50, but per-task cost depends on turns and harness, not just price per token. Re-auditing the old leader Opus 4.7 with a blind cross-audit found a double-send bug, dropping its score from 97 to 87, which he says shows his earlier audit was incomplete, not that the model got worse. He closes advising to read 90+ as a group and run your own test."
key_claims:
  - claim: "Opus 5 scored 95/A in the Rails chat benchmark via Claude Code, tying Opus 4.8 and GPT 5.4."
    time_sensitive: true
  - claim: "Opus 5 API pricing is $5/$25 per million tokens, the same as Opus 4.8 and half of Fable 5."
    time_sensitive: true
  - claim: "Price per million tokens is not cost per task: a cheaper-per-token model can cost more per run because of turns and cache reads."
    time_sensitive: false
  - claim: "Opus 4.7's earlier 97 was inflated by an audit blind spot (a double-send bug); it was recalculated to 87 with no change to the model."
    time_sensitive: true
  - claim: "Opus 5's score being higher than Fable's does not prove it is better in general; Anthropic says Fable's edge grows on longer, more complex tasks."
    time_sensitive: true
