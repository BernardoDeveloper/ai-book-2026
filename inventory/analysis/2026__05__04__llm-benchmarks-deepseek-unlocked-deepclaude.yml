title_en: "LLM Benchmarks: DeepSeek Unlocked! Use DeepClaude"
ai_relevance: core
ai_relevance_reason: "A benchmark follow-up showing how the agent wrapper (harness) changes one model's score, centered on DeepSeek V4 Pro."
genre: benchmark
themes: [benchmarks-model-comparison, coding-agents-tools, open-vs-closed-and-local-models, limits-of-llms]
thesis: "Swapping only the harness (the agent loop around the model) lifted DeepSeek V4 Pro from an unmeasurable or Tier B 69 to Tier A 89, showing that the wrapper matters as much as the model."
summary: "Recaps four earlier benchmark posts, where DeepSeek V4 Pro could not be measured in opencode because a reasoning field it returns was dropped by the SDK, causing errors that the tool hid by silently falling back to Opus. Akita found DeepClaude, a shell shim that points Claude Code at an alternative Anthropic-compatible endpoint (OpenRouter, DeepSeek, Fireworks), so Claude Code's whole agent loop runs on another model. He extended his benchmark runner with environment overrides and ran two variants: DeepSeek solo scored 84 and with a Sonnet subagent registered but never invoked scored 89 at $3.14 in 18 minutes. Observations: the Opus code-quality regression inside Claude Code is specific to Opus, merely having a subagent available seemed to make the planner decompose better, a multi-turn bug in the controller persisted regardless of harness, and DeepSeek also ignored the subagent. Caveats of DeepClaude include no image input, no MCP tools and ignored Anthropic cache markers. An update notes other options: DeepSeek-TUI and an opencode fix (PR merged April 24) needing manual config. Practical conclusion: this is the first real Tier A coding option without an Anthropic subscription."
key_claims:
  - claim: "Changing only the harness raised DeepSeek V4 Pro from 69 (Tier B, opencode, partly written by a hidden Opus fallback) to 84-89 (Tier A via Claude Code with an alternative endpoint)."
    time_sensitive: true
  - claim: "A coding tool can silently fall back to another model when the chosen model errors, making a benchmark appear to succeed while measuring the wrong model."
    time_sensitive: false
  - claim: "Having an unused subagent registered correlated with +5 points, possibly because the planner designs smaller, more contractable units."
    time_sensitive: true
  - claim: "The Opus regression in Claude Code does not appear with DeepSeek in the same harness, so it is specific to Opus rather than the harness alone."
    time_sensitive: true
  - claim: "DeepClaude lacks image input and MCP tools and drops Anthropic's explicit prompt-cache markers, so costs are not strictly comparable."
    time_sensitive: true
  - claim: "As of May 2026, opencode supports DeepSeek thinking mode through a merged fix but needs manual config."
    time_sensitive: true
