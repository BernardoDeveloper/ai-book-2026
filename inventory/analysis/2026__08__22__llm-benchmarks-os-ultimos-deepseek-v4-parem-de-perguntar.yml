thesis: "DeepSeek V4's new snapshots moved from Tier B to Tier A (90 and 91) and are the cheapest in that tier, but similar scores on a narrow web-app test do not make models equivalent, and Kimi K3 and GLM 5.3 remain his preference."
summary: "Tired of readers asking 'what about DeepSeek?', Akita ran the new DeepSeek V4 Flash 0731 and Pro 0813 snapshots on his v2 Rails chat benchmark. Flash rose from 80 to 90 and Pro from 82 to 91, both Tier A, with Flash's roughly 82-cent run the cheapest Tier A run yet. Pro's earlier multi-turn bug was fixed in a harness update, so the workaround was no longer needed. Both were slow (82 and 88 minutes) and verbose (Flash used 44 million tokens). He reminds readers the benchmark measures one narrow slice, easy web programming, so close scores mean closeness only on that test. DeepSeek's trajectory since April, when an earlier version invented a whole library API, is steep. Among Chinese models in the same harness it trails GLM 5.3, Qwen 3.8 Max and Kimi; its advantage is price."
key_claims:
  - claim: "DeepSeek V4 Flash 0731 scored 90 (was 80) and Pro 0813 scored 91 (was 82), both Tier A."
    time_sensitive: true
  - claim: "A benchmark score reflects only the narrow tested slice (easy Rails web programming) and says nothing about kernel drivers, game engines or offensive security."
    time_sensitive: false
  - claim: "DeepSeek is competitive in cost (about $0.82 and $5.01 per run) but slow and token-verbose compared with peers."
    time_sensitive: true
  - claim: "Models can improve greatly within months: from fabricating an entire library API in April to finding and confessing its own dead code."
    time_sensitive: true
