thesis: "A parallel X11 session (bspwm, picom, polybar, rofi, XLibre) can reproduce the Omarchy look and workflow on older hardware or X11-dependent setups where Wayland is not yet viable."
summary: "Akita announces NW-Omarchy (Not Wayland Omarchy), an experimental sidecar project that adds an X11 session beside an existing Omarchy (Hyprland, Wayland) install. He explains XLibre, a 2025 fork of xorg-server that continues maintenance after Red Hat said it would stop supporting the upstream X server in RHEL 10. He maps each Omarchy component to an X11 equivalent (bspwm, sxhkd, picom, polybar, rofi, dunst and others), shows that the same theming pipeline and more than 70 key bindings work, and lists what is lost (fractional per-monitor scaling, HDR, tear-free by design, swipe previews). He gives install, upgrade and uninstall steps and positions the project as pragmatic: new machines should stay on Hyprland, older ones can use X11. It is described as version 1.0 but still experimental and seeking feedback."
key_claims:
  - claim: "XLibre is a drop-in fork of xorg-server with active maintenance, adopted by Artix and proposed for Fedora."
    time_sensitive: true
  - claim: "X11 retains advantages for legacy GPU drivers, ssh -X, automation tools and accessibility; Wayland has advantages in fractional scaling, HDR and tear-free rendering."
    time_sensitive: true
