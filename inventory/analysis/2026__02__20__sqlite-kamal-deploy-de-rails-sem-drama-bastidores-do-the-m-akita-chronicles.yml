thesis: "Most applications never needed the infrastructure complexity (PostgreSQL, Redis, Kubernetes) the industry assumed; Rails 8 with SQLite and Kamal on one cheap VPS is enough."
summary: "Akita describes running a full Rails 8 app (database, job queue, cache, websockets) on a single 12 dollar per month VPS using SQLite files instead of PostgreSQL and Redis. Kamal handles Docker-based deploys over SSH with zero downtime through a proxy, automatic Let's Encrypt SSL, hooks and a secrets file. Docker volumes keep SQLite data alive across deploys, and VACUUM INTO gives an atomic hourly backup, while naive file copies of a live database can corrupt the backup. He lists when not to use SQLite (multiple writers, huge datasets, high availability). A cost table compares roughly 84 dollars per month for the classic stack against 12 dollars. The conclusion is that SQLite plus Kamal is not a downgrade but a recognition that most apps never needed the complexity."
