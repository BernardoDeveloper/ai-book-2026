title_en: "Codes of Conduct Are the Root of All Evil: Reclaiming Your Freedom"
ai_relevance: tangential
ai_relevance_reason: "About open-source community politics; AI appears only as a side note in the 2022 tech-layoff and ChatGPT timeline (end-of-programming predictions)."
genre: opinion
themes: [open-source-community, society-politics-censorship, non-ai]
thesis: "Open-source codes of conduct, born in a decade of cheap money, became instruments for cancelling people over opinions rather than code, with no evidence they improved diversity; the era ended when the money did."
summary: "Akita argues that the Contributor Covenant and similar codes of conduct were used to oust high-profile figures (Brendan Eich, Larry Garfield, Linus Torvalds, Richard Stallman, Tim Peters and others) for opinions or private life rather than technical wrongdoing. He ties the phenomenon to the 2012-2022 hiring bubble, when companies overhired and had spare time for internal politics, and notes the bubble burst in 2022 with large layoffs, coinciding with ChatGPT's release and early predictions that AI would end programming (including Amodei's 90% claim, which he says did not come true). He reviews academic studies finding no demonstrable gain in diversity or newcomer attraction from codes of conduct, and a 2026 causal study showing veteran contributors disengage after adoption. He describes the backlash led by DHH, Framework and the Omacom Foundation, and tells how pressure on quotas led him to leave organizing RubyConf Brasil. He closes saying the cancelling machine lost funding rather than the debate."
key_claims:
  - claim: "Codes of conduct were used to remove prominent open-source figures for non-code reasons (opinions, donations, private life)."
    time_sensitive: false
  - claim: "Studies find no evidence that codes of conduct raise diversity or attract newcomers; a 2026 ICSE causal study found more newcomers but also more disengagement of existing contributors."
    time_sensitive: true
  - claim: "The 2012-2022 tech hiring bubble, fueled by cheap money, funded the 'everyone should learn to code' wave and burst with hundreds of thousands of layoffs in 2022-2023."
    time_sensitive: false
  - claim: "ChatGPT launched during the 2022 layoffs, followed by predictions of the end of programming (Huang, Devin, Amodei's 90% of code in 3-6 months) that did not materialize."
    time_sensitive: true
