title_en: "Hot take: Harness, Loop Engineering and Graph Engineering are bullshit"
ai_relevance: core
ai_relevance_reason: "Argues about how AI agents should be used and sold: against new named 'engineering' disciplines and heavy multi-agent orchestration."
genre: rant
themes: [hype-and-marketing, coding-agents-tools, software-engineering-discipline, vibe-coding-practice]
thesis: "When the technology becomes a commodity, money moves to taxonomy: harness, loop and graph engineering and spec-driven development are small real practices inflated into courses and certifications, and plain software engineering (tests, CI, pair-style iteration) is what actually works."
summary: "Akita defends a tweet saying new AI 'engineering' disciplines exist to sell consulting and courses. His evidence is more than 30 public repositories and his benchmark data: for weak models a harness can rescue results, for frontier models harness is noise (one-point differences), and where it really matters is cost via caching (a run 5x cheaper in the vendor's own CLI). Loop engineering is test-and-review, graph engineering is a diagram for a straight line, and multi-agent chains multiply failure (ten steps at 90% each succeed about 35% of the time). He cites Cognition, Anthropic's own multi-agent post (15x tokens, coding poorly suited) and a Berkeley study of production agents. He argues spec-driven development is a program written in prose, repeats the failed UML/MDA promise, and contradicts agile's lesson that software emerges by building. He recommends Agile Vibe Coding (XP with an LLM), uses his ai-memory tool to switch harnesses freely, and says FOMO is the sales mechanism."
key_claims:
  - claim: "For frontier models the harness changes scores by about a point (noise); for weak models it can rescue results; the main real effect is cost through caching."
    time_sensitive: true
  - claim: "A pipeline of ten steps with 90% accuracy each succeeds only about 35% of the time."
    time_sensitive: false
  - claim: "No multi-agent planner-executor combination beat Opus alone in his April tests."
    time_sensitive: true
  - claim: "Anthropic's multi-agent research system uses about 15x more tokens, and 80% of its improvement came from spending more tokens."
    time_sensitive: true
  - claim: "A spec precise enough to generate correct code is already a program, written in prose that cannot be compiled or tested."
    time_sensitive: false
  - claim: "Gartner estimates only about 130 of thousands of vendors selling 'agentic AI' are real ('agent washing') and 40% of agentic projects will be canceled by end of 2027."
    time_sensitive: true
  - claim: "Agile Vibe Coding is XP with an LLM: tests, clean code, CI, pairing and deploy; the AI idea is 10% and normal engineering 90%."
    time_sensitive: false
