title_en: "ai-memory: Long-Term Memory (Karpathy Wiki) and Self-Learning (Hermes) for Your Projects"
ai_relevance: core
ai_relevance_reason: "The subject is persistent memory for AI coding agents and a guarded self-learning loop."
genre: project-log
themes: [agent-memory-and-context, coding-agents-tools, limits-of-llms]
thesis: "A coding agent's session memory vanishes; a versioned markdown wiki with selective, validated, auditable promotion of lessons gives continuity across sessions and agents, and 'self-learning' should be modest, not magic."
summary: "Akita describes the daily-use side of ai-memory. Long sessions produce a warmed-up agent that forgets everything once the session ends, making the human the agent's cache; a big context window only belongs to the current session. The tool follows Karpathy's LLM Wiki idea: hooks capture sessions, the server organizes them into small markdown pages (decisions, gotchas, procedures, rules) with SQLite as a rebuildable index, and agents query via MCP. An auto-improve job inspired by Hermes Agent reviews finished sessions in the background, asks an LLM for small edits, validates evidence, path, size and confidence, logs an audit trail and optionally requires human approval. He warns that bad memory is worse than no memory because it produces false certainty, and cautions against marketing the word 'auto' as agents learning by themselves."
key_claims:
  - claim: "Context windows belong to the current session; they do not give agents memory across days or across different agents."
    time_sensitive: false
  - claim: "Useful memory is synthesis (decisions, gotchas, procedures, rules), not transcripts of logs."
    time_sensitive: false
  - claim: "Bad memory is worse than no memory: lacking memory makes you ask, wrong memory gives false certainty; a naive auto-writer would fill the wiki with superstitions from transient failures."
    time_sensitive: false
  - claim: "ai-memory keeps markdown as source of truth with SQLite as a derived index that can be rebuilt."
    time_sensitive: false
  - claim: "Auto-improve runs outside the hot path of hooks, validates proposals and records an audit trail, with an optional manual approval mode."
    time_sensitive: true
  - claim: "'Self-learning' is an easy marketing trap; the real system is a bounded job that observes, filters, validates and leaves a trail."
    time_sensitive: false
fears_addressed:
  - "Does AI really learn and remember like a person?"
  - "Will agents quietly accumulate wrong beliefs?"
reader_value: "Medium to high for the first half: explains in plain terms why AI assistants forget, what 'memory' really means and why 'self-learning' claims deserve scrutiny; the product feature list is niche."
