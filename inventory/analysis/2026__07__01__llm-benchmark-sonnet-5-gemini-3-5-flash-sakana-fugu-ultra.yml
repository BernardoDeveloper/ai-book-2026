title_en: "LLM Benchmark: Sonnet 5 Fails, Gemini Flash Surprises, Sakana Fugu Nearly Tier A"
ai_relevance: core
ai_relevance_reason: "A benchmark round scoring new LLMs on a full-project coding task."
genre: benchmark
themes: [benchmarks-model-comparison, limits-of-llms, hype-and-marketing]
thesis: "A famous new model name does not guarantee working integration: Sonnet 5 passed Docker yet called a non-existent API (58/100), while Gemini 3.5 Flash scored 93; green builds and tests can hide fake-based lies."
summary: "Akita adds Sonnet 5, Gemini 3.5 Flash, Sakana Fugu Ultra, Qwen3.7 Max and Step 3.7 Flash to his Rails/RubyLLM chat-app benchmark graded by reading code by hand. Sonnet 5 scored 58 because its service assigns messages= which RubyLLM lacks, so the first real chat raises NoMethodError, and its test fake defines the missing writer, hiding the bug. Gemini 3.5 Flash scored 93 with correct API use, strong tests and file-based persistence, though its run cost about $3.50. Sakana Fugu Ultra (79) never replayed chat history to the model, and Step 3.7 Flash had the same flaw. He also notes Anthropic lifting US-government controls on Fable 5 and OpenAI's GPT-5.6 preview. His practical advice remains Opus 4.8 or GPT 5.5 for serious coding, and that harness, prompt, memory and test quality matter as much as the model."
key_claims:
  - claim: "Claude Sonnet 5 scored 58/100 (Tier C) in his benchmark because the generated code assigned chat.messages=, a method RubyLLM does not have, so the first real conversation fails."
    time_sensitive: true
  - claim: "The project's own FakeChat defined the missing writer, so tests were green while production code was broken: a green test can be worse than useless when the fake lies."
    time_sensitive: false
  - claim: "Gemini 3.5 Flash scored 93/100 (Tier A, #6) but cost about $3.50 per run, more than Opus 4.8 on this task."
    time_sensitive: true
  - claim: "Sakana Fugu Ultra (79) and Step 3.7 Flash (69) displayed a multi-turn chat UI but only sent the last message to the model."
    time_sensitive: true
  - claim: "Anthropic lifted controls on Fable 5 on 30 June 2026 after imposing US-government-related controls on 12 June; Mythos 5 remains restricted to approved US organizations."
    time_sensitive: true
  - claim: "Model alone does not carry the work; harness, system prompt, project memory and test quality matter."
    time_sensitive: false
