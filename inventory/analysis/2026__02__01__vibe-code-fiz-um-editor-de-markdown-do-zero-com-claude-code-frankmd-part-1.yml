thesis: "A personalised tool built with AI in about three days fits the author's workflow, but it works because text editors are very well documented in training data, not because AI can make anything."
summary: "Akita presents FrankMD, a self-hosted Markdown editor (Ruby on Rails 8, Docker) built entirely with Claude Code in about three days and 30 hours, without writing code himself. It was motivated by friction in editing his Hugo blog posts: front matter and slugs, uploading images to S3, tables, previews, spell-checking. Features include image insertion from local files, web search and the Nano Banana image generator, YouTube embedding, table helpers, emoji, themes matching Omarchy, fonts, i18n, typewriter mode, an AI button that sends text to a chosen LLM for grammar-only checks with a diff, and Hugo post creation. The name honours Frank Rosenblatt, creator of the 1957 Perceptron. He frames the two prior vibe-code posts as showing how hard simple things are, and says the point is to temper the unrealistic expectations of non-programmers ('a GTA 6 from scratch'). He cautions that editors are heavily documented so the result is not as impressive as it looks."
key_claims:
  - claim: "FrankMD was built with Claude Code in about 3 days (roughly 30 hours) with 137 pull requests and no code written by hand."
    time_sensitive: false
  - claim: "Claude succeeded partly because text editors are very well documented with abundant training material; the result should not be over-interpreted."
    time_sensitive: false
