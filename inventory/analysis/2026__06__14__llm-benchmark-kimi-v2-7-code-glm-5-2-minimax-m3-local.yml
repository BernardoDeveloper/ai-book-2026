title_en: "LLM Benchmark: Kimi K2.7 Code, GLM 5.2 and MiniMax M3 Local"
ai_relevance: core
ai_relevance_reason: "Benchmarks open-weight models and discusses why large open models cannot run on consumer hardware."
genre: benchmark
themes: [open-vs-closed-and-local-models, benchmarks-model-comparison, hardware-and-infrastructure]
thesis: "Open-weight models are improving steadily (GLM 5.2 jumped from 46 to 87), but serious coding still needs Opus 4.8 or GPT 5.5, and local use of the largest open models is blocked by memory and chip supply until perhaps around 2030."
summary: "Akita adds Kimi K2.7 Code (86/100), GLM 5.2 (87) and the open-weights MiniMax M3 to his Rails/RubyLLM coding benchmark. He first updates his data-center story: SpaceX's record IPO was pitched on orbital AI compute, and open models could eventually offload demand from the cloud. Kimi K2.7 Code regressed slightly versus K2.6 by omitting the system prompt, and its case exposed a false positive in his own scanner. GLM 5.2 made the biggest jump he has measured by fixing a hallucinated API bug. MiniMax M3 has about 428B parameters in a mixture-of-experts layout, so even the 1-bit quantization fills 128 GB and leaves nothing for the KV cache; only 256 GB or more Mac Studios could try it. He expects local viability to converge with cheaper hardware around 2030."
key_claims:
  - claim: "In his benchmark GLM 5.2 scored 87 and Kimi K2.7 Code 86, versus GLM 5.1 at 46."
    time_sensitive: true
  - claim: "Serious agentic coding needs more than about 200K tokens of context, which most open models do not deliver with quality."
    time_sensitive: true
  - claim: "In a mixture-of-experts model all weights must stay resident in memory even though only a fraction is active per token; the total size, not the active size, sets hardware needs."
    time_sensitive: false
  - claim: "MiniMax M3 (~428B parameters, ~23B active) cannot run on a 32 GB GPU or a 128 GB unified-memory machine at any usable quantization."
    time_sensitive: true
  - claim: "Local AI is held back by chip and memory supply being absorbed by data-center buyers; he guesses viability around 2030."
    time_sensitive: true
  - claim: "His automated scanner flagged valid app methods as hallucinated API calls, so he always reads integrations by hand."
    time_sensitive: false
