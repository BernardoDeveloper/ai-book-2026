title_en: "ai-memory 2.0: the best memory system for agents and teams"
ai_relevance: substantial
ai_relevance_reason: "Release announcement and positioning of a long-term memory server for coding agents; memory and context are central AI topics, though the post is promotional and feature-focused."
genre: announcement
themes: [agent-memory-and-context, coding-agents-tools, open-source-community]
thesis: "ai-memory 2.0 offers an open-format, local-embedding, multi-agent and team-ready memory for coding agents, keeping the project's knowledge with the user instead of with any model vendor or harness."
summary: "Akita announces ai-memory 2.0 after 1.x grew to 1.39 in two months. Major points: strict semantic versioning with a verified-backup migration, a native Open Knowledge Format wiki so memory is plain Markdown readable by other tools, and a local embedding provider on by default that raised retrieval hit@5 on LongMemEval-S from 0.617 to 0.779. It supports several agents at once on the same project without overwriting one another (versioned pages, single writer) and a team sharing one server with attribution and audit log, while handoffs and personal work slots stay per person. He compares it with other memory projects and the memory built into Claude Code, claiming the combination of cross-agent, cross-machine, team, open Markdown, silent capture and single binary is unique. He credits about 70 contributors and closes: rent LLMs and subscriptions from whoever is best, keep the project memory."
key_claims:
  - claim: "Local embeddings improved retrieval on the LongMemEval-S benchmark (hit@5 from 0.617 with full-text only to 0.779)."
    time_sensitive: true
  - claim: "The wiki is native Open Knowledge Format Markdown, so memory is not locked into the tool."
    time_sensitive: true
  - claim: "Concurrent writes create new page versions rather than overwriting; all writes go through a single writer."
    time_sensitive: false
  - claim: "Claude Code's built-in memory is limited to one machine and one agent, without real search or team support."
    time_sensitive: true
  - claim: "The project grew to about 70 contributors, 371 merged PRs and 181 closed issues by 2.0."
    time_sensitive: true
