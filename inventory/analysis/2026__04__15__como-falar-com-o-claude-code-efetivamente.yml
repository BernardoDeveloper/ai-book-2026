title_en: "Why LLMs Don't Give You the Result You Expect | Why I Prefer Claude Code Today"
ai_relevance: core
ai_relevance_reason: "The post is about how to prompt and collaborate with LLM coding agents and compares two of them."
genre: essay
themes: [vibe-coding-practice, coding-agents-tools, jobs-and-careers, limits-of-llms]
thesis: "When people say a model 'failed', the cause is usually poor communication: stating what you want, how, what you do not want and how to validate, then iterating like a pair programmer."
summary: "Akita hears constantly that Claude is worse than GPT or vice versa, but after 500+ hours and about 400k generated lines with Claude Code and Codex, he says neither went off the rails and that when they could not do something they said so. He rejects heavy frameworks such as Spec Driven Development and instead practices Agile Vibe Coding: XP-style pair programming with an LLM. Using a real example (consolidating 12 TB of ROMs with checksums, idempotent steps, zero deletion and a human approval gate) he shows four things to communicate: the goal, the preferred method, what you do NOT want, and how to validate success. Once the context is solid, he switches from dictating to asking the model for the best approach, because it has broader vocabulary. He says the prompt is the start of a conversation, not a contract, and that output quality is proportional to the effort put into asking. He argues AI will replace people who cannot ask properly or validate, not good professionals, uses Tony Stark and Jarvis (and 85 armors) as a metaphor for iteration, and prefers Claude Code over Codex in April 2026 due to its harness (to-do planning and parallel execution), not the model. He closes with the Hitchhiker's 42 joke about asking the wrong question."
key_claims:
  - claim: "Differences people report between models are mostly differences in how they communicate with the model."
    time_sensitive: false
  - claim: "Effective prompts state the goal, the method, what not to do, and how to validate success."
    time_sensitive: false
  - claim: "After context is established, asking the model for the best approach beats prescribing the solution."
    time_sensitive: false
  - claim: "AI agents will replace people who cannot specify or validate work, not good professionals who become more productive."
    time_sensitive: false
  - claim: "As of April 2026, Claude Opus and GPT-5.4 xHigh are roughly tied as models; Claude Code's harness (visible to-do list, parallel execution on interruption) is superior to Codex's."
    time_sensitive: true
  - claim: "Models tend to say when they cannot do a task given the constraints rather than inventing, in the author's 500+ hours of use."
    time_sensitive: true
  - claim: "Prompting is iterative; the first prompt is a starting point and corrections continue during the work."
    time_sensitive: false
