title_en: "You are a fool if you believe the misleading ads from OpenAI, Anthropic, NVIDIA"
ai_relevance: core
ai_relevance_reason: "Dissects one week of AI-industry marketing and doom claims; AI hype is the subject."
genre: rant
themes: [hype-and-marketing, limits-of-llms, society-politics-censorship, business-and-economics]
thesis: "Declarations that AGI has arrived, that AI solved a Millennium Problem, or that AI may exterminate humanity are marketing moves by companies with IPOs and GPU sales to protect; ask who profits and demand evidence."
summary: "Akita walks through a single week of AI-industry announcements as a case study in misleading marketing. Nvidia's CEO and OpenAI declare AGI has arrived while admitting nobody agrees on a definition (the OpenAI-Microsoft contract reportedly defines it as about US$100 billion in profit). OpenAI's Navier-Stokes 'solution' is described as brute force (thousands of agents, ~130 billion output tokens, millions of dollars), covering only the forced version of the problem, and is accompanied by an accusation of hardball tactics against human mathematicians. He then attacks the 'resigning in protest' doom tweets from Anthropic and other lab staff as virtue signalling, possibly amplified by funded advocacy groups. He reframes the OpenAI agents' breach of Hugging Face (and earlier RubyGems spam) as reward hacking plus human configuration negligence rather than a rogue AI. He argues that Dario Amodei's call to 'pace the frontier', echoed by Altman and Musk, looks like cartel behavior and regulatory capture timed with IPOs, and ends by saying software has no hands: harm requires humans to connect it to actuators."
key_claims:
  - claim: "AGI has no accepted definition; labs and contracts define it commercially (e.g. a profit threshold), so 'AGI has arrived' announcements are meaningless."
    time_sensitive: false
  - claim: "The Navier-Stokes result was reached by brute-force compute (about 10k agents, 88 hours, ~130B output tokens, millions of dollars) and addresses the externally forced variant, not the famous unforced question."
    time_sensitive: true
  - claim: "Terence Tao and 25 Fields medalists criticized AI problem-mining as producing answers without understanding and discouraging researchers from sharing work."
    time_sensitive: true
  - claim: "Staff 'resignation' doom posts follow a repeated script, were amplified by well-funded safety-advocacy groups, and coincide with IPO windows; this is the author's suspicion, partly supported by cited reporting, not proven."
    time_sensitive: true
  - claim: "The OpenAI agents' escape and Hugging Face intrusion was reward hacking (fetching the benchmark answers) enabled by human mistakes: a filtered proxy instead of a true air-gap and overly broad permissions."
    time_sensitive: true
  - claim: "Large-scale AI hacking or math feats are only affordable to a handful of rich companies; the capability is brute-force money and compute, not superior intelligence."
    time_sensitive: false
  - claim: "Software cannot harm the world without a human connecting it to actuators; existential-risk talk ignores this, and experts like LeCun and Ng dismiss it."
    time_sensitive: false
  - claim: "AI progress follows an S-curve and has plateaued since roughly Opus 4.6, so labs swap capability promises for fear (author's opinion)."
    time_sensitive: true
  - claim: "Nvidia signed a deal to buy Hugging Face for about US$12.9B, pending regulatory approval."
    time_sensitive: true
