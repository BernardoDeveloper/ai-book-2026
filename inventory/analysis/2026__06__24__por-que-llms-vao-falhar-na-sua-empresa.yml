title_en: "Why LLMs Will Fail at Your Company"
ai_relevance: core
ai_relevance_reason: "Argues about why corporate AI adoption fails and how to redesign software process around LLMs."
genre: essay
themes: [business-and-economics, jobs-and-careers, software-engineering-discipline, vibe-coding-practice]
thesis: "Speculatively, LLMs fail in companies because they amplify processes populated by people trained not to decide; the fix is short daily cycles of decision, implementation, test and review, paired with PO, QA and tech lead."
summary: "Akita opens by noting Uber reportedly burned its 2026 AI budget in four months on Claude Code without tracing value to tokens. He argues that spec-driven development, the market's answer to one-line prompts, is still wrong because the real problem is professionals taught for years not to decide or face consequences. Corporate Agile has become structured bureaucracy where decisions are diluted and feedback arrives months later. Since LLMs make coding cheap, the bottleneck moves to deciding, explaining, testing and reviewing, and AI becomes a mirror that amplifies lack of direction. He proposes, as speculation, rotating pairing of a programmer with a PO, QA and Tech Lead in same-day cycles, throwaway code, and one or two weeks of training without delivery goals."
key_claims:
  - claim: "Uber reportedly consumed its 2026 AI budget in about four months on Claude Code-style tools, and executives could not tie token use to delivered value (as cited from Forbes)."
    time_sensitive: true
  - claim: "With LLMs the bottleneck moves from writing code to human ability to decide, explain, test and review."
    time_sensitive: false
  - claim: "Putting an LLM inside the same broken process yields faster slop: bad code, bugs and irritated customers arrive ten times faster."
    time_sensitive: false
  - claim: "Spec-driven development still documents bad decisions if the spec comes from a process where nobody owns decisions."
    time_sensitive: false
  - claim: "Because LLMs make mistakes and prototypes cheap, teams should throw code away far more often and use branches for experiments."
    time_sensitive: false
  - claim: "He labels the whole thesis speculative and not backed by sufficient data."
    time_sensitive: false
