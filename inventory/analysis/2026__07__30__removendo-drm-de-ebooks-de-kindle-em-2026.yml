thesis: "Books you bought should stay yours; with Calibre, DeDRM, KFX Input and a Windows VM you can still archive purchased Kindle books as EPUB, though Amazon keeps changing the rules."
summary: "Amazon disabled USB download of purchased Kindle books in February 2025, breaking the old Calibre workflow. Akita explains the formats (AZW, EPUB, KFX) and the difference between format and DRM, then walks through a current method: Calibre with the DeDRM fork (10.0.28 pre-release) and KFX Input plugins, the Windows Kindle app inside a VM to download the books, and conversion to EPUB. He recovered 106 purchased books, advises keeping originals until EPUBs are verified, and storing the key file encrypted. He notes Amazon has remotely deleted books (Orwell, 2009) and edited purchased content, argues DRM does not stop piracy but only inconveniences paying customers, and restricts the discussion to books he bought. He includes a legal disclaimer."
