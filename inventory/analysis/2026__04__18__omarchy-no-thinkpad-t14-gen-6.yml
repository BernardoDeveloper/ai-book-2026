thesis: "A modest, rugged ThinkPad running Omarchy Linux makes a good remote companion for SSH, Claude Code and NAS access, provided you configure laptop-specific power, input and security settings."
summary: "Akita bought a Lenovo ThinkPad T14 Gen 6 as a companion laptop to his main desktop (Ryzen 9, RTX 5090), not as a primary machine. He reviews it as unglamorous but rugged with good ports and fingerprint support. He explains using Tailscale to SSH home from anywhere, why he does not use a Mac (including a short claim that expensive unified-memory Macs for local LLMs are a hobby, with open models not matching Claude Opus), and why he picked Omarchy (Arch plus Hyprland defaults). Most of the post is configuration: TLP power management, suspend and lid behavior, touchpad, fingerprint for sudo and lock screen, the ThinkPad Brazilian keyboard variant, fcitx5, audio firmware, fwupd, fractional scaling, Btrfs snapshots, NFS to a Synology NAS, public WiFi hardening, SSH agent persistence, shell tooling and Waybar widgets (including a Claude Code usage bar). He notes he used the approach of letting Claude Code guide setup, following his earlier home server migration. He advises waiting 6-12 months after a laptop launches before buying for Linux and keeping config in Git."
