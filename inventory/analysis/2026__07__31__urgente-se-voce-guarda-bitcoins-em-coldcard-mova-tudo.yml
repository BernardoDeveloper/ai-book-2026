title_en: "URGENT - If you keep Bitcoin on a ColdCard: MOVE EVERYTHING"
ai_relevance: tangential
ai_relevance_reason: "A Bitcoin hardware-wallet security incident; one section rebuts the vendor's attempt to blame AI-assisted code review."
genre: news-analysis
themes: [society-politics-censorship, hype-and-marketing, limits-of-llms, non-ai]
thesis: "A basic firmware bug (a preprocessor check that tested existence, not value) left ColdCard seeds with far less entropy than promised; the cause is engineering negligence and incentives, not AI breaking Bitcoin."
summary: "Akita warns that seeds generated by ColdCard firmware since March 2021 had weak randomness and were being swept, with a public cluster of about 594 BTC. A C preprocessor check (#ifndef) passed because the symbol existed even though it was set to zero, so the firmware fell back to a deterministic software random generator; effective entropy was around 40 bits on Mk3 and roughly 72 on newer models, far below 128. He lists affected models, stresses that restoring the same words on another device is not a migration, and that updating firmware does not fix old seeds. He argues the problem was visible in public code for five years, calls it a 'white swan', and criticizes the vendor's disclosure culture. A section rejects the vendor's suggestion that AI-assisted review is the new paradigm to blame: AI may have helped find or exploit it, but did not write the bug or remove the tests. The rest explains seeds, BIP39, entropy, dice, passphrases, PSBT, multisig and a step-by-step migration, and says he currently recommends no specific hardware wallet."
key_claims:
  - claim: "ColdCard seeds generated since March 2021 on affected firmware had far less than 128 bits of entropy (about 40 bits on Mk3 per the vendor's preliminary estimate)."
    time_sensitive: true
  - claim: "A public address received about 594 BTC from 501 outputs in sweeps starting 29 July 2026."
    time_sensitive: true
  - claim: "Hashing weak entropy does not create entropy; 24 words do not guarantee 256 bits of real randomness."
    time_sensitive: false
  - claim: "AI did not break Bitcoin or cryptography; it can speed up auditing and exploitation once someone points where to dig, but the flaw was a basic untested regression."
    time_sensitive: false
  - claim: "Restoring the compromised seed on another wallet does not fix it; a new seed must be generated and funds moved."
    time_sensitive: false
