title_en: "The AI Controversy in Open Source Contributions: My Opinion"
ai_relevance: core
ai_relevance_reason: "The subject is AI-generated contributions, AI slop and AI-assisted review in open source."
genre: opinion
themes: [open-source-community, software-engineering-discipline, limits-of-llms, coding-agents-tools]
thesis: "AI in open source contributions is here to stay and banning it is a losing fight locally defensible; the pragmatic answer is to use AI for triage and audit while a human keeps the final decision, because bugs and regressions were never exclusive to AI."
summary: "Akita surveys recent flashpoints: rsync 3.4.3 regressions after Andrew Tridgell used Claude to help rewrite tests, Zig's strict no-AI policy, Bun's move to Rust after joining Anthropic, and curl dropping its bug bounty because of AI-generated fake reports. He grants maintainers the right to ban AI but says the volume will keep rising. He argues regressions exist with or without AI, citing the impossibility of a general perfect program verifier. His own workflow has an agent audit each PR with 'do not trust the author' prompts and ask for approval, after which he runs a second hardening audit and a deploy test. Projects need real use plus CI, since manual testing remains the last defense. His conclusion: AI is a mirror that amplifies sloppiness or engineering, and companies adding AI must strengthen QA."
key_claims:
  - claim: "rsync 3.4.3 (a security release in May 2026) triggered regressions; Tridgell said he used Claude with Codex and Gemini cross-checks to help rewrite Python tests and that the regressions were in valid but uncommon cases untested before."
    time_sensitive: true
  - claim: "Zig has a strict no-LLM contribution policy covering code, prose, translation and review."
    time_sensitive: true
  - claim: "curl suspended its bug bounty from 1 Feb 2026 after being flooded with LLM-generated vulnerability reports."
    time_sensitive: true
  - claim: "Fake security reports are worse than bad patches because an experienced person must spend time proving no bug exists."
    time_sensitive: false
  - claim: "No language or process eliminates bugs; there is no general perfect verifier for semantic properties of programs (halting problem, Rice's theorem)."
    time_sensitive: false
  - claim: "Banning AI contributions cannot be enforced reliably since AI use cannot be detected with certainty."
    time_sensitive: false
  - claim: "AI amplifies the practices of its user: sloppy people produce industrialized slop, rigorous engineers get amplified engineering."
    time_sensitive: false
  - claim: "ai-memory had 55 closed PRs (46 merged) and was entirely written by AI with no hand-written code."
    time_sensitive: true
