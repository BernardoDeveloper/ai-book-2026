title_en: "My First Vibe Code Failure and How I Fixed It (Frank Yomik)"
ai_relevance: substantial
ai_relevance_reason: "Vibe-coding post-mortem built with Claude; also uses pre-trained ML models (RT-DETR detector, OCR, local LLM translation) and discusses why heuristics lost to a trained model."
genre: project-log
themes: [vibe-coding-practice, limits-of-llms, software-engineering-discipline, generative-media]
thesis: "AI makes writing code so fast that you can produce a huge volume of useless code; prompting does not replace thinking. Know when to abandon a brittle approach and search for an existing trained model, and AI makes such failure cheap."
summary: "Akita wanted a tool to add furigana to, or translate, manga pages in near real time. With Claude he spent about six days building an OpenCV heuristic detector for speech bubbles: 551 lines, seven false-positive filters, three detection passes, and many hand-tuned magic numbers, plagued by faces being mistaken for bubbles. Each fix broke something else, which he calls brittle code. He then asked Claude to search for pre-trained models and found an RT-DETR-v2 detector trained on about 11,000 comic images; replacing the heuristic code with it deleted 1,112 lines in one commit and solved over 99% of cases. A hidden-browser prefetch feature and a Flutter-on-Linux saga are also described. He argues that the last 20% of a project costs exponentially more, that vibe coding made the failure cheap (days instead of weeks), and that researching existing models first would have saved most of the time. Unsolved: translating each speech balloon without context loses gender and wordplay, and webtoon art requires AI in-painting."
