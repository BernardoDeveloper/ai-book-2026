title_en: "AI Agent Memory: Karpathy's LLM Wiki and agentmemory in Practice"
ai_relevance: core
ai_relevance_reason: "Explains how coding agents manage context and memory and how to extend it."
genre: essay
themes: [agent-memory-and-context, what-llms-are, coding-agents-tools, limits-of-llms]
thesis: "An LLM has no persistent memory beyond its context window; agents manage this with compaction, which loses long-term detail, so durable memory means structured text files, ideally a Karpathy-style LLM Wiki, kept outside any one vendor."
summary: "Akita explains that a language model only 'remembers' what fits in its context window, and that agents like Claude Code, Codex and opencode keep it from overflowing by compaction, summarizing the old conversation. Reading the real source of each, he compares them: Codex asks for a short handoff summary, opencode keeps an anchored summary that is updated and leaves recent turns verbatim, and Claude Code has three layers, including clearing old tool results after an hour and a nine-section summary that preserves every user message. He argues there is no vendor lock-in because agent memory is just text, so handoffs between agents work via a markdown file. The problem is that compaction deletes early details, so he has long forced agents to write to docs files. He then covers Karpathy's LLM Wiki (raw sources, LLM-maintained wiki pages, schema; ingest, query, lint), whose core claim is that knowledge should be compiled and compound rather than re-derived by retrieval each time. He tried agentmemory, an MCP server implementing that idea with tiered consolidation and hybrid search, but a May 23 update says he withdrew his recommendation after structural bugs and started his own tool, ai-memory. Conclusion: memory is text, and text needs management."
key_claims:
  - claim: "An LLM has no persistent memory; what it knows in a conversation is the tokens in its context window, resent in full each turn."
    time_sensitive: false
  - claim: "When context nears its limit, agents run an extra LLM call to summarize and discard raw history (compaction), which saves space but loses detail."
    time_sensitive: false
  - claim: "Claude Code, Codex and opencode implement compaction differently: Claude Code uses three layers and a nine-section summary preserving all user messages; Codex a short handoff; opencode an updatable anchored summary."
    time_sensitive: true
  - claim: "Agent memory is plain text, so there is no real vendor lock-in; context can be handed off between agents with a markdown file."
    time_sensitive: false
  - claim: "Early-session information is the first to be lost on compaction, so important decisions should be written to files."
    time_sensitive: false
  - claim: "Karpathy's LLM Wiki compiles knowledge into LLM-maintained markdown pages so knowledge compounds, unlike RAG which re-derives answers each query."
    time_sensitive: true
  - claim: "A larger context window does not mean it should be filled; fuller windows are slower, costlier and make agents worse at using relevant information."
    time_sensitive: false
  - claim: "The author withdrew his agentmemory recommendation on 2026-05-23 due to structural bugs and replaced it with his own ai-memory."
    time_sensitive: true
