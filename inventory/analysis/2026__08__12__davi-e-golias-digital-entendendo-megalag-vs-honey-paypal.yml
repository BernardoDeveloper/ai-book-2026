thesis: "A lone researcher with clear-text JSON evidence exposed that the Honey extension, owned by PayPal, hid its commission-stealing behavior from auditors; the company denied and threatened at every step until the evidence became undeniable."
summary: "Akita summarizes the YouTuber MegaLag's investigation of Honey, a coupon extension bought by PayPal for 4 billion dollars. Honey exploited last-click affiliate attribution to replace creators' tracking cookies with its own at checkout, and pressured stores whose coupons were listed. The core finding is a defeat device in a server-delivered JSON file that made the extension obey the industry 'stand down' rule only when the user looked like an auditor (new accounts, few points, affiliate-dashboard cookies, 'test' in the email), compared to the VW Dieselgate. After the PayPal rewrite in 2021 the rules became readable. Affiliate networks (Rakuten, Impact, Awin) cut Honey in January 2026 and a class action survived a motion to dismiss in June 2026. He notes PayPal's pattern of denial and legal threats."
key_claims:
  - claim: "Honey replaced creators' affiliate cookies at checkout using last-click attribution, even when no coupon was found."
    time_sensitive: false
  - claim: "A server-delivered rules file made the extension honor stand-down rules only for users who looked like auditors (a defeat device akin to Dieselgate)."
    time_sensitive: false
  - claim: "Rakuten, Impact and Awin removed or suspended Honey in January 2026, and the class action survived dismissal on 22 June 2026."
