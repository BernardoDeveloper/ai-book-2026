thesis: "After years of failing, a Sunday of emulator tuning finally got hard-to-run racing games (Driveclub on shadPS4, Forza Motorsport 4 on Xenia) working, with a coding agent helping gather scattered knowledge."
summary: "Akita documents a single productive Sunday getting classic racing games to run on Linux inside his Distrobox: Gran Turismo 1 to 6 via DuckStation, PCSX2 and RPCS3 (with community HD textures, widescreen patches and the Spec II mods), Enthusia, Ridge Racer, Colin McRae, Forza Motorsport 2 to 4 and Horizon 1 and Project Gotham Racing on Xenia Canary. The centerpiece is Driveclub on a PS4 emulator that has no stable release; he lists seven traps (an audio error that was actually unpacked game files, a patch-versus-base install, a 60fps patch that makes physics slow-motion, shader pipeline cache, silently ignored config format, controller detection, and black night tracks that he fixed with a depth-buffer shader patch in a local fork). He reflects that the years of frustration were caused by too much badly indexed, outdated information, and that Claude Code now acts as his aggregator, reading issue trackers, wikis and logs and comparing with the installed version. He notes he does not distribute ROMs. The post is mostly emulator-specific."
key_claims:
  - claim: "The difficulty with emulation was never lack of information but too much outdated, scattered information; a coding agent can aggregate and cross-check it against the installed version and logs."
    time_sensitive: false
  - claim: "Driveclub runs at a stable 30 FPS on shadPS4 with a local fork fix for night tracks, v1.28 with DLC."
