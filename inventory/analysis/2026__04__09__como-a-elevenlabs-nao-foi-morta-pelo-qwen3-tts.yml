title_en: "How ElevenLabs Was Not Killed by Qwen3 TTS"
ai_relevance: core
ai_relevance_reason: "Hands-on comparison of an open-source text-to-speech model with a commercial one in a real production podcast and a large AI dubbing project."
genre: review
themes: [generative-media, open-vs-closed-and-local-models, hype-and-marketing, business-and-economics]
thesis: "Open-source TTS hyped as an 'ElevenLabs killer' falls well short once you run it in real weekly production; the commercial service is worth its much higher per-episode cost."
summary: "When Qwen3 TTS launched in January 2026, the enthusiast internet called it an ElevenLabs killer. Akita ran it for about two months to produce his weekly podcast and found the voice flat, with mispronounced English terms that forced him to rewrite scripts to avoid anglicisms and with heavy ops work (rented GPU, cold starts of 5-15 minutes). He switched to ElevenLabs v3: about 4 minutes per episode instead of 25-30, inline emotion tags that work in Portuguese, one API key instead of infrastructure, at roughly $2.70 per episode versus $0.08. The second half describes dubbing all 146 episodes (about 96 hours) of his YouTube channel into English with a cloned voice: chunking text, preventing hallucinated long audio from the v3 model, aligning audio to video, rewriting unspeakable code and URL passages, repairing truncated subtitles with Claude, detecting jingles and inserted external clips, and translating thumbnails with Gemini Nano Banana Pro. The effort took several rounds, burned over 91 percent of an 11M-credit ElevenLabs Business plan and a maxed Claude Max 20x plan with over R$300 extra. His conclusion is that tweet demos are not production and open-source TTS is still far behind, though it has a niche for sensitive data or idle GPUs."
key_claims:
  - claim: "Qwen3 TTS 1.7B is not an 'ElevenLabs killer'; in production it sounded flat and mispronounced English terms, and does not beat even ElevenLabs v2."
    time_sensitive: true
  - claim: "Switching to ElevenLabs v3 cut episode generation from about 25-30 minutes to about 4 minutes, at about $2.70 versus about $0.08 per episode."
    time_sensitive: true
  - claim: "Demos of a few seconds hide problems that only appear when a model runs real, long, repeated production work."
    time_sensitive: false
  - claim: "TTS models can hallucinate, generating minutes of invented audio for long inputs, so inputs must be chunked and outputs sanity-checked."
    time_sensitive: false
  - claim: "Dubbing 146 episodes required multiple full re-renders because of structural problems found only after listening to final masters; the job consumed over 91 percent of 11M credits and the Claude Max 20x weekly limit."
    time_sensitive: true
  - claim: "A voice clone inherits the accent and rhythm of its training sample, so a non-native English sample yields a non-native clone."
    time_sensitive: false
  - claim: "Open source TTS still makes sense for sensitive data that cannot leave the machine or when GPU is idle and budget is small."
    time_sensitive: true
