title_en: "Serving AI in the Cloud: My Personal TTS (Behind the Scenes of The M.Akita Chronicles)"
ai_relevance: core
ai_relevance_reason: "Production lessons from serving a text-to-speech model on a serverless GPU and prompting an LLM to write podcast scripts."
genre: tutorial
themes: [generative-media, hardware-and-infrastructure, limits-of-llms]
thesis: "Running AI in production is infrastructure and experimentation, not a ten-line tutorial: cold starts, sampling settings, input quality and post-processing matter, and an LLM will homogenise your opinions unless told explicitly to preserve them."
summary: "Part 3 of the series. To produce a weekly 30-minute, two-voice podcast automatically, Akita runs Qwen3-TTS on RunPod serverless GPUs. He lists nine lessons: cold starts of 30 to 90 seconds need health-check polling; model weights belong on a network volume; fine-tuned and voice-cloned modes need very different sampling parameters (the wrong ones yield white noise); a reference clip that starts without silence makes every generation clip the first syllable; generation needs token and time limits because GPU time is billed per second; loudness normalisation (-14 LUFS for Spotify), re-encoding and MP3 conversion are half the work. Script quality matters more than voice quality: he uses two LLM passes (draft into dialogue, then refine for naturalness), brutally specific personality prompts for the host and the robot co-host Marvin, rules to expand acronyms for speech, and explicit instructions to keep opinions because the model softens strong opinions into 'balanced' takes. Costs are about US$0.39 per GPU hour and US$0.50 to 1.50 per episode, but dozens of hours were spent making it work. He claims similar quality to ElevenLabs at a fraction of the cost."
key_claims:
  - claim: "A 4GB TTS model has a 30 to 90 second cold start on serverless GPU; designs must expect the model to take time to load."
    time_sensitive: true
  - claim: "Sampling parameters that work for a fine-tuned voice produce white noise for voice cloning mode; parameters are not universal across modes of the same model."
    time_sensitive: false
  - claim: "Reference audio quality dominates output: if the reference clip starts without silence, every generated clip cuts the first syllable."
    time_sensitive: false
  - claim: "Because LLMs are trained to be helpful and balanced, they soften strong opinions when rewriting content unless explicitly told to change the how and never the what."
    time_sensitive: false
  - claim: "Splitting script generation into a structure pass and a naturalness pass gives better output than doing both in one prompt."
    time_sensitive: false
  - claim: "One 30-minute episode costs roughly US$0.50 to 1.50 in GPU time on RunPod (L40 about US$0.39/hour)."
    time_sensitive: true
  - claim: "Prompts need concrete examples of how each persona speaks; abstract personality descriptions produce generic tone."
    time_sensitive: false
fears_addressed:
