title_en: "Backing Up Gmail to Maildir on Linux"
ai_relevance: none
ai_relevance_reason: "A sysadmin tutorial on mirroring Gmail with mbsync, systemd and restic; AI appears only in a passing mention of LLM classification pipelines."
genre: tutorial
themes: [non-ai]
thesis: "Do not trust the cloud to own your email; mirror it locally in an open format (Maildir) so you keep the data and any tool can read it."
summary: "Akita replaces a manual Thunderbird backup with mbsync pulling Gmail over IMAP into Maildir, scheduled by a systemd user timer. The config is pull-only with no expunge or removal, so deleted remote mail is preserved locally. He stores an app password in the desktop keyring rather than in a config file. Restic snapshots the Maildir to a home NAS with deduplication, and the Synology sends encrypted copies to Glacier off-site. Because Maildir is an open format, many mail clients can read the same archive. Scripts or bots can read the files directly without Gmail OAuth or API quotas, which he notes would work for LLM classification too."
key_claims:
  - claim: "Maildir stores each message as a separate file, avoiding mbox locking and corruption problems, and has been the standard local format for decades."
    time_sensitive: false
  - claim: "A pull-only sync with no expunge/remove means deletions on Gmail never propagate and the local copy accumulates history."
    time_sensitive: false
  - claim: "Local ownership of email in an open format protects you if the provider closes your account."
    time_sensitive: false
