# Which post supersedes which. Drafters MUST check this before using a post:
# a "superseded" post may only contribute what `keep_from_old` says, and the
# chapter tells the newer state (optionally the change itself as story).
# Built from inventory/analysis/*.yml `obsolescence` + author banners in the posts.
# Ids omit the "2026/" prefix for brevity; scripts prepend it.

