  pt:
    sha256: d0ad6a79b80f5d9dd74bf39c0782d291889f9de32b964c6ea06c580f02bb4079
    title: Existem Linguagens Melhores pra programar com LLMs?
    description: 'DHH converteu o Campfire dele pra várias linguagens com IA e saiu
      postando que Rust ganhou. Em vez de brigar no X, montei um benchmark reproduzível:
      7 linguagens, 4 configurações de LLM, 112 tentativas de implementação, e um
      teste de fila sob pressão com Elixir, Rust, Rails e Ruby puro. Resultado: nenhum
      ranking de linguagem se sustenta, Ruby conciso custou mais tokens que Rust,
      tipagem forte não poupou reparo nenhum, e sob carga as quatro stacks empataram
      em vazão. O que importa é teste e disciplina, não linguagem.'
    slug: existem-linguagens-melhores-pra-programar-com-llms
