        presenting as a journalist covering AI for TechCrunch, previously at Mashable
      url: https://new-uploads-akitaonrails.s3.us-east-2.amazonaws.com/2026/09/22/scam-mia-profile.png
    - alt: 'X DM conversation: the account sends a Calendly link and asks to set up
