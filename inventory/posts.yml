- id: 2026/10/10/qual-modelo-de-decisao-classificador-de-ia-tipo-jev-e-melhor
  date: '2026-10-10T12:00:00-03:00'
  url_pt: https://www.akitaonrails.com/2026/10/10/qual-modelo-de-decisao-classificador-de-ia-tipo-jev-e-melhor/
