    title: Disaster on My NAS! How I Almost Lost 90 TB of Data
    description: 'I swapped one drive in my Synology DS1821+ and woke up the next
      day with two critical drives in an array that only survives losing one. Full
      post-mortem: why SHR-1 wasn''t enough, the warning DSM never sent, the R$ 185
      thousand for a QNAP bought in a hurry, and the recovery: parallel NAS-to-NAS
      rsync, the slow drive holding the array back, the verification of 5.9 million
      files, the thick provisioning scare, and both NASes healthy in RAID-6.'
