  pt:
    sha256: ee499fef89fe8fe35d652f193b51f1660cd08e8ed77adee74e036ca1444cc54b
    title: LLMs + Agentes = competente o suficiente
    description: 'Uma síntese do que venho medindo e escrevendo: os LLMs convergiram.
      A arquitetura transformer chegou perto do teto, a guerra de parâmetros acabou,
      e o salto que todos sentimos em 2025 e 2026 veio do harness agêntico (tool calling,
      prompt caching, sessões longas), não de uma inteligência de base ordens de magnitude
      maior. Reconto a linha do tempo de 2019 pra cá com fontes, explico por que o
      agente permite um modelo menos denso, e por que isso já é competente o suficiente
      pra automatizar engenharia de software de verdade.'
