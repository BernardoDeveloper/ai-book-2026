    title: 'Treinei meu próprio modelo de IA (Spoiler: é só pra estudo)'
    description: 'Faltava um exercício: treinar um LLM do zero. Parti do microgpt
      do Karpathy, 200 linhas de Python puro, e expandi pra um laboratório com tokenizer,
      pré-treino, SFT, servidor compatível com OpenAI e integração com o OpenCode.
      Menos de duas semanas, uma RTX 5090, 10 bilhões de tokens, 137 horas de treino,
      no máximo uns R$ 80 de luz. O modelo final tem 337 milhões de parâmetros, acerta
      58 de 100 funções Python simples e zera em tudo que exige agir num repositório.
      Explico cada etapa, os tropeços, as dimensões contra GPT-2 e modelos de fronteira,
      e por que acho que o futuro são modelos menores e especializados.'
