  en:
    sha256: 4507305488a642dbad276679312fe09a2ab0a70fe0d5a60d71a78da101c4b0b3
    title: 'AI Reverse Engineering: Is Adobe Dead?'
    description: 'In the same week, a dev dropped seven Adobe clones built with Claude,
      REA passed 100K stars promising to ''reverse engineer anything'', and retro
      gaming got a new port every day. The viral conclusion: no binary is sacred,
      Adobe is dead, programmers are dead. I explain what each of these things actually
      does: PhotoCraft is an alpha with 800 open issues, REA is a toolbox that requires
      the binary and Ghidra, and retro moves fast because an 8 MB ROM turns into 135K
      lines of C. Rewriting Bun cost US$ 165K with the author and 64 agents; Photoshop
      doesn''t even have an open binary in the parts that matter. Reverse engineering
      got easier. Magic still doesn''t exist.'
