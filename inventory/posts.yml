    sha256: bee5a97eedf6feceda46af16d79f0fecdea5e75ac25a57130a7123113c4b1f1f
    title: Are There Better Languages for Programming with LLMs?
    description: 'DHH converted his Campfire to several languages with AI and started
      posting that Rust won. Instead of fighting on X, I built a reproducible benchmark:
      7 languages, 4 LLM configurations, 112 implementation attempts, and a queue-under-pressure
      test with Elixir, Rust, Rails and plain Ruby. Result: no language ranking holds
      up, concise Ruby cost more tokens than Rust, strong typing spared no repair
      at all, and under load the four stacks tied on throughput. What matters is testing
      and discipline, not language.'
