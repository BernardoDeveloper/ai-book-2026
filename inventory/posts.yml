- id: 2026/09/22/pseudo-techcrunch-tentou-me-pegar-em-golpe-calendly-e-uma-merda
  date: '2026-09-22T21:00:00-03:00'
  url_pt: https://www.akitaonrails.com/2026/09/22/pseudo-techcrunch-tentou-me-pegar-em-golpe-calendly-e-uma-merda/
  url_en: https://www.akitaonrails.com/en/2026/09/22/pseudo-techcrunch-tried-to-scam-me-calendly-is-shit/
  pt:
    sha256: bc328ccb2a5fdc5aa452538106d42f7f99a31e6109cacb8e0def3bd7effc94a0
    title: Cuidado! Pseudo-Techcrunch tentou me pegar em golpe! E Calendly é uma MERDA
    description: Uma conta se passando por jornalista da TechCrunch me mandou DM hoje
      pedindo reunião, com um link de Calendly que redireciona pra uma tela de autorização
      OAuth do X. É o mesmo golpe que já pegou o José Valim, criador do Elixir. Documento
      o golpe passo a passo, com prova técnica.
    slug: pseudo-techcrunch-tentou-me-pegar-em-golpe-calendly-e-uma-merda
    tags:
    - seguranca
    - inteligencia-artificial
    words: 1477
    links:
    - text: documentou tudo publicamente
      url: https://x.com/josevalim/status/2029628027945021810
    images:
    - alt: Perfil no X de uma conta chamada Mia, @MiaEsswein, com selo de verificado,
        se apresentando como jornalista cobrindo IA para a TechCrunch, anteriormente
        na Mashable
      url: https://new-uploads-akitaonrails.s3.us-east-2.amazonaws.com/2026/09/22/scam-mia-profile.png
    - alt: 'Conversa de DM no X: a conta manda um link do Calendly e pede pra marcar
        reunião com o time dela; eu respondo recusando autorizar o Calendly a acessar
        minha conta do X e peço identificação'
      url: https://new-uploads-akitaonrails.s3.us-east-2.amazonaws.com/2026/09/22/scam-dm-conversation.png
    - alt: Post do José Valim no X contando que a conta dele foi hackeada temporariamente
        pelo mesmo golpe do Calendly com autorização falsa do Twitter
      url: https://new-uploads-akitaonrails.s3.us-east-2.amazonaws.com/2026/09/22/scam-josevalim-post.png
    - alt: Tela de autorização OAuth do X pedindo permissão para o app "Events Portal"
        acessar a conta, com aviso de que o app não é afiliado ao X e está pedindo
        permissões sensíveis, callback em plugins.cal-apis.com
      url: https://new-uploads-akitaonrails.s3.us-east-2.amazonaws.com/2026/09/22/scam-oauth-authorize.png
    youtube: []
  en:
    sha256: 462efd240516f13176524b241f7475b2dff8784136cc7f1e8b058ab549999dcb
    title: Watch Out! A Pseudo-TechCrunch Tried to Scam Me! And Calendly Is SHIT
    description: An account posing as a TechCrunch journalist DMed me today asking
      for a meeting, with a Calendly link that redirects to an X OAuth authorization
      screen. It's the same scam that already caught José Valim, Elixir's creator.
      I document the scam step by step, with technical proof.
