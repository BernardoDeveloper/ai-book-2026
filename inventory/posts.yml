- id: 2026/10/13/engenharia-reversa-com-ia-a-adobe-morreu
  date: '2026-10-13T00:00:00-03:00'
  url_pt: https://www.akitaonrails.com/2026/10/13/engenharia-reversa-com-ia-a-adobe-morreu/
  url_en: https://www.akitaonrails.com/en/2026/10/13/ai-reverse-engineering-is-adobe-dead/
  pt:
    sha256: deadcd56a7224857fd51925747a119fc9cecbf26300360afea516cd1de5765ac
    title: 'Engenharia Reversa com IA: a Adobe morreu?'
    description: 'Na mesma semana, um dev soltou sete clones da Adobe feitos com Claude,
      o REA passou de 100 mil estrelas prometendo ''engenharia reversa de qualquer
      coisa'', e o retrô ganhou port novo todo dia. A conclusão viral: nenhum binário
      é sagrado, a Adobe morreu, programador morreu. Explico o que cada coisa dessas
      faz de verdade: o PhotoCraft é alpha com mais de 800 issues abertas, o REA é
      uma caixa de ferramentas que exige o binário e o Ghidra, e o retrô anda rápido
      porque ROM de 8 MB vira 135 mil linhas de C. Reescrever o Bun custou US$ 165
      mil com o autor e 64 agentes; o Photoshop nem binário aberto tem nas partes
      que importam. Engenharia reversa ficou mais fácil. Mágica continua sem existir.'
    slug: engenharia-reversa-com-ia-a-adobe-morreu
