  en:
    sha256: c39990023635f5788e970e87ab6984105f7e3a24fe6d09b714e82179eaabe4d9
    title: 'I Trained My Own AI Model (Spoiler: It''s Just for Study)'
    description: 'One exercise was missing: training an LLM from scratch. I started
      from Karpathy''s microgpt, 200 lines of pure Python, and expanded it into a
      lab with a tokenizer, pretraining, SFT, an OpenAI-compatible server and OpenCode
      integration. Under two weeks, one RTX 5090, 10 billion tokens, 137 hours of
      training, at most around R$ 80 of electricity. The final model has 337 million
      parameters, gets 58 out of 100 simple Python functions right and scores zero
      on anything that requires acting in a repository. I explain each step, the stumbles,
      the dimensions against GPT-2 and frontier models, and why I think the future
      is smaller, specialized models.'
    slug: i-trained-my-own-ai-model-spoiler-its-just-for-study
