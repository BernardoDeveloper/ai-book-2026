  pt:
    sha256: 90819aaee0a700994dc5dbcc83018b026811a12e9ea657a31c3e2d53c6270c0b
    title: Qual modelo de decisão/classificador de IA tipo Jev é melhor?
    description: 'Rodei meu próprio benchmark de modelos de decisão: Jev, Clef, OpenAI
      Decisions e Microsoft Decision-1 na nuvem, mais dezoito configurações abertas
      (Perplexity Decider 27B, Decision 3.0 e Edge, Clef-flash, Kev, Jebadiah, Mapika,
      Eikos, Laya, Julia, GLiNER, Simple-Jev) no meu Strix Halo, em mais de 22 mil
      classificações com casos em inglês e português. O topo agora tem dois de pesos
      abertos: Perplexity e Decision 3.0 empataram em 99,4%, com rótulos idênticos
      nas 1.024 classificações e 100% em português. O Microsoft Decision-1 empatou
      com o Jev em 97,6% sendo o hospedado mais barato. Tabela completa, custo em
      e-mails de suporte, pegadinhas e onde os dados convergem.'
    slug: qual-modelo-de-decisao-classificador-de-ia-tipo-jev-e-melhor
