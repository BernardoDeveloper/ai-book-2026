    title: Desastre no meu NAS! Como quase perdi 90 TB de dados
    description: 'Troquei um disco do meu Synology DS1821+ e acordei no dia seguinte
      com dois discos críticos num array que só aguenta perder um. Post-mortem completo:
      por que SHR-1 não bastou, o aviso que o DSM nunca mandou, os R$ 185 mil de um
      QNAP comprado às pressas, e a recuperação: rsync paralelo NAS a NAS, o disco
      lento que segurava o array, a verificação de 5,9 milhões de arquivos, o susto
      do thick provisioning e os dois NAS saudáveis em RAID-6.'
