    title: 'Entendendo o Hype do Jev: pra que serve?'
    description: O Jev é um classificador hospedado, e o choque de '193x mais rápido'
      só existe porque muita gente usa LLM de chat como classificador caro. Reproduzo
      o ensaio do Paulo Câmara, da LUA Vision, com os gráficos dele, explico o que
      é um classificador e por que é a primeira coisa que um cientista da computação
      pensa, aponto onde o ensaio pede desconto, comparo com as alternativas abertas
      Clef e Laya, e fecho com como pensar em ferramenta desse tipo no seu projeto.
