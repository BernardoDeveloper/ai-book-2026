    sha256: 9557e0d08cd5fa75de197b87ebeb0ebc632bc76d8a46e85041ad75a5ee9bb18c
    title: Which Jev-like AI Decision/Classifier Model Is Best?
    description: 'I ran my own decision-model benchmark: Jev, Clef, OpenAI Decisions
      and Microsoft Decision-1 in the cloud, plus eighteen open configurations (Perplexity
      Decider 27B, Decision 3.0 and Edge, Clef-flash, Kev, Jebadiah, Mapika, Eikos,
      Laya, Julia, GLiNER, Simple-Jev) on my Strix Halo, across more than 22 thousand
      classifications with cases in English and Portuguese. The top now has two open-weights
      models: Perplexity and Decision 3.0 tied at 99.4%, with identical labels on
      the 1,024 classifications and 100% in Portuguese. Microsoft Decision-1 tied
      Jev at 97.6% while being the cheapest hosted one. Full table, cost in support
      emails, gotchas, and where the data converges.'
