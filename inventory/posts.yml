    sha256: '0178f4ea75a7f6b79e7ae1878ccf3ccfd7fe7c0c4edf57d4cfd3bac2dee3e921'
    title: LLMs + Agents = competent enough
    description: 'A synthesis of what I''ve been measuring and writing: LLMs converged.
      The transformer architecture got near the ceiling, the parameter war is over,
      and the leap everyone felt in 2025 and 2026 came from the agentic harness (tool
      calling, prompt caching, long sessions), not from a base intelligence orders
      of magnitude larger. I retell the timeline from 2019 onward with sources, explain
      why the agent allows a less dense model, and why that''s already competent enough
      to automate real software engineering.'
