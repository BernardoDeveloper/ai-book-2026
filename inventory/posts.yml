    title: 'The Limits of LLMs: Good at Reproducing What Exists. Expensive for What
      Doesn''t'
    description: 'Every LLM was trained only on what''s public, but 81.5% of GitHub
      activity happens in private repositories, and the source code of every proprietary
      software never made it into training. In my retrocomputing projects I felt firsthand
      where the machine stalls: with no reference and no oracle, it spins in directed
      brute force.'
