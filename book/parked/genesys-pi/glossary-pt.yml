proxy:
  term: Proxy
  def: Um intermediário que recebe pedidos e os repassa a outro serviço. Um proxy
    transparente só encaminha; quem usa pode achar que fala com um sistema quando,
    na verdade, fala com outro.
tokenizador:
  term: Tokenizador
  def: A parte do modelo que quebra o texto em tokens antes de qualquer processamento.
    Cada família de modelo tem o seu vocabulário, e quem ajusta um modelo herda o
    tokenizador dele, por isso ele serve como pista de parentesco.
