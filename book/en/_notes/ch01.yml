notes:
  - "Famous line uses Akita's own EN wording from 2026/02/24 index.en.md: 'Your hype about AI is inversely proportional to your knowledge of AI.' Also from his EN posts: 'glorified text generator', 'stochastic parrot', 'Why glorify a hammer? Why hate a hammer?' (EN post: 'Why do you need to glorify a hammer?'), 'The promises died as promises', 'Economic cycles and technological cycles', 'don't bet ... on the same horse', 'GPT-1 to 2 was a quantum leap...', 'expensive parrot ... competent enough' (10/12)."
  - "The scrambled card text '*inversarenty proporonal ao sseu knoveemto*' kept verbatim: it is what the Portuguese card in the image shows. The editor may prefer to add '(in Portuguese)' or rewrite if the EN edition uses a different image."
  - "Flow Podcast glossed with the shortest clause ('one of the biggest talk shows in Brazil'); episode title kept in Portuguese with an English gloss in parentheses."
  - "Restored original English for paraphrased sources: GPT-2 'experiment in responsible disclosure', 'concerns about malicious applications'; NYT 1958 'embryo of an electronic computer ... walk, talk, see, write, reproduce itself and be conscious of its existence'; GPT-4 report 'competitive landscape and safety implications'. All kept as indirect speech, as in PT."
  - "Attention example: PT 'banco' (bank vs. bench) adapted to English 'bank' with 'the kind with tellers' to keep the ambiguity point working. Token example 'in-constitucional-mente' -> 'un/constitution/ally'."
  - "EN post 02/08 credits AlexNet to Hinton, LeCun and Sutskever; the PT chapter (Krizhevsky, Sutskever, Hinton) is correct and was followed."
  - "Mixing-board image ('painel de som com bilhões de botõezinhos') -> 'a sound mixing panel with billions of little adjustment knobs', consistent with apmecanica EN 'panel of knobs'."
  - "Figure note: assets/figures/en/ch01-proximo-token.png has a rendering glitch: the top-left 'The cat climbed onto the' box text overflows the box on the left ('he cat...') and the fan-out arrows overlap 'the'. Worth re-rendering."
