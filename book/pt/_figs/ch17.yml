- {fig: ch17-fingerprint, kind: diagram, idea: "Many small generic icons (phone model, battery, time-zone clock, Wi-Fi signal, Bluetooth, screen size, chip/CPU, motion sensor) each labelled with a weak signal, converging by arrows into one fingerprint in the centre. To the side, a trash can labelled 'limpar dados / reinstalar' with an arrow showing the same fingerprint coming out unchanged. No brand logos.", labels_pt: ["modelo", "bateria", "fuso horário", "Wi-Fi por perto", "Bluetooth", "tela", "processador", "sensores", "fingerprint", "limpar dados e reinstalar", "continua o mesmo"], caption: "Sinais fracos e comuns, somados, viram uma identidade quase única e difícil de apagar.", alt: "Vários ícones pequenos e genéricos (celular, bateria, relógio de fuso horário, sinal de Wi-Fi, Bluetooth, tela, chip) convergem por setas para uma única impressão digital no centro. Ao lado, uma lixeira com as palavras limpar dados e reinstalar, e uma seta mostrando que a impressão digital continua igual depois."}
- {fig: ch17-capacidade-vs-prova, kind: diagram, idea: "Split panel. Left: magnifying glass over a blueprint of an app with labels (permissions, addresses, identifiers), title 'análise estática: o que ele pode fazer'. Right: a phone connected to a pipe carrying packets, with an interceptor box in the middle, title 'captura ao vivo: o que de fato saiu'. A small padlock on some packets marks encrypted payloads. Generic, no logos.", labels_pt: ["análise estática", "o que ele pode fazer", "permissões", "endereços", "identificadores", "captura ao vivo", "o que de fato saiu", "criptografado"], caption: "A análise estática lê a planta; só a captura do tráfego ao vivo mostra o que de fato saiu pela porta.", alt: "Duas metades lado a lado. À esquerda, uma lupa sobre a planta baixa de um aplicativo, com etiquetas como permissões, endereços e identificadores, sob o título análise estática: o que ele pode fazer. À direita, um celular ligado a um cano por onde passam pacotes, com um interceptador no meio, sob o título captura ao vivo: o que de fato saiu."}
- {fig: ch17-camadas-frank-fbi, kind: diagram, idea: "An envelope enters at the top and passes through six stacked horizontal bands with weights: autenticação 15%, reputação 15%, conteúdo 15%, bases de links maliciosos 15%, verificação de identidade 10%, LLMs 30%. In the LLM band, three small generic boxes vote. Dotted arrows from the LLM band to the other bands mark cross-checking. At the bottom, a risk gauge 0-100. No vendor logos.", labels_pt: ["autenticação 15%", "reputação 15%", "conteúdo 15%", "links maliciosos 15%", "identidade 10%", "LLMs 30%", "votação", "conferência", "risco 0 a 100"], caption: "O e-mail suspeito passa por seis camadas; o LLM é uma voz entre várias, e suas afirmações são conferidas contra os dados das outras.", alt: "Um envelope entra por cima e passa por seis faixas horizontais empilhadas, cada uma com seu peso: autenticação 15%, reputação 15%, conteúdo 15%, bases de links maliciosos 15%, verificação de identidade 10% e LLMs 30%. Na faixa dos LLMs, três pequenas caixas votam. Setas pontilhadas ligam a faixa dos LLMs às outras, marcando a conferência. Embaixo, um medidor de risco de 0 a 100."}
