- {fig: ch05-iceberg, kind: diagram, idea: "Iceberg. Small tip above the waterline is the demo that 'works on my machine' (about 10% of the effort). The much larger mass below is split into labelled layers: security, tests, cleanup/refactoring, configuration for other environments, review. Optional small clock icons: '1 h' above, '10-12 h' below.", labels_pt: ["funciona na minha máquina", "segurança", "testes", "limpeza e refatoração", "configuração", "revisão", "1 hora", "10 a 12 horas"], caption: "A parte que funciona fica acima da água; segurança, testes e limpeza ficam embaixo.", alt: "Um iceberg. Acima da linha da água, uma ponta pequena com a etiqueta 'funciona na minha máquina'. Abaixo, a massa muito maior dividida em camadas: segurança, testes, limpeza, configuração, revisão."}
- {fig: ch05-revezamento, kind: diagram, idea: "Relay of five reviewers (Opus 4.5, GPT-5.2 Codex, Kimi K2.5, Gemini 3 Pro Preview, MiniMax M2.1) left to right, each a box joined by arrows. Under each, a stack of 'problems' that shrinks but never reaches zero; some boxes add a small new stack of their own (overengineering, resurrected dead code). Generic boxes, no vendor logos.", labels_pt: ["problemas encontrados", "problemas criados", "sobra"], caption: "Cinco revisores em sequência; cada um tira algo da pilha de problemas, e a pilha nunca zera.", alt: "Uma fila de cinco caixas, uma por modelo, ligadas por setas. Embaixo de cada caixa, uma pilha de problemas que diminui mas nunca chega a zero, e em algumas caixas uma pequena pilha nova de problemas que o próprio revisor criou."}
