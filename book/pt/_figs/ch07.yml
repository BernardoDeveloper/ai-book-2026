- {fig: ch07-disjuntor, kind: diagram, idea: "Two side-by-side panels. Left, 'tentar de novo': a program repeatedly knocks on the door of an overloaded web service that answers 'devagar'; behind the program a queue of delayed requests keeps growing. Right, 'disjuntor': a household circuit-breaker switch trips, the program moves on with an empty newsletter section, and a small clock shows '2 min' before the breaker resets. Generic shapes, no logos.", labels_pt: ["tentar de novo", "disjuntor", "devagar, você está pedindo demais", "pedidos atrasados", "seção vazia", "2 minutos", "religa"], caption: "Duas reações ao mesmo erro: tentar de novo sem parar ou desligar por um tempo e seguir em frente.", alt: "Dois painéis. À esquerda, um programa bate repetidamente na porta de um serviço sobrecarregado, e uma fila de pedidos atrasados cresce atrás dele. À direita, um disjuntor desarma, o programa segue com uma seção vazia, e depois de dois minutos o disjuntor volta a ligar."}
- {fig: ch07-zero-e-nada, kind: diagram, idea: "Two index cards for the same social-media post. Left card: field 'compartilhamentos' is blank with a question mark, tagged 'dado não disponível'. Right card: field shows '0' with a check mark, tagged 'medido'. A dashed arrow from the blank card goes to a speech balloon from a generic chatbot icon saying 'ninguém compartilha seus posts', crossed out in red. A small note under the left card: 'a fonte não informa este número'.", labels_pt: ["compartilhamentos", "dado não disponível", "medido", "a fonte não informa este número", "ninguém compartilha seus posts"], caption: "Um campo vazio e um zero medido parecem iguais pro modelo, a menos que alguém diga a diferença.", alt: "Duas fichas lado a lado. A da esquerda tem o campo compartilhamentos vazio, com um ponto de interrogação e a etiqueta dado não disponível. A da direita mostra o número zero com um sinal de conferido e a etiqueta medido. Uma seta sai da ficha vazia até um balão com a conclusão errada ninguém compartilha."}
