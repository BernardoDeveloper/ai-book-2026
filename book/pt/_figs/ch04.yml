- {fig: ch04-duas-perguntas, kind: diagram, idea: "One generic news article (no real outlet, a fictional coffee-and-memory headline) in the centre. Two arrows leave it, each labelled with a question typed into a chat box: 'quais são os problemas desta reportagem?' and 'esta reportagem está correta?'. Each arrow ends in a chat bubble: one full of red critique marks, the other full of green approval marks. Same text, opposite answers.", labels_pt: ["a mesma reportagem", "quais são os problemas?", "está correta?", "críticas", "elogios"], caption: "O mesmo texto, duas perguntas, duas respostas opostas.", alt: "Uma mesma reportagem no centro, com duas setas saindo dela. Numa seta, a pergunta 'quais os problemas?' leva a uma resposta cheia de críticas. Na outra, a pergunta 'está correta?' leva a uma resposta cheia de elogios."}
- {fig: ch04-tres-juizes, kind: diagram, idea: "Three generic boxes (model A, model B, model C, from three different companies; no logos) each casting a vote with a confidence percentage, e.g. 'sustentado 70%', 'sustentado 70%', 'misto 95%', feeding a balance scale that tips toward 'misto'. Beside it, a document labelled 'fonte primária' with a veto stamp clamping the result at 'misto, no máximo 60%'. Small inset: five newspaper icons from the same group merged into one voice; a circular arrow among outlets citing each other.", labels_pt: ["modelo A", "modelo B", "modelo C", "sustentado 70%", "misto 95%", "fonte primária", "veto: no máximo 60%", "mesmo grupo = uma voz", "citação circular"], caption: "Três modelos votam com pesos diferentes; uma fonte primária contrária derruba o resultado.", alt: "Três caixas representando modelos de empresas diferentes, cada uma com um voto e uma porcentagem de confiança, alimentando uma balança. Ao lado, um documento marcado 'fonte primária' com um carimbo de veto que trava a balança em 'misto'."}
- {fig: ch04-marca-dagua, kind: diagram, idea: "A sentence drawn as a path with forks at synonym points ('nublado' / 'cinzento', and two or three more). At each fork a small key icon nudges the choice slightly toward one branch. Below, a tally bar that grows across many sentences until it forms a visible pattern labelled 'assinatura'. A second, faded panel: the same text rewritten by another model, forks chosen differently, tally back to noise.", labels_pt: ["nublado", "cinzento", "chave secreta", "assinatura", "reescrito por outro modelo", "sinal some"], caption: "Em cada encruzilhada de sinônimos, a chave inclina a escolha; num texto longo, as inclinações formam uma assinatura.", alt: "Uma frase com bifurcações em alguns pontos, como 'nublado' ou 'cinzento'. Uma pequena chave empurra levemente a escolha pra um dos lados. Embaixo, uma contagem que se acumula ao longo de muitas frases até formar um padrão."}
