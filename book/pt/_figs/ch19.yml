- {fig: ch19-ciclos, kind: diagram, idea: "Two loops side by side. Left: a large sprint loop with widely spaced stages (planejamento, duas semanas de código, testes, revisão) and a long arrow to 'resultado' labelled 'um a dois meses'. Right: a small loop with a programmer + AI agent at the centre and three people taking turns around it (PO, QA, líder técnico), short arrow to 'resultado' labelled 'no mesmo dia'. Mark the right side as 'hipótese'.", labels_pt: ["sprint", "planejamento", "duas semanas de código", "testes", "revisão", "resultado", "um a dois meses", "PO", "QA", "líder técnico", "programador + agente", "no mesmo dia", "hipótese"], caption: "À esquerda, o ciclo de sprint em que a decisão e o resultado ficam a semanas de distância. À direita, o ciclo curto em que decidir, implementar, testar e revisar cabem no mesmo dia.", alt: "Dois ciclos lado a lado. O da esquerda é um círculo grande com etapas espaçadas: planejamento, duas semanas de código, testes, revisão, e uma seta longa até o resultado, rotulada 'um a dois meses'. O da direita é um círculo pequeno com quatro pessoas em volta de um programador com IA: dono do produto, testes, líder técnico, e uma seta curta até o resultado, rotulada 'no mesmo dia'."}
- {fig: ch19-camadas, kind: diagram, idea: "Left-to-right conveyor/pipeline: mudança, testes automatizados, integração contínua, revisão automática, feature flag, staging, produção. From produção a curved arrow back labelled 'rollback'; a dotted arrow from produção back to the start labelled 'usuários reais relatam problemas'.", labels_pt: ["mudança", "testes automatizados", "integração contínua", "revisão automática", "feature flag", "staging", "produção", "rollback", "usuários reais relatam problemas"], caption: "As camadas que deixam colocar no ar com frequência sem medo: cada uma pega um tipo de erro antes de chegar ao cliente, e a seta de volta desfaz o que passou.", alt: "Uma esteira da esquerda pra direita: mudança, testes automatizados, integração contínua, revisão automática, feature flag, staging, produção. De produção sai uma seta curva de volta pra trás, rotulada 'rollback', e outra seta pontilhada rotulada 'usuários reais relatam problemas' volta até o início."}
- {fig: ch19-ferrari, kind: concept-art, idea: "A sleek red unbranded sports car (no logos, no real brand marks) with its rear engine lid open, revealing a small, old air-cooled economy-car engine. A few people photograph the car body with phones, nobody looks at the engine. Slightly humorous editorial illustration.", labels_pt: [], caption: "O PhotoCraft de outubro de 2026: a carroceria certa, o motor de outro carro.", alt: "Ilustração de um carro esportivo vermelho de linhas aerodinâmicas, sem marca, com o capô traseiro aberto revelando um motor pequeno e antigo de carro popular, refrigerado a ar. Algumas pessoas fotografam o carro com o celular, sem olhar o motor."}
