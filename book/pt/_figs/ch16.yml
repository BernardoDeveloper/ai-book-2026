- {fig: ch16-gigante-na-mesa, kind: diagram, idea: "Callback to ch02's desk metaphor. Left: a towering stack of paper labelled 'um milhão de linhas'. Right: a small desk labelled 'janela de contexto' with only a few sheets on it. Sheets slide off the desk edge; on the floor, crumpled notes tagged 'a fazer' (the todo stubs the agent left). No logos.", labels_pt: ["um milhão de linhas", "janela de contexto", "a fazer"], caption: "Um milhão de linhas não cabe na mesa: o agente só vê um pedaço de cada vez, e o resto ele inventa ou deixa pra depois.", alt: "À esquerda, uma pilha enorme de folhas rotulada um milhão de linhas. À direita, uma mesa pequena rotulada janela de contexto, com só algumas folhas em cima. Setas mostram folhas caindo da mesa e, no chão, papéis com a etiqueta a fazer."}
- {fig: ch16-laco-adversarial, kind: diagram, idea: "The Bun rewrite loop as a cycle: a task queue feeds an 'implementador' box; arrows to two 'revisor adversarial' boxes (each with a magnifying glass, each seeing only the diff); both feed a 'corretor' box; result goes to a scale labelled 'testes e CI'; a failing result returns to the queue. Small note: 'contexto limpo'. Generic boxes, no vendor logos.", labels_pt: ["fila de tarefas", "implementador", "revisor adversarial", "corretor", "testes e CI", "contexto limpo"], caption: "O laço da reescrita do Bun: um agente implementa, dois revisores atacam, um terceiro corrige, e os testes decidem.", alt: "Diagrama circular. Uma fila de tarefas alimenta uma caixa chamada implementador. Dela saem setas para duas caixas chamadas revisor adversarial, cada uma com uma lupa. As duas apontam para uma caixa chamada corretor, que entrega o resultado a uma balança rotulada testes e CI. A balança devolve a tarefa à fila quando reprova."}
