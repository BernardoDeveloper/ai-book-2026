- {fig: ch09-quatro-partes, kind: diagram, idea: "A request card split into four horizontal bands: 'o que eu quero', 'como', 'o que eu não quero' (highlighted, the band most people skip), 'como saber que deu certo'. An arrow carries the card to a generic agent icon; a return arrow brings back a speech bubble 'e se não der?' (the model saying when it cannot comply). No vendor logos.", labels_pt: ["o que eu quero", "como", "o que eu não quero", "como saber que deu certo", "e se não der?"], caption: "As quatro partes de um bom pedido: o que eu quero, como, o que eu não quero e como saber que deu certo.", alt: "Um cartão de pedido dividido em quatro faixas. A primeira diz 'o que eu quero', a segunda 'como', a terceira, destacada, 'o que eu não quero', e a quarta 'como saber que deu certo'. Uma seta sai do cartão em direção a um agente e outra volta trazendo a pergunta 'e se não der?'."}
- {fig: ch09-fatias, kind: diagram, idea: "Two panels. Left: a very long file drawn as a tall scroll cut into slices; a generic agent holds one slice while the others sit outside a dashed 'campo de visão' box. Right: a short file that fits whole in the agent's hand, inside the same box. Optional small label on the left scroll: '2 mil linhas por vez (abril de 2026)'.", labels_pt: ["arquivo gigante", "arquivo pequeno", "campo de visão", "2 mil linhas por vez (abril de 2026)"], caption: "Um arquivo gigante lido em fatias e um arquivo pequeno lido de uma vez.", alt: "À esquerda, um arquivo muito comprido cortado em várias fatias; o agente segura só uma por vez e o resto fica fora do campo de visão. À direita, um arquivo curto que cabe inteiro na mão do agente."}
- {fig: ch09-revelacao-progressiva, kind: diagram, idea: "Progressive disclosure. A desk (same desk metaphor as ch02's context window) holds a row of small name tags, one per skill (generic names like 'auditar', 'publicar versão', 'revisar texto'). A drawer below holds closed folders. The agent picks one tag and only that folder opens on the desk; the rest stay closed.", labels_pt: ["só nome e descrição", "conteúdo carregado sob demanda", "mesa (janela de contexto)", "gaveta"], caption: "Só os nomes das skills ficam na mesa; o conteúdo é aberto quando o agente precisa.", alt: "Uma mesa com uma fileira de etiquetas, cada uma com o nome curto de uma skill. Ao lado, um arquivo fechado. O agente puxa uma única etiqueta e só aquele arquivo se abre sobre a mesa; os outros continuam fechados na gaveta."}
