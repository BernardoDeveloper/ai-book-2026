- {fig: ch01-proximo-token, kind: diagram, idea: "Next-token prediction as a branching path. Left: the prompt 'O gato subiu no'. Arrows fan out to candidate tokens with probability bars ('telhado' biggest, 'muro', 'sofá' smaller, a few tiny ones). A die icon marks the sampling among the top few. The chosen token is appended and the loop restarts from the longer sentence, drawing a path that keeps branching. A small loop arrow labelled with the four steps.", labels_pt: ["olha o texto todo", "calcula as chances", "sorteia entre os mais prováveis", "cola no fim e repete", "telhado", "muro", "sofá"], caption: "Cada volta do ciclo calcula as chances dos próximos pedaços, sorteia um e recomeça com o texto maior.", alt: "Um texto inicial, 'O gato subiu no', à esquerda. Dele saem setas para vários pedaços possíveis, cada um com uma barra indicando a chance: 'telhado' com a barra maior, 'muro' e 'sofá' menores, outros quase invisíveis. Um dado marca o sorteio. O pedaço escolhido é colado no texto, e o processo se repete a partir da frase maior, formando um caminho que se ramifica."}
- {fig: ch01-curva-em-s, kind: diagram, idea: "Conceptual (not to scale) S-curve of capability over time 2018-2025 with points GPT-1 (2018), GPT-2 (2019), GPT-3 (2020), GPT-4 (2023), GPT-5 (2025): slow start, steep rise GPT-2 to GPT-3, flattening GPT-4 to GPT-5. A second curve, training cost, keeps rising ever faster. Phase labels under the S like Akita's 2023 sketch. Mark it clearly as qualitative: no numeric y-axis.", labels_pt: ["capacidade", "custo de treino", "infância", "subida rápida", "maturidade", "tempo"], caption: "A família GPT numa curva em S: os primeiros saltos são enormes, os últimos custam muito mais e entregam menos.", alt: "Gráfico com duas curvas sobre uma linha do tempo de 2018 a 2025. A curva de capacidade tem forma de S: sobe devagar, dispara entre GPT-2 e GPT-3, e achata entre GPT-4 e GPT-5. A curva de custo de treino sobe cada vez mais rápido, sem achatar. Os pontos GPT-1, GPT-2, GPT-3, GPT-4 e GPT-5 estão marcados na curva de capacidade."}
- {fig: ch01-perceptron, kind: photo, idea: "Historical photo of the Mark I Perceptron (Cornell Aeronautical Laboratory, c. 1958-1960), public domain / Wikimedia Commons; the machine itself, ideally showing the camera array or the patch-board wiring. A photo of Frank Rosenblatt with the machine is acceptable if public domain. No generated imagery.", labels_pt: [], caption: "O Mark I Perceptron, a versão em hardware da máquina de Rosenblatt.", alt: "Fotografia histórica em preto e branco do Mark I Perceptron: um painel grande com uma câmera de 400 pontos de luz de um lado e, do outro, um emaranhado de fios ligando as conexões ajustáveis da máquina.", photo_query: "Mark I Perceptron Cornell Aeronautical Laboratory Frank Rosenblatt photograph, Wikimedia Commons"}
