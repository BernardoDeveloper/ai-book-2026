- {fig: ch12-teste-verde, kind: diagram, idea: "Two parallel lanes. Left lane 'no teste': the test calls a stand-in (dublê/mock) written by the same model; the stand-in accepts an invented command and a green light turns on. Right lane 'em produção': the real app calls the real library with the same invented command and gets a red error. Generic boxes, no code, no vendor logos.", labels_pt: ["no teste", "em produção", "dublê", "biblioteca de verdade", "comando inventado", "verde", "erro"], caption: "O teste conversa com um dublê que aceita o comando inventado; a biblioteca de verdade não aceita.", alt: "Dois caminhos lado a lado. À esquerda, o teste chama um dublê que responde 'ok' ao comando inventado, e uma luz verde acende. À direita, o aplicativo de verdade chama a biblioteca real com o mesmo comando, e recebe um erro em vermelho."}
- {fig: ch12-mescla, kind: diagram, idea: "Lineage tree. Top: base model 'Qwen 3.5'. Arrow down to 'Nex-N2-Pro' labelled 'pós-treino pra agentes'. Two arrows labelled 60% (from Nex-N2-Pro) and 40% (from Qwen 3.5) converge into a file icon 'checkpoint publicado do Rio 3.5', annotated 'média ponderada, sem treino novo'. Side note with benchmark grades 42 (Qwen base) and 83 (Nex). Neutral style, no logos.", labels_pt: ["Qwen 3.5 (base)", "Nex-N2-Pro", "pós-treino pra agentes", "60%", "40%", "checkpoint publicado do Rio 3.5", "média ponderada, sem treino novo", "nota 42", "nota 83"], caption: "Uma mescla é uma média ponderada de dois modelos prontos, sem treino novo.", alt: "Árvore de linhagem. No topo, o modelo base Qwen 3.5. Dele sai o Nex-N2-Pro, pós-treinado pra tarefas de agente. Duas setas, marcadas 60% e 40%, saem do Nex-N2-Pro e do Qwen 3.5 e se juntam num terceiro arquivo, o checkpoint publicado do Rio 3.5."}
- {fig: ch12-impressao-digital, kind: diagram, idea: "One line of mixed text (a Chinese snippet, a run of digits, an emoji with joiners) enters six 'cutters', one per tokenizer family (o200k, cl100k, Llama 3, Qwen, DeepSeek, Mistral). Each outputs a different number of chips. A seventh box 'API testada' outputs a count that matches only the o200k row, highlighted. Optional small inset: 'mesma contagem ≠ mesmos pesos'.", labels_pt: ["mesmo texto", "o200k (OpenAI)", "cl100k", "Llama 3", "Qwen", "DeepSeek", "Mistral", "API testada", "mesma contagem não quer dizer mesmos pesos"], caption: "A mesma frase vira quantidades diferentes de tokens em cada família de modelo; a contagem funciona como impressão digital.", alt: "Uma mesma linha de texto, com um trecho em chinês, uma sequência de dígitos e um emoji, passa por seis cortadores diferentes, um por família de modelo. Cada cortador produz uma quantidade diferente de pedaços. A contagem da API testada coincide com a de um único cortador, o o200k."}
