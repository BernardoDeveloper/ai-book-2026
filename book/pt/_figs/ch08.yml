- {fig: ch08-regras-vs-modelo, kind: diagram, idea: "Left: a manga page falling through a vertical stack of seven sieves/filters, each with a visible patch, and a character face slipping through the last one tagged 'balão?'. Right: the same page entering a single box labelled 'modelo treinado com 11 mil imagens' and coming out with speech bubbles correctly outlined and the face untouched. Generic manga-style drawing, no real manga characters.", labels_pt: ["7 filtros escritos à mão", "balão?", "modelo treinado com 11 mil imagens", "balões encontrados"], caption: "Regras escritas à mão de um lado; um único modelo treinado com milhares de páginas do outro.", alt: "Dois lados lado a lado. À esquerda, uma página de mangá passando por uma pilha de sete peneiras, cada uma com um remendo, e um rosto de personagem escapando pela última com a etiqueta 'balão?'. À direita, a mesma página entrando numa única caixa rotulada 'modelo treinado com 11 mil imagens' e saindo com os balões marcados corretamente."}
- {fig: ch08-oraculo, kind: diagram, idea: "Two stacked panels. Top 'tradução cega': original game -> model -> translated game -> question mark 'parece certo?', no arrow back. Bottom 'tradução com oráculo': original and translation run in two emulators side by side fed the same button script; a comparator checks memory each frame and measures processor time; a feedback arrow returns differences to the model, closing a loop. Generic console boxes, no brand logos.", labels_pt: ["tradução cega", "parece certo?", "tradução com oráculo", "jogo original", "tradução", "mesmos botões", "compara a memória a cada quadro", "mede o tempo", "diferenças voltam pro modelo"], caption: "Sem oráculo, o modelo traduz e adivinha; com oráculo, original e tradução rodam lado a lado e cada diferença volta pro modelo.", alt: "Dois diagramas. Em cima, 'tradução cega': o jogo original entra no modelo, que produz uma tradução, e uma seta com ponto de interrogação aponta para 'parece certo?'. Embaixo, 'tradução com oráculo': o jogo original e a tradução rodam em dois emuladores lado a lado, recebendo os mesmos botões; um comparador confere a memória a cada quadro e mede o tempo gasto; as diferenças voltam numa seta para o modelo, fechando um ciclo."}
