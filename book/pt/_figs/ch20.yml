- {fig: ch20-linha-do-tempo, kind: diagram, idea: "Horizontal timeline 2019-2026 split into four coloured bands: (1) 'guerra dos parâmetros' 2019-2022 with GPT-2 (2019, 1,5 bi), GPT-3 (2020, 175 bi), 'lei de escala' (2020), Chinchilla (2022, 70 bi > Gopher 280 bi); (2) 'segredo e raciocínio' 2023-2024 with GPT-4 report (parameter count withheld) and o1 (Sep 2024) marked as 'último grande salto'; (3) 'otimização' 2025 with mistura de especialistas (Mixtral, DeepSeek-V3 671 bi / 37 bi ativos), prompt caching (-90%), DeepSeek-R1; (4) 'agentes' 2026 with chamada de ferramentas (2023), MCP (2024), Claude Code / Codex (2025), METR 'dobra a cada 7 meses'. Above the axis a curve 'inteligência de base' rising then flattening after 2024; below it a second curve 'modelo + harness' that keeps rising. No vendor logos.", labels_pt: ["guerra dos parâmetros", "segredo e raciocínio", "otimização", "agentes", "GPT-2", "GPT-3", "lei de escala", "Chinchilla", "GPT-4", "o1", "último grande salto", "mistura de especialistas", "prompt caching", "DeepSeek-V3", "DeepSeek-R1", "chamada de ferramentas", "MCP", "inteligência de base", "modelo + harness"], caption: "De 2019 a 2026: a guerra dos parâmetros, o pico do raciocínio, a otimização e a era dos agentes.", alt: "Uma linha do tempo horizontal de 2019 a 2026 dividida em quatro faixas coloridas. Na primeira, 'guerra dos parâmetros', os marcos GPT-2, GPT-3 e lei de escala, e a Chinchilla em 2022. Na segunda, 'segredo e raciocínio', o relatório do GPT-4 sem número de parâmetros e o o1 em 2024, marcado como o último grande salto. Na terceira, 'otimização', mistura de especialistas, prompt caching e DeepSeek. Na quarta, 'agentes', chamada de ferramentas, MCP e agentes de programação. Acima da linha, uma curva de capacidade de base que sobe e achata depois de 2024; abaixo, uma curva de competência do conjunto modelo mais ferramentas que continua subindo."}
- {fig: ch20-mapa-em-branco, kind: concept-art, idea: "An old hand-drawn map, sepia. A small region labelled 'público' is dense with roads, towns and rivers named 'formulários', 'cadastros', 'sites'. Around it a much larger region labelled 'privado' is blank parchment with only a few scattered faint labels ('código das empresas', 'jogos comerciais', 'sistemas de bancos'). A magnifying glass over the blank area shows nothing. No people.", labels_pt: ["público", "privado", "formulários", "cadastros", "sites", "código das empresas", "jogos comerciais", "sistemas de bancos"], caption: "O modelo enxerga o território público em detalhe; o que é privado aparece em branco no mapa dele.", alt: "Um mapa antigo desenhado à mão. Uma região menor, rotulada 'público', aparece cheia de detalhes: estradas, cidades, rios, com nomes como 'formulários', 'cadastros', 'sites'. Uma região muito maior em volta, rotulada 'privado', está em branco, com apenas pequenas legendas espalhadas: 'código das empresas', 'jogos comerciais', 'sistemas de bancos'. Uma lupa sobre a área em branco não mostra nada."}
