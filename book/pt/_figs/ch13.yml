- {fig: ch13-banda-e-capacidade, kind: diagram, idea: "Two water tanks feeding a tap that fills a cup labelled 'tokens por segundo'. Left: small tank (RTX 5090, 32 GB) with a very wide pipe (1.792 GB/s), cup filling fast. Right: large tank (Strix Halo, até 128 GB) with a narrow pipe (256 GB/s), cup filling slowly. A big block labelled 'modelo de 81 GB' fits only in the right tank; it sits outside the left one, too big to enter.", labels_pt: ["RTX 5090: 32 GB", "cano de 1.792 GB/s", "Strix Halo: até 128 GB", "cano de 256 GB/s", "modelo de 81 GB", "tokens por segundo", "rápido, mas pequeno", "cabe tudo, mas devagar"], caption: "Banda decide a velocidade; capacidade decide o que cabe.", alt: "Dois reservatórios ligados a uma torneira. À esquerda, um reservatório pequeno com um cano largo, etiquetado RTX 5090: 32 GB, cano de 1.792 GB/s. À direita, um reservatório grande com um cano estreito, etiquetado Strix Halo: até 128 GB, cano de 256 GB/s. Um modelo grande, desenhado como um bloco, só cabe no reservatório da direita."}
- {fig: ch13-especialistas, kind: diagram, idea: "Two panels side by side. Left 'modelo denso': a grid of 16 blocks, all lit, arrow from every block to one output token. Right 'MoE': the same 16-block grid inside a memory box, only 2 blocks lit, a small 'roteador' choosing them for the current token; the 14 unlit blocks are still inside the memory box (greyed). Caption under right panel: 'só alguns trabalham, todos ocupam memória'.", labels_pt: ["modelo denso", "MoE", "roteador", "todos os pesos lidos a cada token", "só alguns blocos trabalham", "todos ocupam memória", "token"], caption: "Num modelo denso, o modelo inteiro trabalha em cada token; num MoE, um roteador acorda só alguns blocos, mas todos precisam estar na memória.", alt: "Dois painéis. No primeiro, modelo denso: uma grade de blocos todos acesos, com a legenda todos os pesos lidos a cada token. No segundo, MoE: a mesma grade com apenas dois blocos acesos e um pequeno roteador apontando pra eles, e a legenda só alguns blocos trabalham, mas todos ocupam memória."}
