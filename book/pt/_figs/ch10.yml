- {fig: ch10-fosso, kind: diagram, idea: "Conceptual (not to scale, no numbers) two-curve diagram over time. Curve 1 'custo de escrever código' falls toward the floor. Curve 2 'custo de treinar modelos e reunir dados exclusivos' rises ever steeper. Small castle icon near the falling curve with a dried-up moat; a full moat near the rising curve.", labels_pt: ["custo de escrever código", "custo de treinar modelos e reunir dados exclusivos", "tempo", "fosso seco"], caption: "Em 2026 o custo de construir software despencou, enquanto o de treinar modelos e juntar dados exclusivos disparou.", alt: "Duas curvas ao longo do tempo. Uma, rotulada 'custo de escrever código', desce até perto do chão. A outra, rotulada 'custo de treinar modelos e reunir dados exclusivos', sobe cada vez mais íngreme. No cruzamento, um pequeno castelo com o fosso seco do lado do código."}
- {fig: ch10-limiar, kind: diagram, idea: "Vertical 'annoyance' scale with many small everyday irritations as dots (clock, email, song lyric, typing, manga). A high horizontal line labelled 'custa um fim de semana' leaves almost all dots below it (unfixed, grey). A much lower line labelled 'com um agente' leaves almost all above it (fixed, coloured).", labels_pt: ["incômodo", "custa um fim de semana", "com um agente", "fica sem conserto", "vale consertar"], caption: "Antes dos agentes, só valia consertar irritações que custassem mais que um fim de semana de trabalho. Depois, a linha desceu.", alt: "Uma régua vertical de incômodo, com várias pequenas irritações do dia a dia espalhadas como pontos. Uma linha alta, rotulada 'custa um fim de semana', deixa quase todas abaixo dela, sem conserto. Uma segunda linha, bem mais baixa, rotulada 'com um agente', deixa quase todas acima, consertadas."}
