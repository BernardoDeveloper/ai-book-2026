- {fig: ch03-laco-do-agente, kind: diagram, idea: "Circular agent loop. Four stations joined by arrows: (1) the model thinks, (2) the model writes a tool request, (3) the harness executes it (examples: compile, run tests, read a file, search docs), (4) the result returns to the model as text. Centre label: 'tarefa'. An exit arrow from (1) to 'pronto' when the result matches the request. Visually separate what is the model (a box that only writes text) from what is the harness (the ring with hands/tools). No vendor logos.", labels_pt: ["o modelo pensa", "pede uma ferramenta", "o harness executa", "o resultado volta como texto", "tarefa", "pronto", "compilar", "rodar teste", "ler arquivo"], caption: "O laço de um agente: o modelo pensa, pede uma ferramenta, o harness executa e devolve o resultado, e o modelo decide de novo.", alt: "Um diagrama circular com quatro etapas ligadas por setas: o modelo pensa, o modelo pede uma ferramenta, o harness executa (compilar, rodar teste, ler arquivo), o resultado volta como texto pro modelo. No centro, a palavra 'tarefa'. Uma seta de saída leva a 'pronto' quando o resultado bate com o pedido."}
