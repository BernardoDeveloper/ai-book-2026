- {fig: ch06-commits, kind: chart, idea: "Horizontal bar chart of the 274 commits of The M.Akita Chronicles by type, sorted largest first. Data (from 2026/02/20): funcionalidades novas 101 (37%); correção de bugs 45 (16%); testes e CI 44 (16%); infraestrutura e deploy 30 (11%); refatoração e reforço 27 (10%); documentação 27 (10%); segurança 21 (8%). Highlight the features bar; the other six in one neutral color, labelled together as 'o que não aparece na demonstração'.", labels_pt: ["funcionalidades novas", "correção de bugs", "testes e integração contínua", "infraestrutura e colocar no ar", "refatoração e reforço", "documentação", "segurança", "o que não aparece na demonstração"], caption: "Pra onde foram os 274 commits: pouco mais de um terço virou funcionalidade nova; o resto foi o trabalho que não aparece na demonstração.", alt: "Gráfico de barras horizontais com sete categorias de commits. Funcionalidades novas, 37%, é a maior barra. Abaixo vêm correção de bugs, 16%; testes e integração contínua, 16%; infraestrutura e colocar no ar, 11%; refatoração e reforço, 10%; documentação, 10%; segurança, 8%."}
- {fig: ch06-ciclo-xp, kind: diagram, idea: "XP loop with the AI as pair. Circle of five steps with arrows: (1) humano pede um passo pequeno (o quê e o porquê); (2) agente planeja, humano revisa o plano; (3) agente escreve código e teste; (4) integração contínua roda todos os testes; (5) humano revisa e grava o commit. A side arrow from step 4 back to step 3 labelled 'teste falhou'. Two small role tags: 'navega' on the human, 'pilota' on the agent.", labels_pt: ["pede um passo pequeno", "planeja / revisa o plano", "código + teste", "integração contínua", "revisa e grava o commit", "teste falhou", "navega", "pilota"], caption: "O ciclo da programação em par com um agente: o humano decide o quê e o porquê, o agente propõe o como, e nada entra sem teste e revisão.", alt: "Diagrama circular com cinco etapas ligadas por setas: o humano pede um passo pequeno; o agente planeja e o humano revisa o plano; o agente escreve o código e o teste; a integração contínua roda todos os testes; o humano revisa e grava o commit. Uma seta de volta indica que, se um teste falha, o ciclo volta para o agente."}
