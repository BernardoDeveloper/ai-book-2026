- {fig: interlude2-partida-4, kind: photo, idea: "Game record diagram of AlphaGo vs Lee Sedol, game 4 (13 March 2016), the only game Lee Sedol won, turned by his move 78. Use the Wikimedia Commons SVG by Wesalius, rasterized to PNG; no photo of people needed.", labels_pt: [], caption: "A partida 4 de Lee Sedol (brancas) contra o AlphaGo (pretas), em 13 de março de 2016: a única vitória humana na série, virada pela jogada 78. Diagrama: Wesalius, CC BY-SA 4.0, via Wikimedia Commons.", alt: "Diagrama de um tabuleiro de Go de 19 por 19 linhas, coberto de pedras pretas e brancas numeradas pela ordem em que foram jogadas, registrando a partida 4 entre Lee Sedol e o AlphaGo, que terminou com o AlphaGo abandonando.", photo_query: "File:Lee Sedol (W) vs AlphaGo (B) - Game 4.svg (Wikimedia Commons, author Wesalius, CC BY-SA 4.0). Note: the file page's description heading wrongly says 'Game 1' with colors swapped; filename, title and result ('White wins by resignation') are Game 4. Fallback: a CC photo of the DeepMind Challenge Match, Seoul, March 2016."}
