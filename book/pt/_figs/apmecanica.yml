- {fig: apmecanica-descida-na-neblina, kind: diagram, idea: "Gradient descent as walking downhill in fog. Side view of a hilly terrain whose height is labelled 'tamanho do erro'. A small human figure walks down the slope in short steps, each step marked by a dot, from a high point labelled 'botões sorteados' to the valley floor labelled 'erro pequeno'. A soft fog band covers most of the landscape, leaving only a small circle of ground visible around the walker's feet. Inset at the side: a small panel of knobs, each with a short curved arrow showing a tiny turn, labelled 'cada passo = todos os botões giram um pouquinho'. Qualitative, no numeric axes.", labels_pt: ["tamanho do erro", "botões sorteados", "erro pequeno", "neblina", "cada passo = todos os botões giram um pouquinho"], caption: "Treinar é descer um morro na neblina: a cada passo, cada botão gira um pouquinho na direção em que o erro diminui.", alt: "Um terreno ondulado visto de lado, com a altura marcada como 'tamanho do erro'. Uma figura humana pequena desce a encosta em passos curtos, cada passo marcado por um ponto. Uma faixa de neblina cobre quase tudo, deixando visível só o chão perto dos pés. No fundo do vale, a etiqueta 'erro pequeno'. Ao lado, um painel com botões, cada um com uma seta curva indicando um giro pequeno."}
- {fig: apmecanica-mapa-de-sentidos, kind: diagram, idea: "Embeddings as a map of meanings. A flat 2D 'city map' with labelled dots grouped into neighbourhoods (light background tint per cluster): animals (cachorro, gato, cavalo), weekdays (segunda, terça, quarta), money/taxes (imposto, salário, boleto). In one corner, four dots forming a parallelogram: 'homem' and 'mulher' at the bottom, 'rei' and 'rainha' on top, with two parallel arrows homem->mulher and rei->rainha in the same accent colour. Small note: 'o mapa real tem milhares de direções'. No numbers or axes.", labels_pt: ["cachorro", "gato", "cavalo", "segunda", "terça", "quarta", "imposto", "salário", "boleto", "homem", "mulher", "rei", "rainha", "o mapa real tem milhares de direções"], caption: "No mapa de sentidos, palavras usadas em situações parecidas moram perto, e algumas relações viram direções.", alt: "Um mapa plano com pontos rotulados agrupados em bairros: um bairro de animais (cachorro, gato, cavalo), um de dias da semana (segunda, terça, quarta) e um de impostos e dinheiro. Num canto, quatro pontos formam um paralelogramo: 'homem' e 'mulher' embaixo, 'rei' e 'rainha' em cima, com duas setas paralelas indo de 'homem' para 'mulher' e de 'rei' para 'rainha'."}
- {fig: apmecanica-tres-etapas, kind: diagram, idea: "Training pipeline as a conveyor belt with three stations left to right, ending in a locked file. Station 1 'pré-treino': a huge stack of text goes in; output tag 'continuador de documentos'. Station 2 'ajuste por instruções': a smaller stack of question-and-answer examples written by people; output tag 'responde no formato de assistente'. Station 3 'RLHF': simple human icons ranking answers A-D, feeding a 'juiz automático' that gives scores; output tag 'aprende o que agrada'. End of belt: a file icon with a padlock labelled 'pesos congelados'. Stack sizes should visibly shrink from station 1 to 3.", labels_pt: ["pré-treino", "continuador de documentos", "ajuste por instruções", "responde no formato de assistente", "RLHF", "juiz automático", "aprende o que agrada", "pesos congelados"], caption: "Do continuador de textos ao assistente: três etapas de treino e, no fim, um arquivo trancado.", alt: "Uma esteira com três estações da esquerda para a direita. Primeira, 'pré-treino': uma pilha enorme de texto entra e sai um continuador de documentos. Segunda, 'ajuste por instruções': uma pilha menor de exemplos de pergunta e resposta escritos por pessoas. Terceira, 'RLHF': pessoas ordenando respostas e um juiz automático dando notas. No fim da esteira, um arquivo com um cadeado, rotulado 'pesos congelados'."}
