- {fig: ch02-mesa, kind: concept-art, idea: "An office desk seen from slightly above, covered in stacked sheets of paper (messages, files, command output). No drawers, no cabinets: only the surface. The oldest sheets sit at the far edge and a few are sliding off and falling. Calm, slightly humorous editorial illustration; no people, no logos.", labels_pt: [], caption: "A mesa de trabalho do modelo: tudo o que ele enxerga está em cima dela, e o que cai da borda deixa de existir pra ele.", alt: "Ilustração de uma mesa de escritório coberta de folhas de papel empilhadas. As folhas mais antigas estão na borda e algumas caem pelo lado. Não há gavetas nem armários; só a superfície da mesa."}
- {fig: ch02-compactacao, kind: diagram, idea: "Three horizontal bars side by side (or stacked top to bottom) showing the context window over time. Bar 1: a few message blocks, lots of free space. Bar 2: nearly full of message blocks, a red line marks the limit. Bar 3: the oldest blocks replaced by one small block labelled 'resumo', followed by the recent messages intact, free space restored. A small arrow labelled 'compactação' between bar 2 and bar 3.", labels_pt: ["janela de contexto", "mensagens antigas", "mensagens recentes", "limite", "compactação", "resumo", "espaço livre"], caption: "Conforme a conversa cresce, a janela enche; na compactação, as mensagens antigas viram um resumo curto e as recentes continuam inteiras.", alt: "Três barras horizontais lado a lado representando a janela de contexto ao longo do tempo. Na primeira, poucas mensagens. Na segunda, a barra está quase cheia de mensagens, com uma linha vermelha marcando o limite. Na terceira, as mensagens antigas foram substituídas por um bloco pequeno chamado resumo, seguido das mensagens recentes, e sobra espaço livre."}
- {fig: ch02-memoria-em-camadas, kind: diagram, idea: "Three stacked tiers. Top: a small index card ('índice') sitting inside a box labelled 'janela de contexto', marked 'sempre carregado'. Middle: several folders ('arquivos de tópico') outside the box, with an arrow into the box labelled 'sob demanda'. Bottom: a large pile of transcripts with a magnifying glass, labelled 'só pesquisadas por palavra'. Optional small moon icon beside the folders labelled 'sonho: consolidação em segundo plano'. Generic, no vendor logos.", labels_pt: ["janela de contexto", "índice", "sempre carregado", "arquivos de tópico", "sob demanda", "transcrições antigas", "só pesquisadas por palavra", "sonho: consolidação"], caption: "As três camadas da memória do Claude Code, segundo o código vazado: um índice sempre na mesa, arquivos de tópico buscados quando preciso, e transcrições antigas que só são pesquisadas.", alt: "Diagrama com três níveis empilhados. No topo, um cartão pequeno chamado índice, sempre dentro da janela de contexto. No meio, várias pastas chamadas arquivos de tópico, com uma seta indicando que são puxadas sob demanda. Embaixo, uma pilha grande de transcrições com uma lupa, indicando que só são pesquisadas por palavra."}
