- {fig: ch15-verificar-na-origem, kind: diagram, idea: "Two verification paths side by side. Left: a backup tool looks at its own report and shows a green check, while one folder (a padlock icon: no permission) silently stayed behind on the source side. Right: an independent list of every file at the source is compared item by item with the destination; the missing folder shows up highlighted in red. Generic boxes, no vendor logos or product names.", labels_pt: ["origem", "destino", "relatório da ferramenta: sucesso", "inventário da origem", "faltando"], caption: "A pergunta certa compara o destino com a origem; o relatório da ferramenta só repete o que ela acha que fez.", alt: "Dois caminhos de verificação lado a lado. À esquerda, uma ferramenta de backup olha pro próprio relatório e mostra um sinal verde, enquanto uma pasta ficou de fora sem aviso. À direita, uma lista independente dos arquivos da origem é comparada item por item com o destino, e a pasta faltante aparece marcada em vermelho."}
- {fig: ch15-camadas, kind: diagram, idea: "Concentric rings around a file icon at the centre. From inside out: sandbox (the agent only sees the project), snapshot (back to one hour ago), external backup (another device, last night's copy), production out of reach (a human approves). An arrow labelled as a wrong command pierces the first ring and is stopped at the second. Clean, flat, no logos.", labels_pt: ["seus arquivos", "sandbox", "snapshot", "backup externo", "produção: um humano aprova", "comando errado"], caption: "Cada camada pega o que passou pela anterior: a jaula limita o que o agente enxerga, o snapshot desfaz o erro recente, o backup externo sobrevive ao disco, e a produção fica fora do alcance.", alt: "Círculos concêntricos em volta de um ícone de arquivo no centro. Do centro pra fora: sandbox (o agente só vê o projeto), snapshot (volta ao estado de uma hora atrás), backup externo (outro aparelho, cópia da noite anterior), produção fora do alcance (um humano aprova). Uma seta representando um comando errado atravessa o primeiro anel e é parada no segundo."}
