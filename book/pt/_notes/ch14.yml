integration:
  - "Export-control episode re-verified on primary/press sources: Anthropic statement (12 Jun 2026, 5:21pm ET directive 'citing national security authorities', suspends access by any foreign national inside or outside the US, net effect: disable Fable 5 and Mythos 5 for all customers; government reportedly believed it had found a jailbreak; no specific concern given); Anthropic's Fable 5 page banners (suspended 12 Jun, available again 1 Jul); Engadget 30 Jun (Commerce lifted the controls; Anthropic 'will begin restoring access tomorrow'; per FT, Lutnick's letter says Anthropic agreed to proactively detect and address security risks). Text expanded to say who was barred and why the shutdown was worldwide, and the 'trava nova' claim (single-sourced via CNN summary) replaced by the commitment Engadget reports. Citation switched cnbc2026lifted -> moon2026redeploy (CNBC page 403); cnbc2026lifted entry kept in _refs/ch14.yaml because apA cites it."
  - "Mythos Preview: 'pra dar tempo de corrigir o que ele encontrava' -> partners fix their systems before similar models spread (anthropic.com/research/mythos-preview gives that rationale, not patch time)."
  - "Glasswing: 'umas quarenta' -> 'mais de quarenta' (page: 'over 40 additional organizations'); 11 named partners besides Anthropic confirmed."
  - "Mythos unauthorized access: Anthropic investigated a REPORT of access (Engadget 22 Apr) -> text says 'denúncia' and makes the back-door line conditional."
  - "Fable routing: 'desviado em silêncio' -> 'desviado automaticamente' (Anthropic page: 'automatically handled by Claude Opus 4.8'). Register: 'admitiu que tinha errado na calibragem' holds ('We made the wrong tradeoff...')."
  - "Price: 94 vs 95, 24 min, ~US$11.20 vs ~US$6.40 (cost_analysis.md verified 2026-07-09), $10/$50 vs $5/$25: all hold. ch11/ch13 do not state 'dez vezes' (ch13 quotes no ratio)."
  - "Anthropic IPO (SiliconANGLE 1 Oct citing Bloomberg): '1,8 a 2 trilhões ... fim de novembro' -> 'em novembro, antes do Ação de Graças, avaliação esperada acima de 2 trilhões' (article: Nov. 9 target, 'more than $2 trillion'). S-1 1 Jun, Series H US$65B at US$965B (28 May), Altman 'not 2026' / 'ill-advised moment' (Fortune 12 Sep): hold."
  - "Navier-Stokes cost: 'Executivos da OpenAI falaram em milhões' was not in Fortune -> 'A OpenAI disse a jornalistas que usou pelo menos mil vezes a computação de problemas anteriores (~US$2 mil cada), uns 2 milhões; outras estimativas passaram de 20 milhões' (Fortune: 'at least 1,000 times greater', ~$2,000; others $22.5M). 10k agents confirmed by Fortune; 88 h and 130B/300B tokens rest on the post + openai.com page (403 at integration, drafter verified)."
