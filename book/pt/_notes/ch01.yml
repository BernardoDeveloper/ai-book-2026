notes:
  - "ch01 explains properly (continuity explained_in.ch01): LLM, token, parâmetros, pesos, treino vs uso (inferência), transformer (2017, 'atenção'), AGI, bolha, curva em S. Also introduces and glosses temperatura, papagaio estocástico, rede neural. Later chapters should mark these with .gls and point to @sec-ch01, never re-explain."
  - "Proposed glossary keys in _gls/ch01.yml: curva-em-s, treinamento (term 'Treino'), papagaio-estocastico, temperatura, rede-neural."
  - "Half-clause glosses given in ch01 for terms owned elsewhere: prompt (ch05), contexto (ch02, 'the app resends the whole conversation every time'), alucinação (ch04), placas de vídeo [gpu] (ch13). ch02 can open directly from ch01's last paragraph: frozen weights + the app re-sending the conversation; the hook is the 31 March 2026 Claude Code source-map leak ('como um produto comercial simula memória')."
  - "Frank Rosenblatt is introduced in ch01 (section 'O primeiro hype'): Cornell Aeronautical Laboratory psychologist, Perceptron report January 1957 (rosenblatt1957perceptron, entry lives in _refs/ch05.yaml), Navy press demo July 1958 on an IBM 704 (50 trials, left/right cards; lefkowitz2019perceptron), NYT 8 July 1958 'walk, talk, see, write, reproduce itself and be conscious of its existence' (cited via sejnowski2020unreasonable, which reproduces the article), Minsky & Papert 1969, AI winter, death in 1971 on his 43rd birthday. ch01 does NOT explain the Frank-project naming; ch05 does. ch01 says only 'Este livro vai falar dele outras vezes'."
  - "GPT-2 'perigoso demais' (Feb 2019) is told in ch01 with primary sources: OpenAI post (radford2019better: 'Due to our concerns about malicious applications of the technology, we are not releasing the trained model'; framed by OpenAI as an experiment it was unsure about), Guardian headline same day (hern2019dangerous), full 1.5B release 5 Nov 2019 (openai2019gpt2). Dario Amodei and Ilya Sutskever are on the GPT-2 post's author list; ch01 hooks ch14 explicitly: 'você vai reencontrar exatamente esse roteiro no @sec-ch14, em junho de 2026, ... na empresa do mesmo Dario Amodei'. ch14 can call back without retelling."
  - "The S-curve is stated in ch01 as Akita's 2023 prediction plus the GPT-1..5 progression from 02/08, with cost evidence (AI Index 2024: GPT-4 ~US$78M, Gemini Ultra ~US$191M compute; hai2024aiindex), GPT-4 report hiding size (openai2023gpt4) and Reuters Nov 2024 (reuters2024limitations). ch20 owns the full 2019-2026 timeline (Chinchilla, o1, MoE, caching, METR, Sutskever NeurIPS 2024); ch01 deliberately left those out and only forward-points to @sec-ch03 and @sec-ch20 for 'the leap came from the harness'."
  - "Correction vs blog: 02/08 credits AlexNet to 'George Hinton, Yann LeCunn e Ilya Sutskever'. The paper's authors are Alex Krizhevsky, Ilya Sutskever and Geoffrey Hinton (krizhevsky2012imagenet). Any chapter mentioning AlexNet or Hinton should use 'Geoffrey'."
  - "Scene detail to confirm with Akita: the outline calls the 02/08 image 'the T-shirt with the phrase', but the image (file 'akita camiseta.jpg') shows Akita holding a card with the phrase, with garbled lettering ('inversarenty proporonal ao sseu knoveemto') and a Gemini-style sparkle mark. ch01 describes it as a card with scrambled letters, 'o tipo de tropeço que gerador de imagem por IA cometia', without asserting who generated it."
  - "The phrase 'Sua empolgação com IA é inversamente proporcional ao seu conhecimento sobre IA' is anchored in ch01 to Akitando #135 (5 Jan 2023, akita2023chatgpt) with the magic-trick comparison from that episode; the preface may quote the phrase but should not retell its origin."
  - "Flow podcast episode referenced: 'MENTIRAM PRA VOCÊ SOBRE INTELIGÊNCIA ARTIFICIAL [com Fabio Akita]', 13 June 2025 (flow2025mentiram). Reuse the key."
  - "ch01 forward refs: @sec-ch02 (contexto), @sec-ch03 (harness leap), @sec-ch04 (alucinação), @sec-ch08 (months-long retro-game conversion where the model learned nothing), @sec-ch14 (too-dangerous pattern), @sec-ch20 (year balance). ch05's back-reference to @sec-ch01 for frozen weights, 'máquina de probabilidade com dose de acaso' and the Perceptron/first AI hype is satisfied."
