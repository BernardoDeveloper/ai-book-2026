notes:
  - "Oráculo (owned by ch08): defined in section 'O oráculo' as an external verifier that measures reality independent of the model (test, measurement, comparison with a trusted reference); 'o oráculo não negocia'. ch08 states 'Um teste é um oráculo pequeno' and points back to @sec-ch06 (integration tests with real data). Later chapters (ch09 'how to check', ch11 benchmark, ch12 green tests that lie, ch15 'verify against the source not the tool's log', ch20) can mark [oráculo]{.gls key=oraculo} and call back without re-explaining."
  - "Frank naming conflict: the Frank Yomik post (03/05) says 'Frank é referência à tradução franca, direta', which contradicts the Rosenblatt ruling. ch08 gives only the Yomik etymology (yomi + ik-da) and says nothing about the Frank part. Integration may want to know the blog is inconsistent here."
  - "Frank Yomik GPU memory: the post says 16 GB at the top and 8 GB at the end. Unresolvable from the text; ch08 says only that the server needs a GPU. ch13 should not quote either number for Frank Yomik."
  - "Driveclub day count: the post says 'four days' (Sunday night to Thursday morning, 8h to midnight) but its effort accounting says '3 dias de trabalho ativo (Apr 21-23)'. ch08 uses 'domingo à noite até quinta de manhã' and 'quatro dias'. Also the blackout duration varies inside the post (10-30 s vs ~15 s fade + 60-90 s black); ch08 avoids a seconds figure and uses 'recovers near 1:30'."
  - "ch18 can reuse the junior-learning point briefly: ch08 owns the story and states 'Profissional sênior é alguém que já foi júnior em cada tema que domina' and the four-item advice list (mergulhe; use a IA pra acelerar a busca; insista no porquê; when the AI says 'vamos aceitar e documentar', check if you understood the chain). Reference @sec-ch08 instead of retelling Driveclub."
  - "ch08 cites Akitando #81 (key akita2020akitando81, 2020-06-18, youtube hYJ3dvHjeOE); reuse it if another chapter mentions the channel's Super Mario/6502 video."
  - "NESdev citation: the blog quotes a long sentence attributed to the NESdev thread t=17339; on verification the first page only has tokumaru's 'Automatic conversion of 6502 code to Z80 will definitely cause a hit in performance'. ch08 paraphrases only the performance point. Do not reuse the blog's longer quote."
  - "Model names: the NES post (09/07) writes 'Claude Fable' and 'GPT Astra' without version numbers; ch08 keeps them versionless ('recém-lançado GPT Astra'). If ch11/ch14 fix the exact September versions (Fable 5 vs 5.1), integration may add them."
  - "Glossary first uses in ch08 that later chapters own: gpu (ch13), parametros (ch01), contexto/janela-de-contexto (ch02, with @sec-ch02), modelo-de-fronteira (ch14), fine-tuning. Each has only a half-clause gloss here. Proposed new keys in _gls/ch08.yml: ocr, heuristica, modelo-pre-treinado, emulador, bug, oraculo. ch17 (reverse engineering) and the Go interlude may want emulador/heuristica."
  - "Hook: ch08 closes with the 04/15 opening ('o que você pediu pra ele, exatamente?'), listing 04/15 in sources. ch09 can open on the same question without repeating the cancelled-subscription anecdote at length."
