notes:
  - "apmecanica goes one level below ch01 and points back to @sec-ch01 for: next-token loop, tokens, temperature, frozen weights, Rosenblatt/Perceptron, Eliza, 'magic trick' comparison. It points to @sec-ch02 (embedding for search), @sec-ch04 (alucinação, sicofancia; cites sharma2023sycophancy only as support), @sec-antes (reading list). It does not retell the February 2026 clips scene."
  - "Full treatment of papagaio-estocastico lives here (section 'O papagaio e o polvo'): Bender, Gebru, McMillan-Major & Mitchell 2021 (bender2021dangers; the paper's byline uses the pseudonym 'Shmargaret Shmitchell' for Margaret Mitchell, the text names her as Margaret Mitchell), translated definition quote, Gebru's December 2020 exit from Google (hao2020gebru), Bender & Koller's octopus test (bender2020climbing) opening and closing the appendix, then critics: in-context learning (brown2020language), emergent abilities (wei2022emergent) vs 'mirage' (schaeffer2023mirage), Othello-GPT (li2023othello), Anthropic rhyme planning and the addition-explanation mismatch (anthropic2025tracing), Hinton 'They really do understand' (brown2024hinton, Globe and Mail, June 2024). Akita's position labelled as his (02/08, 02/24): appeal to authority, findings real but still statistics of text, AGI not with current tech."
  - "Suggested richer glossary def for papagaio-estocastico (ch01 owns the key; integration may adopt): 'Expressão criada em 2021 por Emily Bender, Timnit Gebru e colegas para descrever modelos de linguagem: sistemas que costuram sequências de palavras vistas no treino segundo probabilidades, com uma dose de sorteio, sem acesso ao significado. Usada por críticos do hype; contestada por quem vê estruturas internas mais ricas nesses modelos.'"
  - "New glossary keys proposed in _gls/apmecanica.yml: descida-do-gradiente, retropropagacao, atencao, pre-treino, aprendizado-em-contexto. 'pre-treino' (training stage) is distinct from ch08's 'modelo-pre-treinado' (a ready-made published model)."
  - "Correction carried from the blog: 02/08 says 'George Hinton'; the text uses Geoffrey Hinton (as ch01 did for AlexNet)."
  - "ch04 explains RLHF in a half-paragraph; apmecanica gives the InstructGPT mechanics (40 contractors, reward model, 1.3B preferred over 175B, alignment to a specific group of labelers). If ch04 wants a pointer for readers who want more, '(veja @sec-apmecanica)' fits after its RLHF sentence."
  - "Numbers used (all cited): GPT-3 96 layers, 96 attention heads, 12,288-dimension embeddings, 175B params, 300B training tokens (Table 2.1); Llama 3 >15T tokens, 128K vocabulary (Meta blog, 18 Apr 2024); Epoch AI 2026-2032 data exhaustion window (villalobos2024data, key shared with ch10); Stack Overflow questions back to roughly 2009 level (orosz2025stackoverflow)."
  - "Integration item already logged: ch01 should get a one-line pointer to @sec-apmecanica."
