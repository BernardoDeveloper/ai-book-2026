notes:
  - "LEDGER ch03/ch11 (Opus 4.7 chat.complete) settled as follows in ch11: the 18 Apr report (docs/success_report.multi_model.md) called chat.complete 'a method that doesn't exist' and kwargs add_message wrong; the 24 Apr re-audit against the ruby_llm 1.14.1 gem source (README.md e834f50 and the 04/24 post) found both VALID. I also checked the gem source myself (local 1.14.1 and GitHub, cited paolino2026rubyllm): Chat#complete is public and Chat#ask is literally add_message(role: :user, ...) + complete. So Opus in Claude Code wrote the long form of ask. The multi_model report was never re-scored; the 04/25 post and README 'Key Findings' (line ~60) and the July note in multi_model.md (line 20) kept repeating the hallucination claim. ch11 tells this as 'the correction and the error coexisted for months'. ch11 also tells that in July Opus 4.7's OpenCode 97 was re-audited to 87."
  - "WHAT ch03 SHOULD SAY (do not edit until integration): keep 'a auditoria da época classificou como errado' (it is consistent). But the following sentences present the April conclusion as established and should be reframed as the then-hypothesis: 'A hipótese era que as instruções ... empurravam o Opus pra um padrão genérico' (fine as hypothesis) and especially 'Então o problema era da combinação: aquele harness atrapalhava aquele modelo.' Suggested: 'Na época, concluí que o problema era da combinação. Dias depois, conferindo o código-fonte da biblioteca, descobri que aquele uso estava certo (@sec-ch11).' The DeepSeek-in-Claude-Code paragraph can stay (DeepSeek did use the API correctly) but it no longer proves a harness effect on Opus. The July Opus 5 paragraph stays as is."
  - "ALSO for ch03: the 'Claude Code 4-7x more expensive / 6-11M cache tokens vs ~210K in OpenCode' comparison is invalid, because the OpenCode token counts before 2026-08-01 came from the metrics bug (only the last step_finish recorded, 40-90x understated). ch03 only quotes the 6-11M Claude Code figure (fine); nobody should quote the OpenCode 210K or the 4-7x ratio."
  - "Lineage applied: only v4 numbers (combined ranking, 46 models, 2026-09-22) are presented as current: seven-way tie at 100 (GPT-6 Astra, Opus 5, Fable 5, Opus 5.5, GPT 5.6 sol/terra, GPT 5.5), terra < half of sol's cost, Opus 5.5 = 1/4 cost and < half time of Opus 5, DeepSeek V4.1 Flash 92.5 for ~US$1.21, Grok 4.7 83.5 vs 4.6 98.5, MiniMax M3 91 (v2) -> 75.5 (v4). The posts' '39 models' is mentioned only as 'a contagem daquele momento'. All April/July numbers (Kimi/Gemini tier moves, 97/96, Fable 94/93, GPT 5.5 96->85, Opus 4.7 ~US$1 -> ~US$7, 15 of 40 in tier A, v3 24 of 37 at 95-100) are framed as dated history."
