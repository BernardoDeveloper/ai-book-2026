  - "Hook to ch14 borrows 06/11 (listed in sources): June 2026, days after Anthropic's confidential IPO filing (1 June), it released the first public model of the family it had called too dangerous to release (Mythos, announced 7 April); in the benchmark it tied the previous model. ch13 deliberately quotes no price ratio, since the Opus cost of ~US$1,10 in that post was later corrected to ~US$7 (continuity corrections)."
