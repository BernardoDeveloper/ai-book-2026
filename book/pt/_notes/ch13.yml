notes:
  - "ch13 explains properly: GPU, VRAM, quantização (supermarket-price rounding image), KV cache ('o caderno de anotações' on ch02's desk), largura de banda de memória (writer walking to the shelf to reread the whole encyclopedia per word; speed = width of the corridor), memória unificada, MoE (router wakes a few blocks; sleeping experts still occupy memory; experts are NOT topic specialists, cite jiang2024mixtral), modelo aberto (weights published; not the same as local, not the same as free, training data rarely public), destilação (aluno/professor, hinton2015distilling; 'transfere o estilo, o conhecimento nem sempre'), classificador. Later chapters: mark and point to @sec-ch13."
  - "Proposed glossary keys in _gls/ch13.yml: kv-cache, memoria-unificada, largura-de-banda, classificador. ch14 (Jev hype) should reuse 'classificador' and not re-explain it; ch13 describes Jev only as a classifier that 'virou febre em setembro' and forwards the hype analysis to @sec-ch14."
  - "Binding correction applied: the Strix Halo mini-PC had 96 GB allocated as VRAM in the March review, reduced to 64 GB on 8 April 2026 (homelab notes). ch13 tells the change and says everything after April ran with 64 GB. NOTE: the 09/15 post and the benchmark repo report still say 'Strix Halo with 96 GB' for the September Qwen 3.8 27B run; ch13 does not repeat that figure. Other chapters must not say 96 GB for anything after April."
  - "Correction vs blog: 01/22 says GLM 4.7 Flash is 'the same 30B GLM 4.7, quantized'. The Z.ai model card shows GLM-4.7-Flash is a separate 30B-A3B MoE sibling (GLM 4.7 is much larger). ch13 says only 'um irmão menor do GLM 4.7 com 30 bilhões de parâmetros' (zai2026glm47flash). The 60 GB-at-16-bit arithmetic is presented as an original bridge."
  - "Jev-class ranking told as of 12 October 2026 from jev-docs (d3 and Perplexity Decider 27B at 99.4%, identical labels on all 1,024 classifications; Jev and Microsoft Decision-1 at 97.6%, Microsoft cheapest hosted at ~US$0,065 per 10k; Jebadiah/Mapika/Kev 4B at 87-90%; Julia-1 31.5% vs ~31% chance, 48/71 confident errors; support-ticket data-loss case where 27B Clef said 'degraded'). Local cost written as 'não medido', never zero."
  - "Local benchmark facts (v4, September 2026): GLM 4.7 Flash on the RTX 5090 first local model to finish all 7 sprints, 29 min, 24 points; Qwen 3.8 27B stalled at sprint 3 on the 5090 (coherence, not memory) and on the Strix Halo scored 80 in 706 minutes vs 80-300 min for cloud runs. The combined report at HEAD ranks Qwen local #39 (post says #32); ch13 gives no rank."
