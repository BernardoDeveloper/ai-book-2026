notes:
  - "Facts added beyond the 07/06 post, all verified and cited: match dates 9-15 March 2016 in Seoul, game 4 on 13 March, AlphaGo's estimate collapsing near move 87, Gu Li calling move 78 divine (wikipedia2026alphagoleesedol, deepmind2026alphago); Lee Sedol's retirement in November 2019 and the Yonhap quote (vice2019leesedol); KataGo paper Feb 2019, <30 GPUs (wu2019katago); the 2022-23 adversarial attack on KataGo, humans incl. coauthor Kellin Pelrine learning it (wang2023adversarial)."
  - "Not used: the widely reported '14 of 15 games' figure for Pelrine (only secondary reposts of an FT story found, FT original not verified). Text says he won 'com regularidade', which the ICML paper supports."
  - "The KataGo adversarial 'ponto cego' is set up as a bridge to Part IV: superhuman system with a blind spot nobody saw until someone searched for it. ch15/ch16 (or the prompt-injection chapter) can call back to it as @sec-interlude2."
  - "Hook borrows from 07/11 (agents deleting files that week, Akita two months in YOLO mode without incident, but no blind trust). The Matt Shumer case is described without the name or model; ch15 owns the details and the layered-defense story."
  - "Glossary proposals: mcts (busca em árvore de Monte Carlo) and codigo-aberto (open source, contrasted with modelo-aberto). If an earlier chapter already proposed an open-source key, merge into that one."
  - "Frank GO points to @sec-ch05 for the Rosenblatt naming; not re-explained."
  - "Figure source caveat: the Commons file page for 'Lee Sedol (W) vs AlphaGo (B) - Game 4.svg' has a description heading that says 'Game 1' with colors swapped; filename, title and result (White wins by resignation) are game 4. Credit line (Wesalius, CC BY-SA 4.0) is in the caption; creditos.md should list it."
integration:
  - "Re-verified online: 9-15 Mar 2016 Four Seasons Seoul, 4-1, game 4 on 13 Mar, move 78, Gu Li 'divine move', AlphaGo's estimate plummeting at move 87 (Wikipedia); ICML 2023 abstract (human experts beat superhuman AIs with the attack; vulnerability persists in adversarially trained KataGo). Post supports 'mão de Deus', move 37, 2008 GNU Go, Frank GO facts."
  - "'Cinco dias depois de eu publicar o Frank GO, o assunto nas redes era outro' -> 'Na mesma semana em que eu publiquei' (07/11 says 'essa semana'; the date of the 07/11 post is not the date of the incident)."
  - "Opening is consistent with ch14's closing (ch14 states only the 4-1 result and the July app; the interlude tells the series in full). '2 months YOLO' matches 07/11 and ch15 ('cinco meses... os dois últimos em modo YOLO')."
