notes:
  - "ch15 explains properly (owner per continuity): sandbox (caixa de areia; 'a jaula') and snapshot (fotografia do estado; copy-on-write explained in one paragraph). Later chapters mark [sandbox]{.gls} / [snapshot]{.gls} and point to @sec-ch15."
  - "Opening scene is from private-notes (private, not named): 10 Oct 2026, the home-server agent pruned the old NAS downloads folder with an empty keep-list (download client stopped, API returned nothing, 'e eu não conferi a lista'); 69 deleted: 58 had library copies, 11 never-imported albums had no other copy, the 31 incomplete downloads were untouched. All 11 restored from the NAS's midnight snapshot, byte sizes matched. The executing desktop agent found two defects in the handoff procedure (a '..' guard that rejects 'Oops!... I Did It Again'; restore treating 'exists' as 'restored', with a real interrupted-copy stub). Then 785 entries (>2 TB) pruned with 0 failures; 186 held for owner. New rules: protection lists asserted non-empty and count-matched; 'already copied' verified per entry. No hostnames, IPs, share names, usernames or repo names used; the blog's own server/share names (the server and share names) are also avoided."
  - "Lineage applied: 01/10 used only for the principle (treat agent/tools as untrusted) and permission fatigue; the January script is mentioned only as the ~170-line origin (fact from 03/01). 03/01 details superseded: no 'network inherits host'; current ai-jail facts from README/SECURITY.md v2.8.1: 'accident guard, not a security boundary', disposable VM for hostile code, agent's own credentials exposed by default as a stated trade-off, network off by default but filtered egress to the agent's own API host (v2.8.0) and package registries (toolchains, early Oct). Docker socket opt-in told as the July story (v1.16.0)."
  - "Quote check: the outline's 'a sandbox with a convenience back door is decoration' is a paraphrase. 07/25's actual sentences are 'Uma sandbox bem construída perde boa parte do valor se tiver uma porta dos fundos aberta por conveniência' and 'Camada de segurança que você não audita vira decoração'; ch15's blockquote combines both. 'accident guard, not a fortress' is also a paraphrase; SECURITY.md says 'an accident guard, not a security boundary', README says 'accident-prevention layer'. ch15 quotes 'proteção contra acidentes' only."
  - "Two audits (2026-09-30, v2.3.0): both found the same two Highs (forged worktree metadata -> arbitrary host dir RW; duplicate env entries bypass phantom secret), both reproduced; fixed in v2.4.0, tagged the same night (release notes header still says 'unreleased'). A found 11+ items B missed (all macOS); B found 3 A missed (test escape hatches in release binary); B rejected/left unresolved 3 that were real. Who ran the audits is not stated in the docs, so ch15 doesn't say."
  - "Story of change kept honest: July 2026 Akita hypothesised that agent-deletion incidents mostly come from vague prompts (5 months YOLO, zero accidents). The October deletion came from an unchecked premise (empty list), not a vague prompt; ch15 says this 'não cabe nessa hipótese' and that the July conclusion (layers, distrust as engineering) came out reinforced. Akita may want to confirm that framing."
  - "NAS story (10/06) told only as far as the trust/verification lesson: two disks critical on Mon 5 Oct, single parity, vendor knew of the failing disk >1 month without notifying, emergency second NAS at >3x US price (R$ figures left out), agents ran recovery; HBS silent skips (901 GB permission, 113 names); busybox ps truncation -> 32 rsyncs; verification inheriting excludes (952 files / 191 GB); 17 jobs, ~5.9M files byte-identical; kernel regression rolled back via transactional snapshot OS. Disk-price/AI-demand material, RAID internals, ZFS thick/thin, sshd lockout are NOT used; ch19 or ch14 can take the HDD price/AI demand angle."
  - "Callbacks used: @sec-ch03 (agent), @sec-ch05 (five reviewers), @sec-ch08 (oráculo), @sec-ch20 (ai-memory as the agents' message box, unnamed here), @sec-apB (practical how-to). apB should cover: snapshots on Linux/Mac/Windows, restic-style external backup with retention, ai-jail usage and flags, permission allow/ask/deny lists, git push requiring approval."
  - "Proposed glossary keys (_gls/ch15.yml): root, modo-yolo, ataque-cadeia-de-suprimentos, maquina-virtual, conteiner, copy-on-write, backup, producao. ch16/ch17 may reuse conteiner, ataque-cadeia-de-suprimentos, producao. prompt-injection (ch09 key) is NOT treated in ch15; ownership still open for ch16/ch17."
  - "Hook into ch16 borrows from 03/16 (listed in sources): a popular open project linking messaging apps to AI models, >1M lines, ~50 commits/day from dozens of contributors; OpenClaw is not named in ch15, leaving the reveal to ch16."
  - "Citation keys created: backblaze2026q2, shumer2026deleted, goodalexander2026devnet (X posts; titles paraphrased, exact July day unchecked), akita2026aijail, mdindoffer2026docker, docker2026security, akita2023akitando146. apB should reuse akita2026aijail."
integration:
  - "Opening scene: download client did not 'stay off since the crisis'; per homelab notes it stopped by itself that night (exit 137, cause unknown) after the owner had used it. Text now: 'tinha parado sozinho naquela madrugada, por um motivo que ninguém descobriu'."
  - "Snapshot: 'tirava um snapshot toda meia-noite' -> 'tinha tirado um snapshot automático à meia-noite' (only the 10 Oct 00:00 snapshot is documented, not the schedule)."
  - "Backblaze: 1,7% (Q2 quarterly AFR) did not produce the post's 11%/40% arithmetic; added the 1,4% lifetime fleet rate (verified on backblaze.com) and tied the 8-disk math to it."
  - "'E, cinco dias depois, o agente da faxina...' -> 'no meio dessa mesma semana' (the copy/verification slips were spread over 5-11 Oct, so 'five days after' was not accurate)."
  - "Closing hook: removed the >1M lines / ~50 commits/day numbers because ch16's opening tells them immediately; hook now teases 'ritmo que nenhum humano conseguiria revisar, com cara de código gerado por IA' (03/16)."
  - "Verified unchanged: 69/58/31/11, 785 (2,14 TB) 0 failures, 186 held (173+13), two defects ('..' guard, exists != restored with a real 794 MB stub), new rules; 901 GB/113, 32 rsyncs, 952 files/191 GB, 17 jobs/~5,9M files, 57 services, kernel rollback; agents talk via ai-memory (homelab CLAUDE.md), so the @sec-ch20 pointer holds. ai-jail: agent_state ON by default in code (command.rs/seatbelt.rs tests, v2.6.0 notes); registries egress v2.5.0 (1 Oct), agent API host v2.8.0 (9 Oct); docker opt-in commit 25 Jul at version 1.16.0 (tag later re-cut 30 Jul); audits on v2.3.0 30 Sep, v2.4.0 tagged 21:31 same day; comparison counts (11/3/3) match."
  - "Note: src markers and refs_projects name the private repo 'private-notes' and file names containing NAS brands; they are stripped at build, but rename if the source tree is ever published."
