notes:
  - "apB H1 is `# Kit mínimo para usar agentes com segurança {#sec-apB}` (no .unnumbered, per the appendix brief; ch02's note asked for .unnumbered, now moot)."
  - "Structure: seven tool-agnostic pieces (jaula, snapshots, backup externo, lista de permissões, nada em produção, notas de memória, limites de uso), then ai-jail / ai-memory / ai-usagebar as one example, then a seven-line pocket checklist. ch15's requested items are all covered: snapshots on Linux (Btrfs, Timeshift/snapper, grub-btrfs), macOS (APFS + Time Machine local snapshots, tmutil) and Windows (VSS weak, backup mandatory); restic with 7/4/6/1 retention; ai-jail usage and flags; allow/ask/deny lists; git push in 'ask', force push in 'deny'."
  - "Lineage: 01/10 used only for the principle/permission fatigue. The permission-list excerpt comes from ai-jail's current src/bootstrap.rs (Oct 2026), which no longer puts `rm -rf` in deny (rm is in ask); the 03/01 post's list is superseded on that detail. Docker socket told as opt-in (07/25)."
  - "ai-jail README inconsistency: the 'Secure defaults' section says agent_state is ON by default, but the 'Useful options' block says '--agent-state / --no-agent-state ... (default off)'. apB (like ch15) follows 'on by default'. Worth flagging upstream."
  - "`--bootstrap` is not documented in the README but exists in src/cli.rs and src/bootstrap.rs (v2.8.1); apB cites it from the 03/01 post plus the source."
  - "Versions as of 13 Oct 2026: ai-jail 2.8.1, ai-memory 2.6.6, ai-usagebar 1.36.0 (git describe). ai-usagebar is not named in any chapter; it lives only in apB and apD."
  - "Commands shown (each explained): timeshift --create, tmutil localsnapshot, restic forget retention line, three ai-jail invocations, two ai-memory install lines, and a 3-line JSON permission excerpt."
  - "New citation keys in _refs/apB.yaml: akita2026aimemory, akita2026aiusagebar, mryll2026claudebar, restic2026, antynea2026grubbtrfs. apD and ch20 can reuse akita2026aimemory (ch20 currently cites no key for ai-memory)."
integration:
  - "ai-jail README (HEAD v2.8.1-1) still contradicts itself: Secure defaults and options table say agent_state on by default, usage block line ~513 says '(default off)'. Book (apB, ch15) follows 'on'. Flag for Akita."
  - "Committed .ai-jail: README says project config is untrusted and monotonic (can only tighten unless the folder is listed in trust_project_config); apB no longer says the team 'inherits the same jail'."
  - "--bootstrap targets: Claude Code, Codex, OpenCode, Gemini CLI and Crush (src/bootstrap.rs run()); src marker changed to ref:ai-jail/src/bootstrap.rs."
  - "Verified: permission excerpt in bootstrap.rs; WSL2 / sandbox-exec / tmpfs home / defaults off list; ai-memory 2.6.6, install commands, loopback no-auth default, markdown in git, zero-LLM default; ai-usagebar 1.36.0 Rust port of claudebar, 97% alert, tray for macOS/Windows; ch15 callbacks (YOLO since May, eleven albums, transactional OS rollback)."
