mescla-de-modelos:
  term: Mescla de modelos
  long: Model merge
  def: Criar um modelo novo tirando uma média ponderada dos pesos de dois modelos compatíveis já treinados. Custa muito menos do que treinar, e o resultado herda as qualidades (e a autoria) dos dois.
pos-treino:
  term: Pós-treino
  long: Post-training
  def: Treinamento feito depois do treino principal, pra ensinar um modelo-base a seguir instruções, usar ferramentas ou trabalhar como agente. Muitas vezes é o que separa um modelo útil de um que só completa texto.
caixa-preta:
  term: Teste de caixa-preta
  def: Avaliar um sistema só pelo que entra e pelo que sai, sem ver o que tem dentro. Serve pra excluir hipóteses sobre um modelo fechado, mas não prova de onde ele veio.
