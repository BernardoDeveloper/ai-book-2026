  - {unit: ch03, where: "### O plugin que eu esqueci ligado", why: "Notas de modelos desconhecidos para um ponto já provado (DeepSeek e o mesmo Opus)."}
  - {unit: ch06, where: "## Os mocks mentem", why: "Teste de integração e dublês de teste: o ponto 'a IA precisa de conferência' já veio nos capítulos 4 e 5."}
  - {unit: ch08, where: "## Quatro dias no escuro", why: "Emulador de PS4; o aprendizado 'a IA quer parar' e 'sênior vira júnior de novo' cabe em um parágrafo."}
  - {unit: ch10, where: "### Um relógio, um e-mail, uma música", why: "Geary, Frank Lyrics, Frank Type e Rust são lista de projetos pessoais; ficar só com a ideia das pequenas coceiras."}
  - {unit: ch11, where: "### O colega sabotador", why: "Método do benchmark do autor e custo de 4 mil dólares."}
  - {unit: ch12, where: "## A receita da prefeitura", why: "Disputa de licenças e pesos entre laboratórios; bastava uma frase sobre 'não confie na origem anunciada'."}
  - {unit: ch16, where: "## Uma reescrita que deu certo", why: "Bun, Zig e Rust; é conversa entre programadores."}
  - {unit: ch17, where: "### O Clash of Kings e a carteira", why: "Jogo de estratégia chinês; os pontos de privacidade se repetem no TikTok."}
