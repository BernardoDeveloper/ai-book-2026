persona: profissional
summary: |
  I picked this book up because I read my job "ends in two years", and I finished it calmer but not fully answered. What I will remember: the model is a locked file that re-reads the whole conversation (the "mesa"), it agrees with whoever is asking, it invents with the same confident tone, and the sentence "boa pra quê, conferida por quem, a que custo". Chapter 4 (eight rules, health/money/news, and the warning about pasting client data) is the most useful thing I read, and the epilogue's "pra esta semana" is exactly what I wanted, though it arrives on the last pages. The reassurance about work is the weakest part for me: the job chapters are about programmers, my profession gets four paragraphs and an openly admitted extrapolation, and the "decide and confere" answer is never shown to hold for accounting. I nearly quit twice on my phone at night: in the middle of Part II (commits, emulators, a Master System converter) and in Part III (benchmark versions, Rio/Nex weights, GPU memory, Casey the saboteur). I skimmed most of ch11, ch12, ch16 and the second half of ch15. The 20 percent that was for me was excellent; the other 80 percent I read as someone being polite to a stranger's hobby.
best:
  - "ch04: o mesmo texto, duas perguntas ('quais os problemas' x 'está correta'), duas respostas opostas; e as oito regras com saúde, dinheiro e notícias"
  - "ch02: a mesa de trabalho e o bilhete: 'A IA não lembra de você. Ela lê um bilhete sobre você'"
  - "ch14: a lista 'Como ler um anúncio' (e o exemplo do Jev com um adversário por manchete)"
  - "ch07: 'Zero e nada' (campo vazio lido como zero) e a regra de tratar a saída da IA como entrada de estranho"
  - "epilogo: 'Pra esta semana' para quem trabalha com escritório, números ou papéis"
worst:
  - "ch11: quatro versões do benchmark, 46 modelos, o sabotador Casey; só voltei a me achar na seção 'Como eu leio uma tabela'"
  - "ch12: Rio 3.5 x Nex x Qwen e o teste de caixa-preta do Kimi; nenhuma decisão minha depende disso"
  - "ch16: OpenClaw, reescrita em Rust, Bun x Zig, teorema de Rice; só a lista 'Então, é seguro?' me serviu"
  - "ch08: Driveclub no emulador e conversão de Nintendinho para Master System; só o conceito de oráculo ficou"
  - "ch18: li esperando a minha profissão e encontrei história de cartão perfurado e linguagem de programação"
units:
  - {unit: index, score: 4, note: "Abertura com o robô de 1939 demorou, mas o 'pra quem eu escrevi' me nomeou e eu continuei; faltou uma frase honesta sobre o emprego logo aqui."}
  - {unit: como-ler, score: 4, note: "O 'se você tem pressa' me deixou pular, mas me mandou para o ch18, que é sobre programadores."}
  - {unit: antes, score: 3, note: "Entendi o que fica de fora, mas é um capítulo de aviso antes de qualquer história; poderia ser um parágrafo."}
  - {unit: ch01, score: 4, note: "Finalmente entendi o corretor do celular em escala grande e por que o chatbot parece uma pessoa; Rosenblatt e a história do GPT-2 alongaram."}
  - {unit: ch02, score: 4, note: "A mesa de trabalho explicou por que ele esquece; os detalhes do vazamento (1.279 sessões, 3.272 falhas) eu pulei."}
  - {unit: ch03, score: 3, note: "A ideia 'mesmo modelo, outro resultado' é boa, mas veio embrulhada em MCP, skills, caching, DeepSeek e OpenCode ao mesmo tempo."}
  - {unit: ch04, score: 5, note: "Vou usar amanhã: perguntar sem dar minha opinião, nunca colar dado de cliente, conferir conta passo a passo."}
  - {unit: ch05, score: 3, note: "A lição dos 10% e 90% veio; eu não precisava dos commits e arquivos de mil linhas para acreditar."}
  - {unit: ch06, score: 3, note: "A parte do 'adulto na sala' e da voz que o modelo apaga é ótima; XP, CI e mocks perderam esta leitora de celular."}
  - {unit: ch07, score: 3, note: "'Zero e nada' e 'a IA reflete a sua competência' ficaram; Gmail, FrankMega e Sherlock eu li na diagonal."}
  - {unit: ch08, score: 2, note: "Perdi o fio no emulador de PlayStation e na conversão de jogos; só o 'oráculo' (algo de fora que diz se está certo) me serviu."}
  - {unit: ch09, score: 4, note: "As quatro partes de um bom pedido e o exemplo da carta ao plano de saúde são exatamente meu uso; a segunda metade (Clean Code, skills) é de programador."}
  - {unit: ch10, score: 3, note: "O boletim 'nenhum projeto ganhou 10' foi honesto; os multiplicadores 5x, 6-7x, 30 semanas e 19% mais lento me confundiram."}
  - {unit: interlude1, score: 4, note: "Leve e concreto: 20 anos de blog traduzidos enquanto ele dormia, e o filtro que recusou texto contra o nazismo."}
  - {unit: ch11, score: 2, note: "Comecei bem ('Embaraçoso.') e depois me afoguei em versões, notas e nomes de modelo; a regra 'acima de 90, leia como um grupo' salvou."}
  - {unit: ch12, score: 2, note: "A cola do modelo é uma boa história, mas Rio/Nex e o teste do Kimi parecem briga de bastidor que não muda nada para mim."}
  - {unit: ch13, score: 3, note: "A analogia da estante e do corredor funcionou; entendi que IA em casa não é o meu caso; a parte do classificador pequeno é boa para empresa."}
  - {unit: ch14, score: 4, note: "Muita coisa acontecendo, mas a lista de oito perguntas para ler um anúncio é ouro para quem recebe notícia de fim de mundo no WhatsApp."}
  - {unit: interlude2, score: 3, note: "Agradável e bem contado, mas é um respiro que não tem nada a ver com o meu trabalho."}
  - {unit: ch15, score: 3, note: "Os hábitos do fim (cópia em outro lugar, abrir o backup para ver se abre) valem tudo; a saga dos 90 TB e dos 32 processos eu só atravessei."}
  - {unit: ch16, score: 2, note: "Aprendi a 'carta que dá ordens' (injeção de prompt) e as perguntas do fim; o meio é sobre reescrever sistemas gigantes em Rust."}
  - {unit: ch17, score: 4, note: "Finalmente algo do meu celular e dos golpes que eu recebo; deepfake e palavra-código em família ficam; a análise do TikTok é longa."}
  - {unit: ch18, score: 3, note: "Mais próximo do meu medo, mas a história é de programadores; minha profissão ocupa quatro parágrafos e a conclusão para ela é vaga."}
