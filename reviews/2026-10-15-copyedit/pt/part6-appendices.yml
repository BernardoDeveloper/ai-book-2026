- id: '6.1'
  unit: apB
  line: 194
  quote: antes de enviar, olhe o que vai no pacote (no Git, `git status` e `git diff
    --cached` mostram exatamente isso)
  category: error
  severity: high
  problem: 'Os comandos mostram a árvore de trabalho/índice e as mudanças preparadas
    para o próximo commit, não todo o histórico já gravado que o push enviará. Depois
    de um segredo entrar num commit, ambos podem parecer limpos e o envio ainda publicá-lo.
    Conferido no manual primário de git-diff: https://git-scm.com/docs/git-diff, forma
    --cached comparada com HEAD.'
  suggestion: antes de gravar um commit, confira o que está preparado (`git status`
    e `git diff --cached`); antes de enviar, revise também todos os commits locais
    que ainda não foram enviados, inclusive arquivos removidos num commit posterior
