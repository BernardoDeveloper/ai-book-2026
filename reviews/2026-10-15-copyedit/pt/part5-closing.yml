- id: '5.9'
  unit: ch20
  line: 120
  quote: 'Todo LLM foi treinado no que é público: a internet aberta e, no caso de
    código, os repositórios abertos.'
  category: clarity
  severity: medium
  problem: 'R1: a formulação absoluta prepara uma divisão público/privado que sugere
    um corpus restrito ao público, embora a frase seguinte admita desconhecimento
    do treino. O relatório técnico do GPT-4, seção 2, registra dados públicos e dados
    licenciados de terceiros (https://arxiv.org/pdf/2303.08774). O argumento sobre
    não conhecer as regras privadas do cliente não depende de excluir toda outra fonte
    de treino.'
  suggestion: 'Substituir por: Uma parte importante do treino de um LLM vem do que
    é público: a internet aberta e, no caso de código, os repositórios abertos. Manter
    a ressalva seguinte de que ninguém de fora sabe exatamente o que entrou.'
