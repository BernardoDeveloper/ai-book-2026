- id: '5.4'
  unit: ch18
  line: 306
  quote: "[tipagem forte]{.gls key=tipagem-forte}"
  category: consistency
  severity: medium
  problem: 'O mecanismo explicado no glossário e no apêndice é checagem antes da execução,
    isto é, tipagem estática. Forte/fraca é outra distinção; Python também tem tipos
    e checagens. O livro de Rust explicita static typing como tipos conhecidos na
    compilação, e a especificação oficial de Python distingue estática/dinâmica: https://doc.rust-lang.org/book/ch03-02-data-types.html;
    https://typing.python.org/en/latest/spec/concepts.html.'
  suggestion: Usar [tipagem estática]{.gls key=tipagem-forte}, preservando a chave
    estável, e na linha 317 trocar em linguagem tipada ou dinâmica por em linguagem
    de tipagem estática ou dinâmica. Coordenar o rótulo e a definição do glossário
    e aptecnico com os respectivos responsáveis.
- id: '5.5'
  unit: ch20
  line: 200
  quote: Fora desse território não tem de onde tirar o sinal.
  category: error
  severity: medium
  problem: 'R5: o parágrafo anterior inclui RLHF, cujo sinal vem de avaliações humanas,
    não necessariamente de placar/prova/teste objetivo. A fonte já cadastrada como
    ouyang2022training descreve exemplos e rankings produzidos por avaliadores humanos
    (https://arxiv.org/abs/2203.02155). A afirmação de ausência de sinal fora de resultados
    verificáveis contradiz o próprio exemplo e a explicação de ch04.'
  suggestion: 'Na linha 195, introduzir o aprendizado por reforço como uma forma de
    fazer isso, não como sinônimo de toda IA treinando IA. Na linha 197, substituir
    o final por: Nos exemplos de autojogo e raciocínio verificável, a recompensa é
    fácil de conferir: jogo tem placar, matemática tem prova, código tem teste. Na
    linha 200, usar: Fora desse território, é mais difícil obter um sinal automático
    confiável; no RLHF, ele vem de avaliações humanas. Preservar a explicação seguinte
    sobre treino no laboratório e pesos congelados.'
