- id: '2.13'
  unit: ch09
  line: 215
  quote: And there are things it simply doesn't propose. Retrying when an outside
    service fails
  category: consistency
  severity: medium
  problem: 'R5, shared PT contradiction: ch07:181 says automatic retries are exactly
    what the agent would do if left to decide, while this paragraph says it does not
    propose them. Narrow the statement to safeguards the narrator had to request.'
  suggestion: 'Start with: And there were safeguards I had to ask for. Retrying when
    an outside service fails, giving up after a timeout, degrading gracefully when
    something goes down: the agent implements all of that nicely when you ask. End
