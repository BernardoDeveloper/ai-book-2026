- id: '2.11'
  unit: ch06
  line: 147
  quote: every feature comes with the test that proves it works
  category: clarity
  severity: medium
  problem: 'Shared PT definition issue: this omits writing and running the failing
    test before the implementation, the defining test-first order. The list at line
    78 similarly says together after labeling the practice tests first. Primary explanation:
    https://agilealliance.org/glossary/tdd/.'
  suggestion: 'For the TDD definition use: a failing test comes first, followed by
    the code that makes it pass. For the list item use: **tests first**: a failing
    test comes first, followed by the code that makes it pass. Preserve the following
    explanation of regression tests for bug fixes.'
