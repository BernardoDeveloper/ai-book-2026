  line: 291
  quote: the pair just stopped being human
  category: clarity
  severity: medium
  problem: PT par refers to one partner; English pair refers to the two-person combination.
    The narrator remains human, so this literal translation changes the claim. Other
    singular uses in this chapter have the same ambiguity.
  suggestion: 'Use: only the partner is no longer human. Also use Partner in the A
