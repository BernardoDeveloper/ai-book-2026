- id: '2.4'
  unit: ch07
  line: 68
  quote: It only shows up in production, when two requests arrive together.
  category: error
  severity: medium
  problem: 'R1, shared PT error: concurrency is the condition, not production deployment.
    MITRE CWE-362 explicitly describes detecting race conditions through concurrent
    stress tests with multiple threads/processes: https://cwe.mitre.org/data/definitions/362.html.'
  suggestion: 'Replace the paragraph with: That bug can slip past you when you test
    alone, with a single browser. It shows up when two requests arrive together.'
