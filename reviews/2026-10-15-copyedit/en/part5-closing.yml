  line: 121
  quote: 'Every LLM was trained on what''s public: the open internet and, in the case
    of code, the open repositories.'
  category: clarity
  severity: medium
  problem: 'R1, shared PT scope issue: the absolute public/private setup suggests
    a public-only corpus, despite the next paragraph acknowledging uncertainty. GPT-4’s
    technical report, section 2, also records licensed third-party data (https://arxiv.org/pdf/2303.08774).
