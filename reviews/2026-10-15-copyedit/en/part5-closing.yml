  quote: The programming bubble popped before there were LLMs that could program.
  category: error
  severity: medium
  problem: 'Shared PT chronology error: the authors published their Codex code-writing
    LLM paper on July 7, 2021, before the 2022 layoffs (https://arxiv.org/abs/2107.03374).
    The narrative can distinguish the layoffs from the ChatGPT launch without denying
    earlier coding models.'
  suggestion: The programming bubble was already bursting when ChatGPT launched.
- id: '5.2'
  unit: ch18
  line: 114
  quote: To call yourself a "software engineer," you need no council at all
  category: error
  severity: medium
  problem: 'Shared PT categorical legal claim: current Confea Resolution 1.156/2025,
    article 7, expressly covers software engineers (https://normativos.confea.org.br/Ementas/Visualizar?id=82360).
    General software development and the regulated engineering title cannot simply
    be equated. The superseded 2018 resolution is not the current authority.'
  suggestion: 'Replace the paragraph with: There is a detail few people notice. Writing
    "software engineer" on LinkedIn proves neither training, experience nor the ability
    to deliver.'
- id: '5.3'
  unit: ch18
  line: 209
  quote: if you copy GCC, you arrive at another GCC
  category: error
  severity: medium
  problem: 'R5, shared PT issue: the cited primary report describes a clean-room compiler
    implementation with no internet access; GCC served as the known-good compiler
    oracle. Consulting a reference implementation through outputs is not copying its
    source. See https://www.anthropic.com/engineering/building-c-compiler.'
  suggestion: having GCC as an oracle gives you a ready-made reference for checking
    the result
- id: '5.4'
  unit: ch18
  line: 308
  quote: "[strongly typed]{.gls key=tipagem-forte}"
  category: consistency
  severity: medium
  problem: 'Shared PT terminology issue: the glossary/compiler mechanism is static
    typing, not the separate strong/weak distinction. Rust explicitly defines static
    typing as compile-time type knowledge; Python defines its runtime system as dynamic
    typing: https://doc.rust-lang.org/book/ch03-02-data-types.html; https://typing.python.org/en/latest/spec/concepts.html.'
  suggestion: Use [statically typed]{.gls key=tipagem-forte}, preserving the stable
    glossary key, and at line 319 use in statically or dynamically typed languages
    instead of in typed or dynamic languages. Coordinate glossary/appendix labels
    with their owners.
- id: '5.5'
  unit: ch20
  line: 201
  quote: Outside that territory there's nowhere to get the signal from.
  category: error
  severity: medium
  problem: 'R5, shared PT error: RLHF, cited in the preceding paragraph, gets its
    signal from human evaluations rather than necessarily from objective game/proof/test
    outcomes. The paper already registered as ouyang2022training explicitly describes
    human demonstrations and rankings: https://arxiv.org/abs/2203.02155.'
  suggestion: 'Introduce reinforcement learning as one way for AI to train AI rather
    than their synonym. End the preceding paragraph with: In the self-play and verifiable-reasoning
    examples, the reward is easy to check: games have a scoreboard, math has proofs,
    code has tests. Start this paragraph: Outside that territory, getting a reliable
    automatic signal is harder; in RLHF, it comes from human evaluations. Preserve
    the subsequent frozen-weights explanation.'
- id: '5.6'
  unit: ch20
  line: 159
  quote: With one, the machine iterates until it gets it right. Without one, it spins
    indefinitely.
  category: consistency
  severity: medium
  problem: 'R2/R5, shared PT continuity problem: the game converter was just described
