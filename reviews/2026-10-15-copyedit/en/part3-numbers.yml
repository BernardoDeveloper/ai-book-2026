  quote: My model cost about R$ 80
  category: consistency
  severity: medium
  problem: 'R7: line 133 calls this an unmetered upper estimate for GPU electricity,
    while the ending presents it as the total measured cost of the model. Tracked
    reference nvidia2025rtx5090 explicitly scopes it to 575 W x 137 h = 78.775 kWh;
