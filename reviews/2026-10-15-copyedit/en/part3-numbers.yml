  quote: That rules out a live detour on those routes
  category: error
  severity: high
  problem: 'R1/R17: one identity answer per provider cannot exclude concealed or request-dependent
    relaying. The same chapter correctly acknowledges identity concealment and the
    limits of a negative test at line 224. ''Decisive test'' (208), guaranteed consistency
    (199), and ''rule out hypotheses'' (233) repeat the overstatement.'
