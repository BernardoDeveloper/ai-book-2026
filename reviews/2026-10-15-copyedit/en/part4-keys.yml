- id: '4.12'
  unit: ch15
  line: 288
  quote: has a name on a payroll
  category: consistency
  severity: low
  problem: PT says the person pressing the production button has a CPF, emphasizing
    a real, accountable individual. A payroll adds an employment/salary condition
    absent from PT and drops the Brazilian identifier, contrary to the translation
    contract.
  suggestion: Use 'has a CPF, a Brazilian taxpayer ID'. This retains the narrator's
