---
- id: '4.1'
  unit: ch16
  line: 201
  quote: which kept only the main repository and 96 copies listed one by one
  category: clarity
  severity: medium
  problem: 'The object of ''kept'' is ambiguous, and the canonical PT sentence actually
    reverses the retraction. The cited primary notice withdrew the takedown for all
    OTHER repositories, leaving the main repository and 96 individually listed forks
    covered. It asked GitHub to restore the others: https://github.com/github/dmca/blob/master/2026/04/2026-04-01-anthropic-retraction.md.'
  suggestion: After the verified PT correction, use 'which left the notice in force
    only against the main repository and 96 individually listed forks, and asked for
    all the others to be restored'. Keep the citation.
- id: '4.2'
  unit: ch16
  line: 316
  quote: too fast for a serious review
  category: consistency
  severity: high
  problem: 'R1/R20: line 37 says 42 people could review fifty small changes a day
    and explicitly calls inadequate review a suspicion, not proof. The conclusion
    upgrades the same rate to a demonstrated impossibility of serious review.'
  suggestion: Follow PT with 'One took in about fifty changes a day, a pace that made
    me doubt the review process, and an audit done by an AI...' Preserve the caveat
    that the findings were not checked item by item.
- id: '4.3'
  unit: ch17
  line: 106
  quote: a keylogger, a program that injects taps on the screen as if it were you
  category: error
  severity: medium
  problem: 'The apposition wrongly defines keylogging as input injection. The cited
    native-library report lists keystroke logging and input injection as separate
    searched-for capabilities, neither identified in that scan: https://github.com/akitaonrails/tiktok_analysis/blob/main/docs/13-native-library-analysis.md.'
  suggestion: Use 'a keylogger or a program that injects taps on the screen as if
    it were you'. Mirror PT.
- id: '4.4'
  unit: ch15
  line: 273
  quote: An agent would have to be very dedicated to punch through both
  category: consistency
  severity: medium
  problem: 'R5: both layers here are the snapshot and the external backup, yet the
    sentence implies a further last-night copy survives both. Last night''s NAS copy
    is the same backup just described. Saying its device is unreachable also conflicts
    with this chapter''s admin agents having direct access to both NASes at lines
    56 and 101.'
  suggestion: Keep the first three sentences and replace the last with 'For that to
    work, the backup needs to stay out of reach of the agent working on the original.'
    Do not invent a third copy or a restriction absent from the narrator's setup.
- id: '4.5'
  unit: ch15
  line: 178
  quote: only the current project's folder is real and persistent
  category: consistency
  severity: medium
  problem: The later credential-sharing paragraph says other host-backed files are
    deliberately exposed by default. The primary ai-jail README also lists persistent
    agent state and toolchain caches. The word 'only' overstates isolation and contradicts
    the chapter's own qualification. The matching apB wording needs the same scoped
    correction.
  suggestion: Follow PT with 'the current project's folder stays real and persistent'.
    Preserve the subsequent credential trade-off and accident-guard explanation.
- id: '4.6'
  unit: ch17
  line: 135
  quote: and it doesn't go to third parties
  category: consistency
  severity: medium
  problem: 'R1/R5: the chapter explicitly did no dynamic analysis and cannot inspect
    server-side logic. Its static-reading scope cannot guarantee that the uploaded
    selfie never reaches a third party; it can only say such forwarding was not identified
    in this reading.'
  suggestion: Follow PT with 'with no forwarding to third parties identified in this
    reading'. Keep the following open CPF/crash-report question.
- id: '4.7'
  unit: ch17
  line: 111
  quote: Nobody has proven that TikTok is spyware.
  category: consistency
  severity: medium
  problem: 'R1: the claim ranges over every outside investigation, while the evidence
