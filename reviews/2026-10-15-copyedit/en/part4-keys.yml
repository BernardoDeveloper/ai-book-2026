  suggestion: Use 'A "bank" message with "voce" missing its accent and mangled Portuguese
    grammar was a scam.'
- id: '4.18'
  unit: ch17
  line: 289
  quote: the math didn't close
  category: error
  severity: low
  problem: This is a literal translation of 'não fechava a conta'. English does not
    use 'close' this way to say a production cost is uneconomic.
  suggestion: Use 'the economics didn't work'.
- id: '4.19'
  unit: ch15
  line: 96
  quote: what it would cost in the US
  category: consistency
  severity: low
  problem: 'Semantic parity: PT says ''o preço de lá'', in the context of an imported
    NAS, but never specifies the United States. EN adds that particular country. The
    private blog checkout is unavailable and the public source page did not return
    usable text in this check, so this added detail could not be independently confirmed.
    The comparison can be retained without it.'
  suggestion: Use 'the price abroad'. This preserves the imported-versus-local price
    comparison without adding an unverified country.
