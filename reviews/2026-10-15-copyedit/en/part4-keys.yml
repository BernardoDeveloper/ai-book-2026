- id: '4.13'
  unit: ch16
  line: 224
  quote: Whoever maintains decides.
  category: error
  severity: low
  problem: In this sense, English 'maintain' needs the project as its object. The
    Portuguese permits this ellipsis more naturally.
  suggestion: Use 'Whoever maintains it decides.'
- id: '4.14'
  unit: ch16
  line: 253
  quote: The ai-memory (the memory system for agents from @sec-ch20)
  category: error
  severity: low
  problem: The standalone product name does not take this definite article in English.
    The construction is a literal carryover of Portuguese 'O ai-memory'.
  suggestion: Use 'The ai-memory project (the memory system for agents from @sec-ch20)'
    or simply 'ai-memory (the memory system for agents from @sec-ch20)'. Retain the
    measured June figures.
- id: '4.15'
  unit: ch17
  line: 209
  quote: you've been nominated as a reference in your sector
  category: error
  severity: low
  problem: Portuguese 'referência no seu setor' means an authority or leading figure
    in the field. English 'a reference' instead suggests a citation or a person providing
    a recommendation. The mistranslation makes an example meant to sound like polished
    flattery sound unnatural.
  suggestion: Use 'you've been recognized as a leader in your field'.
- id: '4.16'
  unit: ch17
  line: 98
  quote: further on applies to the whole list
  category: error
  severity: low
  problem: The preceding comma begins a parenthetical 'further on' but no closing
    comma follows it. The resulting relative clause is awkwardly punctuated.
  suggestion: Use 'The limit I explain later in "What the Blueprint Doesn't Show"
    applies to the whole list:'. Preserve the remainder of the sentence.
- id: '4.17'
  unit: ch17
  line: 226
  quote: A "bank" message full of typos and broken grammar was a scam.
  category: consistency
  severity: low
  problem: 'Semantic parity: PT ch17:225 supplies the concrete example of ''voce''
