  quote: keep the last copy of each of the last seven days, of each of the last four
    weeks, of each of the last six months and of the last year
  category: error
  severity: low
  problem: 'The restic command counts days/weeks/months/years that contain snapshots,
    not a strict window measured back from today. With missed backups those retained
    periods can be older. Primary restic documentation explicitly distinguishes --keep-daily
    from --keep-within-daily: https://restic.readthedocs.io/en/stable/060_forget.html.'
  suggestion: keep the last copy from each of the seven most recent days with backups,
    the four most recent weeks with backups, the six most recent months with backups
    and the most recent year with backups
