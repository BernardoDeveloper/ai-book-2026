---
- id: '6.1'
  unit: apB
  line: 195
  quote: before pushing, look at exactly what is about to be sent (in Git, `git status`
    and `git diff --cached` show exactly that)
  category: error
  severity: high
  problem: 'These commands inspect the working tree/index and changes staged for the
    next commit, not all committed history about to be pushed. After the agent commits
    a secret, both can be clean while push publishes it. Verified in primary git-diff
    documentation: https://git-scm.com/docs/git-diff (the --cached form compares staged
    changes with HEAD). This directly undercuts the stated secret-review safeguard.'
  suggestion: before committing, inspect what is staged (`git status` and `git diff
    --cached`); before pushing, also review every local commit that has not been sent
    yet, including files removed by a later commit
