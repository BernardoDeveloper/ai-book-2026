- id: '1.5'
  unit: ch03
  line: 282
  quote: It puts three different models to work checking the claims in each story.
  category: consistency
  severity: medium
  problem: 'Semantic parity: PT ch03:281 continues this sentence with ''e uma fonte
    primária vale mais que dez jornais repetindo a mesma coisa''. EN omits the primary-source
