- id: '1.3'
  unit: ch02
  line: 63
  quote: something like *The Great Gatsby* twice over
  category: error
  severity: medium
  problem: 'R7 and semantic parity: PT uses The Old Man and the Sea with room to spare.
    EN substitutes two copies of Gatsby, which conflicts with the preceding estimate
    of 100,000 tokens ≈75,000 words. The Gutenberg text, excluding its boilerplate,
    has about 48,000 whitespace-delimited words; twice that is about 96,000 words
    (https://www.gutenberg.org/ebooks/64317).'
  suggestion: 'Restore the canonical example: ''100,000 tokens is an entire short
    novel, something like *The Old Man and the Sea* with room to spare.'''
