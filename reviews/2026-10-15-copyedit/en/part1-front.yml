- id: '1.10'
  unit: ch04
  line: 110
  quote: with no opinion in the question, sycophancy has no one to please
  category: consistency
  severity: medium
  problem: 'R5: the opening example shows that asking for problems can steer an answer
    without stating an opinion. This section''s ''list the fallacies'' and ''say what
    context is missing'' carry the same expectation. Line 71 also notes that a prompt
    without an opinion can still pull toward the agreeable middle.'
