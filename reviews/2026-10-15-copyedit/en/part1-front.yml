- id: '1.6'
  unit: ch04
  line: 78
  quote: 'LLMs hallucinate: they fabricate plausible citations and data'
  category: consistency
  severity: medium
  problem: 'Semantic parity: PT ch04:77 has an additional causal qualification: ''Quando
    não têm evidência suficiente pra sustentar a resposta que acham que você quer''.
    EN compresses it away, removing the explicit connection between insufficient evidence,
    the desired answer and fabrication.'
  suggestion: Use 'LLMs hallucinate. When they don't have enough evidence to support
    the answer they think you want, they fabricate plausible citations and data and
    attribute to people statements they never made.'
- id: '1.7'
  unit: ch01
  line: 209
  quote: blogs and social networks were born
  category: error
  severity: medium
  problem: The sentence places the birth of blogs in 2002–2008, mirroring the PT chronology
    error. The official Blogger history dates that platform's launch to 23 August
    1999 (https://blogger.googleblog.com/2006/08/happy-birthday-blogger.html), so
    blogs demonstrably predate the stated window.
  suggestion: After the PT correction, use 'blogs and social networks grew popular'.
- id: '1.8'
  unit: ch03
  line: 53
  quote: When you chat with a chatbot on a website, the most it does is write.
  category: consistency
  severity: medium
  problem: 'R1: this confuses a chat interface with absence of tools. OpenAI''s 31
    October 2024 primary announcement documents web search in ChatGPT itself (https://openai.com/index/introducing-chatgpt-search/),
    predating the book''s snapshot. The relevant comparison is with an unassisted,
    tool-free model.'
  suggestion: Use 'In a chatbot without tools, the most the model does is write.'
    Match the scope at line 71 ('the chat without tools') and line 276 ('a chat box
    without search or other tools') after PT is settled.
