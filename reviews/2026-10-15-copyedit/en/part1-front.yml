- id: '1.16'
  unit: ch02
  line: 61
  quote: and often less in other languages
  category: consistency
  severity: low
  problem: 'Semantic parity: PT says the ratio is similar in Portuguese, while EN
    makes a different claim about other languages. OpenAI''s primary guide describes
    the three-quarters rule specifically as an English estimate and says the relationship
    varies by language and encoding (https://help.openai.com/en/articles/4936856-understanding-and-counting-tokens).'
  suggestion: Agree on the neutral PT correction, then use 'in English; the ratio
    varies with the language and the model'.
