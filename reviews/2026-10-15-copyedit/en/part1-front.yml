- id: '1.1'
  unit: ch03
  line: 46
  quote: That's 15 to 20 points, gained without touching the model.
  category: consistency
  severity: high
  problem: 'R1: line 39 identifies the 69-point baseline as mixed DeepSeek/Opus authorship
    and impossible to measure. Subtracting it from 84/89 does not establish a 15–20-point
    improvement by unchanged DeepSeek. This mirrors the PT continuity error.'
  suggestion: 'After the PT correction, use: ''The model didn''t change. What changed
    was the program around it.'' Keep the valid 84/89 results in the preceding paragraph.'
