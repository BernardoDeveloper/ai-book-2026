  - id: 2022/10/25/akitando-130-rant-projetos-testes-e-estimativa-rated-r
    title: "[Akitando] #130 - Rant: Projetos, TESTES e Estimativa??? | Rated-R"
    one_line: "Errar cedo com provas de conceito de prazo fixo, teste em todo pull request, CI e deploy tedioso; estimativa é ordem de grandeza e não previsão; produtividade sustentável vem de disciplina, não de contratar mais."
    bio_facts:
      - claim: "O blog dele foi feito em Rails em 2012 (talvez Rails 3 ou 4), atualizado até Rails 6 / Ruby 3, com RSpec; atualiza uma vez por ano em ~30 minutos há 10 anos."
        quote: "Eu mesmo que fiz em 2012. Não lembro se foi em Rails versão 3 ou 4."
        check: "DATED: the blog now runs on Hugo (akitaonrails-hugo). Cite as 'o blog que eu mantive em Rails por mais de 10 anos' and cross-check with interlude1 (Vinte anos de blog)."
      - claim: "Já teve cliente cujo CTO exigia descrever classes e métodos antes de escrever qualquer código."
        quote: "Eu tive um cliente que o imbecil do CTO mandava todo programador descrever em detalhes como ia programar, antes de escrever uma linha de códigos."
        check: "author memory. Do not name the client."
      - claim: "Usa e recomenda Heroku (review apps, rollback) e CI com Brakeman nos projetos internos da empresa."
        quote: "Esse é outro motivo de porque eu sempre recomendo Heroku."
        check: "2022 stack; may be dated (Heroku free tier ended Nov 2022). Do not present as current."
      - claim: "A turma já fazia testes automatizados antes do TDD ter nome: scripts à parte para trechos sensíveis; os agilistas deram nome aos bois."
        quote: "A gente fazia alguns scripts separados do código pra rodar partes que eram mais sensíveis se quebrasse"
        check: "author memory, frame as such."
      - claim: "Mostrou ao vivo as suítes de testes de Firefox, React, Tailwind, Django, Laravel, VS Code, Tokio e Spring Boot."
        quote: "eu baixei o código fonte da biblioteca Tokio, que é o framework pra desenvolvimento assíncrono em aplicativos feitos em Rust."
        check: "Test counts (React >7k, Tailwind ~900, Django >16k, Laravel ~8k) are Oct 2022 and DATED."
    world_facts:
      - claim: "TDD nasceu com Kent Beck e o primeiro jUnit, em Java."
        quote: "Foi com Kent Beck, que fez o primeiro jUnit, em Java."
        check: "Imprecise: Beck's SUnit (Smalltalk) came first; JUnit (Beck and Erich Gamma, 1997-98) is the Java port. TDD as a named practice is from XP (1999)."
      - claim: "Equipe de 3 que entrega 6 a 9 tarefas/semana sem testes cai a 1 ou 2 e depois dobra a equipe sem recuperar; com testes mantém 4 a 6 constantes."
        quote: "Se lá no começo tivesse decidido entregar tudo com testes, em vez de 6 a 9 tarefas, a equipe estaria entregando só de 4 a 6 coisas, talvez menos."
        check: "Illustrative thought experiment, not data. Do not cite as measurement."
      - claim: "Estimativa é ordem de grandeza; COCOMO e fórmulas são lixo; prever é outra coisa."
        quote: "Estimativas nunca estão erradas, porque não são previsões."
        check: "Author stance. COCOMO (Boehm, 1981) is the model he dismisses."
      - claim: "Anedota: alguém atualizou o Java do 16 ao 18 e subiu direto pra produção numa sexta."
        quote: "Eu vi um tweet alguns dias atrás, de alguém que tava relatando como um idiota da equipe resolveu atualizar a versão do Java"
        check: "Unverifiable tweet; do not cite as an event."
    positions:
      - stance: "Errar cedo e consertar rápido vale mais que horas de consenso; incerteza se resolve com teste, não com planejamento infinito."
        quote: "Errar antes e consertar rápido é infinitamente melhor do que horas e horas de discussão tentando chegar em consenso e bikeshedding."
      - stance: "Prova de conceito de 2 dias a 2 semanas, prazo fixo, para descartar o que não vai dar certo; é seguro, não desperdício."
        quote: "Não é jogar tempo fora, é pagar um pouco pra não jogar muito mais fora."
      - stance: "Teste é seguro; sem ele a produtividade cai até a equipe só apagar incêndio, e contratar mais gente não resolve."
        quote: "Ter testes não é burocracia, não é perda de tempo. É um seguro."
      - stance: "Compilar não é funcionar; nem o Rust dispensa testes."
        quote: "Só porque compila não significa que bugs não foram introduzidos."
      - stance: "O importante é não estragar o que já funcionava; deploy deve ser dia normal e tedioso."
        quote: "O importante não é andar rápido, o importante é não estragar o que já funcionava."
      - stance: "Bug corrigido começa com teste que falha; o mesmo bug não volta."
        quote: "Toda correção de bugs, deveria começar com um teste que simula o bug, pra que já comece falhando, e você sabe que corrigiu quando esse teste passa."
      - stance: "Quem é contra teste e se diz sênior não deveria; quem diz que 'não sabe' ataca o que não pratica."
        quote: "Todo mundo que se sente incapaz de fazer alguma coisa, tenta denegrir esse alguma coisa."
      - stance: "Medo de deploy na sexta só existe em equipe sem o básico."
        quote: "Medo de deploy na sexta-feira só existe em equipes disfuncionais que não fazem esse básico que acabei de falar."
    book_hooks:
      - unit: ch19
        where: "'As travas que tornam a velocidade segura' (testes, CI, staging, rollback) e 'A premissa mudou' (deploy na sexta)"
        touch: "Essa lista de travas não é invenção do ano dos agentes. Eu a defendi no Akitando #130, em outubro de 2022: teste em todo pull request, CI, review app, rollback com um clique, e a frase 'medo de deploy na sexta-feira só existe em equipes disfuncionais que não fazem o básico'. A IA só tornou o conserto mais barato; a rede de segurança é a mesma."
        strength: high
      - unit: ch06
        where: "'A rede de segurança' / 'Rodou sem erro, saiu errado' (testes que o agente escreve, mocks que mentem)"
        touch: "Já no Akitando #130 eu batia que 'só porque compila não significa que bugs não foram introduzidos'. O código do agente que compila e passa no próprio teste é a mesma ilusão, com sotaque novo; o bug corrigido tem que virar teste que falha antes (e que não seja o agente a decidir sozinho que passou)."
        strength: high
      - unit: ch16
        where: "'Um milhão de linhas a cinquenta por dia' / 'Quem revisa o que chega' (volume sem teste)"
        touch: "Eu desenhei a espiral no Akitando #130: sem teste, a equipe entrega muito, os bugs consomem a semana, contrata-se mais gente, o volume dobra e a produtividade cai de novo. Troque 'mais gente' por 'mais agentes' e a conta é a mesma."
        strength: high
      - unit: ch05
        where: "'Duzentas horas em trinta' (a estimativa de 200 horas) e 'O que sobra pra gente'"
        touch: "As 200 horas são estimativa no sentido que eu defendia em 2022, no Akitando #130: ordem de grandeza, não previsão. Dá pra saber que um projeto é 'perto de 6 meses e menos de 1 ano'; dizer 5 meses, 2 semanas e 4 dias é futilidade."
        strength: medium
      - unit: ch07
        where: "'A vida depois do deploy' / 'Software nunca está pronto'"
        touch: "Meu blog em Rails sobreviveu mais de dez anos com uma regra: atualizar uma vez por ano rodando a suíte primeiro, 30 minutos. A conta do 'software nunca está pronto' só fecha se o que já funcionava continua funcionando, e quem garante isso é o teste (Akitando #130)."
        strength: medium
      - unit: ch08
        where: "'Meu primeiro fracasso' / prova de conceito descartada"
        touch: "Prova de conceito de prazo fixo para descartar a ideia ruim barato: eu pregava isso em 2022 (Akitando #130). A maratona e o fracasso do capítulo foram isso, com agente: o prazo era de horas e a ideia errada morreu rápido."
        strength: low
    appendix_candidate: "Apêndice B (kit mínimo para usar agentes com segurança): uma caixa curta 'o mínimo que não é novo' com teste por bug, CI, review antes de merge, rollback e prova de conceito de prazo fixo, creditando o Akitando #130."

  - id: 2023/08/11/akitando-144-modelagem-de-software-e-dificil-ver-vs-enxergar
    title: "[Akitando] #144 - Modelagem de Software é Difícil? | \"Ver\" vs \"Enxergar\""
    one_line: "Modelar e arquitetar não tem receita: depende de conhecer o domínio e ter quilometragem; os livros (DDD, Patterns) são vocabulário e só rendem depois de anos de prática; ninguém sabe tudo, nem o Magento de 2 milhões de linhas."
    bio_facts:
      - claim: "Trabalhou ao longo de 30 anos em projetos de telecomunicações, varejo, manufatura, RH, infraestrutura, agências, grandes corporações e startups."
        quote: "Telecomunicações, varejo, manufatura, RH, infraestrutura, agências, grandes corporações, startups."
        check: "author memory (the sentence before: 'eu trabalhei em projetos de software de vários tipos de negócios diferentes')."
      - claim: "Nunca leu o código do Spree nem do Magento, embora tenha trabalhado em projetos com eles; não é preciso ler tudo."
        quote: "eu, Fabio Akita, nunca li o código do Spree, muito menos do Magento."
        check: "author statement."
      - claim: "Teve vários mentores que nem sabiam: aprendeu marketing, contabilidade e vendas trabalhando ao lado de quem era treinado nelas."
        quote: "Eu tive vários mentores que nem sabiam que estavam me mentorando."
        check: "author memory."
      - claim: "Em Asterisk (VoIP) é júnior; sênior numa coisa não é sênior em tudo."
        quote: "Em Asterisk eu não sou mais que um junior."
        check: "author statement; short and quotable for 'sênior volta a ser júnior'."
      - claim: "Conheceu o autor do Spree (Sean Schofield), entrevistou Luke Kanies (Puppet) em 2009, fez workshop de Francesco Cesarini (Erlang) em 2009 e trouxe Ilya Grigorik à RailsConf Brasil 2009."
        quote: "Eu entrevistei ele pro meu blog em 2009, vou deixar o link nas descrições."
        check: "Links in the post: akitaonrails.com/2009/11/18/conversando-com-luke-kanies and 2009/05/08 RailsConf 09 audio interviews. Good for the 'lived history' of the narrator, not for AI chapters."
      - claim: "Em 2023 já explicava embeddings de álgebra linear para recomendação (episódio do código do Twitter), LLVM para tensors de IA, e filas/sala de espera (Ingresso.com)."
        quote: "No episódio do Twitter explico como embeddings de álgebra linear ajudam a resolver o problema de relevância e recomendação de tweets."
        check: "Twitter open-sourced its recommendation algorithm 31 Mar 2023; episode precedes this one (Aug 2023)."
    world_facts:
      - claim: "Escala de e-commerce: livro de Rails ~2.700 linhas de Ruby; Spree ~92 mil; Magento 2 ~2 milhões de linhas de PHP (> 700 vezes o livro)."
        quote: "O Magento sozinho, só no javascript, tem o dobro de linhas de código do que Ruby no Spree"
        check: "Counts via tokei in Aug 2023: DATED, recount if cited. Arithmetic 2M/2.7k = 740 is right."
