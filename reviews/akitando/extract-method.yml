# Akitando extraction, group "method". Quotes validated verbatim against the posts (whitespace-normalized).
posts:
  - id: 2018/11/01/akitando-23-the-mm-m-o-melhor-livro-de-software
    title: "[Akitando] #23 - The MM-M: O Melhor Livro de Software?"
    one_line: "The Mythical Man-Month (Brooks, 1975/1995) já descrevia os problemas, e boa parte das 'novidades' ágeis, de projetos de software; livro bom é o que passa pelo teste do tempo."
    bio_facts:
      - claim: "Leu o livro de Brooks cerca de 15 anos antes de 2018 (~2003) e achou que teria evitado muitos problemas se tivesse lido 10 anos antes, no começo da carreira."
        quote: "Quando eu li esse livro uns 15 anos atrás, eu pensei, cara se eu tivesse lido esse livro uns 10 anos antes, no começo da minha carreira, talvez eu tivesse evitado muitos problemas"
        check: "author memory, frame as such. Cross-check with the Slashdot date below."
      - claim: "Ouviu falar do livro pela primeira vez em 27 de julho de 2002, num post do Slashdot, achado depois nos e-mails antigos."
        quote: "Foi no dia 27 de julho de 2002 (então eu estava certo, 15 anos atrás), e foi no Slashdot.org"
        check: "Link web.archive.org no post (slashdot.org/books/980805/1148235.shtml). Note: 2002 to 2018 is 16 years, and the URL path says 1998. Use 'por volta de 2002', not an exact date, unless the archive page is opened."
      - claim: "Começou a programar no fim dos anos 80; viu Agile, XP, Git e o open source nascerem e achou tudo evolução do que já sabia."
        quote: "pra mim que começou a programar no fim dos anos 80, nada foi realmente surpreendente, só uma evolução do que eu já sabia."
        check: "author memory. Other posts say 'desenvolvia software desde os anos 90' and faculdade in 1995; the book says 1990 at 13 elsewhere (check ch intro before combining)."
      - claim: "Já passava pelos projetos dos anos 90 e diz que dev da época entregava software, não era 'burro' antes do Ágil."
        quote: "Eu digo isso por experiência porque isso assume que programadores dos anos 90 como eu eram todos burros."
        check: "author memory, frame as such."
      - claim: "Trabalha a partir de Brooks mais do que do 'Agile moderno' e tem 'zero interesse' nas discussões de agile."
        quote: "a forma como eu trabalho deriva mais de Brooks do que de Agile moderno."
        check: "author statement of method, 2018."
    world_facts:
      - claim: "Lei de Brooks: adicionar gente a um projeto atrasado atrasa mais; canais de comunicação n(n-1)/2 (10 pessoas = 45, 20 = 190)."
        quote: "adicionar mais gente num projeto atrasado só vai deixá-lo mais atrasado."
        check: "Brooks, The Mythical Man-Month, cap. 2 (1975). Arithmetic is right."
      - claim: "Plan to throw one away / efeito do segundo sistema (caps. 11 e 5)."
        quote: "Ele avisa que o segundo é o mais perigoso sistema que uma pessoa vai desenhar."
        check: "Brooks cap. 5 'The Second-System Effect'; cap. 11 'Plan to Throw One Away'."
      - claim: "Edição de 1995: modelo cascata com duas falácias (passa uma vez; construído de uma vez), construção incremental, nightly builds da Microsoft; 'No Silver Bullet'."
        quote: "a primeira falácia básica do modelo de cascata é que ele assume que o projeto avança pelo processo somente UMA vez"
        check: "Brooks 1995 anniversary edition, cap. 19 'The Mythical Man-Month after 20 Years'. DATED/WRONG details in the post: 'No Silver Bullet' is from 1986 (IEEE Computer), appended in 1995, not 'o primeiro paper'; 'Most Viable Product' should be Minimum Viable Product; Modula (1975) did not come before Pascal (1970); 'quase descreveu TDD' is the author's reading, not Brooks's."
      - claim: "A manutenção introduz novo defeito com chance de 20 a 50% a cada conserto, o que exige rodar a suíte inteira de casos de teste."
        quote: "O problema fundamental com manutenção é que consertar um defeito tem uma chance substancial - 20 a 50%- de introduzir outro defeito."
        check: "Brooks cap. 11, 'Passing the Buck'/maintenance passage; verify wording in the book before quoting Brooks directly."
    positions:
      - stance: "Livro bom é o que passa pelo teste do tempo; evite lista de 'celebridadezinhas' recentes."
        quote: "pra um livro ser considerado realmente bom, ele PRECISA passar pelo teste do TEMPO."
      - stance: "Quem ignora o que se sabia do passado repete os mesmos erros."
        quote: "se toda vez você ignora o que já se sabe do passado, vai simplesmente cometer os mesmos erros e, se tiver sorte, chegar às mesmas conclusões."
      - stance: "Não leia Brooks como doutrina: é uma conversa de um programador experiente com o de hoje, e pouco mudou em 50 anos."
        quote: "Não leia o livro de Brooks como um procedimento ou doutrina a ser seguida."
      - stance: "Prazo é gerência: mude equipe, escopo, arquitetura, mas não a data."
        quote: "Mude, só não mude a data. Isso é gerência, qualquer coisa diferente é ingerência."
      - stance: "Aprender a aprender, não ser doutrinado em ferramentas."
        quote: "Se você se tornar doutrinado, só seguir certas marcas e só usar certas ferramentas, você nunca vai evoluir como programador."
    book_hooks:
      - unit: ch19
        where: "'Isso tem vinte e cinco anos' (travas que tornam a velocidade segura): XP de Kent Beck e lote pequeno"
        touch: "Antes do XP já tinha Brooks. Na edição de 1995 de The Mythical Man-Month ele descreve construir o esqueleto do sistema e ter 'em todo estágio um sistema que roda', e cita os builds noturnos da Microsoft. Eu falei disso no Akitando #23, em 2018: a ideia de integrar toda noite e testar na manhã seguinte é bem mais velha que o meu canal."
        strength: high
      - unit: ch19
        where: "'Jogar código fora': com IA, protótipo e descarte ficaram baratos"
        touch: "Brooks já dizia em 1975, no capítulo 'Plan to Throw One Away', que o primeiro sistema é quase inusável e que você vai jogá-lo fora, queira ou não. O que mudou com os agentes foi o preço: descartar uma versão que custava meses agora custa uma tarde (Akitando #23)."
        strength: high
      - unit: ch16
        where: "'Reescrever um gigante, um pedaço por vez' (OpenClaw em Rust)"
        touch: "Brooks batizou esse perigo há meio século: o efeito do segundo sistema, a tentação de enfiar na reescrita todas as ideias que ficaram de fora da primeira versão (Akitando #23). Ir devagar, uma funcionalidade por vez, com teste, é também o jeito de não cair nele."
        strength: medium
      - unit: ch18
        where: "'Como alguém vira sênior' ou 'Que linguagem aprender': fundamento que não envelhece"
        touch: "Eu disse em 2018 que livro de tecnologia bom é o que passa pelo teste do tempo, e que a área erra nos mesmos lugares desde os anos 60. Em 2026 o que mudou foi a ferramenta; o que Brooks descreveu sobre gente, comunicação e integridade do design continua aí."
        strength: medium
      - unit: ch19
        where: "'Quatro cadeiras na mesma mesa' ou 'Gente treinada pra não decidir': quem responde pelo conjunto do produto"
        touch: "Brooks chamava de integridade conceitual a coisa mais importante num sistema e dizia que alguém precisa responder por ela, um 'ditador benevolente' (Akitando #23). Com agentes gerando código por todos os lados, essa pessoa fica mais necessária, não menos."
        strength: medium
    appendix_candidate: "Linha do tempo de método (Brooks 1975/1995, XP 1999, Manifesto 2001, DORA) como complemento de apA: mostra que commits pequenos, CI e descarte de protótipo são práticas antigas que viram as travas da era dos agentes."

  - id: 2019/06/18/akitando-51-esqueca-metodologias-ageis-rated-r
    title: "[Akitando] #51 - Esqueça Metodologias \"Ágeis\" | [Rated R]"
    one_line: "Ágil é adjetivo e atitude de profissional accountable (dar um passo, avaliar, ajustar), não processo, cerimônia ou consultoria; o que vale está em XP; terceirizar a decisão é medo."
    bio_facts:
      - claim: "Acompanhou o movimento ágil do nascimento à 'decadência', desenvolvendo software desde os anos 90; as práticas ágeis foram bem-vindas pra ele."
        quote: "Eu acompanhei o nascimento, a evolução e a decadência desde quase quando o movimento surgiu."
        check: "author memory."
      - claim: "Tem a própria empresa de desenvolvimento e não 'vende' agilidade; foco em práticas básicas de desenvolvimento."
        quote: "Eu tenho minha própria empresa de desenvolvimento de software, mas eu não “vendo” agilidade."
        check: "company: Codeminer42 (public). Frame as his own account."
      - claim: "Entrevistou Robert Martin (Uncle Bob) em 2010; usou trechos no vídeo."
        quote: "Em 2010 eu tive a oportunidade de trocar idéia com o Bob Martin."
        check: "Description also says 'entrevista que fiz com Robert Martin (em 2010!)'. Look for the interview on akitaonrails.com 2010."
      - claim: "Escreveu em 2014 um artigo no blog chamado 'Ágil está morto', na mesma época do post de Dave Thomas."
        quote: "Ele também escreveu um blog post um ano antes em 2014 na mesma época em que eu escrevi um artigo no meu blog: Ágil está morto"
        check: "Links in the post: 'Agile: a Verdade por trás do Método' (2014/09/28) and '#noEstimates Debunked' (2013/10/07) on akitaonrails.com. Dave Thomas 'Agile is Dead' is 2014-03-04; the GOTO talk is 2015."
      - claim: "Recusa projetos mal definidos que dariam mais dor de cabeça do que valem."
        quote: "Eu tô cansado de recusar projetos porque eu acho que tá tão mal definido que vai me dar mais dor de cabeça do que vale a pena."
        check: "author memory."
    world_facts:
      - claim: "Manifesto de 2001 por 17 signatários em Snowbird, Utah; é 'Manifesto do Desenvolvimento Ágil de Software', não 'Manifesto Ágil'; ágil é adjetivo."
        quote: "Ágil não é um nome, é um adjetivo."
        check: "agilemanifesto.org/history; Dave Thomas, GOTO 2015. Post has typos: 'Ken Schwabber', 'Jeff Sutterland', and 'Indivíduos e Iterações' (should be Interações)."
      - claim: "Scrum vem dos anos 80 e o guia não menciona 'ágil'."
        quote: "Scrum na verdade foi inventado nos anos 80, o guia sequer menciona o termo “ágil”."
        check: "Imprecise: the term comes from Takeuchi and Nonaka (HBR 1986); Schwaber/Sutherland formalized Scrum in 1995; the Scrum Guide dates from 2010. Say 'o termo vem de um artigo de 1986'."
      - claim: "Agilidade é o ciclo PDCA de Deming / DMAIC do Six Sigma: passo, avaliar, ajustar."
        quote: "agilidade é simplesmente andar um passo de cada vez, avaliar o resultado a cada passo, ajustar o caminho se o resultado não estiver de acordo com o esperado e repetir."
        check: "Deming PDCA; DMAIC is Six Sigma. Definition is the author's, attributed to Dave Thomas."
      - claim: "Práticas de XP: TDD, small releases, CI, simple design, collective code ownership."
        quote: "Test Driven Development, Small Releases, Continuous Integration, Simple Design, Collective Code Ownership"
        check: "Kent Beck, Extreme Programming Explained (1999)."
    positions:
      - stance: "Terceirizar a decisão a coach, mentor ou consultoria é medo e insegurança; ninguém pode dizer que errou se fez o que todo mundo manda."
        quote: "Um medroso ou medíocre sempre vai terceirizar a decisão pra algum expert ou coach ou mentor ou consultoria"
      - stance: "O que importa é entregar valor, não bater número num gráfico arbitrário."
        quote: "O objetivo não é atingir determinado número em algum gráfico arbitrário: é entregar valor."
      - stance: "Decidir com informação incompleta; a pior opção é não decidir."
        quote: "Não tem como saber com 100% de certeza qual decisão é a melhor. Mas a pior coisa é não tomar nenhuma."
      - stance: "Software não é fábrica: dois programadores, mesma especificação, resultados de ordens de grandeza diferentes."
        quote: "software se chama soft porque não é hard."
      - stance: "Metodologia é muleta; sem ela sobra o trabalho, que se mede por mérito. Accountability é o centro."
        quote: "Todo mundo que não quer trabalhar ou que vai seguir a lei do menor esforço, sempre vai se esconder atrás de todos os procedimentos que você der."
      - stance: "Números que parecem evidência não são prova; 'no Google funciona' sem condições não diz nada."
        quote: "ter algo que parecem ser evidências não é nem de longe perto de ter provas."
    book_hooks:
      - unit: ch19
        where: "'Gente treinada pra não decidir' (intro cita 'vídeos de 2019 sobre não terceirizar decisões e o que as metodologias ágeis viraram')"
        touch: "O episódio a que me refiro é o #51 do Akitando, 'Esqueça Metodologias Ágeis', de junho de 2019. Lá eu dizia que quem terceiriza a decisão pra consultoria faz isso por medo de estar errado, e que sem a muleta do procedimento 'sobra o trabalho em si'. A IA tira a muleta; é por isso que o problema aparece agora."
        strength: high
      - unit: ch19
        where: "'A cerimônia' (Manifesto Ágil virou burocracia em ciclos menores)"
        touch: "Em 2019 eu já reclamava disso no Akitando #51: ser ágil é andar um passo, avaliar e ajustar, e o resto (sprint, story points, throughput) é jargão vendido a quem não quer decidir. O Manifesto é um adjetivo, como lembrou Dave Thomas, não um produto que se compra por quilo."
        strength: high
      - unit: ch19
        where: "'Isso tem vinte e cinco anos': XP, lote pequeno, integração contínua"
        touch: "Quando eu digo que as práticas que valem são as de XP, testes primeiro, releases pequenos, integração contínua, código compartilhado, não é conversão recente. Foi a mensagem do Akitando #51, em 2019: 'se você é iniciante, as práticas que realmente interessam começam no Extreme Programming e não no Scrum'."
        strength: medium
      - unit: ch05
        where: "'Duzentas horas em trinta' (a estimativa de 200 horas é minha)"
        touch: "Todo cliente sabe que se o programador estima 200 horas, em 200 horas o que foi pedido vai estar pela metade; eu dizia isso no #51 como 'quase uma lei universal'. Por isso as 200 horas do FrankMD aparecem aqui como chute de ordem de grandeza, não como medição."
        strength: low
      - unit: ch11
        where: "Método de medir IA: números que 'provam' qualquer coisa"
        touch: "Já em 2019 eu escrevia que é fácil torturar números pra contar a história que a gente quer ouvir, e que a pergunta é sempre sob quais condições, com que precisão, com que grupo de controle. A mesma régua vale pra benchmark de modelo (Akitando #51)."
        strength: medium
    appendix_candidate: "Frase de 'como ler anúncio' (apC): ecoar 'sob quais condições? quais premissas?' do #51 como pergunta-padrão antes de aceitar 'no Google/na empresa X funciona'."

  - id: 2021/10/11/akitando-106-recomendacao-de-livros-introducao-a-design-emergente
    title: "[Akitando] #106 - Recomendação de Livros - Introdução à Design Emergente"
    one_line: "Lista cronológica de livros (Cormen/Knuth, Dragão, C++, UML/RUP, Refactoring, XP, Clean Code, Pragmatic Programmer, DDD, Lean Startup, Brooks) para defender que design emerge do código em uso e que a ciência da computação envelhece melhor que a engenharia de software."
    bio_facts:
      - claim: "Entrou na faculdade em 1995 e conheceu Design Patterns (1994) por volta de 1998, já programando há alguns anos; reconhecia os padrões de emuladores e jogos."
        quote: "Esse livro foi publicado em 1994, um ano antes de entrar na faculdade. E eu só fui conhecer ele alguns anos depois, lá por 1998."
        check: "GoF Design Patterns: 1994. Matches the book's 'faculdade em 1995'."
      - claim: "Usou Flex/Bison na faculdade, meio dos anos 90, e não lembra mais nem uma fração de compiladores, mas os conceitos o ajudam a avaliar linguagens novas."
        quote: "Se você me perguntar se eu ainda sei essas coisas, não, não lembro nem uma fração mais hoje. Mas os conceitos que guardei me ajudam a avaliar toda vez que uma nova linguagem aparece"
        check: "author memory. Strong candidate for 'fundamento = vocabulário de julgamento'."
      - claim: "Aprendeu o básico de algoritmos com o livro do Wirth, não o Cormen; tem Knuth volumes 1 a 3 e 4A."
        quote: "Eu mesmo não usei ele na faculdade. Eu aprendi o básico com um muito mais simples, este do Niklaus Wirth."
        check: "Wirth, Algorithms + Data Structures (1976/1986 ed.). Post says Cormen 3rd ed. is 2009, correct. The post says Knuth started 'em 1962' (correct) and 4B still unfinished in 2021 (dated: 4B fascicles continue)."
      - claim: "Acumulou os livros ao longo dos primeiros 10 a 15 anos de carreira e muitos nunca leu inteiros."
        quote: "muitos nem li inteiro, e vim acumulando ao longo dos primeiros 10 a 15 anos da minha carreira, durante e depois da faculdade."
        check: "author memory."
      - claim: "Já avaliou pilhas de 500 páginas de especificação e UML, e nunca viu um design assim que desse pra traduzir em software."
        quote: "eu já tive que avaliar calhamaços, literalmente pilhas de quinhentas páginas de especificações e diagramas de UML."
        check: "author memory; no client named."
    world_facts:
      - claim: "Design emergente: design e código eram etapas separadas nos anos 60-80 porque depurar era caro e computador era compartilhado; com PCs potentes e rede, passou a valer código ruim primeiro, refatorar depois."
        quote: "Fazer o design antecipadamente era crucial nas décadas de 60 a 80, mas depois disso a tecnologia avançou o suficiente pra gente conseguir fazer código ruim primeiro e refatorar depois pra ter código bom"
        check: "Author's own interpretation ('Isso é uma interpretação minha'); also Brooks cap. 11 and 1995 edition on incremental builds. Strong parallel to the book's 'a premissa mudou'."
      - claim: "Refatorar (Fowler, 1999) é mudar estrutura interna sem mudar comportamento externo; reescrever é outra coisa."
        quote: "Muita gente falando “refatoração” na verdade está querendo dizer “reescrever”"
        check: "Fowler, Refactoring (1999). Fine."
      - claim: "Manifesto Ágil (2001) é resumo de ~20 anos de prática anterior, não o começo dela."
        quote: "Essa ordem é importante, porque o Manifesto é só um resuminho de 20 anos de experiência de cada um deles que veio antes."
        check: "Author's interpretation; the Manifesto is a 2001 codification of practices from the 80s/90s (XP 1996-99)."
      - claim: "Lean Startup (2011) coincide com o começo da 'atual bolha de tech startups'."
        quote: "Foi exatamente quando começou a atual bolha de tech startups e esse livro apareceu na hora certa pra se tornar meio que a bíblia das novas tech startups."
        check: "Eric Ries, The Lean Startup, 2011. The 'bubble from 2011' dating is the author's call in 2021."
      - claim: "Erlang: 'ER' de Ericsson; Jacobson veio da Ericsson e saiu em 1987 para fundar a Objectory."
        quote: "Se você não sabe, o “ER” de Erlang é de Ericsson."
        check: "Imprecise: Erlang is named for A. K. Erlang and is also read as 'Ericsson Language'. Jacobson left Ericsson in 1987 and founded Objectory: correct. Rational bought Objectory in 1995: correct."
    positions:
      - stance: "O código é o design; o design perfeito no papel é impossível, então começa mínimo, constrói, aprende e refatora."
        quote: "Na realidade o código \"é\" o design e ele nunca vai estar perfeito, muito menos na primeira vez."
      - stance: "Código que roda mas é sujo é lixo; precisa estar limpo pro próximo programador."
        quote: "Código que roda, mas é sujo, com baixa mantenabilidade, é lixo, pode jogar fora."
      - stance: "Livros de ciência da computação envelhecem melhor que os de engenharia de software; os fundamentos seguem válidos."
        quote: "livros de ciência da computação tendem a envelhecer melhor que livros de engenharia de software."
      - stance: "Usar biblioteca sem saber por baixo serve pra 80% dos casos (nível júnior); o sênior precisa da fundação."
        quote: "E isso é ok pra 80% dos casos, por isso que muito iniciante consegue ir até longe em alguns projetos sem nunca ter lido um único livro sobre algoritmos e estruturas de dados."
      - stance: "Vá atrás dos autores originais; evite derivativos que simplificam ou alteram o original."
        quote: "Minha recomendação é sempre ir atrás dos autores originais de um determinado tema"
      - stance: "Livro de padrões é catálogo e vocabulário, não manual de design."
        quote: "Design Patterns é um catálogo, e não um manual de como fazer design."
      - stance: "Livros técnicos se lêem aos poucos ao longo de 10 anos; só depois da experiência vem o 'ahá'."
        quote: "só daí vai vir o \"ahhhh, era isso que o livro queria dizer\", aquele momento \"ahá\"."
    book_hooks:
      - unit: ch19
        where: "'A premissa mudou' (consertar depois ficou rápido e barato; deploy frequente)"
        touch: "Não é a primeira vez que a economia do conserto muda o método. No Akitando #106 eu expliquei que fazer o design inteiro antes do código fazia sentido nos anos 60 a 80, quando depurar era caro e o computador era compartilhado; quando o PC ficou potente, código ruim primeiro e refatorar depois passou a ser possível, e nasceu o design emergente. Com agentes, o custo de consertar caiu de novo, e a premissa muda outra vez."
        strength: high
      - unit: ch19
        where: "'Gente treinada pra não decidir' / spec-driven development (especificação de requisitos inteira antes do agente)"
        touch: "Spec-driven é o RUP de volta. Eu já avaliei pilhas de 500 páginas de especificação e UML e nunca vi uma que desse pra traduzir em software sem buracos (Akitando #106); o código é o design, e ele só aparece de verdade no uso."
        strength: high
      - unit: ch18
        where: "'Que linguagem aprender' ou 'O que sobra quando a digitação some' (fundamento)"
        touch: "No Akitando #106 eu confessei que não lembro mais nem uma fração do livro do Dragão sobre compiladores. O que ficou foi o suficiente pra avaliar qualquer linguagem nova que aparece. É esse tipo de fundamento, vocabulário pra julgar, que o agente não substitui."
        strength: high
      - unit: ch16
        where: "'Reescrever um gigante, um pedaço por vez' ou 'Bug não foi inventado pela IA'"
        touch: "Refatorar e reescrever não são a mesma coisa, e eu já reclamava disso em 2021 (Akitando #106): refatorar muda a estrutura sem mudar o comportamento; reescrever joga fora e não garante melhoria. Pedir ao agente 'reescreva tudo em Rust' em uma frase é pedir a segunda coisa achando que é a primeira."
        strength: medium
      - unit: ch18
        where: "'O esconderijo acabou' (junior que usa framework sem saber o que há por baixo)"
        touch: "Já em 2021 eu dizia que usar lista, cache ou thread de um framework sem saber como é feito funciona em 80% dos casos e é o nível do júnior; o sênior é pago pelos outros 20% (Akitando #106). Com agente, esses 80% ficaram ainda mais fáceis de fingir."
        strength: medium
      - unit: apleituras
        where: "Lista de leituras: Brooks, Beck (XP Explained), Pragmatic Programmer, Fowler"
        touch: "Nota curta: eu recomendo ir aos autores originais (Brooks, Beck, Fowler, Martin, Thomas e Hunt) e ler aos poucos ao longo de uns dez anos, como expliquei no Akitando #106."
        strength: low
    appendix_candidate: "Seção de apleituras 'Livros que envelhecem bem': cinco ou seis títulos de ciência da computação e método e a regra 'leia aos poucos, volte depois da experiência'."

  - id: 2022/06/13/akitando-120-discutindo-gestao
    title: "[Akitando] #120 - Discutindo Gestão"
    one_line: "Gestão é decidir no tempo certo com informação incompleta, priorizar e gerenciar expectativas; confiança entre profissionais experientes, senioridade que forma sucessores, e metodologia/métrica como muletas de burocrata."
    bio_facts:
      - claim: "Cerca de 30 anos gerenciando projetos, de um jeito ou de outro."
        quote: "depois de 30 anos gerenciando projetos de uma forma ou de outra"
        check: "Description of the episode. 1992 start would fit the 'anos 90'. Frame as 'trinta anos de projetos', author memory."
      - claim: "Teve certificado PMP (colocava 'vírgula PMP' no nome, em 2003) e depois rasgou o certificado no vídeo do Guia de Aprendendo a Aprender."
        quote: "eu também colocava “virgula PMP” no meu, mas a vergonha alheia me fez tirar rápido. Também era 2003."
        check: "Other episode: 'Guia de Aprendendo a Aprender' (rasgou o certificado). Confirm the PMP year with that post if the book cites it."
      - claim: "Era 'kamikaze' no começo: pegava brigas que não eram dele e demorou anos para aprender a escolher batalhas."
        quote: "eu mesmo lá no começo era estilo mais kamikaze, ficava pegando briga que não era minha, e perdendo tempo com batalhas inúteis. Demorei anos pra aprender isso."
        check: "author memory, frame as such."
      - claim: "Cerca de dez anos antes (~2012) teve um cliente que pediu um chat 'igual o Facebook Messenger' em um mês; resposta padrão: pague o que o Facebook pagou."
