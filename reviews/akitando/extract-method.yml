        quote: "Daí entra a Adobe em 2018 que adquire a empresa."
        check: "Adobe announced the Magento purchase in May 2018 (US$1.68 billion): correct. eBay: acquired a stake in 2010 and full control in 2011. Magento 2.0 GA: Nov 2015. Author hedges 'pelo pouco que puxei no Google'."
      - claim: "Michelangelo pintou a Capela Sistina de 1508 a 1512 aos 33 anos, tendo estudado desde ~13 com Ghirlandaio."
        quote: "Quatro anos inteiros, de 1508 a 1512, usando tecnologia do século XVI."
        check: "Sistine ceiling: 1508-1512, correct. Born 1475, so 33 in 1508, correct. Apprenticed to Ghirlandaio at 13 (1488): correct."
      - claim: "Regra de negócio como política (overbooking): exemplo de Eric Evans em DDD."
        quote: "Segundo o Eric, essa regra de overbooking é uma política."
        check: "Evans, Domain-Driven Design (2003), intro, 'Cargo/Voyage' example. Correct."
    positions:
      - stance: "Não existe 'o jeito certo' de fazer software, mas o processo não é aleatório; programador existe para decidir o que é melhor na circunstância."
        quote: "O spoiler é que não existe o \"jeito certo\" de se fazer software, mas por outro lado, o processo não é aleatório."
      - stance: "Melhor programador é o que decide no momento em que precisa, nem antes nem depois (ecoa 'Não terceirize suas decisões')."
        quote: "O pior programador é aquele que é incapaz de tomar decisões."
