        quote: "Durante minha carreira de 30 anos de programação eu tive o privilégio de testemunhar boa parte dessa história em primeira mão"
        check: "Trecho final (convite do Código Fonte TV, ao fim do arquivo). Dezembro/2019, 30 anos desde ~1990. Consistente com ep 65."
      - claim: "Visitou por mais de uma década cidades como Xanxerê, Maringá, Rio Branco, Criciúma, Macapá e Campos; viu empresas do interior presas a tecnologias dos anos 90."
