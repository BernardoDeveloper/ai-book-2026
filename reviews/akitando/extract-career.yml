        where: "Código que ninguém leu (revisão do código gerado)"
        touch: "Já em 2019 eu dizia: nenhum código é imune à revisão, de quem for. Quem escreveu não faz merge. A regra é a mesma para o código do agente (Akitando #64)."
        strength: high
      - unit: ch15
        where: "Um estagiário com acesso root (a metáfora de júnior e supervisão)"
        touch: "A analogia não é nova: no canal eu já explicava que as empresas de 99% do mercado não têm tempo de supervisionar o júnior, por isso a qualidade média do código é baixa (Akitando #64). O agente é o júnior que não aprende com o erro de ontem; o ônus de revisar continua humano."
