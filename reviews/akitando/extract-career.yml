        check: "Autor memória; útil para o paralelo com código gerado por IA."
      - claim: "Parou de usar Clipper em 1994."
        quote: "Clipper, que eu parei de usar em 1994."
        check: "Autor memória; combina com ep 37 (1995 faculdade)."
      - claim: "Contratou centenas de pessoas e avaliou centenas de currículos ao longo de 20 anos (ep 72), e sente falta de sênior que critique o código do júnior."
        quote: "se alguém que se diz senior, olhar pro seu código de junior, e não tiver nada a dizer, provavelmente é porque ele também é junior e só tem o título de senior."
        check: "'Centenas' está no ep 72, aqui só a observação do sênior; combinar as fontes."
      - claim: "Tem a empresa Codeminer com escritórios fora dos grandes centros (Santa Maria, Guarapuava, Poços de Caldas)."
        quote: "A minha própria empresa, a Codeminer, costuma procurar cidades fora de São Paulo pra montar escritório"
        check: "Fato público (Codeminer42). Citar só se necessário."
    world_facts:
