  - id: 2019/10/23/akitando-65-a-dor-de-aprender-que-cursos-livros
    title: "[Akitando] #65 - A Dor de Aprender: que cursos? que livros?"
    one_line: "Ninguém aprende a programar seguindo procedimento: copie muito código, aceite a dor de cair, estude algoritmos e estruturas de dados antes de patterns, e não se apaixone por framework."
    bio_facts:
      - claim: "Fez um pequeno curso de Basic em 1990, com cerca de 13 anos; programa desde 1991; aprendeu quase tudo sozinho; trabalhou com dezenas de linguagens e frameworks (Java, C#, PHP, Ruby, Objective-C)."
        quote: "eu fiz um pequeno curso de programação sim, em 1990, quando tinha uns 13 anos, de Basic."
        check: "Discrepância: no ep 29 'aprendi a programar aos 12 anos'; aqui 1990 aos 13 e 'programador desde 1991'. Usar 'adolescente, no começo dos anos 90'."
      - claim: "Nunca leu um livro técnico de cabo a rabo; faz anos que não faz curso nem lê livro técnico, só consulta a documentação e o código-fonte quando precisa."
        quote: "eu leio muito pouco livro técnico e acho que nunca fiz nenhum curso de programação de verdade até hoje"
        check: "Ep 69 vai além: 'Eu realmente nunca li um livro técnico de cabo a rabo'; ep 63 diz 'raramente'. Frame: 'raramente, quase nunca de cabo a rabo'."
      - claim: "Aprendeu a datilografar copiando enciclopédia, às vezes o mesmo verbete várias vezes; copiar código é o mesmo método de memória muscular."
        quote: "Eu aprendi a datilografar desse jeito. Lembram no episódio de Henry Jones que eu disse que eu copiava enciclopédia?"
        check: "Autor memória (episódio do Henry Jones, fora deste grupo)."
      - claim: "Aprendeu Elixir, Crystal e Rust em ~30 dias cada para ficar produtivo (Rust é o que menos treinou); em 1990 Basic e dBase levaram meses por falta de base de referência."
        quote: "eu não levei mais que 30 dias pra aprender cada uma."
        check: "Autor memória; 'produtivo, não expert' (ele ressalva). Útil para 'IA acelera o aprendizado de linguagem nova para quem já tem fundação' (ver ch18 Que linguagem aprender)."
      - claim: "Aos 41-42 anos aprendeu a andar de uniciclo em 2 dias, caindo, para ilustrar a dor de aprender."
        quote: "Aprendizado, no seu núcleo, é uma briga de você contra você mesmo."
        check: "Autor memória, anedota; possivelmente usar só a frase."
    world_facts:
      - claim: "O livro Design Patterns (Gang of Four) saiu em 1994 e ganhou notoriedade junto com o nascimento do mercado Java; patterns vêm de A Pattern Language, de Christopher Alexander."
        quote: "Eu pensei isso quando o livro do Gang of Four saiu pela primeira vez em 1994."
        check: "GoF: 1994 (Addison-Wesley). Alexander: A Pattern Language, 1977. Confere."
      - claim: "A discussão ActiveRecord vs Repository vs DAO já era antiga em 2003 e continua sem consenso em 2019."
        quote: "Vejam, 16 anos depois e até agora as pessoas ainda não chegaram num consenso sobre acesso e abstração de dados."
        check: "Opinião do autor; Fowler PoEAA 2002, Evans DDD 2003. Confere."
      - claim: "O significado original de 'hacker' é uma pessoa curiosa que busca a resposta; cracker é o invasor criminoso."
        quote: "a definição original de hacker é só uma pessoa curiosa. Na verdade mais que só curioso, alguém que é curioso é alguém que faz a pergunta. Mas um hacker é alguém que também procura a resposta."
        check: "Definição pessoal de uso comum; ok."
    positions:
      - stance: "Autodidata é quem decide pelo procedimento, não o procedimento por ele; o aprendizado passivo seguindo receita é 'passatempo'."
        quote: "O procedimento não decide por mim, eu decido pelo procedimento."
      - stance: "Cursos ensinam o 'o que', não o 'por quê'; seguir o procedimento dá sensação falsa de aprendizado."
        quote: "E a satisfação no final vai ser maior porque fica a falsa sensação que aprendeu alguma coisa, quando na verdade só seguiu um procedimento."
      - stance: "Copie código dos outros, em grande quantidade, sem objetivo, para ganhar memória muscular e reconhecer patterns; o objetivo aparece depois."
        quote: "Copia um monte de código. Parece idiota isso, mas abre um código do GitHub de um lado, o editor do outro lado e vai copiando, da mesma forma como você copiaria um texto de um livro no Word."
      - stance: "Fundação sólida (algoritmos e estruturas de dados) antes de patterns, frameworks e arquitetura; aprender framework novo tem que ser simples se a fundação é boa."
        quote: "Antes de dominar o básico, esquece o avançado, não vai acontecer."
      - stance: "Se tem boa fundação, framework e linguagem novos são simples; o difícil adiado é a fundação."
        quote: "Se você aprender a aprender, que é hackeando seu caminho, resolvendo problemas que o material não previu, ou seja, aprendendo a ser autodidata, a vantagem é que quanto mais você aprender assim e criar seu próprio ritmo, menos difícil vai ficando aprender coisas novas."
      - stance: "Patterns são repetições, não regras; estudar patterns sem prática leva a usar tudo errado. Quem só conhece martelo vê prego."
        quote: "Patterns não representam uma regra ou regulamento ou o melhor jeito, são simplesmente coisas que se repetem várias vezes."
    book_hooks:
      - unit: ch18
        where: "## O que sobra quando a digitação some (a defesa de que 'agora precisa mais ciência da computação')"
        touch: "Em 2019 eu já dizia que, se uma matéria separa o amador de quem vai ter carreira, é Algoritmos e Estruturas de Dados: sem ela você não sabe o que pedir nem como conferir. O agente esconde essas coisas como as linguagens modernas já escondiam (Akitando #65). Fundação sólida, não hype da moda."
        strength: high
      - unit: ch18
        where: "## Que linguagem aprender"
        touch: "Com fundação, aprender linguagem nova é questão de semanas, não de anos: aprendi Elixir, Crystal e Rust em uns 30 dias cada (produtivo, não expert). Em 1990, sem referência, Basic e dBase me custaram meses (Akitando #65). A IA encurta o caminho de quem já tem o mapa; pra quem não tem, só acelera a perdição."
        strength: high
      - unit: ch04
        where: "Ela vai concordar com você"
        touch: "O mesmo problema do curso: ele te dá o 'o que' mastigado e a sensação falsa de ter aprendido, quando na verdade você seguiu um procedimento (Akitando #65). O modelo faz isso por você, com mais simpatia ainda."
        strength: medium
      - unit: ch09
        where: "Como falar com a máquina (prompt como skill)"
        touch: "No canal eu já dizia que copiar muito código dos outros, sem objetivo, e depois quebrá-lo e combiná-lo é como se forma o olho para patterns (Akitando #65). Com o agente a prática de ler código alheio é ainda mais central: você passa a maior parte do tempo lendo."
        strength: medium
      - unit: epilogo
        where: "## O que vale aprender"
        touch: "A dor de aprender não foi terceirizada: 'a menos que você esteja disposto a encarar a dor, engolir o choro, esquecer a frustração, e começar a cair e ficar roxo na frente dos outros, não adianta nenhum curso' (Akitando #65). Se a IA tira toda a dor, tira o aprendizado junto."
        strength: high
    appendix_candidate: "Como aprender com IA sem terceirizar a dor: copiar, ler, quebrar, fundações (algoritmos e estruturas de dados). Curto (1-2 páginas), serve ao leitor iniciante do livro; contrapõe o aprendizado por 'procedimento' ao por 'prática' do #65, hoje com agente."

  - id: 2019/12/11/akitando-69-respondendo-suas-perguntas-sobre-carreira-via-instagram
    title: "[Akitando] #69 - Respondendo suas Perguntas sobre Carreira (via Instagram)"
