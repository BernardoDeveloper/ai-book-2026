        quote: "E sim, existe escassez de profissionais qualificados neste mercado. Não é alarmismo."
        check: "Opinião de mercado 2019; confrontar com o fim da bolha em 2022 (ch18) para mostrar a virada."
      - claim: "A maioria das startups queima dinheiro sem lucro, vive de rodada em rodada, e 'a maioria vai quebrar ou ser adquirida'."
        quote: "A maioria vai quebrar ou ser adquirida por outra empresa maior."
        check: "Previsão, confirmada em parte em 2022-2024. Cuidar para não parecer profecia perfeita."
      - claim: "Bootcamp/curso que promete 'pule de júnior para pleno em x tempo' é charlatão."
        quote: "se você ver algum curso ou bootcamp que faça promessas imbecis como \"estude com a gente e pule de júnior pra pleno em x tempos\" eles são charlatães, fuja."
        check: "Posição do autor, útil para ch14 e ch18 ('chef de Miojo')."
    positions:
      - stance: "Todo curso online gera no máximo júnior; ninguém queima as etapas de prática em empresa real."
        quote: "Via de regra, qualquer curso online, os melhores, só vão conseguir gerar, no máximo do máximo, programadores júniors."
      - stance: "Tech startups são péssimo lugar para iniciante; prefira empresas com histórico de 10 anos ou mais."
        quote: "Tech startups no geral são péssimos lugares pra iniciantes, porque a prioridade não é te ensinar nada, a prioridade é crescimento acelerado acima de tudo"
      - stance: "O que mais importa em soft skill é honestidade: saber dizer 'não' quando não vai entregar."
        quote: "O mais importante é aprender a ser honesto."
      - stance: "Programador ruim não acha vaga; qualificado acha. Lei da oferta e da procura a seu favor: acumule mais conhecimento que a maioria."
