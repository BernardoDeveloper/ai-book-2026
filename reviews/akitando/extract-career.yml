        strength: medium
      - unit: ch16
        where: "Código que ninguém leu (cheiro de copy-paste; código de iniciante)"
        touch: "Eu bato o olho num código e sei se é de iniciante, quais trechos têm cheiro de copy e paste (Akitando #69). Agora o 'copy e paste' é do modelo, e o cheiro é o mesmo: parece funcionar, não tem estilo próprio, e quem revisa precisa de repertório pra perceber."
        strength: medium
      - unit: ch20
        where: "## A linha reta"
        touch: "Em dezembro de 2019 eu fechei o episódio dizendo que 'não existiu melhor momento pra se tornar programador do que agora' e que eu não imaginava a próxima década (Akitando #69). Em 2026 não imagino a seguinte, e o conselho é o mesmo: entenda como as coisas funcionam."
        strength: medium
      - unit: epilogo
        where: "## O que vale aprender"
