# Akitando extraction, group "career". Quotes verbatim from the transcripts
# (validated by script). Transcripts carry the author's own typos; kept as-is.
# Cross-post notes:
#  - First-programming date differs between episodes: ep 29 says "aprendi a programar aos 12 anos";
#    ep 65 says a Basic course in 1990 "uns 13 anos" and "programador desde 1991"; ep 69 says
#    "carreira de 30 anos de programação" (Dec 2019). Use "começou na adolescência, no início dos
#    anos 90" unless the author confirms the exact year.
#  - Ep 29/63 age: "42 anos" in Oct 2019 (born 1976/77).
posts:
  - id: 2018/11/27/akitando-29-o-que-eu-devo-estudar-vou-conseguir-emprego
    title: "[Akitando] #29 - O que eu devo estudar? Vou conseguir emprego?"
    one_line: "Não pergunte se tem emprego para a tecnologia da moda: domine a ferramenta do trabalho, pratique o resto nas horas vagas, e jogue o jogo de longo prazo, porque os pontos só se ligam em retrospectiva."
    bio_facts:
      - claim: "Em 2006 decidiu aprender e trabalhar com Ruby, quando não havia mercado no Brasil; pediu demissão de um bom emprego de consultor Java e recomeçou do zero. Primeiro emprego remoto com Ruby em 2007, empresa própria em 2011."
        quote: "quando eu decidi que ia aprender Ruby E trabalhar com Ruby, havia zero mercado de trabalho no Brasil."
        check: "Datas 2006/2007/2011 batem com o restante do blog (Codeminer42 em 2011, ele diz 34 anos na abertura). Frame como memória do autor; a data de abertura da empresa conferir contra o texto do livro."
      - claim: "Escreveu o livro de Rails em 2006, em cerca de 2 meses, nas horas vagas, enquanto trabalhava como consultor Java."
        quote: "Eu escrevi em 2 meses nas horas vagas não porque eu era bom, mas porque eu não tinha outra alternativa."
        check: "Conferir título/ano do livro (Repensando a Web com Rails, 2006) em registro público ou no blog. Memória do autor."
      - claim: "Em dez/2002-jan/2003 consertou um sistema ASP legado (RH, banco de horas) numa grande empresa; isso levou à RFP perdida em 2003 e, em 2004, ao projeto SAP/J2EE de RH com mais de 4000 funcionários (cliente nomeado no vídeo: Suzano Bahia Sul), onde passou cerca de 2 anos com a própria equipe."
        quote: "o projeto era a implementação SAP do módulo de recursos humanos pra gerenciar os mais de 4000 funcionários que eles tinham na época."
        check: "Memória do autor; nome do cliente está no vídeo mas evitar citá-lo no livro sem aval (nome de cliente). Frame como 'uma grande empresa de papel e celulose' se necessário."
      - claim: "Aos 30 anos sabia que ainda não era bom; abriu a empresa só aos 34, embora quisesse antes dos 30."
        quote: "Eu também queria abrir minha própria empresa antes dos 30 anos. Mas eu esperei. Até os 34 anos."
        check: "Autor memória. 34 anos em 2011 é coerente com nascimento ~1977."
      - claim: "Nos primeiros 5 anos de carreira (dos 20 aos 25) não frequentava eventos, fóruns ou comunidades, o que o blindou do hype."
        quote: "Teria sido um desastre se eu ficasse toda hora correndo atrás do hype."
        check: "Autor memória; ver também o episódio dos 'primeiros 5 anos' (fora deste grupo)."
    world_facts:
      - claim: "Em 2018 a empresa dele tinha 7 anos, 80 funcionários (75 devs) e 11 escritórios fora das capitais principais."
        quote: "Em 2018 minha empresa tem 7 anos, 80 funcionários sendo 75 desenvolvedores"
        check: "Dado de empresa em 2018; não usar como número atual. Nomes de cidades de escritórios são do vídeo, não precisam entrar no livro."
      - claim: "Dado datado: .NET Core, Kotlin e OpenJDK/Azul sendo os destaques de 2018."
        quote: "mas alternativas como o próprio OpenJDK ou a nova JDK da Azul Systems, baseado em LLVM, e o dialeto Kotlin da Jetbrains, também aumentaram o padrão do jogo."
        check: "Afirmação técnica datada de 2018 (Azul Zing/LLVM). Não reutilizar no livro."
    positions:
      - stance: "Aprender a linguagem é meio, não objetivo; a pergunta 'tem emprego?' vale para qualquer tecnologia e é a pergunta errada."
        quote: "Aprender Ruby ou Aprender Elixir não é o objetivo, é só um meio."
      - stance: "O diferencial de um profissional é absorver o ambiente e decidir rápido, não saber ferramentas."
        quote: "A característica mais importante de qualquer profissional não é saber usar bem suas ferramentas, isso é o básico. É a capacidade de absorver o ambiente, entender as limitações desse ambiente, e tomar as melhores decisões o mais rápido possível e executar."
      - stance: "Melhorar legado é mais difícil e mais valioso do que começar do zero."
        quote: "qualquer imbecil consegue começar um projeto novo do zero. Mas só caras realmente bons conseguem melhorar sistemas legados."
      - stance: "Conhecimento e experiência são o único ativo que não se perde; os pontos só se ligam depois."
        quote: "É impossível juntar os pontos no presente. Só no futuro que tudo se conecta."
      - stance: "Competência óbvia dá voz nas decisões."
        quote: "Você só ganha voz pra tomar decisões de verdade no dia que sua competência técnica é reconhecida porque ela é óbvia. Se você precisa explicar, ela ainda não é óbvia."
    book_hooks:
      - unit: ch18
        where: "## Que linguagem aprender (a pergunta do iniciante, 'que linguagem eu aprendo agora?')"
        touch: "Em 2018 eu já respondia isso no canal: a pergunta 'tem emprego pra essa linguagem?' vale pra Ruby, pra Elixir, pra qualquer uma, e é a pergunta errada. Eu mesmo larguei um bom emprego de consultor Java em 2006 pra apostar em Ruby, quando não existia mercado nenhum no Brasil, e não recomendei a ninguém me copiar (Akitando #29)."
        strength: medium
      - unit: ch18
        where: "## Como alguém vira sênior (ou a seção sobre o júnior que vai ser formado com agente)"
        touch: "Peguei meu maior projeto Java até então porque aceitei consertar um sistema ASP horrível que ninguém queria. Quem escolhe só a oportunidade confortável perde as que mudam a carreira (Akitando #29). Vale como contraponto ao medo do 'trabalho chato que a IA vai tirar do júnior': o serviço ingrato é onde se aprende a decidir."
        strength: medium
      - unit: ch20
        where: "## Competente o suficiente (o que sobra é saber decidir, não digitar)"
        touch: "Desde 2018 eu digo que a característica mais importante do profissional não é dominar a ferramenta, e sim absorver o ambiente, entender os limites e decidir rápido (Akitando #29). A ferramenta mudou, a frase continua."
        strength: medium
      - unit: epilogo
        where: "## O que vale aprender"
        touch: "Aprenda o que a IA ainda não faz por você nas horas vagas, sem perguntar se tem vaga. Em 2018 eu já dizia: conhecimento e experiência são o único bem que ninguém rouba de você, e os pontos só se ligam depois (Akitando #29)."
        strength: low
    appendix_candidate: ""

  - id: 2019/01/30/akitando-37-a-dimensao-do-tempo-para-iniciantes-em-programacao-serie-comecando-aos-40
    title: "[Akitando] #37 - A Dimensão do Tempo para Iniciantes em Programação (Série Começando aos 40)"
    one_line: "A cada dez anos as plataformas e linguagens mudam por completo; quem aos 20 projeta o futuro com base no presente está sempre errado, então apaixone-se pelo processo de aprender, não pela tecnologia ou pela empresa."
    bio_facts:
      - claim: "Entrou na faculdade em 1995, aos 18 anos."
        quote: "Agora vamos pular pra 1995, ano que eu entrei na faculdade e tinha 18 anos."
        check: "Ep 64 diz que escolheu cursos 'lá por 94'; ep 63 diz que saiu antes de terminar. Conferir 1995 na cronologia do blog (post dos primeiros 5 anos)."
      - claim: "Viu as transições de classe de computador na própria carreira (4 décadas de vida): mainframe, mini, desktop, web, mobile, cloud."
        quote: "só na minha curta história de 4 décadas eu diria que vi isso acontecer com meus próprios olhos."
        check: "Autor memória; consistente com 'carreira de 30 anos' do ep 69."
      - claim: "Conheceu o GitHub em 2008, quando era um escritório pequeno com poucas pessoas."
        quote: "Eu conheci o GitHub em 2008, era um escritório pequeno, poucas pessoas."
        check: "Autor memória (visita?). GitHub foi lançado em abril de 2008; adquirido pela Microsoft em 2018 (US$ 7,5 bi, anunciado em jun/2018). Confere."
    world_facts:
      - claim: "Em 1995 a internet comercial estava começando, com cerca de 1% da população em modems de 56 kbps."
        quote: "A internet comercial estava só começando com cerca de Um Porcento da população experimentando a “ultra” velocidade de modems discados de Cinquenta e Seis kbps."
        check: "Dado impreciso: em 1995 o padrão era 14.4/28.8 kbps, 56k chegou em 1997-98; no Brasil a internet comercial começa em 1995 com muito menos de 1%. Não citar o número."
      - claim: "Cada tecnologia dominante de uma década (dBase/Clipper, Visual Basic/Delphi, Flash) estava em declínio dez anos depois."
        quote: "Sabe o dBase ou Clipper ou Dataflex de 10 anos atrás? Já estavam no caminho de queda."
        check: "Fatos históricos amplamente documentados; seguro como ilustração."
      - claim: "Sun vendida para a Oracle em 2009; Microsoft e Apple tiveram altos e baixos; a startup de ontem vira o enterprise de amanhã."
        quote: "Toda startup inovadora de ontem se torna o enterprise de amanhã."
        check: "Sun/Oracle: acordo anunciado abr/2009, concluído jan/2010. 'Em 2009' é aceitável. Citar como 'anunciada em 2009'."
      - claim: "Lei de Bell (1972): cerca de a cada década nasce uma nova classe de computadores de menor custo, com nova plataforma, rede e interface."
        quote: "Mais ou menos a cada década uma nova classe de computadores de menor custo se forma baseada em uma nova plataforma de programação, rede e interface resultando em uma nova usabilidade e o estabelecimento de uma nova indústria."
        check: "Lei de Bell: Gordon Bell, 1972; confirmar em Wikipedia (Bell's law). É boa âncora para 'LLM como mais uma classe/interface'."
    positions:
      - stance: "Nenhum projeto de carreira aos 20 sobrevive à década seguinte; quem acha que acertou tudo limitou as opções."
        quote: "E se quando chegar aos 40 você olhar pra trás e disser “sim, tudo aconteceu exatamente como eu tinha imaginado aos 20 anos” eu sinto dizer que você provavelmente limitou muito suas opções e viveu muito abaixo do seu potencial."
      - stance: "Cada linguagem de uma década vira obsoleta na seguinte; por isso 'aprender a aprender'."
        quote: "cada nova linguagem que aprenderíamos numa década se tornaria obsoleta já na década seguinte e teríamos que aprender mais e mais linguagens e tecnologias novas. Entenderam agora porque eu constantemente falo tanto sobre “Aprendendo a Aprender”?"
      - stance: "Amar o processo, não a tecnologia nem a empresa por trás."
        quote: "Apaixone-se pelo processo de aprender e usar as tecnologias, nunca pelas tecnologias em si e as empresas por trás."
      - stance: "Nada permanece igual por mais de uma década."
        quote: "Nada permanece igual por mais de uma década neste nosso mundo de tecnologia."
      - stance: "Ninguém está atrasado; uma nova década sempre se abre."
        quote: "Talvez, talvez você esteja atrasado, pra década passada, mas uma nova década já se abriu."
    book_hooks:
      - unit: ch18
        where: "## Uma interface atrás da outra (a sequência chaves, cartão, montador, compilador, framework, agente)"
        touch: "Eu falava disso no canal em 2019, no episódio 'A Dimensão do Tempo': em 1985, 1995, 2005 e 2015 a escolha de quem começava era outra, e cada tecnologia dominante estava em declínio dez anos depois. A Lei de Bell (1972) descreve o ciclo: a cada década nasce uma nova classe de computador, com nova interface. O agente é só a interface da próxima década."
        strength: high
      - unit: ch20
        where: "## A linha reta (ou o fecho sobre o que não muda)"
        touch: "Tenho 4 décadas de vida e vi mainframe, desktop, web, celular e nuvem chegarem 'pra acabar' com o que veio antes. Em 2019 eu já avisava (Akitando #37): quem projeta o futuro com base no presente erra, e a única constante é gostar do jogo e do próprio esforço."
        strength: medium
      - unit: epilogo
        where: "## Pra esta semana / ## Medo vende"
        touch: "Se você se pergunta 'será que estou atrasado?', a resposta que eu dei em 2019 vale pra IA: talvez você esteja atrasado pra década passada, mas uma nova década já se abriu (Akitando #37)."
        strength: medium
    appendix_candidate: "Linha do tempo de 1985 a 2025, uma página: o que um jovem de 20 anos escolheria em cada década, e o que estava em queda dez anos depois. Serve ao leitor do livro de IA como prova visual de que 'interface da década' muda sempre (Lei de Bell). Já existe quase pronto no episódio; precisaria atualizar com 2015-2025 (cloud, mobile, LLM)."

  - id: 2019/10/09/akitando-63-nao-terceirize-suas-decisoes-a-licao-mais-importante-da-sua-vida
    title: "[Akitando] #63 - Não Terceirize suas Decisões: a lição mais importante da sua vida"
    one_line: "Não terceirize decisões de carreira nem de projeto para influencers ou para o que Google, Netflix e Facebook fazem: erre barato, assuma o prejuízo, desconfie de quem não tem skin in the game."
    bio_facts:
      - claim: "Nunca teve ídolos na área nem perguntou a ninguém o que fazer na carreira; todas as decisões importantes foram dele."
        quote: "Todas as decisões importantes são minhas, certas ou erradas. Se eu tomar a decisão certa, 100% do mérito é meu. Se eu tomar a decisão errada, 100% do prejuízo é meu também."
        check: "Autor memória; frame como estilo pessoal e 'ninguém deve me copiar', como ele mesmo diz."
      - claim: "Tinha 42 anos em outubro de 2019; só teve internet aos 17 ou 18 anos, principalmente à noite."
        quote: "eu só fui ter acesso à internet, principalmente de noite, lá pros 17 ou 18 anos."
        check: "42 anos em 2019 bate com nascimento ~1977; 17-18 anos = ~1994-95. Autor memória."
      - claim: "Saiu da faculdade antes de terminar, quando já se equilibrava 'sem rodinhas'."
        quote: "foi um dos motivos de porque eu saí antes de terminar a faculdade, quando eu me vi já conseguindo me equilibrar na bicicleta sem rodinhas e tentando saltar a rampa antes."
        check: "Autor memória (diz noutros episódios, 'Devo fazer faculdade?'). Não citar como recomendação."
      - claim: "Fez da consultoria a profissão de achar defeito nas coisas, e por isso é 'do contra por padrão'."
        quote: "Eu fui consultor por muitos anos, minha profissão era achar defeito nas coisas."
        check: "Autor memória; ancora a postura de cético diante de hype."
      - claim: "Em 2005, quando ninguém ligava para Rails, apostou nele; usa-se hoje produtos Rails (cita o GitHub). Aposta sempre em ciclos de ~10 anos e em várias opções."
        quote: "Em 2005 ninguém tava muito interessado, eu tive sorte e minha aposta deu certo."
        check: "Rails foi lançado em jul/2004 (open source), 1.0 em dez/2005; ele diz 2006 como decisão no ep 29. Pequena discrepância 2005 vs 2006: ambas são 'quando começou a olhar'. GitHub é de fato Rails."
    world_facts:
      - claim: "Netflix foi lançada em 1997, Google fundado em 1998, Facebook em 2004; o código do dia 1 deles quase não existe mais."
        quote: "O Netflix foi lançado em 97, provavelmente quase nenhum código que eles escreveram no dia 1 deles existe hoje. O Google foi fundado em 98"
        check: "Netflix: fundada 1997, streaming só em 2007. Google: set/1998. Facebook: fev/2004. Datas conferem."
      - claim: "Netflix tinha 'mais de 100 milhões de assinantes' na época do vídeo."
        quote: "como eles resolveram o problema deles de suportar os mais de 100 milhões de assinantes"
        check: "Netflix passou de 100 milhões em 2017 (~139 milhões em 2018, ~158 milhões em 2019). Confere como 'mais de'."
      - claim: "Exemplos de decisão por imitação: Clojure porque o Nubank usa, React porque o Facebook usa, Go porque o Google usa, squads do Spotify."
        quote: "Eu deveria escolher Clojure porque o Nubank usa. Eu deveria escolher React porque o Facebook usa, eu deveria escolher Go porque o Google usa."
        check: "Opinião, não fato. Útil como paralelo: 'escolher IA porque a big tech usa'."
    positions:
      - stance: "Não terceirizar decisões; quem não tem skin in the game não tem autoridade para opinar sobre sua vida."
        quote: "A única pessoa que pode de fato opinar com alguma propriedade é alguém que tem skin in the game: ou seja que vai cortar da própria pele se der errado."
      - stance: "Quem oferece resposta fácil e garantida está vendendo algo."
        quote: "algumas pessoas realmente acham que conseguem dar a resposta certa: suspeite dessa pessoa, ela provavelmente está tentando te vender alguma coisa."
      - stance: "Palestra de big tech descreve solução para o contexto e a escala dela, não a sua; seu dia 1 é sobreviver até o dia 2."
        quote: "No dia 1 sua preocupação não é se você tá usando kubernetes ou não. No dia 1 sua preocupação não é usar GraphQL. No dia 1 sua preocupação não é CQRS. No dia 1 sua preocupação é durar até o dia 2."
      - stance: "O problema não é errar, é como se recupera; aposte de forma anti-frágil, perca pouco, ganhe muito."
        quote: "O problema não é acertar sempre, é como você se recupera depois de um erro."
      - stance: "Contexto, não copiar; ciência de verdade em ciência da computação (provas de conceito, experimentos)."
        quote: "Puta que pariu, cadê a “ciência” em ciências da computação?"
      - stance: "Quantidade de likes não torna algo verdade (2 mais 2 continua 4)."
        quote: "Quantidade de likes não torna uma coisa verdade."
    book_hooks:
      - unit: ch20
        where: "## O que é seu (a decisão que o modelo não toma por você)"
        touch: "Em 2019 o episódio mais importante do meu canal foi o 'Não Terceirize suas Decisões'. Se eu acertar, o mérito é meu; se errar, o prejuízo também. Com IA a tentação só cresceu: terceirizar pro modelo é a versão nova de terceirizar pro influencer. Quem responde pelo resultado ainda é você, e só quem tem skin in the game pode opinar com propriedade."
        strength: high
      - unit: ch14
        where: "A fábrica de propaganda (o benchmark e a palestra da big tech como argumento de venda)"
        touch: "Já em 2019 eu avisava (Akitando #63): quando um engenheiro da Netflix explica como resolveu o problema de 100 milhões de assinantes, ele está dizendo 'se você for a Netflix, isso tem chances de funcionar'. Ponto. A mesma conta vale pro slide de 'empresa X economizou Y% com IA': é a solução do contexto dela, não a sua."
        strength: high
      - unit: ch19
        where: "## Gente treinada pra não decidir / ## Antes de renovar a licença"
        touch: "A frase que mais repeti no canal foi 'seu dia 1 é durar até o dia 2' (Akitando #63): empresa com 2 devs e zero clientes copiando a arquitetura da Netflix está terceirizando a decisão. A versão 2026 é comprar a licença de IA corporativa porque 'todo mundo tem'."
        strength: medium
      - unit: epilogo
        where: "## Sem entregar o volante"
        touch: "Eu falo isso desde 2019: pare de terceirizar as decisões da sua vida, erre rápido, assuma que errou e mude de direção. Pra IA vale igual. Assuma que o agente vai errar e que você vai ter prejuízo; o que importa é como você se recupera (Akitando #63)."
        strength: high
      - unit: ch04
        where: "Ela vai concordar com você (bajulação do modelo)"
        touch: "Nunca deixei o aplauso decidir por mim: 'quantidade de likes não torna uma coisa verdade', 2 mais 2 continua 4 (Akitando #63). Um modelo treinado pra concordar é um like que fala."
        strength: medium
    appendix_candidate: ""

  - id: 2019/10/16/akitando-64-comecando-na-carreira-de-ti-faculdade-niveis-de-experiencia
    title: "[Akitando] #64 - Começando na Carreira de TI: Faculdade, Níveis de Experiência"
    one_line: "Júnior, pleno e sênior diferem no tempo e na confiança, não na qualidade do código; sênior é quem decide, assume a responsabilidade e multiplica os outros; code review obrigatório e curvas S de adoção organizam a carreira."
    bio_facts:
      - claim: "Cursou Ciência da Computação (decidiu por volta de 1994) e sempre teve viés para ciências, embora seja mais analista/engenheiro no perfil."
        quote: "Ciência da Computação foi o que eu fiz, e eu diria que é uma especialização da Matemática Aplicada."
        check: "Autor memória. Cuidado: 'USP' aparece como exemplo de grade de engenharia, não necessariamente a faculdade dele."
      - claim: "Passou pelo efeito Dunning-Kruger quando era júnior e levou 'vários tapas na cara'; odeia ser elogiado por quem não é tecnicamente melhor."
        quote: "Mas eu mesmo passei por algo assim na fase que eu era júnior também. Felizmente eu tomei vários tapas na cara e voltei pra realidade"
        check: "Autor memória, humilde e quotável. O nome 'Dunning-Kruger' é de 1999 (Kruger e Dunning); ele diz que foi cunhado por volta de 2011, o que está impreciso: popularizado em blogs ~2011."
      - claim: "Aprendeu Objective-C em 2010, quando já era pleno em Ruby (no pico da curva); gosta de ser pleno na tecnologia em early majority e explorar as do início da curva."
        quote: "Eu aprendi Objective-C em 2010 por exemplo, e nessa época eu era pelo menos um pleno em Ruby, que estava no pico da sua curva."
        check: "Autor memória; consistente com ep 63 ('mobile em 2010'). Ele publicou app iOS? Conferir no blog antes de afirmar produtos."
    world_facts:
      - claim: "4 em cada 5 microempresas fecham antes de completar 5 anos (segundo 'dependendo da estatística')."
        quote: "Dependendo de qual estatística você procurar, 4 em cada 5 devem fechar antes de completar 5 anos."
        check: "Número impreciso: SEBRAE mostra ~21-25% de mortalidade em 2 anos no Brasil e ~35-40% em 5 anos; '4 em cada 5' é exagero, não citar."
      - claim: "Salário de júnior nos EUA ~US$ 40 mil/ano; sênior na Accenture da Índia ~600 mil rúpias (<R$ 3 mil/mês)."
        quote: "o salário varia na faixa de uns 40 mil dólares ao ano."
        check: "Exemplo de 2019, informal; não citar valores. A ideia útil: valor é determinado pelo mercado, sempre haverá alguém mais barato."
      - claim: "Adoção de iPhone/Objective-C teve pico entre 2010 e 2014; defender Blackberry/Windows Mobile em 2011 era negar a curva."
        quote: "Quem saltou e pegou o early adopter de iPhone em 2009 e aprendeu Objective-C se deu muito bem porque o pico foi entre 2010 e 2014, desde então a curva desacelerou já."
        check: "Opinião de mercado; plausível. Exemplo útil para curva S de LLM: 'quem já sabia quando todos começaram'."
    positions:
      - stance: "Júnior, pleno e sênior entregam qualidade similar; muda o tempo, proporcional à inexperiência. Sênior elimina caminhos inúteis."
        quote: "o mesmo problema dado pra um júnior, um pleno e um sênior, podem ser resolvidos com qualidade similar. O que vai variar é o tempo."
      - stance: "O valor do sênior é a capacidade de decidir e assumir a responsabilidade; delegar e orientar vem junto."
        quote: "O valor de um sênior começa na sua capacidade de tomar de decisões - que se não ficou claro, também implica que ele assume a responsabilidade da decisão. Decidir sem ter o ônus do fracasso não serve pra nada, não tem skin in the game."
      - stance: "Sênior escala 'horizontalmente': com as orientações certas, elimina 18 das 20 tentativas do júnior."
        quote: "Mas se o sênior ajuda ele a eliminar as 18 opções que ele já sabe que não funcionam, o júnior consegue focar só nas 2 que que tem mais chances de funcionar, e o resultado vai ser ordens de grandeza melhor."
      - stance: "Nenhum código imune à revisão; quem escreve não faz merge."
        quote: "nenhum código deve ser imune à revisão, não importa de quem seja."
      - stance: "Elogios não dizem nada; só a autoavaliação e a crítica importam; qualidade (testes) independe de sinal externo."
        quote: "A única avaliação que interessa é sua auto-avaliação. Avaliação externa que tem importância é a crítica, porque ela pode indicar um defeito na sua auto-avaliação."
      - stance: "Curva S de adoção: ganha quem pega o fim do early adopter, e carreira é como carteira de investimentos (renda fixa, ações, opções)."
        quote: "Quem sempre vai ganhar mais é quem souber “surfar” como eu vivo dizendo."
      - stance: "Matérias de baixo nível (cálculo, estatística) duram; as de alto nível (Flash) envelhecem rápido."
        quote: "Quanto mais específico em alto nível, mais rápido tende a ficar defasado, mas mais prático no dia 1. Quanto mais específico em baixo nível, mais tende a ter valor ao longo do tempo mas menos prático vai ser no dia 1"
    book_hooks:
      - unit: ch18
        where: "## Como alguém vira sênior"
        touch: "Desde 2019 eu defendo que júnior, pleno e sênior resolvem o mesmo problema com qualidade parecida; o que muda é o tempo e a confiança. Sênior é quem decide e responde pela decisão, e quem consegue cortar 18 das 20 tentativas do júnior (Akitando #64). Com o agente, o 'júnior' é o agente: ele testa vinte caminhos, e você precisa ser o sênior que poda."
        strength: high
