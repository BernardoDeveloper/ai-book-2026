  - id: 2020/02/19/akitando-72-rant-programacao-nao-e-facil
    title: "[Akitando] #72 - Rant: Programação não é fácil"
    one_line: "Programação virou 'salvador da pátria' numa bolha de abundância; da próxima vez que a bolha estourar, quem não entrega resultado proporcional ao que ganha fica sem emprego, e cursos de semanas são só 5% do caminho de 1400 horas."
    bio_facts:
      - claim: "Falando como 'sobrevivente de umas 3 crises': anos 90, anos 2000 e anos 2010. Viu a bolha da internet cair em 2001 e o mercado indiano de terceirização crescer em seguida."
        quote: "Falando como um sobrevivente de umas 3 crises, nos anos 90, nos anos 2000 e nos anos 2010, uma coisa permanece constante."
        check: "Autor memória, a base do 'eu já vi isso antes' do ch18. O livro (ch18) diz 'bolha dos microcomputadores no começo dos anos 90, bolha da internet em 2001, crise de 2008'. Conferir equivalência."
      - claim: "Contratou literalmente centenas de pessoas e avaliou centenas de currículos ao longo de 20 anos, em várias empresas."
        quote: "Eu já contratei literalmente centenas de pessoas e avaliei centenas de curriculos e acompanhei a evolução deles."
        check: "Autor memória. 'Centenas' é do autor."
      - claim: "Em 2012 usou Uber em São Francisco e Waze em Tel Aviv, antes de popularizarem no Brasil."
        quote: "A primeira vez que eu peguei Uber foi em 2012 em São Francisco."
        check: "Autor memória; datas públicas compatíveis (Uber criado em 2009 como UberCab, SF; Waze em Israel)."
      - claim: "Sempre foi ruim em esportes e culinária e escolheu não investir; só programação o prendia por horas, até ver o sol nascer. Nos anos 80 'basicamente ninguém' tinha esse interesse."
        quote: "eu já cansei de ficar entretido e só parar quando vejo o sol nascendo, de novo."
        check: "Autor memória; anedota boa para 'vocação' e contra 'qualquer um consegue'."
      - claim: "Em 2014 gravou um vídeo para o 'Ano do Código' que depois renegou por dar a entender que qualquer um programa."
        quote: "Eu pessoalmente não gosto desse vídeo que eu fiz. E eu acho que muita gente assume que minha mensagem é sempre próxima disso que eu disse. Eu nunca quero dizer isso."
        check: "Autor memória; humildade e correção pública. Frase de exemplo de 'mudar de opinião e dizer'."
    world_facts:
      - claim: "Em 2020, ele já prevê que 'a bolha vai estourar, em breve ou em poucos anos', e que quem ganha sem entregar o equivalente fica sem emprego; programação virou 'salvador da pátria' após a crise de 2008 e o boom de apps."
        quote: "Da próxima vez que a bolha estourar, e isso pode ser em breve ou pode ser em poucos anos, quem não for programador de verdade, ou seja, quem não souber como de verdade entregar resultados proporcionais ao que ganha, vai ficar sem emprego."
        check: "Verificável: fev/2020 (antes da pandemia). A bolha estourou em 2022 (Meta cortou 11 mil em nov/2022; ch18). Prova do 'aviso antecipado' sem profecia: ele não previu a pandemia e diz no ch18 que a pandemia inflou o fim."
      - claim: "Em Silicon Valley há programadores com salários de US$ 150-500 mil, mas parte é equity (promessa), aluguel caro e impostos; sobra US$ 1-2 mil por mês."
        quote: "No final do mês, você achou que tinha 12 mil dólares, mas tire tudo isso e muito mais que você precisa gastar numa das cidades mais caras do mundo, e se tiver sorte, vai sobrar mil dólares, talvez 2 mil."
        check: "Conta hipotética do autor (câmbio 4,30); explicitamente hipotética. Não citar números."
      - claim: "A TellTale Games demitiu dezenas do dia pra noite por falta de dinheiro (2018)."
        quote: "a empresa de jogos TellTale Games demitiu dezenas de pessoas do dia pra noite porque eles ficaram sem dinheiro."
        check: "Fato: Telltale Games fechou em set/2018, demitiu ~225 pessoas (maioria) de um dia pra outro. 'Dezenas' é subestimado."
      - claim: "Em 2001 caiu a bolha da internet e a Índia se tornou referência em terceirização; sempre haverá alguém que faz por menos da metade."
        quote: "Em 2001 não foi só as torres gêmeas que caíram, caiu também a bolha especulativa da internet. Centenas de programadores que achavam que eram bons de repente não tinham pra onde ir."
        check: "Fato de mercado conhecido; Índia como polo de outsourcing já existia nos anos 90 (Y2K), mas se consolidou nos 2000. Exagerado dizer que 'foi assim que cresceu', formular com cuidado."
      - claim: "Faculdade/estágio: o estagiário tem ~700 horas de curso, mais ~700 de estágio para virar júnior: ~1400 horas, e um workshop de 80-100 horas é 5% do percurso."
        quote: "pra sair do zero até chegar ao primeiro estágio de júnior, estamos falando de uma carga aproximada de 1400 horas entre estudo teórico e treino prático. No mínimo."
        check: "Estimativa do autor, de cabeça; ele mesmo diz 'chutando na média'. Frame como estimativa."
    positions:
      - stance: "Programação não é para todo mundo, não é fácil, não é salvador da pátria; e ele nunca incentivou ninguém a virar programador."
        quote: "eu tomei cuidado pra minha carreira inteira eu nunca incentivei ninguém a virar programador."
      - stance: "Quem não souber entregar resultado proporcional ao que ganha fica sem emprego na próxima bolha."
        quote: "Nunca se esqueça: sempre vai existir um indiano que faz o que você faz por menos da metade do preço."
      - stance: "Você raramente vale o que acha que vale; em bolha a demanda sobe, em crise o preço cai abaixo do normal."
        quote: "Sempre tenha em mente, você raramente vale o que você “acha” que vale."
      - stance: "O emprego que nunca acaba é o do solucionador de problemas reais; ele precisa de fundação."
        quote: "um tipo de emprego que nunca acaba são as posições reservadas ao reais solucionadores de problemas."
      - stance: "Cursos e workshops de semanas prometendo salário de seis dígitos são fraude ou ouro de tolo."
        quote: "Eu acho que cursos, workshops, coaches e todo o aparato de intermediários que está surfando a onda da abundância está realmente realizando fraude."
      - stance: "Os que ficam pra trás são os que estacionaram no básico, cegos por uma valorização fora do normal."
        quote: "Os que ficam pra trás foram os que estacionaram no básico, cegos por um valorização fora do normal, achando que já são bons o suficiente já que existe demanda por eles."
      - stance: "Reclamar de abundância é problema de primeiro mundo de quem nunca viveu a primeira crise."
        quote: "é literalmente problema de primeiro mundo de uma geração que ainda não teve a experiência da primeira crise."
    book_hooks:
      - unit: ch18
        where: "## A bolha que estourou antes (abrir ou fechar com a data do aviso)"
        touch: "O aviso está datado: 19 de fevereiro de 2020, antes da pandemia. 'Da próxima vez que a bolha estourar, e isso pode ser em breve ou em poucos anos, quem não souber entregar resultados proporcionais ao que ganha vai ficar sem emprego.' (Akitando #72). Não previ a pandemia, mas previ a bolha. O que ela encerrou foi o dinheiro fantasma, não a profissão."
        strength: high
      - unit: ch18
        where: "### Os engenheiros de bootcamp"
        touch: "No mesmo episódio eu fiz a conta: 700 horas de curso, mais 700 de estágio, uns 1400 horas até o primeiro nível de júnior. Um workshop de 80 a 100 horas é 5% do percurso (Akitando #72). Não é mágoa com o bootcamp, é aritmética. A promessa 'vire engenheiro em dois meses' nunca fechou a conta."
        strength: high
      - unit: ch19
        where: "## Antes de renovar a licença / ## A premissa mudou"
        touch: "Bolha tem uma assinatura: sobra dinheiro, ninguém olha eficiência, aparecem posições que num mercado normal não existiriam. Eu escrevi em 2020 (Akitando #72) que 'coach de coach' certificado era o sinal de que estávamos num período de abundância excessiva. Em 2026, o sinal equivalente é certificado de 'prompt engineer'."
        strength: medium
      - unit: ch14
        where: "A fábrica de propaganda"
        touch: "Cursos, workshops e coaches 'surfando a onda da abundância' são fraude, eu disse em 2020 (Akitando #72). Mudou a onda, não o negócio: hoje é o curso de IA que promete seis dígitos."
        strength: medium
      - unit: epilogo
        where: "## Medo vende"
        touch: "Sobrevivi a umas três crises (anos 90, 2000 e 2010) e a constante é a mesma: quem fica pra trás parou no básico achando que a demanda era mérito; quem segue em frente tem o mérito de resolver problemas reais, e solucionador de problema não acaba (Akitando #72)."
        strength: high
      - unit: ch20
        where: "## Competente o suficiente"
        touch: "Programação não é salvador da pátria, nem fácil, e eu disse isso em 2020. O que o livro defende é a mesma tese um passo adiante: a IA torna fácil digitar, não torna fácil decidir. Competente o suficiente pra entregar de verdade continua sendo o que o mercado paga (Akitando #72)."
        strength: medium
    appendix_candidate: "As contas da bolha: equity é promessa, custo de vida come o salário, 1400 horas até o primeiro nível de júnior. Uma página de 'faça a conta antes de acreditar' serve ao leitor do livro que ouve 'vire dev com IA em semanas' ou 'IA vai pagar seis dígitos'. É aritmética datada de 2020 e precisa ser atualizada para 2026."
