posts:
  - id: 2019/09/12/akitando-61-meus-primeiros-5-anos-1990-1995
    title: "[Akitando] #61 - Meus Primeiros 5 Anos | 1990-1995"
    one_line: "Dos 13 aos 18 anos o autor aprendeu Basic, dBase, Clipper, CorelDraw e UNIX por curiosidade e por motivos banais (até pirataria), sem plano de carreira, e diz que aprender sem objetivo grandioso foi o que o preparou."
    bio_facts:
      - claim: "Primeiro contato com programação de verdade em 1990, aos 13 anos, num curso de MBasic e Wordstar (telemarketing ofereceu desconto; os pais o matricularam)."
        quote: "Meu primeiro contato com programação de verdade foi em 1990, eu tinha 13 anos."
        check: "author memory, frame as such (ele mesmo diz 'se eu não me engano'). Tensão com #90, que diz 'catorze ou quinze anos' e dBase como primeira linguagem; #61 é mais detalhado, prefira #61 ('Basic em 1990, dBase/Clipper em 1991-92')."
      - claim: "Foi 'estagiário' do tio analista de sistemas nas férias (~1991-92, aos 14), programando dBase e depois Clipper (controle de estoque, escritório de advocacia); copiou uma apostila inteira de dBase III no Wordstar e assim aprendeu a linguagem."
        quote: "eu copiei digitando, página a página dessa apostila no Wordstar pra imprimir minha própria versão."
        check: "author memory, frame as such; datas aproximadas ('final de 91?')."
      - claim: "Aos 15 anos (c. 1992) apresentou jogos em estande da Brasoftgames na Fenasoft e foi parar no palco; foi a primeira vez que falou em público direito, depois de ter fugido do palco aos ~10 anos."
        quote: "Essa foi a primeira vez que eu consegui falar em público direito"
        check: "author memory; Fenasoft (Anhembi) é feira pública de 1990s, ano 'acho que 1992'. Não citar empresa/pessoas pelo nome sem necessidade."
      - claim: "Aprendeu UNIX (HP-UX via Telnet, Lynx, Pine, Vi, Usenet, IRC, FTP, jobs em background) em 1995 como monitor/estagiário do CCE da Poli-USP, com a motivação (declarada) de baixar warez mais rápido."
        quote: "Se  resumir a última metade do vídeo você pode dizer que eu aprendi UNIX pra baixar pirataria mais rápido."
        check: "author memory. Cuidado editorial: confissão de pirataria/phreaking nos anos 90; usar só a frase 'aprendi UNIX por um motivo banal', sem detalhar blue box/warez. Não citar BBS nem apelidos de terceiros."
      - claim: "Passou em Fatec, Unicamp e USP em 1994 e escolheu Ciência da Computação (IME-USP), sem entender a diferença entre os cursos; entrou em 1995."
        quote: "No final passei nos 3 e escolhi fazer ciências da computação."
        check: "author memory; consistente com #138 ('entrei na faculdade em 1995'). #90 diz 'aos dezessete' e 'eu mesmo não me formei' (cursou os dois primeiros anos): verificar se a fala 'não me formei' é consenso antes de afirmar diploma no livro."
      - claim: "Aprendeu a ilustrar em CorelDraw em um mês porque o editor da revista Videogame exigiu ilustração vetorial; publicou ilustrações na revista por alguns meses (1993)."
        quote: "Naquele mesmo dia eu fui pra uma livraria e comprei um livro de CorelDraw 3."
        check: "author memory; revista Videogame (Editora Tambor) é pública, a edição não foi checada."
    world_facts:
      - claim: "Em 1995 o stack TCP no Windows 3.1 era opcional (vinha no Windows for Workgroups ou instalado à parte); internet era opcional e universidades dependiam do backbone da Fapesp."
        quote: "o stack TCP ainda era opcional"
        check: "história da computação, verificável (Windows 3.11 for Workgroups trazia TCP/IP opcional; Fapesp/ANSP foi o backbone acadêmico de SP). Contexto, não prioridade."
      - claim: "Na época o arquivo shadow já existia desde 1986, mas muitos servidores UNIX não estavam atualizados."
        quote: "O arquivo shadow já existia desde 86"
        check: "o autor afirma; shadow passwords surgiram em SunOS/System V por volta de 1987. Dado secundário, imprecisão possível de um ano."
      - claim: "O autor para a história 'exatamente antes de começar a primeira bolha da internet': Java 1.0, Delphi 1.0 e Flash vêm em 1995-96; .NET não existia; PHP não tinha começado."
        quote: "eu estou parando a história exatamente antes de começar a primeira bolha da internet"
        check: "Java 1.0 (jan/1996), Delphi 1.0 (1995), FutureSplash/Flash (1996), PHP/FI 1995: datas verificáveis. 'PHP ainda não tinha começado' é aproximação (PHP/FI é de 1995)."
    positions:
      - stance: "Não planejar a carreira nos primeiros anos; curiosidade e coisas banais levam a conhecimentos que viram importantes depois."
        quote: "Se eu ficasse toda hora pensando \"ah, não vou perder tempo com isso porque não sei se vai ser útil daqui 5 anos\" eu ia ficar estagnado o tempo todo só planejando, planejando e nunca de fato fazendo."
      - stance: "Nunca atrelou aprender a um objetivo grandioso ou lucrativo."
        quote: "Eu nunca penso \"vou aprender X porque isso pode ser mais lucrativo no futuro\""
      - stance: "Definição de hacker: curiosidade com tecnologia. Uma coisa leva à outra."
        quote: "a definição de hacker pra mim é uma pessoa curiosa com tecnologia."
      - stance: "A faculdade vale também pelo networking com gente melhor; ele era 'uma esponja'."
        quote: "Eu era o mais novo e o mais noobie de todos, e eu era uma esponja aprendendo tudo que conseguia deles."
    book_hooks:
      - unit: ch18
        where: "seção 'Que linguagem aprender' (e o tom de conselho de carreira no fim do capítulo)"
        touch: "Uma ou duas frases: 'No meu primeiro contato, em 1990, aos 13 anos, aprendi MBasic num curso que meus pais me deram por causa de uma ligação de telemarketing. Dali vieram dBase, Clipper, CorelDraw e UNIX, nenhum por plano de carreira (Akitando #61).' Serve de prova de que a ferramenta da vez muda e a curiosidade fica."
        strength: medium
      - unit: epilogo
        where: "seção 'O que vale aprender'"
        touch: "Contrapor a ansiedade de escolher a ferramenta certa: 'Aos 13 anos eu só queria dar um comando e ver o computador responder. Aprendi UNIX pra baixar coisa mais rápido. Cada uma dessas coisas banais virou base do que vim a fazer depois.' Citar o episódio #61."
        strength: medium
      - unit: ch08
        where: "seção 'Como se aprende agora' (aprender com a máquina)"
        touch: "Um parágrafo curto: antes, aprender era digitar uma apostila de 100 páginas no Wordstar pra aprender dBase; hoje a dúvida tem resposta imediata, mas copiar sem entender continua sendo copiar. Autoridade vivida sobre 'aprender na marra' vs 'aprender com ajuda'."
        strength: low
    appendix_candidate: ""

  - id: 2023/02/14/akitando-138-meu-comeco-de-carreira-durante-a-bolha-1997-a-2002-bug-do-milenio-crash
    title: "[Akitando] #138 - Meu Começo de Carreira Durante a Bolha - 1997 a 2002, Bug do Milênio, Crash"
    one_line: "O autor conta empregos de 1997 a 2002 (agência de CD-ROM, Y2K, provedor, HPG, PSN) e conclui que atravessou o estouro da primeira bolha ileso porque se definia por resolver problemas e aprender a aprender, não por uma tecnologia."
    bio_facts:
      - claim: "Primeiro emprego (estágio, ~1997, aos 20) numa pequena agência, fazendo CD-ROMs em Macromedia Director (Lingo), depois HTML, Flash, ASP e SQL Server; salário de estágio de uns R$ 500 (≈ R$ 2 mil hoje, segundo ele)."
        quote: "Eu tava empolgado pra mexer mais na Web, mas queriam que eu aprendesse a fazer CD-ROMs."
        check: "author memory, frame as such. Conversão de salário pelo IPCA é do autor; recalcular se citar. Não nomear a agência/cliente no livro sem necessidade."
      - claim: "Em 1999 (22 anos), num provedor de internet, liderou/participou da reescrita do sistema administrativo (Clipper de DOS, bug do milênio) para ASP + SQL Server, com menos de 6 meses de prazo; boletos para 2000 já falhavam em 1999."
        quote: "Mas eu era um moleque de 22 anos que só queria a oportunidade de mexer com coisas novas."
        check: "author memory; checar nomes de empresas (STI, PSINet) em registros públicos antes de citar. Fato de mundo: Y2K começou a falhar antes de 31/12/1999 em contas a prazo."
      - claim: "Viu o primeiro layoff em massa num merge (provedor adquirido) e o primeiro produto 'engordar o porco' (HPG, vendido ao iG); saiu do HPG em menos de 6 meses por ceticismo com o modelo de negócios."
        quote: "Eu tinha 23 anos e na minha cabeça esse produto não fazia sentido."
        check: "author memory. A venda da HPG ao iG é registro público (verificar data e valor); ele próprio diz 'acho que'."
      - claim: "Foi webmaster de uma pontocom esportiva (PSN, do grupo que era dono do Corinthians) até dezembro de 2001; a empresa fechou no crash e ele ficou 'uma semana' desempregado antes de entrar numa consultoria SAP (2002-2007)."
        quote: "Fiquei só uma semana desempregado."
        check: "author memory. Fatos públicos checáveis: Hicks, Muse, Tate & Furst e Corinthians (parceria ISL/Hicks Muse 1999-2002)."
      - claim: "Nunca fez cursos; aprendia por livro importado em inglês (encomendado à Livraria Cultura, espera de um mês) e documentação; chegou a escrever, por conta própria, um mini ASP.NET em ASP clássico em 2000."
        quote: "Notem outra coisa: em nenhum momento eu cito cursos. Porque eu nunca fiz nenhum."
        check: "author memory. Coerente com #61, #90 (autodidata)."
      - claim: "Todas as empresas em que trabalhou de 1996 a 2002 fecharam; ele saía porque ia fechar."
        quote: "nenhuma das empresas que eu trabalhei nesse período existem mais."
        check: "author statement; plausível, não verificável de fora."
    world_facts:
      - claim: "Pico da Nasdaq e crash: o autor diz 'o pico da NASDAQ foi em março de 2001' e que caiu quase 80% até quase o fim de 2002."
        quote: "Na verdade o pico da NASDAQ foi em março de 2001"
        check: "ERRO DE DATA: o pico da Nasdaq foi em 10 de março de 2000 (≈5.048), não 2001; a queda total até out/2002 foi ≈78%. O 'crash em outubro' de 2001 também é impreciso (a queda começou em 2000). Não repetir 2001 como pico; a data 2001 serve só para 'quando a bolha estourou de verdade para ele'."
      - claim: "Em 1997 a Apple estava a dias de falir, com Jobs voltando; depois iMac, Mac OS X e iPod (2001)."
        quote: "A empresa mais valiosa de tecnologia hoje, em 1997 estava praticamente falida."
        check: "público (Apple 1997, aporte da Microsoft de US$150 mi). A frase 'negativo 1 bilhão de dólares' é dele e é impreciso; evitar."
      - claim: "Crashes de 2000-2002 eliminaram empresas, mas Google e Amazon viraram gigantes na 'seca' de 2002 a 2008; blogs e redes sociais nasceram nesse período."
        quote: "não é porque teve crash da bolha que a tecnologia parou"
        check: "histórico, verificável (Google IPO 2004, Facebook 2004, YouTube 2005). Gancho forte para 'bolha estoura, tecnologia fica'."
      - claim: "As demissões das Big Techs em 2022-23 já superavam 120 mil nos EUA (citado em #132; #138 só alude 'Crash da Bolha Tech atual')."
        quote: "Muitos agora começando carreira ou vendo o atual Crash da Bolha Tech estão inseguros"
        check: "o número está em #132; aqui é só a moldura do episódio (fev/2023)."
      - claim: "Em 1997 internet discada de ~19 kbit/s; streaming era impossível, por isso CD-ROM."
        quote: "E a conexão média era de 19 kilobits por segundo."
        check: "razoável; modems de 28.8/33.6/56k conviviam. Não é a hook principal."
    positions:
      - stance: "Nunca se definiu por uma tecnologia, mas por resolver problemas; 'aprender a aprender' foi a arma contra o estouro."
        quote: "eu nunca me defini como \"programador ASP\" ou \"programador Java\" ou \"administrador de SQL Server\". Minha especialidade não era nenhuma dessas ferramentas."
      - stance: "Esperar 2 ou 3 anos 'pra ver se a tecnologia vinga' faz perder a onda e vira vítima do crash."
        quote: "teria perdido a primeira Bolha da Internet, pior, teria sido mais uma vítima do crash."
      - stance: "Crise não acaba com o trabalho; toda empresa continua precisando manter e evoluir tecnologia."
        quote: "Mesmo com o crash da bolha, não significa que acabou todos os empregos."
      - stance: "Não tente adivinhar o que será relevante em 5 anos; nem guru, influencer ou ele sabem para a carreira de cada um."
        quote: "O você de hoje tentando escolher a ferramenta \"ideal\" não tem idéia do que realmente vai ser importante daqui 5 anos."
      - stance: "Cursos não existem para o que acabou de sair; livro importado e documentação; 'não existe falta de oportunidade, existe falta de vontade de pegar pra resolver'."
        quote: "Java saiu ano passado, obviamente não tem curso pra isso."
      - stance: "Networking de verdade é o colega que confia no seu trabalho; o júnior do lado pode ser o próximo fundador."
        quote: "o júnior da sua própria equipe, colega da sua faculdade, vai ser o próximo founder, CTO, CEO da startup inovadora de amanhã."
      - stance: "Aviso de que varar noites foi falta de noção e promessa acima da entrega, não virtude."
        quote: "eu varava noite porque eu não era bom e prometia mais do que conseguia entregar."
    book_hooks:
      - unit: ch18
        where: "seção 'A bolha que estourou antes', parágrafo 'Na minha carreira eu já vi isso acontecer várias vezes. Sobrevivi ao fim da bolha dos microcomputadores... bolha da internet, que estourou em 2001'"
        touch: "Dar rosto ao 'sobrevivi': 'Em 2001 eu era webmaster de uma pontocom que fechou no crash. Fiquei uma semana desempregado. Todas as empresas por onde passei entre 1996 e 2002 fecharam, e eu fui parar numa consultoria porque não me definia pela tecnologia da vez (Akitando #138).' Atenção: dizer 'estourou em 2001' está ok pelo lado do autor (data pessoal) mas o pico da Nasdaq foi mar/2000."
        strength: high
      - unit: ch18
        where: "seção 'Que linguagem aprender'"
        touch: "'Entre 1996 e 2001 aprendi Delphi, HTML, Flash, ASP, PHP, Perl, SQL Server, MySQL e um pouco de Python. Eu não era programador de nenhuma delas.' E a prova de que a escolha 'ideal' era inútil: o ASP de 1999 voltou em 2001, o Java de 1996 só serviu em 2002."
        strength: high
      - unit: ch01
        where: "seção 'Bolhas estouram, tecnologias ficam'"
        touch: "Reforçar com vivência: 'Vi isso por dentro: depois do crash, Google e Amazon viraram gigantes na seca de 2002-2008, blogs e redes sociais nasceram nela. A internet não parou, as empresas que apostaram tudo na onda sim.'"
        strength: high
      - unit: ch19
        where: "seção 'Antes de renovar a licença' ou 'A premissa mudou' (como gestor vê tecnologia nova)"
        touch: "Um exemplo de projeto Y2K: reescrever Clipper em ASP/SQL Server em 6 meses mostra o custo de decidir tecnologia por empolgação; usar apenas se o capítulo tratar de reescrita de sistema legado."
        strength: low
      - unit: epilogo
        where: "seção 'O que vale aprender'"
        touch: "'Se em 1996 eu tivesse esperado 2 ou 3 anos pra ver se o ASP ia vingar, teria perdido a onda. Pelo mesmo motivo, não espere a IA 'assentar' pra aprender, e também não aposte tudo nela.' Fecha com 'aprender a aprender'."
        strength: medium
      - unit: ch08
        where: "seção 'Como se aprende agora' ou 'Traduzir no escuro'"
        touch: "Contrastar: em 1997, mensagem de erro 'Handler not defined' e um livro impresso; hoje a máquina responde. O autor até comenta que 'nem ChatGPT sabe responder' sobre Lingo em 2023: bom exemplo de limite do modelo com tecnologia obscura."
        strength: medium
    appendix_candidate: "Linha do tempo pessoal de 1990 a 2022 (uma página) para o Posfácio ou o apêndice 'Linha do tempo': cruza as bolhas (micro 1990, internet 2000-02, imobiliária 2008, tech 2022) com onde o autor estava em cada uma. Serve ao leitor do livro de IA como prova de que o autor já viu o ciclo quatro vezes. Só vale se for curta e marcada como memória do autor."

  - id: 2019/06/11/akitando-50-a-bolha-de-startups-vai-estourar-winter-is-coming
    title: "[Akitando] #50 - A Bolha de Startups vai Estourar? | Winter is Coming"
    one_line: "Em junho de 2019 o autor argumenta que a bolha de startups vai estourar (valuations inflados, IPOs fracos, cash flow negativo) e que, nesse cenário, só quem pratica programação deliberadamente e entrega o que promete se mantém."
    bio_facts:
      - claim: "Programa por prazer desde o fim dos anos 80, sem o objetivo de ser bem pago."
        quote: "Quando eu comecei a programar eu nunca programei com o objetivo de ser bem remunerado ou qualquer outro objetivo."
        check: "author memory; consistente com #61 (1990, aos 13)."
      - claim: "Diz ter sobrevivido a três décadas e três crises (anos 90, 2000, 2010) sem grandes problemas porque seguiu a descrição de profissional que dá."
        quote: "Sobrevivi os anos 90, os anos 2000 e os anos 2010, cada década teve uma crise e eu realmente nunca tive grandes problemas durantes esses períodos de transição."
        check: "author statement. A versão atual do livro (ch18) usa 'sobrevivi ao fim da bolha dos microcomputadores... 2001... 2008'; aqui ele conta por décadas."
      - claim: "Lembra 'da devastação' do crash das pontocom por experiência própria."
        quote: "eu lembro da devastação que foi o crash da bolha das ponto com."
        check: "ver #138 para os detalhes pessoais."
      - claim: "Define-se como 'cético pragmático' e conservador, que detesta ser otimista demais."
        quote: "Eu sou um cético pragmático."
        check: "autodefinição; coerente com os demais posts."
    world_facts:
      - claim: "Previsão datada: 'o mercado pode começar a ficar muito diferente a partir de 2021 já'; a correção real de Big Tech/startups veio em 2022. Ele disse em #132 que previu 2020-21 e que a pandemia adiou."
        quote: "Se eu tivesse que chutar eu diria que o mercado pode começar a ficar muito diferente a partir de 2021 já."
        check: "Previsão do autor, marcada como chute; verificável: Nasdaq caiu ~33% em 2022; layoffs 2022-23 (ver #132). Ótimo exemplo de 'aviso certo, data um ano errada, pandemia no meio'."
      - claim: "Em 2018 surgiu um novo unicórnio a cada 4 dias; mais de 300 unicórnios somando mais de US$ 1 trilhão em valuation."
        quote: "Só em 2018 surgiu um novo unicórnio - que são empresas avaliadas em mais de 1 bilhão de dólares, a cada 4 dias."
        check: "números de CB Insights / Bloomberg / Forbes de 2019; ver 'China created a new unicorn every 3.8 days' (Bloomberg, jan/2019). Número de 'a cada 4 dias' provavelmente é global/China, checar."
      - claim: "80% das empresas que abriram capital em 2018 eram não-lucrativas, o maior número desde o pico da bolha de 2000 (81%)."
        quote: "80% das empresas que abriram capital ano passado não são lucrativos, o maior número desde o pico da bolha das ponto com em 2000 quando 81% das empresas que abriram capital naquela época não tinham lucro."
        check: "dado de Jay Ritter (Univ. of Florida) para 2018: 83% sem lucro? Verificar; o autor cita fontes jornalísticas de 2019."
      - claim: "IPOs de unicórnios abaixo do esperado: Snap (US$17 → 11), Blue Apron (US$10 → 3), Fitbit (US$45 → 5), Lyft (US$88 → 61), Uber perto do preço de abertura; Uber com receita de ~US$ 11 bi e prejuízo operacional de ~US$ 3 bi."
        quote: "Uber começou em queda e está perto do mesmo preço de abertura, nada bombástico."
        check: "Lyft IPO a US$72, abriu a ~US$87,2 em 29/3/2019; o autor diz '88'. Snap IPO US$17 (mar/2017). Uber IPO US$45 em 10/5/2019. Conferir os números antes de usar qualquer um; seu 'IPO US$88' é a abertura, não o preço de oferta."
      - claim: "Estudo da Forbes: de 135 unicórnios americanos, ao ajustar termos que inflam valuation, 65 perdem o status."
        quote: "pelo menos metade, 65 dos 135 perdem o status de unicórnio."
        check: "Fonte: Stanford (Gornall & Strebulaev, 'Squaring Venture Capital Valuations with Reality', 2018), noticiada pela Forbes: 65 de 135 unicórnios. Verificável."
      - claim: "O legado positivo da bolha de 2000 foi a infraestrutura de fibra óptica; a bolha de 2019 não deixaria nada comparável."
        quote: "O legado da exuberância do ano 2000 foi a colossal infraestrutura de fibra ótica que foi construído no meio da loucura acelerada."
        check: "tese conhecida (Guardian, fev/2019). Para o livro: a bolha da IA deixa data centers/GPU como 'fibra'? Pergunta aberta, não afirmar."
      - claim: "Programadores ruins foram pagos acima do devido até 2001; depois do estouro, mais terceirização para a Índia e demora de anos para o mercado se estabilizar."
        quote: "até 2001 programadores ruins eram remunerados muito acima do que deveriam"
        check: "narrativa do autor, qualitativa. Dados BLS de emprego em software 2001-2004 confirmariam."
    positions:
      - stance: "Programar é uma 'profissão de prática': só se melhora com prática deliberada; seguir tutorial não faz programador."
        quote: "Escrever código é uma coisa muito simples. Qualquer idiota consegue copiar e colar algum código, modificar algumas poucas coisas e fazer rodar."
      - stance: "Armadilha 80/20: com pouco conhecimento você já entrega algo e se sente empoderado, mas continua amador; ninguém deixa de ser júnior em menos de 1 ano nem é sênior antes de 5."
        quote: "Em profissões de prática, sabendo muito pouco, você se torna capaz de entregar alguma coisa. Você se sente empoderado. E isso é um sério problema."
      - stance: "Barreira de entrada baixa e todo mundo cantando como é fácil virar programador é sinal de alerta: oferta sobe, remuneração cai."
        quote: "Você fica feliz de ver que a barreira de entrada está cada vez menor, e que toda hora todo mundo gosta de ficar cantando como é fácil qualquer um ser programador? Preocupe-se."
      - stance: "Na crise, as empresas mantêm quem promete o que entrega, com consistência, sem desculpas."
        quote: "você é o tipo que promete o que entrega, do jeito que prometeu, no custo que prometeu, no tempo que prometeu e na qualidade que prometeu"
      - stance: "Desconfie de coach e mentor: pergunte quantas patentes ou empresas lucrativas de mais de 10 anos ele tem."
        quote: "da próxima vez que você ver um “coach de inovação”, me façam um favor, perguntem pra ele quantas patentes ele tem."
      - stance: "Bolha estourando é correção saudável; mercados precisam de correção; o jogo do longo prazo vence."
        quote: "A maior recompensa sempre vem praqueles que jogam o jogo do longo prazo."
      - stance: "Stock options como promessa são um golpe para o funcionário; quem lucra é o VC."
        quote: "nunca caiam no golpe das stock options."
    book_hooks:
      - unit: ch18
        where: "seção 'A bolha que estourou antes', parágrafo 'Ela tinha um propósito declarado... estouro de uma bolha que, na minha conta, tinha começado por volta de 2014'"
        touch: "Ancorar com a data do aviso: 'Em junho de 2019 (episódio #50) eu disse que a bolha de startups ia estourar, errei o ano em um (apostei em 2021) e não previ a pandemia, que adiou tudo. Estourou em 2022.' Ponto delicado: o livro diz que a bolha começou 'por volta de 2014'; o #50 conta a partir de 2009. Reconciliar (2009 nasce o dinheiro barato, 2014 a fase final?) ou ajustar para 'depois de 2008'."
        strength: high
      - unit: ch18
        where: "mesma seção, 'Os engenheiros de bootcamp' / 'chef de Miojo'"
        touch: "Citar a metáfora original do #50: o cozinheiro de livro de receitas versus o chef (ovo frito, sushi em poucos dias), e a frase 'Qualquer idiota consegue copiar e colar algum código'. Para a IA: o 'copia e cola' agora é feito pela máquina, o que torna ainda mais clara a diferença entre entregar algo e ser profissional. É a origem do 'chef de Miojo' do livro (verificar se o termo vem de #50 ou de outro episódio)."
        strength: high
      - unit: ch14
        where: "seção 'Quem vende a pá' ou 'A panela de pressão' (hype, dinheiro fácil, valuations)"
        touch: "'Em 2019 eu escrevi: Uber, com receita de 11 bilhões, tinha prejuízo operacional de 3 bilhões. A exuberância irracional criou empresas de cash flow negativo. Hoje a IA repete o desenho: quem gasta mais do que ganha prometendo que agora é a hora de crescer.' Compare com os números de capex de IA do capítulo; usar só números já presentes no livro."
        strength: medium
