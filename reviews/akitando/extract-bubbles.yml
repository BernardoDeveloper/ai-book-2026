  - id: 2021/06/22/akitando-100-mercado-financeiro-pos-pandemia-a-tempestade-perfeita
    title: "[Akitando] #100 - Mercado Financeiro Pós-Pandemia: A Tempestade Perfeita?"
    one_line: "Em junho de 2021 o autor argumenta que dinheiro impresso, juros zero, venture capital e SPACs inflaram o mercado e preparam uma 'tempestade perfeita', e aconselha cautela, nada de opções/margem e nunca seguir gurus financeiros."
    bio_facts:
      - claim: "Na viagem anual aos EUA em março de 2020, voltou no 'penúltimo voo' para o Brasil e decretou home office na empresa por e-mail do aeroporto em 13/3/2020; já operava com equipe distribuída."
        quote: "Nesse mesmo dia, do aeroporto, mandei email pra todos os colaboradores da empresa declarando o home office imediato a partir de segunda, dia 16."
        check: "author memory; datas dos fechamentos de voo (EUA restringiu Londres/Europa em 11/3/2020) são públicas. Cenário curioso mas secundário."
      - claim: "Sua carteira de investimentos caiu uns R$ 500 mil em 21 dias em 2020 (queda de 45% entre 19/2 e 23/3)."
        quote: "minha carteira de investimentos desvalorizou por volta de meio milhão de reais."
        check: "author statement sobre patrimônio; evitar no livro (valor privado). Queda de Ibovespa/ S&P no período é pública (S&P -34%; Ibovespa -46%); '45%' vale para o Ibovespa."
      - claim: "Em 10 anos nunca teve tanta demanda por seus programadores quanto em 2020-21, nem no pico das startups brasileiras (2010-2015)."
        quote: "eu nunca tive que lidar com tanta demanda por programadores em 10 anos. Nem no pico do mercado de startups aqui no Brasil que foi entre 2010 a 2015 mais ou menos."
        check: "author memory. Ver #132, que repete."
      - claim: "Comprou uma RTX 3080 em dezembro de 2020 por cerca de R$ 7 mil; seis meses depois custava R$ 21 mil."
        quote: "Lembram que eu comprei minha RTX 3080 dezembro do ano passado? Eu paguei super caro, uns 7 mil reais."
        check: "author memory; preços de revenda no Mercado Livre eram voláteis. Bom detalhe humano para o capítulo de hardware local (ch09?), mas só como curiosidade."
      - claim: "Mantém parte do patrimônio em cripto, metais e commodities como proteção contra inflação, e evita VC e SPAC."
        quote: "Eu como investidor até que conservador, fico longe de VC ou SPAC."
        check: "author statement privada; NÃO usar no livro."
    world_facts:
      - claim: "Crash de março de 2020 (45% em 21 dias) e recuperação rápida: Ibovespa recuperou em 184 dias, Nasdaq em ~1,5 mês; depois tech subiu quase 50% até maio de 2021."
        quote: "do dia 28 de março do ano passado, até fim de maio deste ano, só uns 250 dias, o mercado de tech ainda subiu quase 50%."
        check: "Nasdaq recuperou a máxima de fev/2020 em junho de 2020 (cerca de 2 meses após a mínima de 23/3), não bate 100% com '26 de maio'; checar. Ibovespa só voltou ao patamar de fev/2020 em jan/2021 (≈ 10 meses), então '184 dias' parece impreciso."
      - claim: "Short squeeze da GameStop em janeiro de 2021 (de US$ 23 a US$ 347 em dias), prejuízo de ~US$ 3 bi para a Melvin Capital."
        quote: "as ações da Gamestop nos Estados Unidos subiram nada menos que 1370 porcento! Num período de só 10 dias!"
        check: "GME fechou a ~US$ 19 em 11/1/2021 e chegou a US$ 347 (fechamento 27/1; máxima intradiária US$ 483 em 28/1). Melvin perdeu ~53% no mês de janeiro e teve resgate de US$ 2,75 bi. Número do autor ('3 bi de prejuízo') aproximado."
      - claim: "Metade dos dólares em circulação foram impressos em um ano; o governo americano emitiu mais de US$ 5 trilhões de dívida; inflação nos EUA passou de 4%."
        quote: "metade dos dólares em circulação na economia foi impressa no período de 1 ano."
        check: "M2 cresceu cerca de 25% entre fev/2020 e jun/2021; a base monetária dobrou. 'Metade dos dólares' é verdade para a base monetária (M0), não para M2. CPI de abril/2021: 4,2% (CNBC, 12/5/2021): confere."
      - claim: "SPACs: de 2013 a 2019 eram 2-3 IPOs por ano (13 em 2019); 77 em 2020; mais de 50 em 2021 até junho. Ele chama de 'golpes a céu aberto' e diz que a SEC passou a investigar."
        quote: "Em 2020 esse número foi pra 77, que é mais que todos os SPACs que teve desde 2013 somado!"
        check: "Números do autor estão MUITO abaixo dos reais: houve 248 IPOs de SPAC em 2020 e 613 em 2021 (SPACInsider). Provável confusão com SPACs de 'tamanho/marca'; não repetir 13/77 sem checar. A tese (explosão e depois estouro dos SPACs) se confirmou: SPAC IPOs caíram quase 90% em 2022."
      - claim: "Tesla de US$ 80 (início de 2020) a US$ 630 (maio/2021); Bitcoin de ~US$ 4 mil (março/2020) a US$ 65 mil (abril/2021)."
        quote: "No começo de 2020 uma ação da Tesla valia 80 dólares. Em maio de 2021 tava valendo 630 dólares."
        check: "Tesla ajustada por splits: ~US$ 80 em jan/2020 e ~US$ 600 em maio/2021: confere. Bitcoin: mínima ~US$ 3,8 mil (12/3/2020) e máxima ~US$ 64,9 mil (14/4/2021): confere."
      - claim: "O autor previu uma 'hiper-inflação' no mercado financeiro e inflação geral; a inflação americana chegou a ~9% em junho de 2022."
        quote: "É um fato: o mercado financeiro está em hiper-inflação faz meses."
        check: "A inflação CPI subiu a 9,1% em jun/2022 (BLS). 'Hiperinflação' no sentido técnico (50%/mês) NÃO ocorreu; ele usa a palavra em sentido figurado para ativos financeiros. Cuidado ao citar."
    positions:
      - stance: "Desconfiar de qualquer empresa que fala em 'investimento' e 'contratações' mas nunca em lucro: é 'engordar o porco antes do abate'."
        quote: "É o que eu chamo de engordar o porco antes do abate."
      - stance: "Sinais de bolha: dinheiro fácil, investidores de primeira viagem, SPACs e gurus; 'se a esmola é muita até o santo desconfia'."
        quote: "E aqui vale aquele velho ditado: se a esmola é muita até o santo desconfia."
      - stance: "Não existe riqueza fácil; nunca siga guru financeiro; invista só no que estudou; isso leva anos."
        quote: "Nunca invista em nada que você não estudou muito bem. E nunca, nunca, jamais siga gurus financeiros. Não existe riqueza fácil."
      - stance: "Não julgar informação pela reputação de quem fala."
        quote: "nunca associe a validade ou invalidade de uma informação baseado na reputação da pessoa que tá falando."
      - stance: "Opinião não é recomendação; ele diz que não é economista e que a economia tem variáveis não lineares."
        quote: "eu não sou economista, absolutamente nada do que disser aqui ou o que falei nos outros vídeos é recomendação financeira nem nada."
      - stance: "Admite que errou pontos e que os mercados têm 'centenas de variáveis'."
        quote: "tirando poucos pontos que errei, no geral tá caminhando como falei."
      - stance: "Defende o risco: se ninguém se arriscasse, não haveria Apple, mas o risco é de cada um."
        quote: "Ninguém botou uma arma na sua cabeça pra fazer a aposta."
    book_hooks:
      - unit: ch14
        where: "seção 'A panela de pressão' ou 'Quem vende a pá' (dinheiro fácil, FOMO, gurus)"
        touch: "'Em junho de 2021 eu descrevi os sintomas: empresas que mudam ”despesa” para ”investimento”, contratam em massa antes de ter lucro, e SPACs prometendo atalhos. Chamei de engordar o porco antes do abate. A IA tem seus próprios porcos.' Útil para o leitor reconhecer o padrão sem precisar de uma data."
        strength: high
      - unit: ch18
        where: "seção 'A bolha que estourou antes', depois de 'A pandemia, que eu não previ, inflou ainda mais a fase final'"
        touch: "Um parágrafo curto que explique o 'por quê agora': com os estímulos e os juros em zero, o dinheiro de fundos e de gente física inundou startups e SPACs (cada vez com menos escrutínio), e a demanda por programadores bateu o recorde. Citar #100 e depois #132 como prova de que a conta fechou depois. Dado a verificar: números de SPAC."
        strength: medium
      - unit: epilogo
        where: "seção 'Medo vende'"
        touch: "O FOMO: 'No #100 eu disse: o risco é cair em FOMO, ver os outros se dando bem e entrar numa aposta arriscada fraudulenta e perder tudo.' Em 2026 a aposta tem outro nome (agentes, 'engenharia' de qualquer coisa), o mecanismo é o do SPAC. Já há ponte com o texto de agosto de 2026."
        strength: medium
      - unit: apmemoria
        where: "(se o apêndice tratar de fontes e verificação)"
        touch: "'Informação que depende da pessoa falando tem pouco valor' como regra de verificação, paralela a 'confira você mesmo'."
        strength: low
    appendix_candidate: "Nenhum apêndice. O episódio é quase todo economia financeira e a maior parte envelheceu mal (números de SPAC, 'hiperinflação'); vale usar apenas 1 ou 2 frases como método ('engordar o porco', FOMO)."

  - id: 2021/01/06/akitando-90-o-que-os-cursos-nao-te-ensinam-sobre-mercados
    title: "[Akitando] #90 - O que os Cursos NÃO te Ensinam sobre Mercados"
    one_line: "Palestra de dez/2020 em que o autor liga oferta e procura ao mercado de programação, diz que o ciclo de abundância acabou, que cursos de ferramenta envelhecem e que matemática, fundamentos e aprender a aprender sustentam a carreira."
    bio_facts:
      - claim: "Programador há 'quase trinta anos', passou por front, back, infra, segurança, mobile, gerente, PO, consultor; há 10 anos tem empresa de outsourcing com quase 100 desenvolvedores, projetos majoritariamente nos EUA."
        quote: "eu sou desenvolvedor de software há quase trinta anos."
        check: "author statement (dez/2020). 'Quase 100' é número do autor naquele momento; atualizar se citar."
      - claim: "Aprendeu dBase lendo um livro por quase um ano na adolescência (14-15 anos), fez freelas; aos 17 entrou em Ciência da Computação e o choque foi descobrir que tudo o que sabia não servia, e que dois anos eram só matemática."
        quote: "Aos dezessete resolvi entrar na faculdade de ciências da computação e foi um choque absurdo."
        check: "author memory. Inconsistências com #61: lá começa a programar aos 13 (Basic, 1990) e entra na USP em 1995; aqui diz 'catorze ou quinze' e 'dezessete'. Também 'eu mesmo não me formei', com dois anos concluídos. Alinhar com o texto do livro (que fala em ciência da computação?) antes de usar qualquer detalhe."
      - claim: "Foi consultor (c. 2004) num grande projeto de uma operadora (Atena/Vivo), onde apontou um vazamento de memória num framework proprietário da BEA/Oracle; foi acusado de querer prejudicar o projeto e depois o sistema precisou ser reiniciado a cada meia hora."
        quote: "Eu mandei e-mail pro meu chefe avisando e ele marcou uma reunião com os arquitetos da Oracle."
        check: "author memory; cita nomes de empresas e produto. Para o livro: contar sem nomear (uma operadora, um framework de fornecedor grande). Pode ser a história 'ele avisou e não ouviram' mais forte do livro, par com 'avisei da bolha'."
      - claim: "Hoje aprende uma linguagem nova até ficar minimamente produtivo em um mês; antes levava um ano; a cada geração deixou as ferramentas para trás."
        quote: "Hoje eu consigo aprender uma linguagem nova, a ponto de ficar minimamente produtivo, em um mês."
        check: "author statement (2020). Boa base para 'aprender a aprender' com IA."
      - claim: "Continuou programando em tempo integral em projetos até quase dois anos antes (c. 2019), mesmo sendo empresário."
        quote: "Apesar de ter me tornado empresário eu continuei programando tempo integral em projetos até quase dois anos atrás."
        check: "author statement."
    world_facts:
