  - id: 2022/11/22/akitando-132-rant-a-bolha-de-startups-estourou
    title: "[Akitando] #132 - Rant: A Bolha de Startups Estourou?"
    one_line: "Em novembro de 2022 o autor explica as demissões em massa em Big Tech como o fim de uma década de juros zero, QE e pandemia, ensina a ler fluxo de caixa livre versus stock options (Apple, Meta, Shopify) e avisa jovens para cancelar cursos de influencer."
    bio_facts:
      - claim: "Seu vídeo de junho de 2019 avisou que a bolha ia estourar; ele pensava em 2020-21 e não podia prever a pandemia."
        quote: "eu tinha na cabeça que se fosse vir uma correção, era provável que seria por volta de 2020 ou 2021."
        check: "verificável pelo #50 (jun/2019); o #50 diz 'a partir de 2021'."
      - claim: "Entre 2020 e 2021 a demanda por programadores de sua empresa 'aumentou de forma absurda'; ele recusou-se a dobrar o quadro e comprar concorrentes."
        quote: "Se eu tivesse sido ganancioso e aproveitado a ocasião pra, por exemplo, consolidar e comprar concorrentes menores, dobrar o número de colabores, eu teria alocado todos com facilidade pelo dobro do preço."
        check: "author memory (empresa Codeminer). Boa evidência de que ele escolheu não inflar na bolha; checar se o livro já fala da empresa."
      - claim: "Investe de forma conservadora e fundamentalista (TradingView, análise de fluxo de caixa); 'não tenho vocação pra day trading'."
        quote: "Prefiro colocar meu dinheiro em empresas confiáveis e deixar lá por anos."
        check: "author statement; não afirmar patrimônio no livro."
      - claim: "Diz que 'desde que comecei o canal' avisa para não acreditar em influencers que vendem cursos e emprego garantido."
        quote: "não acreditem em influencers, e era especificamente influencers que vendem cursos e sonho de emprego garantido"
        check: "coerente com #50, #90 e a playlist 'Eu Avisei'."
      - claim: "Já ouviu de coaches e vendedores de curso que 'o Akita é negativo, espalha medo, terra planista' quando avisou da bolha."
        quote: "todos falando que o Akita é negativo, que tá só espalhando medo, que é teoria da conspiração, terra planista."
        check: "author memory; evitar nomear ninguém."
    world_facts:
      - claim: "Final de 2022: Amazon (~10-11 mil), Meta (11 mil), Twitter (mais de 3 mil, metade), Salesforce (2 mil), Netflix (450), Robinhood/Snap/Intel (20%), mais de 120 mil só nas Big Techs dos EUA."
        quote: "Só nas Big Tech dos Estados Unidos, foram pra lá de 120 mil demissões."
        check: "O próprio autor diz Amazon '10 mil' no início e '11 mil' depois: o anúncio de nov/2022 era ~10 mil, e a Amazon chegou a 18 mil em jan/2023. Meta 11 mil (9/11/2022) confere. Layoffs.fyi/TrueUp para o total."
      - claim: "Ações de Facebook (de US$34 a mais de US$200, 2013-2018) e Amazon (de US$14 a mais de US$100, 2013-2018, +600%) subiram muito; 'o mundo de tecnologia se tornou a menina dos olhos de Wall Street'."
        quote: "De 2013 até meados de 2018, meros 5 anos, essa empresa valorizou mais de 500%."
        check: "Preços de Amazon a US$14 e US$100 ignoram o split 20:1 de 2022 (valores ajustados); nominal em 2013 era ~US$ 300, 2018 ~US$ 1.800. Facebook: ~US$ 34 (IPO 2012) e ~US$ 200 em 2018, confere. Dado ajustado, ok para ordem de grandeza."
      - claim: "QE e juros perto de zero após 2008 empurraram fundos para mercado de risco e startups; SoftBank Vision Fund (US$100 bi); em 2020-21 a quantidade de dinheiro impresso foi muito maior que em 2008."
        quote: "Se não rende nada deixar em renda fixa, sua única alternativa é o mercado de risco, de ações, startups e coisas assim."
        check: "mecanismo amplamente aceito, mas simplificado; Vision Fund captou ~US$ 98 bi (2017). A afirmação de que as altas de ações em 2020-21 'foi justamente inflação' é interpretação do autor, não consenso."
      - claim: "Zoom +800% (2020), Netflix +160%, Amazon +120%; em 2022 Netflix perdeu 55%, Zoom 85%, Amazon cerca de 50%, voltando ao patamar pré-pandemia."
        quote: "Zoom, que cresceu quase 800%, em 2022 perdeu 85% do valor, novamente, voltando pros patamares de antes da pandemia."
        check: "ordem de grandeza confere (ZM: ~US$ 70 em jan/2020, pico ~US$ 560 em out/2020, ~US$ 70 em nov/2022); porcentagens exatas variam com a data de corte."
      - claim: "Análise de free cash flow versus compensação em stock options: Meta com FCF de US$ 320 milhões versus mais de US$ 3 bi em SBC no trimestre; Apple com US$ 111 bi de FCF contra US$ 9 bi de SBC; Shopify FCF negativo."
        quote: "320 milhões de fluxo de caixa nesse trimestre contra nada menos que mais de 3 bilhões em compensação de stock options!"
        check: "Meta Q3/2022: FCF reportado ≈ US$ 0,3 bi, SBC ≈ US$ 3,2 bi (bate com os números do autor); Apple FY2022 FCF ≈ US$ 111 bi, SBC ≈ US$ 9 bi (confere). Verificável em 10-Q/10-K."
      - claim: "Previsão: 'primeira perna' do crash, segunda perna provável como em 2001; '2023 vai ser um ano perdido'; recuperação demoraria de 2 a 4 anos."
        quote: "No mínimo, 2023 vai ser um ano perdido pra empresas de tecnologia."
        check: "NÃO SE CONFIRMOU como previsto: a Nasdaq subiu cerca de 43% em 2023 e as Big Techs (Meta, Amazon, Nvidia) dispararam com a onda de IA; o emprego em tech continuou fraco, mas o mercado de ações não teve segunda perna. Ele ressalva: 'É muito possível que eu esteja completamente enganado'. Honestidade: usar o aviso, não o calendário."
      - claim: "FTX/Alameda, Sam Bankman-Fried, WeWork/SoftBank, Theranos como exemplos de 'gurus' expostos: Holmes sentenciada a 11 anos, SBF foragido."
        quote: "Todos foram expostos como tendo tido sorte durante um período econômico favorável e não porque eram gênios."
        check: "FTX faliu 11/11/2022; Holmes foi sentenciada em 18/11/2022 a 11 anos e 3 meses. SBF foi condenado em nov/2023 a 25 anos (o texto do autor 'sentenciado agora' está datado). Linguagem do episódio é rant; não reproduzir adjetivos."
    positions:
      - stance: "Fluxo de caixa livre positivo é a conta mais fundamental; empresa que gasta mais do que ganha prometendo crescimento é charlatã."
        quote: "nunca gaste mais do que ganha. Só isso."
      - stance: "Gurus financeiros e fundadores 'salvadores' são sorte em mercado favorável; um gênio ganharia dinheiro quando todos perdem."
        quote: "Um verdadero gênio estaria ganhando dinheiro em 2022 onde todo mundo perdeu."
      - stance: "Cursos de influencer e bootcamps de 6 meses só funcionaram porque o mercado contratava qualquer um; na crise, vai para o fim da fila quem fez só curso."
        quote: "Se agora a empresa tem opção de contratar alguém que fez 4 anos de faculdade e alguém que fez 4 meses de curso, quem acha que vão escolher?"
      - stance: "Programação não é fácil, nem todo mundo nasceu pra isso; quem vende o contrário quer vender curso."
        quote: "Esqueça o que um influencer vendedor de curso diz: não é fácil. Ele vai sempre te dizer que é, porque obviamente, quer enfiar um curso goela abaixo."
      - stance: "Na crise, ganha quem aprende rápido e se vira; programador é programador, não 'meio-programador' (front sem back, back sem devops)."
        quote: "Numa crise, quem sabe aprender rápido, não ficar só reclamando e sabe se virar, é quem não vai ter problemas."
      - stance: "Ele descreve evidências, não prevê; admite que pode estar enganado."
        quote: "É muito possível que eu esteja completamente enganado e daqui 1 ano tudo volta ao normal."
      - stance: "A pandemia adiou o estouro que ele esperava para 2020-21; avisos não são calendários."
        quote: "A pandemia veio nos 45 do segundo tempo, na prorrogação, e salvou o mundo da tecnologia do crash iminente."
    book_hooks:
      - unit: ch18
        where: "seção 'A bolha que estourou antes', parágrafos 'A pandemia, que eu não previ, inflou ainda mais a fase final. A bolha estourou no fim de 2022' e a citação 'A bolha da programação estourou antes de existir LLM pra programar'"
        touch: "Acrescentar a linha do tempo dos avisos: jun/2019 (#50), jun/2021 (#100), nov/2022 (#132), e a explicação do mecanismo em uma frase: juros perto de zero e dinheiro impresso empurraram fundos para startups, e quando os juros subiram o dinheiro voltou para o Tesouro. Isso sustenta a tese 'não foi a IA' com dados e não só opinião. Usar os números de layoffs já presentes (Meta 11 mil, 150 mil no ano) e conferir a discrepância Amazon 10/11 mil."
        strength: high
      - unit: ch18
        where: "mesma seção, depois de 'Quem culpa a IA pelas demissões de 2022 está olhando pro culpado errado'"
        touch: "Incluir uma frase de honestidade que o autor já praticava: 'Em novembro de 2022 eu disse que 2023 seria um ano perdido e que viria uma segunda perna do crash. Não veio; a onda de IA levantou o mercado em 2023. Avisei da bolha, errei o calendário.' Dá credibilidade ao 'não sou guru, não prevejo o futuro'."
        strength: high
      - unit: ch14
        where: "seção 'Quem vende a pá' ou 'A fábrica de propaganda'"
        touch: "Aplicar o teste FCF versus compensação em ações à indústria de IA: quem gasta mais do que ganha prometendo escala. Citar #132 ('Fluxo de caixa livre: faturar mais do que gasta') como método do autor. Não incluir cálculos novos sem fonte."
        strength: medium
      - unit: epilogo
        where: "seção 'Medo vende' ou 'O que dá pra ignorar'"
        touch: "'Em 2022 mandei o jovem cancelar curso de influencer e ir para uma faculdade de verdade, aprender inglês e esquecer atalhos. Em 2026 a oferta mudou de nome (curso de agentes, de 'engenharia' disso e daquilo), o mecanismo é o mesmo.' Casa com a passagem sobre 'agosto de 2026'."
        strength: high
      - unit: ch20
