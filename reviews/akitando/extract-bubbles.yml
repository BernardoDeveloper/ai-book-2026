        where: "seção 'Bolhas estouram, tecnologias ficam'"
        touch: "Trazer o argumento do legado: a bolha de 2000 deixou fibra óptica; a bolha de 2019 'só deixaria um sorrisinho amarelo'; a da IA deixa os modelos (e os data centers?). Citar #50 como origem da tese."
