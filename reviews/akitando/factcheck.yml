# Fact-check of reviews/akitando/extract-{bubbles,career,method,startups}.yml
# Scope: every world_facts claim; bio_facts only where a public record exists
# (bio claims that are pure memory are listed at the end as author-memory).
# Checked 2026-10-14 with web search + the local blog repo (akitaonrails-hugo).
checks:
  # ================= ANCHOR FACTS =================
  - claim: "Nasdaq Composite dot-com peak and trough"
    from: anchor
    verdict: correct
    correct_version: "Peak close 5,048.62 on 10 Mar 2000; trough close 1,114.11 on 9 Oct 2002; price drop ~78% in 31 months. Price-only recovery of the 2000 high only in 2015 (Apr 2015 close)."
    source: "https://dqydj.com/nasdaq-drawdown-history/ ; https://fred.stlouisfed.org/series/NASDAQCOM ; https://www.ebsco.com/research-starters/economics/nasdaq-dive-prompts-dot-com-crash"
  - claim: "Dot-com crash timeline 1999-2002"
    from: anchor
    verdict: correct
    correct_version: "Mania 1998-99 (Nasdaq +86% in 1999); peak Mar 2000; sell-off from Apr 2000, waves of dot-com failures through 2000-01 (Pets.com Nov 2000, Webvan Jul 2001); 9/11 and the Enron/WorldCom scandals (Dec 2001 / Jul 2002) extended it; bottom Oct 2002."
    source: "https://en.wikipedia.org/wiki/Dot-com_bubble ; https://internationalbanker.com/history-of-financial-crises/the-dotcom-bubble-burst-2000/"
  - claim: "Fed funds near zero 2008-2015 and 2020-2022; 2022 hiking cycle"
    from: anchor
    verdict: correct
    correct_version: "0-0.25% from 16 Dec 2008 to 16 Dec 2015 (first hike); cut back to 0-0.25% on 15 Mar 2020 (two emergency cuts, 3 and 15 Mar); first hike 16 Mar 2022; 425 bp in 2022 (ending at 4.25-4.50% on 14 Dec 2022, four 75-bp hikes Jun-Nov); peak 5.25-5.50% on 26 Jul 2023. Note: the long 'cheap money' era is often given as 2008-2022 (rates never above 2.5% in 2016-19)."
    source: "https://www.federalreserve.gov/monetarypolicy/openmarket.htm ; https://fred.stlouisfed.org/series/DFEDTARU ; https://raymondjames.com/talentfinancialservices/our-perspective/2024/11/08/journey-through-the-history-of-interest-rates"
  - claim: "Tech layoffs 2022 and 2023 totals (layoffs.fyi)"
    from: anchor
    verdict: correct
    correct_version: "layoffs.fyi: 2022 ~165,000 tech employees (snapshots range 153,160 in Jan 2023 to ~165k after back-fill; ~1,000-1,170 companies); 2023 ~263,000 (262,735 at year-end per TechCrunch; ~59% above 2022). Say 'cerca de 165 mil em 2022 e mais de 260 mil em 2023', and cite the tracker, not 'exactly'. Global, all tech companies, not only Big Tech nor only the US."
    source: "https://layoffs.fyi/ ; https://techcrunch.com/2023/09/19/tech-industry-layoffs-2023/ ; https://www.pymnts.com/economy/2023/report-2022-tech-layoffs-exceed-pandemic-job-cuts/ ; https://www.businesstoday.in/technology/news/story/nearly-200000-employees-let-go-worldwide-in-2023-as-job-losses-plague-tech-sector-382157-2023-05-21"
  - claim: "Amazon / Meta / Google layoffs late 2022 - early 2023"
    from: anchor
    verdict: correct
    correct_version: "Meta: ~11,000 (13%) on 9 Nov 2022, plus ~10,000 announced 14 Mar 2023. Amazon: ~10,000 reported Nov 2022, total raised to 'just over 18,000' (Jassy memo, 4 Jan 2023), plus 9,000 more on 20 Mar 2023 (~27,000 total). Google/Alphabet: 12,000 (~6%) on 20 Jan 2023. Microsoft: 10,000 on 18 Jan 2023."
    source: "https://www.cnbc.com/2023/01/18/tech-layoffs-microsoft-amazon-meta-others-have-cut-more-than-60000.html ; https://retail-systems.com/rs/Amazon_job_cuts.php ; https://about.fb.com/news/2022/11/mark-zuckerberg-layoff-message-to-employees/"
  - claim: "ChatGPT public release 30 Nov 2022"
    from: anchor
    verdict: correct
    correct_version: "Released as a free research preview on 30 Nov 2022."
    source: "https://openai.com/index/chatgpt/ ; https://en.wikipedia.org/wiki/ChatGPT"
  - claim: "GPT-2 release: staged Feb 2019, full Nov 2019"
    from: anchor
    verdict: correct
    correct_version: "Announced 14 Feb 2019 with only the 124M model released (larger withheld for misuse concerns); 355M in May, 774M on 20 Aug 2019; full 1.5B on 5 Nov 2019."
    source: "https://openai.com/index/better-language-models/ ; https://openai.com/index/gpt-2-1-5b-release/ ; https://thenextweb.com/artificial-intelligence/2019/11/05/remember-that-scary-ai-text-generator-that-was-too-dangerous-to-release-its-out-now/"
  - claim: "Tech/programmer hiring bubble starts 'por volta de 2014' (book) vs 'from 2009' (Akitando)"
    from: anchor
    verdict: partly
    correct_version: "Sources date the long tech hiring boom to the post-2008 zero-rate era: 'a very strong tech jobs market from about 2010' (Pragmatic Engineer), ZIRP 2008/09-2022, with the hottest market in 2021-22. No source dates the start to 2014. 2013-15 is when 'unicorn' was coined (Aileen Lee, Nov 2013, 39 companies) and when unicorns multiplied, which is a different milestone. Akita's own Akitando posts point the same way: #72 (programming became 'salvador da pátria' after the 2008 crisis), #90 (Jan 2021: cycle 'começou uns 10 anos atrás'), #100/#132 (Brazilian startup peak 2010-2015). Suggest 'a partir de 2010, com juro perto de zero' or 'ao longo da década de 2010', with the 2020-22 pandemic spike as the peak."
    source: "https://newsletter.pragmaticengineer.com/p/zirp-software-engineers ; https://blog.pragmaticengineer.com/software-engineer-jobs-five-year-low/ ; https://en.wikipedia.org/wiki/Unicorn_(finance) ; https://techcrunch.com/2013/11/02/welcome-to-the-unicorn-club/"
  - claim: "Bell's Law of computer classes, Gordon Bell 1972"
    from: anchor
    verdict: correct
    correct_version: "Formulated by Gordon Bell in 1972 (Wikipedia notes a first mention around 1970 with the PDP-11); written up formally in 'Bell's Law for the birth and death of computer classes' (MSR-TR-2007-146; CACM Jan 2008). 'Roughly every decade a new, lower priced computer class forms based on a new programming platform, network, and interface.'"
    source: "https://en.wikipedia.org/wiki/Bell%27s_law_of_computer_classes ; https://research.microsoft.com/en-us/people/gbell/Bell's_Law_MSR-2007-TR-146a.pdf"
  - claim: "The Mythical Man-Month 1975; 20th anniversary edition 1995"
    from: anchor
    verdict: correct
    correct_version: "Original 1975 (Addison-Wesley); Anniversary Edition 1995 adds chapters 16-19, including 'No Silver Bullet' (ch. 16), 'No Silver Bullet Refired' (17), 'Propositions of TMM-M: True or False?' (18) and 'The Mythical Man-Month after 20 Years' (19)."
    source: "https://eu.pearson.com/mythical-man-month-the-essays-on-software-engineering-anniversary-edition/9780132119160 ; https://sebokwiki.org/wiki/The_Mythical_Man-Month"
  - claim: "'No Silver Bullet' 1986"
    from: anchor
    verdict: correct
    correct_version: "First published in Information Processing 86 (IFIP Tenth World Computing Conference, Dublin, 1986, ed. H.-J. Kugler, pp. 1069-1076); reprinted, and made famous, in IEEE Computer 20(4), April 1987. '1986' is correct; '1987 in IEEE Computer' is also correct if that venue is named."
    source: "https://en.wikipedia.org/wiki/No_Silver_Bullet ; https://doi.org/10.1109/MC.1987.1663532"
  - claim: "Extreme Programming Explained, 1999"
    from: anchor
    verdict: correct
    correct_version: "Kent Beck, Extreme Programming Explained: Embrace Change, Addison-Wesley, Oct 1999 (2nd ed. with Cynthia Andres, 2004)."
    source: "https://en.wikipedia.org/wiki/Extreme_programming ; https://en.wikipedia.org/wiki/Kent_Beck"
  - claim: "Agile Manifesto 2001"
    from: anchor
    verdict: correct
    correct_version: "Written 11-13 Feb 2001 at Snowbird, Utah, by 17 practitioners; official title 'Manifesto for Agile Software Development'."
    source: "https://agilemanifesto.org/history.html ; https://www.martinfowler.com/bliki/AgileSignatory.html"
  - claim: "Scrum: term 1986; Schwaber-Sutherland 1995"
    from: anchor
    verdict: correct
    correct_version: "Takeuchi and Nonaka, 'The New New Product Development Game', HBR Jan-Feb 1986 (rugby analogy); DeGrace and Stahl applied the name to software in 1990 ('Wicked Problems, Righteous Solutions'); Sutherland used it at Easel in 1993; Schwaber and Sutherland presented Scrum together at OOPSLA 1995; first Scrum Guide 2010."
    source: "https://en.wikipedia.org/wiki/Scrum_(project_management) ; https://hbr.org/1986/01/the-new-new-product-development-game"
  - claim: "Evans, Domain-Driven Design, 2003"
    from: anchor
    verdict: correct
    correct_version: "Addison-Wesley, Aug 2003 (20-22 Aug depending on listing)."
    source: "https://openlibrary.org/books/OL51275329M/Domain-Driven_Design"
  - claim: "Paul Graham, 'A Plan for Spam', 2002"
    from: anchor
    verdict: correct
    correct_version: "Published Aug 2002 (blogged by Simon Willison on 16 Aug 2002). Graham reports fewer than 5 per 1,000 spams missed and 0 false positives on his own corpus."
    source: "https://paulgraham.com/spam.html ; https://simonwillison.net/2002/Aug/16/aPlanForSpam/"
  - claim: "Google Reader launch 2005"
    from: anchor
    verdict: correct
    correct_version: "Launched 7 Oct 2005 via Google Labs; graduated Sep 2007; shut down 1 Jul 2013."
    source: "https://en.wikipedia.org/wiki/Google_Reader ; https://techcrunch.com/2013/03/23/the-long-and-storied-history-of-google-reader"
  - claim: "Milgram's doctoral advisor"
    from: anchor
    verdict: correct
    correct_version: "Gordon Allport chaired Milgram's Harvard PhD (1960, social relations; dissertation on conformity in Norway and France). Solomon Asch was a visiting lecturer at Harvard (1955-56) whom Milgram assisted, and Milgram later worked for Asch at the Institute for Advanced Study, Princeton. Asch was mentor, not advisor."
    source: "https://en.wikipedia.org/wiki/Stanley_Milgram ; https://www.psychologytoday.com/us/articles/200203/the-man-who-shocked-the-world"
  - claim: "Balanced Scorecard 1992"
    from: anchor
    verdict: correct
    correct_version: "Kaplan and Norton, 'The Balanced Scorecard: Measures That Drive Performance', HBR Jan-Feb 1992, pp. 71-79; book 1996. (Earlier precursor: Art Schneiderman at Analog Devices, 1987.)"
    source: "https://en.wikipedia.org/wiki/Balanced_scorecard ; https://maaw.info/ArticleSummaries/ArtSumKaplanNorton92.htm"
  - claim: "Erlang name origin"
    from: anchor
    verdict: correct
    correct_version: "Officially named after Danish mathematician Agner Krarup Erlang (queueing theory/telephony); unofficially, and deliberately ambiguous, also 'Ericsson Language' (Joe Armstrong). Created 1986 at Ericsson by Armstrong, Virding and Williams; open-sourced 1998."
    source: "https://en.wikipedia.org/wiki/Erlang_(programming_language) ; https://erlang.org/pipermail/erlang-questions/1999-February/000099.html"
  - claim: "JUnit vs SUnit"
    from: anchor
    verdict: correct
    correct_version: "SUnit (Smalltalk) came first: Beck's 'Simple Smalltalk Testing: With Patterns' (1989/1994, Smalltalk Report). JUnit was written by Beck and Erich Gamma on a flight from Zurich to OOPSLA 1997 (Atlanta) as a Java port; it spread xUnit beyond Smalltalk."
    source: "https://martinfowler.com/bliki/Xunit.html ; https://en.wikipedia.org/wiki/SUnit ; https://en.wikipedia.org/wiki/JUnit"
  - claim: "SPAC IPO counts 2019 / 2020 / 2021"
    from: anchor
    verdict: correct
    correct_version: "SPACInsider/SPAC Research: 59 (2019, US$13.6 bi), 248 (2020, ~US$83 bi), 613 (2021, ~US$162 bi); 86 in 2022. Earlier years: ~10-20/yr 2013-16, 34 (2017), 46 (2018)."
    source: "https://www.statista.com/chart/24008/growth-in-us-spac-ipos ; https://www.mayerbrown.com/ebooks/insurance-industry-year-in-review-2021/inc/html/24.html ; https://spacinsider.com/stats/"

  # ================= #61 Meus Primeiros 5 Anos =================
  - claim: "Em 1995 TCP no Windows 3.1 era opcional (Windows for Workgroups ou à parte); universidades dependiam do backbone da Fapesp."
    from: 2019/09/12/akitando-61-meus-primeiros-5-anos-1990-1995
    verdict: correct
    correct_version: "Windows 3.1 had no TCP/IP; it used third-party stacks (Trumpet Winsock). Microsoft TCP/IP-32 for WfW 3.11 was a separate add-on (1994), not bundled. ANSP (Fapesp) was the São Paulo academic backbone from 1989."
    source: "https://en.wikipedia.org/wiki/Windows_for_Workgroups ; https://en.wikipedia.org/wiki/Trumpet_Winsock ; https://www.ansp.br/"
  - claim: "O arquivo shadow já existia desde 1986, mas muitos servidores UNIX não estavam atualizados."
    from: 2019/09/12/akitando-61-meus-primeiros-5-anos-1990-1995
    verdict: partly
    correct_version: "Shadow passwords appear in System V Release 3.2 (1988) and 4.3BSD-Reno (1990); the free shadow suite (Haugh) circulated in 1987-88. Say 'desde o fim dos anos 80'. The 'many servers not updated' point holds: adoption took years."
    source: "https://en.wikipedia.org/wiki/Passwd#Shadow_file ; https://www.tuhs.org/Usenet/alt.sources/1988-November/002826.html"
  - claim: "Ele para a história antes da bolha: Java 1.0, Delphi 1.0 e Flash vêm em 1995-96; .NET não existia; PHP não tinha começado."
    from: 2019/09/12/akitando-61-meus-primeiros-5-anos-1990-1995
    verdict: partly
    correct_version: "Delphi 1.0 Feb 1995; Java 1.0 Jan 1996; FutureSplash 1996 (Flash from Dec 1996); .NET 2002. PHP had started: Personal Home Page Tools announced 8 Jun 1995 (PHP 3, the version that spread, is 1998)."
    source: "https://en.wikipedia.org/wiki/PHP#Early_history ; https://en.wikipedia.org/wiki/Java_version_history ; https://en.wikipedia.org/wiki/Delphi_(software)"
  - claim: "Apresentou jogos em estande na Fenasoft, c. 1992."
    from: 2019/09/12/akitando-61-meus-primeiros-5-anos-1990-1995
    verdict: author-memory
    correct_version: "Fenasoft was a real yearly São Paulo computer fair (Anhembi, late 1980s-2000s); his presence is author memory."
    source: "https://pt.wikipedia.org/wiki/Fenasoft"
  - claim: "Ilustrações na revista Videogame (1993)."
    from: 2019/09/12/akitando-61-meus-primeiros-5-anos-1990-1995
    verdict: unverifiable
    correct_version: "Could not locate the magazine run online; only the author can confirm title/publisher."
    source: "-"

  # ================= #138 Começo de carreira na bolha =================
  - claim: "O pico da NASDAQ foi em março de 2001; caiu quase 80% até quase o fim de 2002."
    from: 2023/02/14/akitando-138-meu-comeco-de-carreira-durante-a-bolha-1997-a-2002-bug-do-milenio-crash
    verdict: wrong
    correct_version: "Peak 10 Mar 2000 (5,048.62), not 2001; trough 9 Oct 2002 (1,114.11), -78%. The decline started Apr 2000; 2001 is when it hit him personally."
    source: "https://dqydj.com/nasdaq-drawdown-history/ ; https://fred.stlouisfed.org/series/NASDAQCOM"
  - claim: "Em 1997 a Apple estava a dias de falir, com Jobs voltando, 'negativo 1 bilhão'; depois iMac, Mac OS X, iPod (2001)."
    from: 2023/02/14/akitando-138-meu-comeco-de-carreira-durante-a-bolha-1997-a-2002-bug-do-milenio-crash
    verdict: correct
    correct_version: "Apple lost ~US$1.04 bi in fiscal 1997 (the 'negative 1 billion' is right as a yearly loss); Jobs returned via NeXT (Dec 1996), interim CEO Sep 1997; Microsoft invested US$150 mi on 6 Aug 1997. Jobs later said Apple was ~90 days from insolvency, so 'a dias' is hyperbole. iMac 1998, Mac OS X Mar 2001, iPod Oct 2001."
    source: "https://appleinsider.com/articles/18/08/06/august-6-1997----the-day-apple-and-microsoft-made-peace ; https://en.wikipedia.org/wiki/History_of_Apple_Inc."
  - claim: "Google e Amazon viraram gigantes na seca de 2002-2008; blogs e redes sociais nasceram nesse período."
    from: 2023/02/14/akitando-138-meu-comeco-de-carreira-durante-a-bolha-1997-a-2002-bug-do-milenio-crash
    verdict: correct
    correct_version: "Google IPO Aug 2004; Amazon first full-year profit 2003, AWS 2006; Facebook 2004, YouTube 2005, Twitter 2006."
    source: "https://en.wikipedia.org/wiki/Google ; https://en.wikipedia.org/wiki/Amazon_(company)"
  - claim: "As demissões das Big Techs em 2022-23 já superavam 120 mil nos EUA."
    from: 2023/02/14/akitando-138-meu-comeco-de-carreira-durante-a-bolha-1997-a-2002-bug-do-milenio-crash
    verdict: partly
    correct_version: "In mid-Nov 2022 layoffs.fyi counted ~121,000 at ~790 tech companies worldwide, all sizes; not 'only Big Tech' and not only the US. By Feb 2023 the 2023 figure alone was already ~100k."
    source: "https://www.fastcompany.com/90811752/november-tech-layoffs-2022-worst-month ; https://layoffs.fyi/"
  - claim: "Em 1997 internet discada de ~19 kbit/s; streaming impossível, por isso CD-ROM."
    from: 2023/02/14/akitando-138-meu-comeco-de-carreira-durante-a-bolha-1997-a-2002-bug-do-milenio-crash
    verdict: partly
    correct_version: "1997 modems were 28.8/33.6 kbit/s (56k X2/K56flex launched late 1997, V.90 1998); real throughput often ~20 kbit/s. The point (no streaming, hence CD-ROM) holds."
    source: "https://en.wikipedia.org/wiki/Modem#Evolution_of_dial-up_speeds"
  - claim: "Webmaster de pontocom esportiva (PSN, grupo dono do Corinthians) até dez/2001; empresa fechou no crash."
    from: 2023/02/14/akitando-138-meu-comeco-de-carreira-durante-a-bolha-1997-a-2002-bug-do-milenio-crash
    verdict: correct
    correct_version: "Public record fits: PSN (Pan-American Sports Network) belonged to Hicks, Muse, Tate & Furst, Corinthians' partner from 1999; HMTF pulled out of Latin America in 2001 (~US$700 mi loss); PSN was defunct by early 2002 and its assets went to Fox Pan American Sports (Feb 2002); Corinthians partnership formally ended Aug 2002. His role and dates are author memory. Corinthians was HMTF's partner, not 'owned'."
    source: "https://telaviva.com.br/16/05/2002/fox-pan-american-sports-plans-launch-in-august/ ; https://www.meutimao.com.br/noticia/510627/bicho-atrasado-e-chapeu-na-adidas-como-foi-o-acerto-entre-corinthians-e-nike-em-2002 ; https://en.wikipedia.org/wiki/HM_Capital_Partners"
  - claim: "HPG vendido ao iG."
    from: 2023/02/14/akitando-138-meu-comeco-de-carreira-durante-a-bolha-1997-a-2002-bug-do-milenio-crash
    verdict: unverifiable
    correct_version: "HPG did end up as an iG property (free hosting with iG e-mail), but no source found for the sale date or value; iG itself launched Jan 2000. Don't date the sale in the book."
    source: "https://exame.com/tecnologia/seu-lugar-na-internet-m0043262/ ; https://en.wikipedia.org/wiki/Internet_Group"

  # ================= #50 A bolha de startups vai estourar =================
  - claim: "Previsão 'a partir de 2021'; correção real veio em 2022."
    from: 2019/06/11/akitando-50-a-bolha-de-startups-vai-estourar-winter-is-coming
    verdict: correct
    correct_version: "Nasdaq -33% in 2022; layoffs 2022-23 as in anchors."
    source: "https://www.macrotrends.net/1320/nasdaq-historical-chart"
  - claim: "Em 2018 surgiu um novo unicórnio a cada 4 dias; mais de 300 unicórnios somando mais de US$1 trilhão."
    from: 2019/06/11/akitando-50-a-bolha-de-startups-vai-estourar-winter-is-coming
    verdict: partly
    correct_version: "Globally ~112-120 new unicorns in 2018 (one every ~3 days); China alone one every 3.8 days (Bloomberg). '300+ unicorns worth ~US$1 tri' matches CB Insights in early 2019 (315-326)."
    source: "https://qz.com/1510648/why-do-we-still-call-billion-dollar-startups-unicorns/ ; https://regional.chinadaily.com.cn/bjzpark/2019-03/18/c_444076.htm"
  - claim: "80% das empresas que abriram capital em 2018 eram não-lucrativas, maior número desde 2000 (81%)."
    from: 2019/06/11/akitando-50-a-bolha-de-startups-vai-estourar-winter-is-coming
    verdict: correct
    correct_version: "Jay Ritter: ~81% of 2018 US IPOs had negative trailing EPS (83% in the first nine months), matching the 2000 record of 81%."
    source: "https://wallstreetonparade.com/2019/03/is-wall-street-putting-lipstick-on-ipo-pigs-or-unicorns/ ; https://site.warrington.ufl.edu/ritter/ipo-data/"
  - claim: "IPOs abaixo do esperado: Snap 17→11, Blue Apron 10→3, Fitbit 45→5, Lyft 88→61; Uber receita ~US$11 bi, prejuízo operacional ~US$3 bi."
    from: 2019/06/11/akitando-50-a-bolha-de-startups-vai-estourar-winter-is-coming
    verdict: partly
    correct_version: "Snap IPO US$17 (Mar 2017): ok. Blue Apron IPO US$10 (Jun 2017): ok. Fitbit IPO was US$20 (Jun 2015); ~US$48 was its Aug 2015 peak. Lyft priced at US$72, opened ~US$87 (29 Mar 2019). Uber IPO US$45 (10 May 2019); 2018 revenue US$11.3 bi, operating loss ~US$3.0 bi: ok."
    source: "https://www.ktvu.com/news/ipo-of-fitness-tracker-maker-fitbit-prices-at-20-per-share ; https://www.renaissancecapital.com/IPO-Center/News/62436/US-IPO-Weekly-Recap-Lyft-makes-its-debut"
  - claim: "Estudo: de 135 unicórnios americanos, 65 perdem o status ao ajustar termos."
    from: 2019/06/11/akitando-50-a-bolha-de-startups-vai-estourar-winter-is-coming
    verdict: correct
    correct_version: "Gornall and Strebulaev (Stanford), 'Squaring Venture Capital Valuations with Reality' (2018; J. Financial Economics 2020): 65 of 135 lose unicorn status; avg overvaluation ~48-50%."
    source: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2955455"
  - claim: "O legado da bolha de 2000 foi a fibra óptica; a de 2019 não deixaria nada comparável."
    from: 2019/06/11/akitando-50-a-bolha-de-startups-vai-estourar-winter-is-coming
    verdict: partly
    correct_version: "Fiber overbuild as dot-com legacy is well documented (dark fiber glut). 'Nothing comparable' is opinion."
    source: "https://en.wikipedia.org/wiki/Dark_fibre"
  - claim: "Programadores ruins foram pagos acima até 2001; depois terceirização para Índia e anos para estabilizar."
    from: 2019/06/11/akitando-50-a-bolha-de-startups-vai-estourar-winter-is-coming
    verdict: partly
    correct_version: "US IT employment fell 2001-2004 and offshoring to India grew strongly in that period (it already existed via Y2K work). The 'bad programmers overpaid' part is opinion."
    source: "https://en.wikipedia.org/wiki/Outsourcing_in_India"

  # ================= #132 A bolha de startups estourou =================
  - claim: "Fim de 2022: Amazon (~10-11 mil), Meta (11 mil), Twitter (>3 mil, metade), Salesforce (2 mil), Netflix (450), Robinhood/Snap/Intel (20%), >120 mil só nas Big Techs dos EUA."
    from: 2022/11/22/akitando-132-rant-a-bolha-de-startups-estourou
    verdict: partly
    correct_version: "Meta 11,000 (9 Nov 2022) ok; Twitter ~3,700 (~50%, 4 Nov) ok; Amazon ~10,000 reported in Nov, later 18,000 (Jan 2023); Netflix ~450 across May-Jun 2022 ok; Snap 20% (Aug 2022) ok; Robinhood 23% (Aug 2022); Intel cuts were not a flat 20%. The 120k figure was layoffs.fyi's global total for all tech companies, not Big Tech in the US."
    source: "https://www.fastcompany.com/90811752/november-tech-layoffs-2022-worst-month ; https://www.cnbc.com/2023/01/18/tech-layoffs-microsoft-amazon-meta-others-have-cut-more-than-60000.html"
  - claim: "Facebook de US$34 a >US$200 e Amazon de US$14 a >US$100 (2013-2018)."
    from: 2022/11/22/akitando-132-rant-a-bolha-de-startups-estourou
    verdict: correct
    correct_version: "Amazon values are split-adjusted (20:1 split in 2022); nominal ~US$260-400 in 2013 and ~US$2,000 at the 2018 peak. Facebook ~US$28-54 in 2013, peak ~US$218 in Jul 2018."
    source: "https://www.macrotrends.net/stocks/charts/AMZN/amazon/stock-price-history ; https://www.macrotrends.net/stocks/charts/META/meta-platforms/stock-price-history"
  - claim: "QE e juros perto de zero após 2008 empurraram fundos para startups; Vision Fund US$100 bi; 2020-21 imprimiu muito mais que 2008."
