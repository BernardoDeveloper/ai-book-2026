chapter:
  followable: |
    I followed the story until "As seis estações". The figure of the six boxes helped a lot: I could see where I was in the pipeline. I stopped following at the tropeço "O dicionário que comeu o cérebro" ("154 milhões eram a tabela de vocabulário, com suas 200 mil entradas") and at the results paragraph "a versão de 2 bilhões de tokens resolveu 39 de 100 tarefas; a de 5 bilhões, 52; a de 10 bilhões, 65", where too many numbers and two sets of 100 tasks blurred. The parametros figure rescued the dictionary passage; the numbers paragraph had no figure and needed one (a simple curve of 2, 5, 10 bilhões). The abismo figure helped the most.
  wizardry: |
    Difficult but within reach of someone who studies, and above all not magic: "Difícil, não feitiçaria" and "Os fundamentos estão publicados, de graça, há anos" convinced me, and "É paciência e método, e isso se aprende". What worked even better than the argument was seeing that his own model could only do a factorial and "0 de 4" real repairs. A gap remains for me: he is an engineer, so "dá pra qualquer um" sounds a bit generous from where I stand. The caveat "Conte em anos de estudo, nunca em fins de semana" is honest.
  so_what: |
    For my son: the scary "superintelligence" is not something someone cooked up in a basement, and one person with a gaming card got a model that writes a factorial and fails at everything that matters at work. I would tell him that studying how these things are made is a good use of his time, and that "parece código" and "funciona" are different things.
  seams: |
    ch13 to ch13b reads well: the last paragraph of "O que cabe na prateleira" asks what one can build alone, and ch13b answers it, so it does not feel inserted. The first paragraph, "Em 7 de outubro de 2026, às quatro da tarde", is a fresh start with a cinematic touch that jars a bit after the shelf section, but it is fine. ch13b to ch14 is the weak seam: the Anthropic hint at the end of ch13b jumps to a benchmark story in ch14 with no bridge, and the topic changes from small models at home to marketing without a sentence to carry me.
  jargon: |
    Not explained where I met them: "botões" (first paragraph), "parâmetros" used for 337 milhões before the chapter says what one is, "tokenizer" versus "tokenizador", "SFT", "pós-treino", "contêiner isolado", "perda", "transformer", "tabela de vocabulário", "tool calling", "OpenCode", "janela de contexto", "MoE", "harness", "destilação", "fine-tuning", "API compatível com a da OpenAI", "kWh" (fine), "H100". Most of them are glossary terms in other chapters but the reader who jumps in here, as I did, meets them cold.
