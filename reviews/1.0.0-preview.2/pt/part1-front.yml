- unit: ch04
  line: 126
  quote: Se dois modelos dizem "sustentado" com 70% de confiança e um diz "misto"
    com 95%, o "misto" pesa mais.
  category: clarity
  severity: medium
  problem: O leitor que fizer a conta (70 + 70 = 140 contra 95) vai ver que a votação
    ponderada pela confiança dá 'sustentado'. O exemplo contradiz a explicação que
    vem antes na mesma frase; a figura (pesos diferentes por modelo) sugere outra
    regra. Precisa bater com o que o Frank Investigator realmente faz.
  suggestion: 'Conferir a regra no código. Se for soma, trocar os números (ex.: dois
    modelos a 40% e um a 95%). Se o peso for maior que linear ou houver peso por modelo,
    dizer isso: ''a confiança conta mais do que o número de votos: um modelo com 95%
    de certeza em "misto" pode derrubar dois que dizem "sustentado" com 70%''.'
