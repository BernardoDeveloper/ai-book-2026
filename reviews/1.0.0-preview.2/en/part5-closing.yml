- unit: ch19
  line: 215
  quote: "Of the 287 complaints and suggestions filed up to then, 249 came from people who weren't me. Of the requests to change the code, 361 came from real people (not counting the dependency-update bot), some 120 different ones"
  category: clarity
  severity: medium
  problem: "Circumlocutions for 'issues' and 'pull requests' (the book has a glossary entry and uses 'pull request' in ch09 and ch16). 'some 120 different ones' has no clear referent (people? requests?). A lay reader cannot tell what is counted."
  suggestion: "Of the 287 issues (bug reports and suggestions) filed up to then, 249 came from people who weren't me. Of the [pull requests]{.gls key=pull-request}, 361 came from outside contributors (not counting the dependency-update bot), some 120 different people, whether or not I accepted the change."
