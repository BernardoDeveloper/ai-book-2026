- unit: ch03
  line: 34
  quote: The runs "completed". The files showed up on disk.
  category: consistency
  severity: medium
  problem: 'Punctuation around closing quotes is inconsistent across the book: ch01
    and ch02 put commas and periods inside the quotes (American style: "un," / "constitution"
    and "ally."), while ch03 ("completed". / "done", / "run this command".), ch04
    (?"., "mixed"...) and later chapters (ch05, ch08 counts) put them outside. Preface
    and como-ler use inside.'
  suggestion: 'Pick one rule for the whole EN edition (inside, matching the American
    spelling used elsewhere) and apply with a find-and-replace pass: "The runs "completed."
    The files...", "when it said "done," I could check", "run this command." The harness...".'
- unit: ch04
  line: 134
  quote: Ten newspapers repeating the same thing without a primary source still add
    up to zero.
  category: repetition
  severity: medium
  problem: 'Three "ten ... repeating the same thing" images in one chapter: here,
    the next section ("ten outlets repeat the same claim citing each other") and rule
    4 ("Ten summaries repeating the same thing are worth one"), plus "five stories"
    in between. The reader notices it. The circular-chain paragraph ("when ten outlets
    repeat ... citing each other") overlaps with the same-group paragraph.'
  suggestion: 'Keep this one. Change the circular-chain paragraph to "And then there''s
    the circular chain: A cites B, B cites C, C cites A, and the evidence goes around
    in circles." Rule 4 can stay as the callback, with "A pile of summaries" instead
    of "Ten".'
- unit: ch01
  line: 57
  quote: something like "un," "constitution" and "ally."
  category: clarity
  severity: medium
  problem: The reader is never told these three pieces are one word. Without the whole
