- unit: ch01
  line: 131
  quote: when the model gets to "payday" it has to realize, because of "withdraw money,"
    that the "bank" back there
  category: clarity
  severity: medium
  problem: The logic is backwards for a lay reader. "Bank" comes before "payday",
    and "withdraw money" is already next to "bank". Nothing in the example needs "payday".
  suggestion: 'Use a sentence where the clue comes first: "I went to withdraw money
    at the bank." When the model reaches "bank," it looks back at "withdraw money"
    and realizes this is the kind with tellers, not the kind with a river.'
