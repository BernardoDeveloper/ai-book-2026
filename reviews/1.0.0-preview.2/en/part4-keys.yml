  quote: "a trick with repeated system settings (the \"environment variables\", where programs keep passwords)"
  category: error
  severity: medium
  problem: "'repeated system settings' is unclear and reads as a mistranslation (a variable defined twice?). Also, environment variables hold settings in general, not just passwords."
  suggestion: "a trick with a duplicated entry in the environment variables (the settings programs read at startup, where passwords often live) let a real password into the jail, in a spot where only a fake placeholder was supposed to go"
