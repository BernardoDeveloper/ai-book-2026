# ---------- 4. CLARITY ----------
- unit: ch15
  line: 85
  quote: "Hard drives die. Always."
  category: clarity
  severity: low
  problem: "'Always' is ambiguous (they always die? always at some point?). Then the 1.7% and 1.4% rates and '11% / more than 40%' are given; the arithmetic checks (1-0.986^8 = 10.7%, 1-0.986^40 = 43%), but a lay reader may not see that the 11% and 40% are the author's own calculation."
  suggestion: "Hard drives die, sooner or later. ... 'Run the numbers for eight drives at the lifetime rate and you get about an 11% chance ...'"
