# ---------- 2. CONSISTENCY ----------
- unit: ch15
  line: 24
  quote: "the downloads folder on the old NAS"
  category: consistency
  severity: low
  problem: "The NAS is introduced as 'the old NAS', then 'a sick NAS' (75), 'the new NAS', 'both NASes'. Cleanup (Oct 10) happens on the old NAS while the opening does not say there were two; the reader learns about the second one only at line 52 and in the next section. Mild confusion about which machine is which."
  suggestion: "At line 24 add one clause, e.g. 'on the old NAS (I'd bought a second one days earlier, more on that below)'."
- unit: ch16
  line: 146
  quote: "178 commits over about five days of work, between March 10 and 16"
  category: consistency
  severity: low
  problem: "March 10 to 16 is seven calendar days; 'five days of work' is fine only if two were idle. A reader doing the arithmetic stumbles. (Same wording in PT; flag only for the author.)"
  suggestion: "author question: keep, or 'in about a week, between March 10 and 16'."
- unit: ch16
  line: 300
  quote: "a million lines no human reviewed line by line"
  category: consistency
  severity: low
  problem: "Line 273 gives the Zig codebase as about 535 thousand lines. The 'million lines' here refers to the Rust result (or Kelley's rounding) but this is not said, so the numbers look inconsistent."
  suggestion: "Add 'in Rust': 'to trust a million lines of Rust no human reviewed line by line' (check Kelley's wording in the post), or say 'hundreds of thousands of lines'."
- unit: ch17
  line: 236
  quote: "Frank FBI was born"
  category: consistency
  severity: low
  problem: "Naming: 'Frank FBI' in prose but 'FrankClaw', 'FrankMD' in ch16 (one word). Fine as product names, but confirm against continuity.yml; the PT also uses two words."
  suggestion: "No change if continuity.yml lists 'Frank FBI'."

