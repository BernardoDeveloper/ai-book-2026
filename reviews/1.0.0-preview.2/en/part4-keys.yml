# Part IV (keys): ch15-ch17, English edition. Read-only copyedit findings.
# Ranked: errors, consistency, repetition, clarity, pacing; high before low inside each.

# ---------- 1. ERRORS / translated-sounding phrasing ----------
- unit: ch15
  line: 92
  quote: "paying more than three times the price over there"
  category: error
  severity: medium
  problem: "'over there' is a leftover of the PT 'de lá' and has no referent in English (over where?). The reader can't tell the price is being compared with the author's country."
  suggestion: "paying more than three times what it would cost in the US, import and rush included"
- unit: ch15
  line: 111
  quote: "After the cleanup, the useful copying got faster."
  category: error
  severity: medium
  problem: "'the cleanup' is the chapter's own term for the file deletion in the opening (and 'cleanup' returns at 241 and 310). Here it means killing the stray copy processes. A reader will connect it to the wrong event."
  suggestion: "Once I killed the extra processes, the useful copying got faster."
- unit: ch15
