- unit: apmecanica
  line: 177
  quote: "In the end, he's chased by a bear and calls for help: she needs to know how to build a weapon out of a few sticks."
  category: error
  severity: high
  problem: "Pronoun slip: 'he' (the castaway) then 'she needs to know'. Bender and Koller's castaway is a man, and the PT says 'precisa saber' with no gender. Also 'He might even accept it' (line 175) reads as if the octopus is the one accepting, because the octopus is the subject of the same sentence."
  suggestion: "Line 175: 'The castaway might even accept it, but only because he's the one doing all the work of making sense of the reply.' Line 177: 'In the end, the castaway is chased by a bear and calls for help: he needs to know how to build a weapon out of a few sticks. The octopus has nowhere to get that from.'"
