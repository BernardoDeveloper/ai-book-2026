- unit: glossary
  line: 1
  quote: "fingerprint"
  category: clarity
  severity: low
  problem: "Entry reads 'A device's fingerprint. An identifier built ...' with the term 'Fingerprint'; the first sentence is a fragment restating the term, and a lay reader will think of biometrics."
  suggestion: "term: Device fingerprint. def: 'An identifier built by combining dozens of characteristics of a phone or computer (model, language, screen, fonts, installed apps). It recognizes the device even without cookies or a login and often survives wiping the data and reinstalling the app. Unrelated to fingerprint sensors.' (Check that the {.gls key=fingerprint} uses in the text still read well.)"
