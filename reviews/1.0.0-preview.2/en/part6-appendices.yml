- unit: apA
  line: 221
  quote: "of quietly passing nearly 300 thousand customer requests through to Claude"
  category: error
  severity: medium
  problem: "Awkward and slightly wrong verb: 'passing ... through to Claude' reads like the requests were handed to Claude. The accusation is that Kimi relayed customer requests to Claude's service and presented the answers as its own. The next sentence then says 'live pass-through' without having defined it."
  suggestion: "'Anthropic accuses Moonshot, the maker of Kimi, of quietly relaying nearly 300 thousand customer requests to Claude. In my tests, I found no sign of live relaying on the routes I checked.'"
