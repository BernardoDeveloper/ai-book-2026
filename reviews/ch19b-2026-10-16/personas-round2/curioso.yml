persona: curioso
summary: |
  I came for the stories, and the midnight Roadster scene pulled me in. The account of redesigning six existing sites gave the chapter a concrete thread: the tools made execution cheaper, but someone still had to choose and judge the result. The Nolan example made that idea easy to picture. I lost patience when the chapter turned to lists and then introduced another analogy with Michelin stars; by then I understood the point. I’ll remember the tension between celebrating change and admitting that people can lose work before new opportunities arrive.
best:
  - "ch19b: the late-night Roadster demonstration and the author’s excitement"
  - "ch19b: the account of rejecting bad prototypes and revising the sites"
  - "ch19b: the Nolan example of coordinating creative work"
worst:
  - "ch19b: the list of film crew roles slows the story into explanation"
  - "ch19b: the Michelin recipe analogy repeats the point about expertise"
