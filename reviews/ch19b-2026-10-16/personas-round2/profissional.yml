persona: profissional
summary: |
  As an accountant, I felt the chapter was aimed mostly at people who build software and websites, so I had to translate some of its examples to my own work. The clearest answer to my worry is honest but uncomfortable: studying helps, yet it cannot guarantee that the market will keep paying for the work I do now. The example about checking a discount, then changing the condition to include a return, finally gave me something I could try at work. I’ll remember that the tool can help me practice, but I still need to understand the rule and catch a wrong answer. I wanted a more direct Monday plan here; the chapter points me to the epilogue for that.
best:
  - "ch19b: the concrete exercise of checking a discount and changing the scenario"
  - "ch19b: the plain admission that people can lose jobs even when they work competently"
  - "ch19b: the distinction between having a task automated and having a job protected"
worst:
  - "ch19b: the detailed website redesign story, which is far from my day-to-day work"
  - "ch19b: the film and restaurant analogies take a while to return to what I can do in my own job"
score: 4
