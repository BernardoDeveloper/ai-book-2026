persona: pai
summary: |
  This chapter makes the change feel concrete: the author actually handed off work he used to do for money, and he does not pretend that every displaced worker will quickly find something better. I trust the careful distinction between a controlled car demo and a product, and between simulated readers and real customers. But my son asked whether superintelligence is real, and this chapter mostly talks about jobs, design, and learning; it doesn’t give me much to say about that fear. The film and cooking comparisons make the point about judgment, though there are enough examples that I started to feel the same lesson coming around again.
best:
  - "ch19b: The author admits that competent people can lose jobs and that new work is not guaranteed to replace them."
  - "ch19b: The Roadster opening clearly separates a demonstration from something people can use."
  - "ch19b: The discount-and-return exercise gives a practical example of how to check an AI answer."
worst:
  - "ch19b: My son’s question about superintelligence is still unanswered."
  - "ch19b: The Nolan and Ramsay comparisons extend the same point about judgment after it was already clear."
units:
  - {unit: ch19b, score: 3, note: "I believe the warning about jobs, but I still need a clearer answer for my son about superintelligence."}
