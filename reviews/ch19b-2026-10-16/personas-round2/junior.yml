persona: junior
summary: |
  As Lucas, I felt seen by the direct admission that competent people can lose jobs and that learning more does not guarantee the market will reward them. The chapter gives me a useful way to practice with agents: predict an answer, change a condition, compare the result, and ask someone who knows the rule about any mismatch. I’ll remember the distinction between making code and deciding whether the result solves the right problem. The six-site example is more credible because it explains what already existed and what the one-day result does not prove. The Nolan and Michelin comparisons make the same point about judgment several times, so the middle stretches before the practical advice arrives. I’m still anxious about what to do in my own job, but the chapter doesn’t pretend there’s a guaranteed career strategy.
best:
  - "ch19b: The practice exercise gives me something I could try on a task at work."
  - "ch19b: The author plainly says competent people can lose their jobs."
worst:
  - "ch19b: The film and cooking comparisons revisit the need for judgment at length."
