persona: curioso
summary: |
  I came for stories, and the opening delivered: the flying car and the late-night redesign gave the chapter a vivid, personal start. I liked the film examples and the thought that a tool can make it easier to try, reject, and improve ideas. As the chapter went on, though, the same point—that execution is cheaper, while judgment still takes experience—returned through several analogies. I finished with a clear idea, but wished the chapter had reached its ending sooner.
