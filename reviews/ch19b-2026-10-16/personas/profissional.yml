persona: profissional
summary: |
  As Marina, I felt the chapter take my fear of job loss seriously: it says plainly that competent people can lose work and that new jobs may not arrive in time to help them. The six-site story made the change feel concrete, and the accounting example at the start of the next chapter helped me connect it to my own work. I came away with a useful principle—learn to judge the result and the problem behind the task—but not a clear Monday plan for an accountant. The film and cooking comparisons made the argument easier to grasp at first, then started to feel like several versions of the same point.
best:
  - "ch19b: The author admits that automation can eliminate good workers' jobs."
  - "ch19b: The six-site story shows what changed in his own work."
  - "ch20 seam: The reconciliation example makes the argument relevant to accounting."
worst:
  - "ch19b: The Nolan and Ramsay comparisons extend the same point about judgment and execution."
  - "ch19b: The employee checklist points back to six questions from an earlier chapter, so this excerpt alone doesn't give me a first step."
