annotations:
  - unit: ch19b
    quote: "Se você é funcionário:\n\n- aprenda a responder as seis perguntas da lista do começo do capítulo sobre a sua própria tarefa, antes de abrir o agente;"
    type: rewrite
    why: "This is the clearest advice for employees, but it sends me elsewhere instead of telling me what to try on Monday."
    suggestion: "Give one compact example of applying those questions to a routine task, such as reconciling an account."
  - unit: ch19b
    quote: "Vale nomear alguns desses trabalhos, porque a comparação fica mais interessante quando a equipe deixa de ser uma massa anônima:"
    type: boring
    why: "The detailed list of film roles slowed me down; I had already understood that a director coordinates many kinds of work."
    suggestion: "Shorten the role-by-role explanation and move sooner to the connection with evaluating AI output."
  - unit: ch19b
    quote: "Pense agora em **Gordon Ramsay** diante de uma receita e numa pessoa que nunca cozinhou preparando o mesmo prato."
    type: boring
    why: "After the film analogy, this felt like another extended example of the same distinction between instructions and judgment."
    suggestion: "Keep one analogy and use the space to show what this means for a worker outside software."
  - unit: ch19b
    quote: "Se a automação libera parte do seu tempo, há uma oportunidade de estudar o trecho que você sempre evitou."
    type: rewrite
    why: "I understand the encouragement, but it assumes I can choose how to use released work time; my employer may simply expect fewer people to do the same workload."
    suggestion: "Acknowledge that constraint and offer a small action an employee can take within ordinary work."
  - unit: ch19b
    quote: "Com os agentes, essa aposta ficou ainda pior. Uma parte crescente dessa execução já pode ser comprada como serviço."
    type: confusing
    why: "I wasn't sure whether 'essa aposta' means staying in the same role, refusing to learn, or relying on repetitive procedures."
    suggestion: "Name the behavior the sentence refers to directly."
